    function renderSearchResults(query) {
      const q = query.trim().toLowerCase();
      const allCards = COURSES.flatMap(course => course.cards.map(card => ({ ...card, courseTitle: course.title, courseId: course.id })));
      const matches = q
        ? allCards.filter(c => c.title.toLowerCase().includes(q) || c.summary.toLowerCase().includes(q) || c.courseTitle.toLowerCase().includes(q))
        : allCards;

      if (matches.length === 0) {
        return `<div class="py-8 text-center text-[13px] text-[#78787F]">Keine passenden Lernmodule gefunden.</div>`;
      }

      return matches.map(m => `
        <button onclick="selectSearchResult('${m.courseId}', '${m.id}')"
                class="w-full text-left p-2.5 rounded-[8px] hover:bg-[#222227] flex items-center justify-between gap-3 transition">
          <div>
            <div class="text-[13.5px] font-medium text-[#F4F4F6]">${escapeHtml(m.title)}</div>
            <div class="text-[11.5px] text-[#78787F]">${escapeHtml(m.courseTitle)}</div>
          </div>
          <span class="text-[12px] text-[#60A5FA] font-medium">${m.completedSteps}/${m.totalSteps}</span>
        </button>
      `).join('');
    }

    function filterSearchResults(val) {
      const list = document.getElementById('search-results-list');
      if (list) list.innerHTML = renderSearchResults(val);
    }

    function selectSearchResult(courseId, cardId) {
      appState.activeCourseId = courseId;
      appState.showSubjectOverview = false;
      appState.activeNav = 'projects';
      syncNavHighlight('projects');
      closeModal();
      renderWorkspace();
      openModuleDrawer(cardId);
    }

    function openNotificationsModal() {
      appState.notifications.forEach(n => n.unread = false);
      const badge = document.getElementById('notif-badge');
      if (badge) badge.classList.add('hidden');
      savePersistedState();

      openModal(`
        <div class="p-5">
          <div class="flex items-center justify-between mb-4">
            <h3 class="text-[16px] font-semibold text-[#F4F4F6]">Benachrichtigungen</h3>
            <button onclick="closeModal()" class="text-[#78787F] hover:text-white p-1">✕</button>
          </div>
          <div class="space-y-2.5 max-h-[340px] overflow-y-auto">
            ${appState.notifications.length === 0 ? `
              <div class="py-8 text-center text-[13px] text-[#8E8E93]">
                Keine neuen Benachrichtigungen vorhanden.
              </div>
            ` : appState.notifications.map(n => `
              <div class="p-3 rounded-[9px] bg-[#141416] border border-[#26262B]">
                <div class="flex justify-between text-[12px] mb-1">
                  <span class="font-semibold text-[#F4F4F6]">${escapeHtml(n.title)}</span>
                  <span class="text-[#78787F]">${escapeHtml(n.time)}</span>
                </div>
                <p class="text-[12.5px] text-[#9A9AA0]">${escapeHtml(n.desc)}</p>
              </div>
            `).join('')}
          </div>
        </div>
      `);
    }

    // =========================================================================
    // 7. INTERACTION HANDLERS
    // =========================================================================

    function syncNavHighlight(navId) {
      document.querySelectorAll('.nav-item').forEach(btn => {
        const isTarget = btn.getAttribute('data-nav') === navId;
        if (isTarget) {
          btn.className = 'nav-item active w-full flex items-center gap-3 px-3 py-2.5 rounded-[8px] text-[13.5px] font-medium bg-[#232327] border border-[#323237] text-[#F4F4F6] transition';
        } else {
          btn.className = 'nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-[8px] text-[13.5px] text-[#9A9AA0] hover:text-[#F4F4F6] hover:bg-[#1E1E22] transition';
        }
      });
    }

    function navigateSection(navId) {
      appState.activeNav = navId;
      if (navId === 'projects') {
        appState.showSubjectOverview = true;
      }
      syncNavHighlight(navId);
      toggleMobileSidebar(false);
      renderWorkspace();
    }

    function openSubjectsOverview() {
      appState.showSubjectOverview = true;
      renderWorkspace();
    }

    function openSubjectBoard(courseId) {
      appState.activeCourseId = courseId;
      appState.showSubjectOverview = false;
      appState.activeNav = 'projects';
      syncNavHighlight('projects');
      savePersistedState();
      renderWorkspace();
    }

    function handleFolderCardMove(event, cardEl) {
      const rect = cardEl.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;
      const centerX = rect.width / 2;
      const centerY = rect.height / 2;
      const rotateX = ((y - centerY) / centerY) * -3.5;
      const rotateY = ((x - centerX) / centerX) * 3.5;

      cardEl.style.setProperty('--mouse-x', `${x}px`);
      cardEl.style.setProperty('--mouse-y', `${y}px`);
      cardEl.style.setProperty('--tilt-x', `${rotateX.toFixed(2)}deg`);
      cardEl.style.setProperty('--tilt-y', `${rotateY.toFixed(2)}deg`);
    }

    function handleFolderCardLeave(cardEl) {
      cardEl.style.setProperty('--tilt-x', '0deg');
      cardEl.style.setProperty('--tilt-y', '0deg');
    }

    function handleNebulaCardMove(event, cardEl) {
      const rect = cardEl.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;
      const centerX = rect.width / 2;
      const centerY = rect.height / 2;
      const rotateX = ((y - centerY) / centerY) * -2.8;
      const rotateY = ((x - centerX) / centerX) * 2.8;

      cardEl.style.setProperty('--mouse-x', `${x}px`);
      cardEl.style.setProperty('--mouse-y', `${y}px`);
      cardEl.style.setProperty('--tilt-x', `${rotateX.toFixed(2)}deg`);
      cardEl.style.setProperty('--tilt-y', `${rotateY.toFixed(2)}deg`);
    }

    function handleNebulaCardLeave(cardEl) {
      cardEl.style.setProperty('--tilt-x', '0deg');
      cardEl.style.setProperty('--tilt-y', '0deg');
    }

    function handleDashCardMove(event, cardEl) {
      const rect = cardEl.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;
      const centerX = rect.width / 2;
      const centerY = rect.height / 2;
      const rotateX = ((y - centerY) / centerY) * -2.2;
      const rotateY = ((x - centerX) / centerX) * 2.2;

      cardEl.style.setProperty('--mouse-x', `${x}px`);
      cardEl.style.setProperty('--mouse-y', `${y}px`);
      cardEl.style.setProperty('--tilt-x', `${rotateX.toFixed(2)}deg`);
      cardEl.style.setProperty('--tilt-y', `${rotateY.toFixed(2)}deg`);
    }

    function handleDashCardLeave(cardEl) {
      cardEl.style.setProperty('--tilt-x', '0deg');
      cardEl.style.setProperty('--tilt-y', '0deg');
    }

    function switchViewTab(tabId) {
      appState.activeViewTab = tabId;
      savePersistedState();
      renderWorkspace();
    }

    function switchCourseById(courseId) {
      appState.activeCourseId = courseId;
      appState.showSubjectOverview = false;
      appState.activeNav = 'projects';
      syncNavHighlight('projects');
      savePersistedState();
      renderWorkspace();
    }

    function toggleMobileSidebar(open) {
      const sidebar = document.getElementById('left-sidebar');
      const backdrop = document.getElementById('mobile-sidebar-backdrop');
      if (open) {
        sidebar.classList.remove('-translate-x-full');
        backdrop.classList.remove('hidden');
      } else {
        sidebar.classList.add('-translate-x-full');
        backdrop.classList.add('hidden');
      }
    }

    // Drag & Drop handlers
    function handleDragStart(event, cardId) {
      appState.draggedCardId = cardId;
      event.currentTarget.classList.add('dragging');
      event.dataTransfer.effectAllowed = 'move';
    }

    function handleDragEnd(event) {
      event.currentTarget.classList.remove('dragging');
      document.querySelectorAll('.kanban-column').forEach(col => col.classList.remove('drag-over'));
    }

    function handleDragOver(event) {
      event.preventDefault();
      event.currentTarget.classList.add('drag-over');
    }

    function handleDragLeave(event) {
      event.currentTarget.classList.remove('drag-over');
    }

    function handleDrop(event, targetColumn) {
      event.preventDefault();
      event.currentTarget.classList.remove('drag-over');
      if (!appState.draggedCardId) return;
      moveCardColumn(appState.draggedCardId, targetColumn);
      appState.draggedCardId = null;
    }

    function moveCardColumn(cardId, targetColumn) {
      const card = getCardById(cardId);
      if (!card) return;
      card.column = targetColumn === 'completed' ? 'completed' : 'todo';
      if (card.column === 'completed') {
        card.completedSteps = card.totalSteps;
        card.checklist.forEach(item => { item.done = true; });
      } else if (card.completedSteps >= card.totalSteps) {
        card.completedSteps = 0;
        card.checklist.forEach(item => { item.done = false; });
      }
      recordLearningSnapshot();
      savePersistedState();
      renderWorkspace();
      if (appState.selectedCardId === cardId) {
        renderModuleDrawerContent();
      }
      showToast(`Modul nach „${card.column === 'completed' ? 'Done' : 'To Do'}“ verschoben`);
    }

    function adjustSteps(cardId, delta) {
      const card = getCardById(cardId);
      if (!card) return;
      const wasDone = card.column === 'completed';
      card.completedSteps = Math.max(0, Math.min(card.totalSteps, card.completedSteps + delta));
      if (delta > 0) {
        appState.completedToday += 1;
        recordDailyProgress(1);
      }

      if (card.completedSteps >= card.totalSteps && card.totalSteps > 0) {
        card.column = 'completed';
        if (!wasDone) showToast(`🎉 „${card.title}“ fertig & nach Done verschoben!`);
      } else if (wasDone && card.completedSteps < card.totalSteps) {
        card.column = 'todo';
      }

      savePersistedState();
      renderWorkspace();
      renderModuleDrawerContent();
    }

    function toggleChecklistItem(cardId, itemIdx) {
      const card = getCardById(cardId);
      if (!card || !card.checklist[itemIdx]) return;
      const wasDone = card.column === 'completed';
      const item = card.checklist[itemIdx];
      item.done = !item.done;
      card.completedSteps = Math.max(0, Math.min(card.totalSteps, card.completedSteps + (item.done ? 1 : -1)));
      if (item.done) {
        appState.completedToday += 1;
        recordDailyProgress(1);
      }

      const allChecklistDone = card.checklist.length > 0 && card.checklist.every(i => i.done);
      if (allChecklistDone || (card.completedSteps >= card.totalSteps && card.totalSteps > 0)) {
        card.completedSteps = card.totalSteps;
        card.column = 'completed';
        if (!wasDone) showToast(`🎉 „${card.title}“ fertig & nach Done verschoben!`);
      } else if (wasDone) {
        card.column = 'todo';
      }

      recordLearningSnapshot();
      savePersistedState();
      renderWorkspace();
      renderModuleDrawerContent();
    }

    function answerQuiz(cardId, qIdx, optionIdx) {
      if (!appState.quizAnswers[cardId] || typeof appState.quizAnswers[cardId] !== 'object') {
        appState.quizAnswers[cardId] = {};
      }
      appState.quizAnswers[cardId][qIdx] = optionIdx;
      const card = getCardById(cardId);
      const quizList = card && Array.isArray(card.quizzes) && card.quizzes.length > 0
        ? card.quizzes
        : (card && card.quiz ? [card.quiz] : []);
      const targetQuiz = quizList[qIdx];
      if (targetQuiz && optionIdx === targetQuiz.correctIndex) {
        showToast('Richtige Antwort! +10 Lernpunkte');
      }
      savePersistedState();
      renderModuleDrawerContent();
    }

    function addModuleNote(event, cardId) {
      event.preventDefault();
      const input = document.getElementById('new-note-input');
      if (!input || !input.value.trim()) return;
      const card = getCardById(cardId);
      if (!card) return;
      card.notes.unshift({
        author: appState.userName,
        time: 'Gerade eben',
        text: input.value.trim()
      });
      card.notesCount = card.notes.length;
      savePersistedState();
      renderWorkspace();
      renderModuleDrawerContent();
      showToast('Lernnotiz gespeichert');
    }

    // Calendar & Exam handlers
    function changeCalendarMonth(delta) {
      let m = appState.calendarMonth + delta;
      let y = appState.calendarYear;
      if (m < 0) { m = 11; y -= 1; }
      if (m > 11) { m = 0; y += 1; }
      appState.calendarMonth = m;
      appState.calendarYear = y;
      renderWorkspace();
    }

    function submitNewExam(event) {
      event.preventDefault();
      const subject = document.getElementById('exam-subject-input')?.value || 'Rechnungswesen';
      const type = document.getElementById('exam-type-input')?.value || 'Klassenarbeit';
      const date = document.getElementById('exam-date-input')?.value;
      const title = document.getElementById('exam-title-input')?.value.trim();
      const topics = document.getElementById('exam-topics-input')?.value.trim();
      if (!date || !title || !topics) return;

      const newExam = {
        id: 'exam-' + Date.now(),
        date,
        subject,
        type,
        title,
        topics
      };
      appState.exams.push(newExam);
      appState.notifications.unshift({
        id: 'notif-' + Date.now(),
        title: `Neuer Prüfungstermin: ${subject}`,
        desc: `${title} am ${formatGermanDate(date)} eingetragen.`,
        time: 'Gerade eben',
        unread: true
      });
      const badge = document.getElementById('notif-badge');
      if (badge) badge.classList.remove('hidden');

      savePersistedState();
      closeModal();
      renderWorkspace();
      showToast('Klassenarbeit / Test im Kalender gespeichert');
    }

    function deleteExam(examId) {
      appState.exams = appState.exams.filter(e => e.id !== examId);
      savePersistedState();
      renderWorkspace();
      showToast('Termin entfernt');
    }

    // Inbox Flashcards & Quick Notes
    function flipFlashcard() {
      appState.flashcardFlipped = !appState.flashcardFlipped;
      renderWorkspace();
    }

    function nextFlashcard() {
      appState.activeFlashcardIndex = (appState.activeFlashcardIndex + 1) % Math.max(1, appState.flashcards.length);
      appState.flashcardFlipped = false;
      renderWorkspace();
    }

    function prevFlashcard() {
      const len = Math.max(1, appState.flashcards.length);
      appState.activeFlashcardIndex = (appState.activeFlashcardIndex - 1 + len) % len;
      appState.flashcardFlipped = false;
      renderWorkspace();
    }

    function markFlashcard(cardId, mastered) {
      const card = appState.flashcards.find(c => c.id === cardId);
      if (card) card.mastered = mastered;
      savePersistedState();
      nextFlashcard();
      showToast(mastered ? 'Als gewusst markiert' : 'Für Wiederholung vorgemerkt');
    }

    function addQuickNote(event) {
      event.preventDefault();
      const subject = document.getElementById('quick-note-subject')?.value || 'Rechnungswesen';
      const input = document.getElementById('quick-note-text');
      if (!input || !input.value.trim()) return;
      appState.quickNotes.unshift({
        id: 'qn-' + Date.now(),
        subject,
        text: input.value.trim(),
        time: 'Gerade eben'
      });
      savePersistedState();
      renderWorkspace();
      showToast('Merkzettel hinzugefügt');
    }

    function deleteQuickNote(noteId) {
      appState.quickNotes = appState.quickNotes.filter(n => n.id !== noteId);
      savePersistedState();
      renderWorkspace();
    }

    // Settings handlers
    function adjustTodayProgress(delta) {
      appState.completedToday = Math.max(0, appState.completedToday + delta);
      if (delta > 0) {
        recordDailyProgress(delta);
      } else if (delta < 0 && appState.dailyHistory) {
        const key = getTodayIsoDate();
        appState.dailyHistory[key] = Math.max(0, (appState.dailyHistory[key] || 0) + delta);
      }
      savePersistedState();
      renderWorkspace();
      if (appState.completedToday === appState.dailyGoal) {
        showToast('🎉 Tagesziel erreicht! Starke Leistung!');
      } else {
        showToast(`Tagesfortschritt: ${appState.completedToday} / ${appState.dailyGoal} Einheiten`);
      }
    }

    function setDashboardChartRange(range) {
      appState.dashboardChartRange = range;
      renderWorkspace();
    }

    function saveSettings() {
      const nameVal = document.getElementById('user-name-input')?.value.trim();
      const goalVal = parseInt(document.getElementById('daily-goal-input')?.value || '6', 10);
      if (nameVal) appState.userName = nameVal;
      if (goalVal >= 1 && goalVal <= 30) appState.dailyGoal = goalVal;
      savePersistedState();
      showToast('Einstellungen gespeichert');
    }

    function handleProfileImageUpload(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) {
        showToast('Bitte wähle eine gültige Bilddatei aus');
        return;
      }

      const reader = new FileReader();
      reader.onload = function (e) {
        const img = new Image();
        img.onload = function () {
          const size = 200;
          const canvas = document.createElement('canvas');
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext('2d');
          const minSide = Math.min(img.width, img.height);
          const sx = (img.width - minSide) / 2;
          const sy = (img.height - minSide) / 2;
          ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, size, size);

          appState.profileImage = canvas.toDataURL('image/jpeg', 0.85);
          savePersistedState();
          updateSidebarAvatar();
          renderWorkspace();
          showToast('Profilbild aktualisiert');
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function removeProfileImage() {
      appState.profileImage = null;
      savePersistedState();
      updateSidebarAvatar();
      renderWorkspace();
      showToast('Profilbild entfernt');
    }

    function resetAllData() {
      try {
        localStorage.removeItem(STORAGE_KEY);
      } catch (e) {}
      COURSES = getDefaultCourses();
      appState.exams = getDefaultExams();
      appState.flashcards = getDefaultFlashcards();
      appState.quickNotes = [];
      appState.notifications = [];
      appState.learningHistory = {};
      appState.userName = 'Marlii';
      appState.profileImage = null;
      appState.dailyGoal = 6;
      appState.completedToday = 0;
      appState.dailyHistory = {};
      appState.activeCourseId = 'rechnungswesen';
      updateSidebarAvatar();
      const badge = document.getElementById('notif-badge');
      if (badge) badge.classList.add('hidden');
      renderWorkspace();
      showToast('Alle Lernprojekte & Termine zurückgesetzt');
    }

    function showToast(message) {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      toast.className = 'bg-[#202024] border border-[#34343B] text-[#F4F4F6] text-[12.5px] font-medium px-3.5 py-2.5 rounded-[9px] shadow-xl animate-scale-in';
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.2s ease';
        setTimeout(() => toast.remove(), 220);
      }, 2400);
    }

    function formatGermanDate(isoStr) {
      if (!isoStr || !isoStr.includes('-')) return isoStr || '';
      const [y, m, d] = isoStr.split('-');
      return `${d}.${m}.${y}`;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // Keyboard shortcuts (Cmd/Ctrl+K for Search, Escape to close overlays)
    document.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        openSearchModal();
      } else if (e.key === 'Escape') {
        closeQuizPopup();
        closeModal();
        closeModuleDrawer();
      }
    });

    // Initial load & render
    window.addEventListener('DOMContentLoaded', () => {
      loadPersistedState();
      updateSidebarAvatar();
      syncNavHighlight(appState.activeNav);
      const hasUnread = appState.notifications.some(n => n.unread);
      const badge = document.getElementById('notif-badge');
      if (badge) badge.classList.toggle('hidden', !hasUnread);
      renderWorkspace();
    });
  </script>
</body>
