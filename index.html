    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #27272C;
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #383840;
    }

    /* 16-Tick Segmented Vertical Progress Bar */
    .tick-bar-container {
      display: inline-flex;
      align-items: center;
      gap: 2.5px;
      height: 12px;
    }

    .tick-segment {
      width: 2.5px;
      height: 11px;
      border-radius: 1px;
      transition: background-color 0.25s ease, transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), filter 0.25s ease;
    }

    .dash-bento-card:hover .tick-segment.is-filled,
    .nebula-study-card:hover .tick-segment.is-filled {
      transform: scaleY(1.22);
      filter: brightness(1.2);
      transition-delay: calc(var(--tick-idx, 0) * 14ms);
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideRight {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.96) translateY(6px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .animate-fade-in {
      animation: fadeIn 0.18s ease-out forwards;
    }

    .animate-slide-right {
      animation: slideRight 0.24s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .animate-scale-in {
      animation: scaleIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Overarching Folder Cards */
    @keyframes folderSlotReveal {
      from { opacity: 0; transform: translateY(14px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes ambientGlowBreath {
      0%, 100% { opacity: 0.82; transform: scale(1) translate(0, 0); }
      50% { opacity: 1; transform: scale(1.07) translate(-3px, 2px); }
    }

    @keyframes starTwinkle {
      0%, 100% { opacity: 0.34; transform: scale(0.9) rotate(0deg); }
      50% { opacity: 0.95; transform: scale(1.16) rotate(8deg); }
    }

    @keyframes starFloatGlint {
      0%, 100% { opacity: 0.25; transform: translateY(0px) scale(0.95); }
      50% { opacity: 0.85; transform: translateY(-2.5px) scale(1.2); }
    }

    .folder-card-slot {
      perspective: 950px;
      opacity: 0;
      animation: folderSlotReveal 0.48s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: calc(var(--stagger, 0) * 95ms);
    }

    .folder-glow-card {
      position: relative;
      background-color: #141416;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      overflow: hidden;
      transform-style: preserve-3d;
      transform: rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg)) translateY(0px);
      transition: transform 0.24s cubic-bezier(0.16, 1, 0.3, 1),
                  border-color 0.25s ease,
                  box-shadow 0.28s ease,
                  background-color 0.25s ease;
    }

    .folder-glow-card:hover {
      background-color: #17171a;
      border-color: rgba(var(--accent-rgb, 96, 165, 250), 0.45);
      transform: rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg)) translateY(-4px);
      box-shadow: 0 18px 38px -8px rgba(0, 0, 0, 0.65),
                  0 0 28px -6px rgba(var(--accent-rgb, 96, 165, 250), 0.22);
    }

    .folder-glow-orb {
      animation: ambientGlowBreath 6s ease-in-out infinite;
    }

    .folder-cursor-spotlight {
      opacity: 0;
      background: radial-gradient(
        240px circle at var(--mouse-x, 82%) var(--mouse-y, 18%),
        rgba(var(--accent-rgb, 96, 165, 250), 0.16),
        transparent 70%
      );
      transition: opacity 0.28s ease;
    }

    .folder-glow-card:hover .folder-cursor-spotlight,
    .nebula-study-card:hover .folder-cursor-spotlight,
    .rank-banner-shell:hover .folder-cursor-spotlight {
      opacity: 1;
    }

    .folder-edge-shimmer {
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, rgba(var(--accent-rgb, 255, 255, 255), 0.65) 50%, transparent 100%);
      opacity: 0;
      transition: left 0.75s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
    }

    .folder-glow-card:hover .folder-edge-shimmer {
      left: 100%;
      opacity: 1;
    }

    .folder-icon-wrap {
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1), filter 0.28s ease;
    }

    .folder-glow-card:hover .folder-icon-wrap {
      transform: translateY(-2px) scale(1.07);
      filter: drop-shadow(0 0 12px rgba(var(--accent-rgb, 96, 165, 250), 0.55));
    }

    .sparkle-star-lg { transform-origin: 111px 58px; animation: starTwinkle 3.8s ease-in-out infinite; }
    .sparkle-star-md { transform-origin: 77px 28.2px; animation: starTwinkle 4.4s ease-in-out 1.1s infinite; }
    .sparkle-star-sm { transform-origin: 104px 17.2px; animation: starFloatGlint 3.2s ease-in-out 0.6s infinite; }
    .sparkle-glint-dot { animation: starFloatGlint 4.1s ease-in-out 1.7s infinite; }

    /* Topic Learning Cards */
    @keyframes nebulaCardReveal {
      from { opacity: 0; transform: translateY(14px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes artworkFloat {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-4px) scale(1.03); }
    }

    @keyframes titleSheen {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }

    .nebula-card-slot {
      perspective: 1000px;
      opacity: 0;
      animation: nebulaCardReveal 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: calc(var(--stagger, 0) * 80ms);
    }

    .nebula-study-card {
      position: relative;
      background: linear-gradient(155deg, var(--card-bg-1, #202026) 0%, var(--card-bg-2, #18181D) 52%, var(--card-bg-3, #141418) 100%);
      border: 1px solid rgba(255, 255, 255, 0.085);
      border-top-color: rgba(255, 255, 255, 0.14);
      border-radius: 18px;
      overflow: hidden;
      contain: layout paint;
      transform: translateY(0px) scale(1);
      transition: transform 0.24s cubic-bezier(0.16, 1, 0.3, 1),
                  border-color 0.22s ease,
                  box-shadow 0.24s ease;
    }

    .nebula-study-card:hover {
      background: linear-gradient(155deg, var(--card-bg-hover-1, #25252D) 0%, var(--card-bg-hover-2, #1C1C23) 52%, var(--card-bg-hover-3, #16161C) 100%);
      border-color: rgba(var(--card-rgb, 96, 165, 250), 0.45);
      transform: translateY(-4px) scale(1.006);
      box-shadow: 0 20px 38px -12px rgba(0, 0, 0, 0.75),
                  0 0 26px -8px rgba(var(--card-rgb, 96, 165, 250), 0.24);
    }

    .nebula-study-card.dragging {
      opacity: 0.48;
      transform: scale(0.97);
    }

    .nebula-artwork-layer {
      animation: artworkFloat 6.5s ease-in-out infinite;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
    }

    .nebula-study-card:hover .nebula-artwork-layer {
      transform: scale(1.06) translate(-2px, -2px);
    }

    .nebula-card-title {

      background-clip: text;

    }

    .nebula-title-underline {

    /* Dashboard Cobalt Bento Cards */
    @keyframes dashCardReveal {
      from { opacity: 0; transform: translateY(14px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes dashHeaderSlide {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes beamSway {
      0%, 100% { opacity: 0.72; transform: rotate(-18deg) translateY(0px) scale(1); }
      50% { opacity: 1; transform: rotate(-14deg) translateY(-5px) scale(1.04); }
    }

    @keyframes barShimmerSweep {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(240%); }
    }

    @keyframes stripeFlow {
      0% { background-position: 0 0; }
      100% { background-position: 22.6px 0; }
    }

    @keyframes badgeBob {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }

    @keyframes clockTickWobble {
      0%, 100% { transform: rotate(0deg) scale(1); }
      25% { transform: rotate(-9deg) scale(1.06); }
      75% { transform: rotate(9deg) scale(1.06); }
    }

    .dash-header-enter {
      animation: dashHeaderSlide 0.38s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .dash-bento-card {
      position: relative;
      background: linear-gradient(165deg, #17171B 0%, #121215 100%);
      border: 1px solid #23232A;
      border-radius: 18px;
      overflow: hidden;
      transform-style: preserve-3d;
      transform: rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg)) translateY(0px);
      transition: transform 0.24s cubic-bezier(0.16, 1, 0.3, 1),
                  border-color 0.24s ease,
                  box-shadow 0.28s ease,
                  background 0.28s ease;
    }

    .dash-bento-card.dash-card-animate {
      animation: dashCardReveal 0.42s cubic-bezier(0.16, 1, 0.3, 1) both;
      animation-delay: calc(var(--stagger, 0) * 55ms);
    }

    .dash-bento-card:hover {
      background: linear-gradient(165deg, #1A1A20 0%, #131317 100%);
      border-color: rgba(59, 130, 246, 0.42);
      transform: rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg)) translateY(-4px);
      box-shadow: 0 20px 38px -12px rgba(0, 0, 0, 0.78),
                  0 0 28px -8px rgba(59, 130, 246, 0.24);
    }

    .dash-edge-shimmer {
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, rgba(96, 165, 250, 0.75) 50%, transparent 100%);
      opacity: 0;
      transition: left 0.75s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
      pointer-events: none;
    }

    .dash-bento-card:hover .dash-edge-shimmer {
      left: 100%;
      opacity: 1;
    }

    .dash-spotlight {
      opacity: 0;
      background: radial-gradient(250px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(59, 130, 246, 0.14), transparent 70%);
      transition: opacity 0.25s ease;
    }

    .dash-bento-card:hover .dash-spotlight {
      opacity: 1;
    }

    .dash-progress-shimmer {
      position: relative;
      overflow: hidden;
    }

    .dash-progress-shimmer::after {
      content: '';
      position: absolute;
      inset: 0;
      width: 55%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.45), transparent);
      animation: barShimmerSweep 2.4s ease-in-out infinite;
    }

    .dash-icon-tile {
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.25s ease, box-shadow 0.28s ease;
    }

    .dash-bento-card:hover .dash-icon-tile {
      transform: scale(1.08) translateY(-1px);
      background-color: #222229;
      box-shadow: 0 0 18px -4px rgba(59, 130, 246, 0.4);
    }

    .dash-bento-card:hover .dash-clock-svg {
      animation: clockTickWobble 0.65s ease-in-out;
    }

    .dash-striped-bar {
      background-image: repeating-linear-gradient(
        -45deg,
        rgba(59, 130, 246, 0.42),
        rgba(59, 130, 246, 0.42) 4px,
        rgba(30, 58, 138, 0.62) 4px,
        rgba(30, 58, 138, 0.62) 8px
      );
      background-size: 22.6px 22.6px;
      animation: stripeFlow 2.6s linear infinite;
      box-shadow: 0 0 20px -4px rgba(59, 130, 246, 0.45);
    }

    .dash-badge-bob {
      animation: badgeBob 2.6s ease-in-out infinite;
    }

    .dash-cta-pill {
      position: relative;
      overflow: hidden;
    }

    .dash-cta-pill::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 70%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.26), transparent);
      transition: left 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .dash-cta-pill:hover::after {
      left: 140%;
    }

    .cobalt-spotlight-beam {
      animation: beamSway 5.5s ease-in-out infinite;
    }

    /* Neon Gradient Frame Flashcards */
    @keyframes frameReveal {
      from { opacity: 0; transform: translateY(16px) scale(0.975); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes flashcardSlideNext {
      from { opacity: 0; transform: translateX(28px) scale(0.98); }
      to { opacity: 1; transform: translateX(0) scale(1); }
    }

    @keyframes flashcardSlidePrev {
      from { opacity: 0; transform: translateX(-28px) scale(0.98); }
      to { opacity: 1; transform: translateX(0) scale(1); }
    }

    @keyframes neonGlowBreath {
      0%, 100% {
        filter: hue-rotate(0deg);
        box-shadow: 0 0 36px -8px rgba(59, 130, 246, 0.45),
                    0 0 18px -4px rgba(168, 85, 247, 0.35),
                    0 22px 40px -14px rgba(0, 0, 0, 0.85);
      }
      50% {
        filter: hue-rotate(180deg);
        box-shadow: 0 0 44px -6px rgba(236, 72, 153, 0.48),
                    0 0 22px -4px rgba(16, 185, 129, 0.38),
                    0 26px 46px -14px rgba(0, 0, 0, 0.9);
      }
    }

    .flashcard-stage {
      perspective: 1800px;
      animation: frameReveal 0.42s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .flashcard-stage.slide-next {
      animation: flashcardSlideNext 0.36s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .flashcard-stage.slide-prev {
      animation: flashcardSlidePrev 0.36s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .flashcard-tilt-shell {
      transform-style: preserve-3d;
      transform: rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg)) translateY(0px);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .flashcard-tilt-shell:hover {
      transform: rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg)) translateY(-4px);
    }

    .flashcard-flipper {
      position: relative;
      width: 100%;
      height: 350px;
      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;
      transition: transform 0.72s cubic-bezier(0.22, 1, 0.36, 1);
      cursor: pointer;
    }

    .flashcard-flipper.is-flipped {
      transform: rotateY(180deg);
    }

    .flashcard-face {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
    }

    .flashcard-face-front {
      transform: rotateY(0deg);
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transition: opacity 0.24s ease 0.16s, visibility 0s linear 0s;
    }

    .flashcard-flipper.is-flipped .flashcard-face-front {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.18s ease 0s, visibility 0s linear 0.18s;
    }

    .flashcard-face-back {
      transform: rotateY(180deg);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.18s ease 0s, visibility 0s linear 0.18s;
    }

    .flashcard-flipper.is-flipped .flashcard-face-back {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transition: opacity 0.24s ease 0.16s, visibility 0s linear 0s;
    }

    .neon-frame-outer {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 24px;
      padding: 2.5px;
      background: linear-gradient(135deg, #3B82F6 0%, #8B5CF6 35%, #EC4899 70%, #10B981 100%);
      animation: neonGlowBreath 7s ease-in-out infinite;
      transition: transform 0.28s ease;
    }

    .flashcard-flipper:hover .neon-frame-outer {
      transform: scale(1.004);
    }

    .neon-frame-inner,
    .neon-frame-inner.is-back {
      position: relative;
      height: 100%;
      width: 100%;
      border-radius: 21.5px;
      background:
        radial-gradient(95% 75% at 50% 0%, var(--frame-inner-tint, rgba(59, 130, 246, 0.16)) 0%, rgba(20, 20, 24, 0) 70%),
        linear-gradient(165deg, #1B1B22 0%, #141418 55%, #101014 100%);
      overflow: hidden;
    }

    /* Interactive Quiz Modal */
    #quiz-popup-overlay {
      -webkit-backdrop-filter: blur(7px);
      backdrop-filter: blur(7px);
      transform: translateZ(0);
      will-change: opacity;
    }

    .quiz-glass-card {
      position: relative;
      border-radius: 26px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background-color: rgba(19, 21, 20, 0.88);
      background-image:
        radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
        var(--quiz-ambient-glow, radial-gradient(95% 65% at 50% 0%, rgba(16, 185, 129, 0.22) 0%, rgba(19, 21, 20, 0) 72%));
      background-size: 16px 16px, 100% 100%;
      box-shadow: 0 24px 52px -14px rgba(0, 0, 0, 0.85);
      contain: layout paint;
      transform: translateZ(0);
      transition: border-color 0.2s ease;
    }

    .quiz-option-btn {
      touch-action: manipulation;
      transition: background-color 0.14s ease, border-color 0.14s ease, color 0.14s ease, transform 0.1s ease;
    }

    .quiz-option-btn:active:not(:disabled) {
      transform: scale(0.99);
    }

    body.quiz-open .nebula-artwork-layer,
    body.quiz-open .folder-glow-orb,
    body.quiz-open .sparkle-star-lg,
    body.quiz-open .sparkle-star-md,
    body.quiz-open .sparkle-star-sm,
    body.quiz-open .sparkle-glint-dot,
    body.quiz-open .cobalt-spotlight-beam,
    body.quiz-open .neon-frame-outer,
    body.quiz-open .radar-sweep-cone {
      animation-play-state: paused !important;
    }

    /* Calendar Chrono-Matrix */
    @keyframes calWaveCascade {
      0% { opacity: 0; transform: translateY(10px) scale(0.94); filter: blur(3px); }
      100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0px); }
    }

    @keyframes calMonthSlideNext {
      from { opacity: 0; transform: translateX(26px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes calMonthSlidePrev {
      from { opacity: 0; transform: translateX(-26px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes chronoOrbitSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes examTicketSlide {
      from { opacity: 0; transform: translateX(16px) scale(0.98); }
      to { opacity: 1; transform: translateX(0) scale(1); }
    }

    .cal-month-slide-next { animation: calMonthSlideNext 0.34s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .cal-month-slide-prev { animation: calMonthSlidePrev 0.34s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    .cal-matrix-shell {
      position: relative;
      background: linear-gradient(170deg, #16161B 0%, #111114 100%);
      border: 1px solid #24242C;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 24px 50px -16px rgba(0, 0, 0, 0.78);
    }

    .cal-matrix-scanlines {
      background-image: repeating-linear-gradient(
        0deg,
        rgba(255, 255, 255, 0.015) 0px,
        rgba(255, 255, 255, 0.015) 1px,
        transparent 1px,
        transparent 28px
      );
    }

    .cal-grid-magnetic-glow {
      opacity: 0;
      background: radial-gradient(340px circle at var(--grid-x, 50%) var(--grid-y, 50%), rgba(96, 165, 250, 0.11), transparent 72%);
      transition: opacity 0.3s ease;
    }

    .cal-matrix-shell:hover .cal-grid-magnetic-glow { opacity: 1; }

    .cal-day-tile {
      position: relative;
      border-radius: 13px;
      background: rgba(24, 24, 29, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.055);
      opacity: 0;
      animation: calWaveCascade 0.42s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: calc(var(--wave, 0) * 28ms);
      transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1),
                  background-color 0.22s ease,
                  border-color 0.22s ease,
                  box-shadow 0.24s ease;
    }

    .cal-day-tile:hover {
      background: rgba(33, 34, 42, 0.95);
      border-color: rgba(96, 165, 250, 0.45);
      transform: translateY(-2px) scale(1.025);
      z-index: 10;
    }

    .cal-day-tile.is-today {

      border-color: rgba(96, 165, 250, 0.65);
    }

    .cal-reticle {
      position: absolute;
      width: 7px;
      height: 7px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .cal-reticle-tl {
      top: 3px;
      left: 3px;
      border-top: 1.5px solid #60A5FA;
      border-left: 1.5px solid #60A5FA;
      border-top-left-radius: 4px;
      transform: translate(-3px, -3px);
    }

    .cal-reticle-br {
      bottom: 3px;
      right: 3px;
      border-bottom: 1.5px solid #60A5FA;
      border-right: 1.5px solid #60A5FA;
      border-bottom-right-radius: 4px;
      transform: translate(3px, 3px);
    }

    .cal-day-tile:hover .cal-reticle { opacity: 1; transform: translate(0, 0); }

    .cal-today-orbit {
      position: absolute;
      inset: -3px;
      border-radius: 999px;
      border: 1.5px dashed rgba(147, 197, 253, 0.75);
      animation: chronoOrbitSpin 12s linear infinite;
      pointer-events: none;
    }

    .exam-chrono-card {
      position: relative;
      background: linear-gradient(160deg, #18181E 0%, #131317 100%);
      border: 1px solid #262630;
      border-radius: 18px;
      overflow: hidden;
      opacity: 0;
      animation: examTicketSlide 0.42s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: calc(var(--stagger, 0) * 75ms);
      transition: transform 0.24s cubic-bezier(0.16, 1, 0.3, 1),
                  border-color 0.24s ease,
                  box-shadow 0.28s ease;

      border-color: rgba(var(--subj-rgb, 96, 165, 250), 0.48);

    .exam-chrono-bar {
      position: absolute;
      left: 0;
      top: 14px;
      bottom: 14px;

      border-radius: 0 4px 4px 0;

      box-shadow: 0 0 14px var(--subj-hex, #60A5FA);
    }

    /* Reports Radar Observatory */
    @keyframes radarWebExpand {
      0% { opacity: 0; transform: scale(0.18) rotate(-14deg); }

    }

    @keyframes radarSweepBeam {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes equalizerBarRise {
      0% { transform: scaleY(0.08); opacity: 0.35; }
      100% { transform: scaleY(1); opacity: 1; }
    }

    @keyframes reportCardFlipIn {
      from { opacity: 0; transform: translateY(14px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }

    .report-telemetry-card {
      position: relative;
      background: linear-gradient(160deg, #17171C 0%, #121216 100%);

      getRoomRef(roomCode) {
        const cleanCode = String(roomCode || '').trim().toUpperCase().replace(/[^A-Z0-9-]/g, '');
        return this._fs.doc(this.db, 'artifacts', this.appId, 'public', 'data', 'studyv_sync_rooms', cleanCode);
      },

      async pushRoom(roomCode, payload) {
        if (!this.ready || !this.user || !roomCode || !this._fs) return false;
        try {
          const ref = this.getRoomRef(roomCode);
          await this._fs.setDoc(ref, {
            payloadJson: JSON.stringify(payload),
            updatedAt: Date.now(),
            updatedBy: this.user.uid
          });
          return true;
        } catch (err) {
          return false;
        }
      },

      async pullRoom(roomCode) {
        if (!this.ready || !this.user || !roomCode || !this._fs) return null;
        try {
          const ref = this.getRoomRef(roomCode);
          const snap = await this._fs.getDoc(ref);
          if (!snap.exists()) return null;
          const data = snap.data();
          return data && data.payloadJson ? JSON.parse(data.payloadJson) : null;
        } catch (err) {
          return null;
        }
      },

      subscribeRoom(roomCode, onRemoteData) {
        if (this.unsubscribe) {
          this.unsubscribe();
          this.unsubscribe = null;
        }
        if (!this.ready || !this.user || !roomCode || !this._fs) return;
        const ref = this.getRoomRef(roomCode);
        this.unsubscribe = this._fs.onSnapshot(
          ref,
          (snap) => {
            if (!snap.exists()) return;
            const data = snap.data();
            if (!data || data.updatedBy === this.user.uid || !data.payloadJson) return;
            try {
              const parsed = JSON.parse(data.payloadJson);
              if (typeof onRemoteData === 'function') onRemoteData(parsed, data.updatedAt);
            } catch (e) {}
          },
          () => {}
        );
      }
    };

    window.StudyVCloudBridge.init().then((ok) => {
      if (ok && typeof window.onStudyVCloudReady === 'function') {
        window.onStudyVCloudReady();
      }
    });
  </script>

    function loadPersistedState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);

        if (parsed.courses && Array.isArray(parsed.courses)) {
          const freshCourses = getDefaultCourses();
          const savedCardMap = {};
          parsed.courses.forEach(c => {
            if (c && Array.isArray(c.cards)) {
              c.cards.forEach(card => {
                if (card && card.id) savedCardMap[card.id] = card;
              });
            }
          });
          freshCourses.forEach(fc => {
            fc.cards.forEach(card => {
              const saved = savedCardMap[card.id];
              if (saved) {
                card.completedSteps = Math.max(0, Math.min(card.totalSteps, Number(saved.completedSteps) || 0));
                card.column = card.completedSteps >= card.totalSteps ? 'completed' : (saved.column || 'todo');
                if (Array.isArray(saved.checklist) && Array.isArray(card.checklist)) {
                  saved.checklist.forEach((ch, idx) => {
                    if (card.checklist[idx] && typeof ch.done === 'boolean') {
                      card.checklist[idx].done = ch.done;
                    }
                  });
                }
                if (Array.isArray(saved.notes) && saved.notes.length > 0) {
                  card.notes = saved.notes;
                  card.notesCount = saved.notes.length;
                }
              }
            });
          });
          COURSES = freshCourses;
        }

        if (parsed.appState) {
          appState = {
            ...appState,
            ...parsed.appState,
            activeNav: 'dashboard',
            selectedCardId: null,
            draggedCardId: null,
            activeQuizSession: null,
            examTimerId: null
          };
          if (!appState.wrongQuestions || typeof appState.wrongQuestions !== 'object') {
            appState.wrongQuestions = {};
          }
          if (typeof appState.xp !== 'number') {
            appState.xp = 0;
          }
          if (!Array.isArray(appState.flashcards) || appState.flashcards.length === 0) {
            appState.flashcards = getDefaultFlashcards();
          }
        }
      } catch (e) {
        COURSES = getDefaultCourses();
      }
    }

    let studyAudioCtx = null;

    function playStudySound(type) {
      if (!appState.soundEnabled) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        if (!studyAudioCtx) studyAudioCtx = new AudioCtx();
        if (studyAudioCtx.state === 'suspended') studyAudioCtx.resume();
        const now = studyAudioCtx.currentTime;

        const playTone = (freq, startOffset, duration, gainVal = 0.055, wave = 'sine') => {
          const osc = studyAudioCtx.createOscillator();
          const gain = studyAudioCtx.createGain();
          osc.type = wave;
          osc.frequency.setValueAtTime(freq, now + startOffset);
          gain.gain.setValueAtTime(0.0001, now + startOffset);
          gain.gain.exponentialRampToValueAtTime(gainVal, now + startOffset + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + startOffset + duration);
          osc.connect(gain);
          gain.connect(studyAudioCtx.destination);
          osc.start(now + startOffset);
          osc.stop(now + startOffset + duration + 0.02);
        };

        if (type === 'correct') {
          playTone(587.33, 0, 0.14, 0.05, 'sine');
          playTone(880.0, 0.08, 0.2, 0.055, 'sine');
        } else if (type === 'wrong') {
          playTone(246.94, 0, 0.16, 0.045, 'triangle');
          playTone(196.0, 0.09, 0.22, 0.045, 'triangle');
        } else if (type === 'flip') {
          playTone(440.0, 0, 0.08, 0.03, 'sine');
        } else if (type === 'levelup') {
          playTone(523.25, 0, 0.15, 0.055, 'sine');
          playTone(659.25, 0.1, 0.15, 0.055, 'sine');
          playTone(783.99, 0.2, 0.18, 0.06, 'sine');
          playTone(1046.5, 0.31, 0.32, 0.065, 'sine');
        }
      } catch (e) {}
    }

    function getXpNeededForLevel(level) {
      const safeLvl = Math.max(1, Math.min(100, level));
      return 60 + (safeLvl - 1) * 15;
    }

    function getTotalXpForLevel(targetLevel) {
      let total = 0;
      for (let l = 1; l < targetLevel; l++) {
        total += getXpNeededForLevel(l);
      }
      return total;
    }

    function getLevelInfo(totalXp = 0) {
      let xp = Math.max(0, Math.floor(totalXp || 0));
      let level = 1;
      while (level < 100) {
        const needed = getXpNeededForLevel(level);
        if (xp < needed) break;
        xp -= needed;
        level += 1;
      }
      const nextLevelXp = getXpNeededForLevel(level);
      const pct = level >= 100 ? 100 : Math.min(100, Math.round((xp / nextLevelXp) * 100));
      return {
        level,
        currentLevelXp: xp,
        nextLevelXp,
        totalXp: Math.max(0, Math.floor(totalXp || 0)),
        pct
      };
    }

    function getRankForLevel(level) {
      const safeLvl = Math.max(1, Math.min(100, level || 1));
      const tierIdx = Math.min(RANK_TIERS.length - 1, Math.floor(safeLvl / 10));
      const current = RANK_TIERS[tierIdx];
      const nextRank = RANK_TIERS[tierIdx + 1] || null;
      const levelsToNextRank = nextRank ? Math.max(0, nextRank.minLevel - safeLvl) : 0;
      return {
        ...current,
        nextRank,
        levelsToNextRank
      };
    }

    function awardXp(amount) {
      if (!amount || amount <= 0) return false;
      const prevLevel = getLevelInfo(appState.xp || 0).level;
      const prevRank = getRankForLevel(prevLevel);
      appState.xp = Math.max(0, (appState.xp || 0) + amount);
      const nextLevel = getLevelInfo(appState.xp).level;
      const nextRank = getRankForLevel(nextLevel);
      updateSidebarGamification();

      if (nextLevel > prevLevel) {
        playStudySound('levelup');
        if (nextRank.tier > prevRank.tier) {
          showToast(`Neuer Rang & Banner freigeschaltet: ${nextRank.name} „${nextRank.bannerTitle}“ (Lvl ${nextLevel})!`);
        } else {
          showToast(`Level Up! Level ${nextLevel} (${nextRank.name}) erreicht (+${amount} XP)`);
        }
        return true;
      }
      return false;
    }

    function updateSidebarGamification() {
      const slot = document.getElementById('sidebar-gamification-slot');
      if (!slot) return;
      const lvl = getLevelInfo(appState.xp || 0);
      const rank = getRankForLevel(lvl.level);

      slot.innerHTML = `
        <div onclick="openRankMedalsModal()"
             onmousemove="handleFolderCardMove(event, this)"
             onmouseleave="handleFolderCardLeave(this)"
             style="--rank-rgb: ${rank.rgb}; ${rank.bannerStyle}"
             title="Klicken für Level-Details &amp; alle 10 Rang-Banner"
             class="rank-banner-shell sidebar-rank-banner p-3.5 cursor-pointer group">
          
          ${renderRankBannerArtwork(rank.tier, 'sidebar')}
          <div class="sidebar-card-sweep"></div>
          <div class="folder-cursor-spotlight absolute inset-0 pointer-events-none" style="--accent-rgb: ${rank.rgb};"></div>

          <div class="relative z-10">
            <div class="flex items-center justify-between gap-2 mb-2.5">
              <div class="flex items-center gap-2.5 min-w-0">
                <div class="relative shrink-0">
                  <span class="sidebar-medal-halo"></span>
                  <div class="relative drop-shadow-[0_4px_12px_rgba(0,0,0,0.75)] transition-transform duration-300 group-hover:scale-110">
                    ${renderRankMedalSvg(rank.tier, 38, false)}
                  </div>
                </div>
                <div class="min-w-0">
                  <div class="text-[13.5px] font-extrabold text-white leading-tight truncate">Level ${lvl.level}</div>
                  <div class="text-[11px] font-bold leading-tight truncate" style="color: ${rank.hex};">${rank.name}</div>
                </div>
              </div>

              <span class="px-2.5 py-0.5 rounded-full bg-black/35 border border-white/20 text-[10px] font-semibold text-white group-hover:bg-white/20 transition shrink-0">

              </span>

            <div class="w-full h-1.5 bg-black/50 rounded-full overflow-hidden border border-white/15 mb-1.5">

            </div>
            <div class="flex items-center justify-between text-[10.5px] text-white/85 font-medium">
              <span>${lvl.currentLevelXp} / ${lvl.nextLevelXp} XP</span>
              <span>${lvl.totalXp} XP</span>
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 1D. PERSISTENT POMODORO FOCUS TIMER WIDGET (Sidebar Footer)
    // =========================================================================

    const pomodoroState = {
      expanded: false,
      running: false,
      isBreak: false,
      focusMinutes: 25,
      breakMinutes: 5,
      remainingSeconds: 25 * 60,
      intervalId: null
    };

    function formatPomodoroTime(secs) {
      const m = Math.floor(Math.max(0, secs) / 60);
      const s = Math.max(0, secs) % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function renderSidebarPomodoro() {
      const slot = document.getElementById('sidebar-pomodoro-slot');
      if (!slot) return;
      const timeStr = formatPomodoroTime(pomodoroState.remainingSeconds);

      slot.innerHTML = `
        <div class="bg-[#1B1B20] border border-[#282830] rounded-[12px] p-2.5 transition">
          <div onclick="togglePomodoroExpand()" class="flex items-center justify-between gap-2 cursor-pointer">
            <div class="flex items-center gap-2 min-w-0">
              <span class="w-2 h-2 rounded-full ${pomodoroState.running ? 'bg-[#10B981] animate-pulse' : 'bg-[#60A5FA]'} shrink-0"></span>
              <span class="text-[12px] font-semibold text-[#E4E4E7] truncate">
                ${pomodoroState.isBreak ? 'Pause' : 'Fokus-Timer'}
              </span>
            </div>
            <div class="flex items-center gap-1.5 shrink-0">
              <span class="font-mono text-[12px] font-bold text-[#60A5FA]">${timeStr}</span>
              <span class="text-[10px] text-[#8E8E93]">${pomodoroState.expanded ? '▲' : '▼'}</span>
            </div>
          </div>

          ${pomodoroState.expanded ? `
            <div class="mt-2.5 pt-2.5 border-t border-[#26262E] space-y-2">
              <div class="grid grid-cols-3 gap-1">
                <button type="button" onclick="setPomodoroPreset(25, 5)"
                        class="py-1 rounded-[7px] text-[11px] font-semibold transition ${pomodoroState.focusMinutes === 25 ? 'bg-[#3B82F6] text-white' : 'bg-[#131316] text-[#8E8E93] hover:text-white'}">
                  25/5m
                </button>
                <button type="button" onclick="setPomodoroPreset(50, 10)"
                        class="py-1 rounded-[7px] text-[11px] font-semibold transition ${pomodoroState.focusMinutes === 50 ? 'bg-[#3B82F6] text-white' : 'bg-[#131316] text-[#8E8E93] hover:text-white'}">
                  50/10m
                </button>
                <button type="button" onclick="promptCustomPomodoro()"
                        class="py-1 rounded-[7px] bg-[#131316] hover:bg-[#23232A] text-[11px] font-semibold text-[#8E8E93] hover:text-white transition">
                  Eigene
                </button>
              </div>
              <div class="flex items-center gap-1.5">
                <button type="button" onclick="startStopPomodoro()"
                        class="flex-1 py-1.5 rounded-[8px] ${pomodoroState.running ? 'bg-[#F59E0B]/20 text-[#FBBF24] border border-[#F59E0B]/35' : 'bg-[#3B82F6] hover:bg-[#2563EB] text-white'} text-[11.5px] font-semibold transition">
                  ${pomodoroState.running ? 'Pause' : 'Starten'}
                </button>
                <button type="button" onclick="resetPomodoro()"
                        class="px-2.5 py-1.5 rounded-[8px] bg-[#131316] hover:bg-[#23232A] border border-[#282830] text-[11.5px] text-[#9A9AA4] hover:text-white transition">
                  ↺
                </button>
              </div>
            </div>
          ` : ''}
        </div>
      `;
    }

    function togglePomodoroExpand() {
      pomodoroState.expanded = !pomodoroState.expanded;
      renderSidebarPomodoro();
    }

    function setPomodoroPreset(focusMin, breakMin) {
      if (pomodoroState.intervalId) {
        clearInterval(pomodoroState.intervalId);
        pomodoroState.intervalId = null;
      }
      pomodoroState.running = false;
      pomodoroState.isBreak = false;
      pomodoroState.focusMinutes = focusMin;
      pomodoroState.breakMinutes = breakMin;
      pomodoroState.remainingSeconds = focusMin * 60;
      renderSidebarPomodoro();
    }

    function promptCustomPomodoro() {
      openModal(`
        <div class="p-5">
          <div class="flex items-center justify-between mb-3">
            <h3 class="text-[15.5px] font-bold text-[#F4F4F6]">Eigene Fokus-Zeit</h3>
            <button onclick="closeModal()" class="text-[#78787F] hover:text-white p-1">✕</button>
          </div>
          <form onsubmit="applyCustomPomodoro(event)" class="space-y-3">
            <div>

    function applyCustomPomodoro(event) {
      event.preventDefault();
      const mins = Math.max(1, Math.min(120, parseInt(document.getElementById('custom-pomo-input')?.value || '25', 10)));
      setPomodoroPreset(mins, 5);
      closeModal();
    }

    function startStopPomodoro() {
      if (pomodoroState.running) {
        pomodoroState.running = false;
        if (pomodoroState.intervalId) {
          clearInterval(pomodoroState.intervalId);
          pomodoroState.intervalId = null;
        }
        renderSidebarPomodoro();
        return;
      }

      pomodoroState.running = true;
      renderSidebarPomodoro();
      pomodoroState.intervalId = setInterval(() => {
        if (pomodoroState.remainingSeconds > 1) {
          pomodoroState.remainingSeconds -= 1;
          renderSidebarPomodoro();
        } else {
          clearInterval(pomodoroState.intervalId);
          pomodoroState.intervalId = null;
          pomodoroState.running = false;
          if (!pomodoroState.isBreak) {
            pomodoroState.isBreak = true;
            pomodoroState.remainingSeconds = pomodoroState.breakMinutes * 60;
            recordLessonCompletion(1);
            awardXp(25);
            playStudySound('levelup');
            savePersistedState();
            if (appState.activeNav === 'dashboard') {
              shouldAnimateDashboard = false;
              renderWorkspace();
            }
            showToast('Fokus-Einheit geschafft! +1 Tagesziel & +25 XP');
          } else {
            pomodoroState.isBreak = false;
            pomodoroState.remainingSeconds = pomodoroState.focusMinutes * 60;
            playStudySound('flip');
            showToast('Pause beendet — bereit für die nächste Fokus-Runde!');
          }
          renderSidebarPomodoro();
        }
      }, 1000);
    }

    function resetPomodoro() {
      setPomodoroPreset(pomodoroState.focusMinutes, pomodoroState.breakMinutes);
    }

    function getWrongQuestionsCount() {
      return appState.wrongQuestions && typeof appState.wrongQuestions === 'object'
        ? Object.keys(appState.wrongQuestions).length
        : 0;
    }

    function recordMistakeQuestion(cardId, poolIndex) {
      if (!cardId || poolIndex === undefined || poolIndex === null) return;
      if (!appState.wrongQuestions || typeof appState.wrongQuestions !== 'object') {
        appState.wrongQuestions = {};
      }
      const key = `${cardId}::${poolIndex}`;
      appState.wrongQuestions[key] = {
        cardId,
        poolIndex,
        streakCorrect: 0,
        updatedAt: Date.now()
      };
    }

    function resolveMistakeQuestionHit(cardId, poolIndex) {
      if (!appState.wrongQuestions) return false;
      const key = `${cardId}::${poolIndex}`;
      const entry = appState.wrongQuestions[key];
      if (!entry) return false;
      entry.streakCorrect = (entry.streakCorrect || 0) + 1;
      if (entry.streakCorrect >= 2) {
        delete appState.wrongQuestions[key];
        return true;
      }
      return false;
    }

    function renderSegmentedTicks(completedSteps, totalSteps, fillColor = '#3B82F6', totalTicks = 16) {
      const ratio = totalSteps > 0 ? Math.min(1, Math.max(0, completedSteps / totalSteps)) : 0;
      const activeTicks = Math.round(ratio * totalTicks);
      const emptyColor = (appState && appState.appTheme === 'daylight') ? '#CBD5E1' : '#2C2C33';
      let ticksHtml = '<div class="tick-bar-container" aria-hidden="true">';
      for (let i = 0; i < totalTicks; i++) {
        const isFilled = i < activeTicks;
        ticksHtml += `<span class="tick-segment ${isFilled ? 'is-filled' : ''}" style="--tick-idx: ${i}; background-color: ${isFilled ? fillColor : emptyColor};"></span>`;
      }
      ticksHtml += '</div>';
      return ticksHtml;
    }

    // =========================================================================

    let shouldAnimateDashboard = true;

    function switchChartRange(range) {
      appState.chartRange = range;
      appState.hoveredChartDay = null;

      savePersistedState();

    function buildDashboardChartSvg() {
      const isLight = appState.appTheme === 'daylight';
      const gridColor = isLight ? '#E2E8F0' : '#202026';
      const axisTextColor = isLight ? '#64748B' : '#686873';
      const activeLabelColor = isLight ? '#2563EB' : '#93C5FD';
      const tooltipBg = isLight ? '#0F172A' : '#1E1E24';

      const rangeDays = appState.chartRange === '1T' ? 5 : appState.chartRange === '1M' ? 14 : 7;
      const todayKey = getTodayIsoKey();
      const seriesPoints = [];
      for (let i = rangeDays - 1; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const iso = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        const label = `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth() + 1).padStart(2, '0')}.`;
        const val = iso === todayKey
          ? Math.max(appState.dailyHistory[iso] || 0, appState.completedToday || 0)
          : (appState.dailyHistory[iso] || 0);
        seriesPoints.push({ iso, label, val, isToday: iso === todayKey });
      }

      const maxVal = Math.max(12, ...seriesPoints.map(p => p.val));
      const svgW = 540;
      const svgH = 175;
      const padL = 34;
      const padR = 44;
      const padT = 34;
      const padB = 26;
      const plotW = svgW - padL - padR;
      const plotH = svgH - padT - padB;

      const coords = seriesPoints.map((pt, idx) => {
        const x = padL + (seriesPoints.length > 1 ? (idx / (seriesPoints.length - 1)) * plotW : plotW / 2);
        const y = padT + plotH - (pt.val / maxVal) * plotH;
        return { ...pt, x, y, idx };
      });

      let linePath = '';
      if (coords.length > 0) {
        linePath = `M ${coords[0].x.toFixed(1)} ${coords[0].y.toFixed(1)}`;
        for (let i = 0; i < coords.length - 1; i++) {
          const p0 = coords[i];
          const p1 = coords[i + 1];
          const cpx = ((p0.x + p1.x) / 2).toFixed(1);
          linePath += ` C ${cpx} ${p0.y.toFixed(1)}, ${cpx} ${p1.y.toFixed(1)}, ${p1.x.toFixed(1)} ${p1.y.toFixed(1)}`;
        }
      }
      const areaPath = coords.length > 0
        ? `${linePath} L ${coords[coords.length - 1].x.toFixed(1)} ${(padT + plotH).toFixed(1)} L ${coords[0].x.toFixed(1)} ${(padT + plotH).toFixed(1)} Z`
        : '';

      const focusIdx = (appState.hoveredChartDay !== null && coords[appState.hoveredChartDay])
        ? appState.hoveredChartDay
        : Math.max(0, coords.length - 1);
      const focusPt = coords[focusIdx] || { x: padL, y: padT + plotH, val: 0, label: '' };
      const pillW = 68;
      const pillX = Math.min(svgW - pillW - 4, Math.max(4, focusPt.x - pillW / 2));
      const pillY = Math.max(4, focusPt.y - 31);

      return `
        <svg viewBox="0 0 ${svgW} ${svgH}" class="w-full h-[185px] overflow-visible">
          <defs>
            <linearGradient id="cobaltAreaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.34" />
              <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.0" />
            </linearGradient>
          </defs>

          ${[0, 0.25, 0.5, 0.75, 1].map(frac => {
            const yPos = padT + plotH - frac * plotH;
            const labelVal = Math.round(frac * maxVal);
            return `
              <line x1="${padL}" y1="${yPos.toFixed(1)}" x2="${svgW - padR}" y2="${yPos.toFixed(1)}" stroke="${gridColor}" stroke-width="1" />
              <text x="${padL - 8}" y="${(yPos + 3.5).toFixed(1)}" text-anchor="end" fill="${axisTextColor}" font-size="9.5" font-family="Inter, sans-serif">${labelVal}</text>
            `;
          }).join('')}

          <path d="${areaPath}" fill="url(#cobaltAreaGrad)" />
          <path d="${linePath}" fill="none" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round" />

          <line x1="${focusPt.x.toFixed(1)}" y1="${focusPt.y.toFixed(1)}" x2="${focusPt.x.toFixed(1)}" y2="${(padT + plotH).toFixed(1)}"
                stroke="#3B82F6" stroke-opacity="0.45" stroke-width="1.2" stroke-dasharray="3 3" />

          ${coords.filter((_, i) => coords.length <= 7 || i % 2 === 0 || i === coords.length - 1).map(pt => `
            <text x="${pt.x.toFixed(1)}" y="${svgH - 4}" text-anchor="middle" fill="${pt.idx === focusIdx ? activeLabelColor : axisTextColor}" font-size="9.5" font-weight="${pt.idx === focusIdx ? '600' : '400'}" font-family="Inter, sans-serif">${pt.label}</text>
          `).join('')}

          ${coords.map(pt => `
            <g class="cursor-pointer" onmouseenter="setHoveredChartDay(${pt.idx})" onclick="setHoveredChartDay(${pt.idx})">
              <rect x="${(pt.x - 18).toFixed(1)}" y="${padT - 10}" width="36" height="${plotH + 24}" fill="transparent" />
              <circle cx="${pt.x.toFixed(1)}" cy="${pt.y.toFixed(1)}" r="2.8" fill="${pt.idx === focusIdx ? '#3B82F6' : '#60A5FA'}" fill-opacity="${pt.idx === focusIdx ? '1' : '0.55'}" />
            </g>
          `).join('')}

          <circle cx="${focusPt.x.toFixed(1)}" cy="${focusPt.y.toFixed(1)}" r="8" fill="#3B82F6" fill-opacity="0.28">
            <animate attributeName="r" values="6;12;6" dur="2.2s" repeatCount="indefinite" />
            <animate attributeName="fill-opacity" values="0.38;0.08;0.38" dur="2.2s" repeatCount="indefinite" />
          </circle>
          <circle cx="${focusPt.x.toFixed(1)}" cy="${focusPt.y.toFixed(1)}" r="4.2" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2" />

          <g>
            <rect x="${pillX.toFixed(1)}" y="${pillY.toFixed(1)}" width="${pillW}" height="20" rx="10" fill="${tooltipBg}" stroke="#3B82F6" stroke-opacity="0.65" />
            <polygon points="${(focusPt.x - 4).toFixed(1)},${(pillY + 20).toFixed(1)} ${(focusPt.x + 4).toFixed(1)},${(pillY + 20).toFixed(1)} ${focusPt.x.toFixed(1)},${(pillY + 24).toFixed(1)}" fill="${tooltipBg}" />
            <text x="${(pillX + pillW / 2).toFixed(1)}" y="${(pillY + 13.5).toFixed(1)}" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="600" font-family="Inter, sans-serif">${focusPt.val} Lekt.</text>
          </g>
        </svg>
      `;
    }

    function setHoveredChartDay(idx) {
      if (appState.hoveredChartDay === idx) return;
      appState.hoveredChartDay = idx;
      const chartBox = document.getElementById('dash-chart-container');
      if (chartBox) {
        chartBox.innerHTML = buildDashboardChartSvg();
      }

    function renderDashboardView() {
      const animClass = shouldAnimateDashboard ? 'dash-card-animate' : '';
      const headerAnimClass = shouldAnimateDashboard ? 'dash-header-enter' : '';
      shouldAnimateDashboard = false;

      const totalDone = COURSES.reduce((sum, c) => sum + c.cards.reduce((s, m) => s + m.completedSteps, 0), 0);
      const totalAll = COURSES.reduce((sum, c) => sum + c.cards.reduce((s, m) => s + m.totalSteps, 0), 0);
      const overallPct = totalAll > 0 ? Math.round((totalDone / totalAll) * 100) : 0;
      const dailyPct = appState.dailyGoal > 0 ? Math.min(100, Math.round((appState.completedToday / appState.dailyGoal) * 100)) : 0;

      const sortedExams = [...appState.exams].sort((a, b) => a.date.localeCompare(b.date));
      const nextExam = sortedExams[0] || null;
      const upcomingExams = sortedExams.slice(0, 3);
      const masteredFlashcards = appState.flashcards.filter(f => f.mastered).length;

      const getDaysCountdown = (isoDate) => {
        if (!isoDate) return '';
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const target = new Date(isoDate + 'T00:00:00');
        const diffDays = Math.round((target - today) / (1000 * 60 * 60 * 24));
        if (diffDays < 0) return 'Vorbei';
        if (diffDays === 0) return 'Heute';
        if (diffDays === 1) return 'Morgen';
        return `${diffDays}d`;
      };

      const totalItemsAll = totalAll + Math.max(1, appState.flashcards.length);
      const totalItemsDone = totalDone + masteredFlashcards;
      const exactQuote = totalItemsAll > 0
        ? Math.min(100, ((totalItemsDone / totalItemsAll) * 100) + (totalItemsDone === 0 && appState.completedToday > 0 ? Math.min(15, appState.completedToday * 2.5) : 0))
        : 0;
      const formattedQuote = `${exactQuote.toFixed(2)}%`;

      const shortMap = { rechnungswesen: 'RW', gespraechsgestaltung: 'GG', sozialkunde: 'SK', englisch: 'EN', kundenbindung: 'KAB' };
      const comparisonBars = [
        ...COURSES.map(c => {
          const d = c.cards.reduce((s, m) => s + m.completedSteps, 0);
          const t = c.cards.reduce((s, m) => s + m.totalSteps, 0);
          const pct = t > 0 ? Math.round((d / t) * 100) : 0;
          return { key: c.id, label: shortMap[c.id] || c.title.slice(0, 3).toUpperCase(), pct, action: `openSubjectBoard('${c.id}')` };
        }),
        { key: 'karten', label: 'Karten', pct: appState.flashcards.length > 0 ? Math.round((masteredFlashcards / appState.flashcards.length) * 100) : 0, action: `navigateSection('inbox')` }
      ];

      let bestBarIdx = 0;
      comparisonBars.forEach((b, i) => {
        if (b.pct > comparisonBars[bestBarIdx].pct) bestBarIdx = i;
      });

      const isLight = appState.appTheme === 'daylight';
      const lvl = getLevelInfo(appState.xp || 0);
      const rank = getRankForLevel(lvl.level);
      const wrongCount = getWrongQuestionsCount();

      return `
        <div class="flex-1 overflow-y-auto px-6 sm:px-9 py-7">
          <div class="max-w-[1160px]">

            <!-- Top Header Row -->
            <div class="${headerAnimClass} flex items-center justify-between flex-wrap gap-4 mb-6">
              <div>
                <h1 class="text-[24px] sm:text-[26px] font-bold text-[#F4F4F6] tracking-[-0.02em]">Dashboard Overview</h1>
                <p class="text-[12.5px] text-[#7E7E87] mt-0.5">StudyV • Lernfortschritt &amp; Prüfungsübersicht</p>
              </div>

              <div class="flex items-center gap-2.5 flex-wrap">
                <!-- Compact Level & Rank Medal Pill -->
                <button type="button" onclick="openRankMedalsModal()"
                        title="Klicken für Level-Details &amp; alle 10 Rang-Banner"
                        class="dash-xp-pill inline-flex items-center gap-2.5 px-3.5 py-1.5 rounded-full bg-[#161619] hover:bg-[#1C1C22] border border-[#24242A] transition">
                  ${renderRankMedalSvg(rank.tier, 26, false)}
                  <div class="flex items-center gap-2">
                    <span class="text-[12px] font-bold" style="color: ${rank.hex};">Lvl ${lvl.level} • ${rank.name}</span>
                    <div class="w-12 h-1.5 bg-[#101014] rounded-full overflow-hidden">
                      <div class="h-full rounded-full transition-all duration-300" style="width: ${lvl.pct}%; background-color: ${rank.hex};"></div>
                    </div>
                  </div>

    function renderKanbanBoard(course) {
      const columns = [
        { id: 'todo', title: 'To Do', barColor: '#7E7E87' },
        { id: 'completed', title: 'Done', barColor: '#10B981' }
      ];

      return `
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 items-start min-w-0">
          ${columns.map(col => {
            const colCards = col.id === 'todo'
              ? course.cards.filter(c => c.column !== 'completed')
              : course.cards.filter(c => c.column === 'completed');

            return `
              <section ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event, '${col.id}')"
                       class="kanban-column flex flex-col min-w-0 p-1.5 transition-colors">
                <div class="flex items-center justify-between px-1 mb-4">
                  <div class="flex items-center gap-2.5">
                    <span class="w-[3px] h-[15px] rounded-full" style="background-color: ${col.barColor};"></span>
                    <h2 class="text-[15px] font-semibold text-[#E4E4E7]">${col.title}</h2>
                    <span class="text-[12px] text-[#6E6E77] font-medium">${colCards.length}</span>
                  </div>
                </div>
                <div class="space-y-4">
                  ${colCards.length === 0 ? `
                    <div class="border border-dashed border-[#27272E] rounded-[16px] p-8 text-center text-[13px] text-[#6E6E77]">
                      ${col.id === 'completed' ? 'Beantworte 30 Fragen in einem Modul richtig, damit es automatisch hier landet.' : 'Alle Themen in diesem Fach wurden abgeschlossen!'}
                    </div>
                  ` : colCards.map((card, idx) => renderNebulaCard(card, idx)).join('')}
                </div>
              </section>
            `;
          }).join('')}
        </div>
      `;
    }

    function renderListView(course) {
      return `

          ${course.cards.map(card => `
            <div onclick="openQuizPopup('${card.id}')"

    // =========================================================================
    // 3C. KARTEN VIEW (3D Flip Card + Spaced Repetition + Eigene Karten)

    function isFlashcardDueToday(card) {
      if (!card) return false;
      if (!card.dueDate) return !card.mastered;
      return card.dueDate <= getTodayIsoKey();
    }

    function addDaysIso(days) {
      const d = new Date();
      d.setDate(d.getDate() + days);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function renderInboxView() {
      const allSubjects = ['ALL', 'Rechnungswesen', 'Gesprächsgestaltung', 'Sozialkunde', 'Englisch', 'Kunden akquirieren und binden'];
      const visibleSubjects = appState.showAllFlashcardSubjects
        ? allSubjects
        : (appState.selectedFlashcardSubject !== 'ALL' ? ['ALL', appState.selectedFlashcardSubject] : ['ALL']);
      const subjectPool = appState.selectedFlashcardSubject === 'ALL'
        ? appState.flashcards
        : appState.flashcards.filter(c => c.subject === appState.selectedFlashcardSubject);

      const dueInPoolCount = subjectPool.filter(isFlashcardDueToday).length;
      const filtered = appState.flashcardDueFilterOnly
        ? subjectPool.filter(isFlashcardDueToday)
        : subjectPool;

      const totalCount = filtered.length;
      const safeIdx = totalCount > 0 ? ((appState.flashcardPage || 0) % totalCount + totalCount) % totalCount : 0;
      const activeCard = totalCount > 0 ? filtered[safeIdx] : null;
      const isFlipped = activeCard ? !!appState.flippedFlashcardIds[activeCard.id] : false;
      const masteredCount = subjectPool.filter(c => c.mastered).length;
      const currentInterval = activeCard ? (activeCard.intervalDays || 0) : 0;
      const nextGoodDays = currentInterval >= 8 ? 16 : currentInterval >= 4 ? 8 : 4;

      const framePalettes = {
        Rechnungswesen: {

        },
        Gesprächsgestaltung: {

          borderGrad: 'linear-gradient(135deg, #6EE7B7 0%, #10B981 50%, #059669 100%)',
          glowColor: 'rgba(16, 185, 129, 0.34)', innerTint: 'rgba(16, 185, 129, 0.16)',
          glyphSvg: `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.2C11.55 21.2 11.12 21.03 10.78 20.73C5.8 16.25 2.75 13.45 2.75 9.65C2.75 6.55 5.15 4.2 8.2 4.2C9.95 4.2 11.6 5.02 12 6.25C12.4 5.02 14.05 4.2 15.8 4.2C18.85 4.2 21.25 6.55 21.25 9.65C21.25 13.45 18.2 16.25 13.22 20.73C12.88 21.03 12.45 21.2 12 21.2Z"/></svg>`
        }
      };

      const pal = activeCard ? (framePalettes[activeCard.subject] || framePalettes.Rechnungswesen) : framePalettes.Rechnungswesen;
      const slideClass = appState.flashcardSlideDir === 'next' ? 'slide-next' : appState.flashcardSlideDir === 'prev' ? 'slide-prev' : '';
      appState.flashcardSlideDir = '';

      return `
        <div class="flex-1 overflow-y-auto px-6 sm:px-9 py-7">
          <div class="max-w-[920px] mx-auto">
            <div class="flex items-center justify-between flex-wrap gap-3 mb-5">
              <div>
                <h1 class="text-[26px] font-bold text-[#F4F4F6] tracking-[-0.02em]">Karten</h1>
                <p class="text-[13px] text-[#8E8E93] mt-0.5">Spaced Repetition (Leitner) • Leertaste = Umdrehen • Tasten 1–3 = Bewerten</p>
              </div>
              <div class="flex items-center gap-2.5 flex-wrap">
                <button type="button" onclick="openFlashcardEditorModal()"
                        class="dash-cta-pill px-4 py-2 rounded-full bg-[#3B82F6] hover:bg-[#2563EB] text-white text-[12.5px] font-semibold shadow-lg shadow-[#3B82F6]/20 transition">
                  + Neue Karteikarte
                </button>
                <span class="px-3.5 py-1.5 rounded-full bg-[#161619] border border-[#26262E] text-[12px] font-semibold text-[#60A5FA]">
