    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function buildFreshQuizRound(cardId) {
      const rawPool = QUESTION_POOLS[cardId] || [];
      const seenSet = new Set(appState.seenQuestionIds[cardId] || []);

      let unseenIndices = rawPool.map((_, i) => i).filter(i => !seenSet.has(i));
      if (unseenIndices.length < 6) {
        unseenIndices = rawPool.map((_, i) => i);
        appState.seenQuestionIds[cardId] = [];
      }

      const selectedIndices = shuffleArray(unseenIndices).slice(0, Math.min(6, rawPool.length));
      appState.seenQuestionIds[cardId] = Array.from(new Set([...(appState.seenQuestionIds[cardId] || []), ...selectedIndices]));

      return selectedIndices.map(poolIdx => {
        const item = rawPool[poolIdx];
        const indexedOptions = item.options.map((text, optIdx) => ({
          text,
          isCorrect: optIdx === item.correctIndex
        }));
        const shuffledOptions = shuffleArray(indexedOptions);
        return {
          poolIdx,
          question: item.question,
          options: shuffledOptions.map(o => o.text),
          correctIndex: shuffledOptions.findIndex(o => o.isCorrect),
          tip: item.tip,
          explanation: item.explanation
        };
      });
    }

    function openQuizPopup(cardId) {
      const card = getCardById(cardId);
      if (!card) return;
      const questions = buildFreshQuizRound(cardId);
      if (questions.length === 0) {
        openModuleDrawer(cardId);
        return;
      }

      appState.activeQuizSession = {
        cardId,
        questions,
        currentIndex: 0,
        answeredIndex: null,
        showTip: false,
        mood: 'green', // 'green' | 'red' (switches to red on wrong answer, back to green on right answer)
        results: []    // { question, userAnswer, correctAnswer, isCorrect }
      };

      savePersistedState();
      const overlay = document.getElementById('quiz-popup-overlay');
      if (overlay) {
        overlay.classList.remove('hidden');
        overlay.classList.add('flex');
      }
      renderQuizPopup();
    }

    function closeQuizPopup() {
      appState.activeQuizSession = null;
      const overlay = document.getElementById('quiz-popup-overlay');
      if (overlay) {
        overlay.classList.add('hidden');
        overlay.classList.remove('flex');
      }
    }

    function openStudyMaterialFromQuiz() {
      const cardId = appState.activeQuizSession?.cardId;
      closeQuizPopup();
      if (cardId) openModuleDrawer(cardId);
    }

    function toggleQuizTip() {
      const session = appState.activeQuizSession;
      if (!session) return;
      session.showTip = !session.showTip;
      renderQuizPopup();
    }

    function selectQuizOption(optionIdx) {
      const session = appState.activeQuizSession;
      if (!session || session.answeredIndex !== null) return;

      const currentQ = session.questions[session.currentIndex];
      const isCorrect = optionIdx === currentQ.correctIndex;

      session.answeredIndex = optionIdx;
      session.mood = isCorrect ? 'green' : 'red';
      session.results.push({
        question: currentQ.question,
        userAnswer: currentQ.options[optionIdx],
        correctAnswer: currentQ.options[currentQ.correctIndex],
        isCorrect
      });

      if (isCorrect) {
        const card = getCardById(session.cardId);
        if (card) {
          card.completedSteps = Math.min(card.totalSteps, card.completedSteps + 3);
          recordLessonCompletion(1);
          if (card.completedSteps >= card.totalSteps) {
            card.column = 'completed';
          }
          savePersistedState();
          renderWorkspace();
        }
      }

      renderQuizPopup();
    }

    function skipQuizQuestion() {
      const session = appState.activeQuizSession;
      if (!session) return;

      const currentQ = session.questions[session.currentIndex];
      if (session.answeredIndex === null) {
        session.results.push({
          question: currentQ.question,
          userAnswer: 'Übersprungen',
          correctAnswer: currentQ.options[currentQ.correctIndex],
          isCorrect: false
        });
      }

      session.currentIndex += 1;
      session.answeredIndex = null;
      session.showTip = false;

      if (session.currentIndex >= session.questions.length) {
        const card = getCardById(session.cardId);
        const correctCount = session.results.filter(r => r.isCorrect).length;
        if (card && correctCount >= Math.ceil(session.questions.length * 0.6)) {
          card.completedSteps = card.totalSteps;
          card.column = 'completed';
          savePersistedState();
          renderWorkspace();
        }
      }

      renderQuizPopup();
    }

    function nextQuizQuestion() {
      const session = appState.activeQuizSession;
      if (!session) return;
      session.currentIndex += 1;
      session.answeredIndex = null;
      session.showTip = false;

      if (session.currentIndex >= session.questions.length) {
        const card = getCardById(session.cardId);
        const correctCount = session.results.filter(r => r.isCorrect).length;
        if (card && correctCount >= Math.ceil(session.questions.length * 0.6)) {
          card.completedSteps = card.totalSteps;
          card.column = 'completed';
          savePersistedState();
          renderWorkspace();
        }
      }

      renderQuizPopup();
    }

    function restartQuizRound() {
      const cardId = appState.activeQuizSession?.cardId;
      if (cardId) openQuizPopup(cardId);
    }

    function renderQuizPopup() {
      const session = appState.activeQuizSession;
      const box = document.getElementById('quiz-popup-box');
      if (!session || !box) return;

      const card = getCardById(session.cardId);
      const isRedMood = session.mood === 'red';
      const ambientGlow = isRedMood
        ? 'radial-gradient(95% 68% at 50% 0%, rgba(239, 68, 68, 0.28) 0%, rgba(19, 21, 20, 0) 74%)'
        : 'radial-gradient(95% 68% at 50% 0%, rgba(16, 185, 129, 0.24) 0%, rgba(19, 21, 20, 0) 74%)';
      const outerShadow = isRedMood
        ? 'rgba(239, 68, 68, 0.28)'
        : 'rgba(16, 185, 129, 0.25)';
      const borderColor = isRedMood
        ? 'rgba(239, 68, 68, 0.28)'
        : 'rgba(16, 185, 129, 0.22)';

      const totalQ = session.questions.length;
      const isFinished = session.currentIndex >= totalQ;

      // RESULT SCREEN AFTER 6 QUESTIONS
      if (isFinished) {
        const correctCount = session.results.filter(r => r.isCorrect).length;
        const scorePct = totalQ > 0 ? Math.round((correctCount / totalQ) * 100) : 0;

        box.innerHTML = `
          <div class="quiz-glass-card p-6 sm:p-7 animate-scale-in"
               style="--quiz-ambient-glow: ${ambientGlow}; --quiz-outer-shadow: ${outerShadow}; border-color: ${borderColor};">
            
            <!-- Top Bar -->
            <div class="flex items-center justify-between mb-5">
              <button onclick="openStudyMaterialFromQuiz()"
                      class="px-3 py-1.5 rounded-full bg-white/[0.06] hover:bg-white/[0.11] border border-white/[0.08] text-[11.5px] font-medium text-[#D4D4D8] transition">
                Lernstoff
              </button>
              <button onclick="closeQuizPopup()" class="w-8 h-8 rounded-full bg-white/[0.06] hover:bg-white/[0.12] text-[#A1A1AA] hover:text-white flex items-center justify-center transition">
                ✕
              </button>
            </div>

            <!-- Score Summary -->
            <div class="text-center mb-5">
              <div class="inline-flex items-center px-3 py-1 rounded-full bg-[#10B981]/15 border border-[#10B981]/30 text-[11.5px] font-semibold text-[#6EE7B7] mb-3">
                Ergebnis • ${escapeHtml(card?.title || '')}
              </div>
              <h2 class="text-[28px] font-bold text-[#F4F4F6] tracking-[-0.02em]">
                ${correctCount} / ${totalQ} richtig
              </h2>
              <p class="text-[13px] text-[#9A9AA4] mt-1">
                Trefferquote: ${scorePct}% ${scorePct >= 60 ? '— Thema erfolgreich gemeistert!' : '— Starte noch eine Runde zur Festigung.'}
              </p>
            </div>

            <!-- Question Breakdown List -->
            <div class="space-y-2.5 max-h-[260px] overflow-y-auto pr-1 mb-6">
              ${session.results.map((res, i) => `
                <div class="rounded-[12px] p-3 border ${res.isCorrect ? 'bg-[#10B981]/10 border-[#10B981]/25' : 'bg-[#EF4444]/10 border-[#EF4444]/25'}">
                  <div class="flex items-start gap-2 text-[12.5px] font-medium text-[#F4F4F6]">
                    <span class="${res.isCorrect ? 'text-[#34D399]' : 'text-[#F87171]'} font-bold shrink-0">${res.isCorrect ? '✓' : '✕'}</span>
                    <span>${i + 1}. ${escapeHtml(res.question)}</span>
                  </div>
                  ${!res.isCorrect ? `
                    <div class="mt-1.5 pl-5 text-[11.5px] space-y-0.5">
                      <div class="text-[#FCA5A5]">Deine Wahl: ${escapeHtml(res.userAnswer)}</div>
                      <div class="text-[#6EE7B7]">Richtig: ${escapeHtml(res.correctAnswer)}</div>
                    </div>
                  ` : ''}
                </div>
              `).join('')}
            </div>

            <!-- Clean Action Button (No Weird Icon) -->
            <div class="flex items-center gap-2.5">
              <button onclick="closeQuizPopup()"
                      class="flex-1 py-2.5 px-4 rounded-full bg-white/[0.06] hover:bg-white/[0.1] border border-white/[0.08] text-[13px] font-medium text-[#D4D4D8] transition">
                Fertig
              </button>
              <button onclick="restartQuizRound()"
                      class="flex-1 py-2.5 px-4 rounded-full bg-[#10B981] hover:bg-[#059669] text-[#052E16] text-[13px] font-semibold transition">
                Neue 6 Fragen starten
              </button>
            </div>
          </div>
        `;
        return;
      }

      // ACTIVE QUESTION SCREEN
      const q = session.questions[session.currentIndex];
      const hasAnswered = session.answeredIndex !== null;
      const isUserCorrect = session.answeredIndex === q.correctIndex;

      // Build visible answer rows:
      // - Before answering: all 4 options (pure text, no left icons)
      // - After answering:
      //     - If right: only the right answer (green)
      //     - If wrong: both the user's wrong answer (red) AND the right answer (green)
      let optionsHtml = '';
      if (!hasAnswered) {
        optionsHtml = q.options.map((opt, idx) => `
          <button onclick="selectQuizOption(${idx})"
                  class="w-full flex items-center justify-between gap-3 text-left px-4 py-3.5 rounded-[14px] bg-white/[0.03] hover:bg-white/[0.07] border border-white/[0.07] hover:border-white/[0.16] transition group">
            <span class="text-[13.5px] font-medium text-[#E4E4E7] group-hover:text-white leading-snug">
              ${escapeHtml(opt)}
            </span>
            <span class="w-7 h-7 rounded-[9px] bg-white/[0.05] group-hover:bg-white/[0.12] border border-white/[0.08] flex items-center justify-center text-[#A1A1AA] group-hover:text-white shrink-0 transition">
              →
            </span>
          </button>
        `).join('');
      } else if (isUserCorrect) {
        optionsHtml = `
          <div class="w-full flex items-center justify-between gap-3 px-4 py-3.5 rounded-[14px] bg-[#10B981]/16 border border-[#10B981]/45 text-[#6EE7B7]">
            <span class="text-[13.5px] font-semibold leading-snug">${escapeHtml(q.options[q.correctIndex])}</span>
            <span class="w-7 h-7 rounded-[9px] bg-[#10B981]/25 flex items-center justify-center text-[#34D399] font-bold shrink-0">✓</span>
          </div>
        `;
      } else {
        optionsHtml = `
          <div class="space-y-2.5">
            <div class="w-full flex items-center justify-between gap-3 px-4 py-3 rounded-[14px] bg-[#EF4444]/16 border border-[#EF4444]/45 text-[#FCA5A5]">
              <div>
                <div class="text-[10.5px] uppercase tracking-wider font-semibold text-[#F87171] mb-0.5">Deine Antwort</div>
                <div class="text-[13px] font-medium leading-snug">${escapeHtml(q.options[session.answeredIndex])}</div>
              </div>
              <span class="w-7 h-7 rounded-[9px] bg-[#EF4444]/25 flex items-center justify-center text-[#F87171] font-bold shrink-0">✕</span>
            </div>

            <div class="w-full flex items-center justify-between gap-3 px-4 py-3 rounded-[14px] bg-[#10B981]/16 border border-[#10B981]/45 text-[#6EE7B7]">
              <div>
                <div class="text-[10.5px] uppercase tracking-wider font-semibold text-[#34D399] mb-0.5">Richtige Antwort</div>
                <div class="text-[13px] font-semibold leading-snug">${escapeHtml(q.options[q.correctIndex])}</div>
              </div>
              <span class="w-7 h-7 rounded-[9px] bg-[#10B981]/25 flex items-center justify-center text-[#34D399] font-bold shrink-0">✓</span>
            </div>
          </div>
        `;
      }

      box.innerHTML = `
        <div class="quiz-glass-card p-6 sm:p-7 animate-scale-in"
             style="--quiz-ambient-glow: ${ambientGlow}; --quiz-outer-shadow: ${outerShadow}; border-color: ${borderColor};">
          
          <!-- Top Utility Row + 6-Segment Progress Indicator (Question Design.png) -->
          <div class="flex items-center justify-between gap-3 mb-6">
            <button onclick="openStudyMaterialFromQuiz()"
                    class="px-3 py-1 rounded-full bg-white/[0.06] hover:bg-white/[0.11] border border-white/[0.08] text-[11.5px] font-medium text-[#D4D4D8] transition">
              Lernstoff
            </button>

            <!-- 6 Progress Segments -->
            <div class="flex items-center gap-1.5">
              ${Array.from({ length: totalQ }, (_, idx) => {
                let segBg = 'bg-white/[0.12]';
                if (idx < session.currentIndex) {
                  segBg = session.results[idx]?.isCorrect ? 'bg-[#10B981]' : 'bg-[#EF4444]';
                } else if (idx === session.currentIndex) {
                  segBg = isRedMood ? 'bg-[#EF4444]' : 'bg-[#10B981]';
                }
                return `<span class="w-6 h-1 rounded-full transition-colors duration-300 ${segBg}"></span>`;
              }).join('')}
            </div>

            <button onclick="closeQuizPopup()"
                    class="w-7 h-7 rounded-full bg-white/[0.06] hover:bg-white/[0.12] text-[#A1A1AA] hover:text-white flex items-center justify-center text-[12px] transition">
              ✕
            </button>
          </div>

          <!-- Centered Question Header (No Folder Icon) -->
          <div class="text-center mb-6 px-1">
            <div class="text-[11px] font-semibold uppercase tracking-wider ${isRedMood ? 'text-[#FCA5A5]' : 'text-[#6EE7B7]'} mb-2">
              Frage ${session.currentIndex + 1} von ${totalQ} • ${escapeHtml(card?.title || '')}
            </div>
            <h2 class="text-[18px] sm:text-[19.5px] font-bold text-[#F4F4F6] leading-[1.35] tracking-[-0.015em]">
              ${escapeHtml(q.question)}
            </h2>
          </div>

          <!-- Answer Options (Pure Text, No Left Icons) -->
          <div class="space-y-2.5 mb-5">
            ${optionsHtml}
          </div>

          <!-- Optional Tip Box -->
          ${session.showTip && !hasAnswered ? `
            <div class="mb-5 p-3.5 rounded-[12px] bg-[#3B82F6]/12 border border-[#3B82F6]/30 text-[12.5px] text-[#BFDBFE] leading-relaxed">
              <strong class="text-[#93C5FD]">Tipp:</strong> ${escapeHtml(q.tip)}
            </div>
          ` : ''}

          <!-- Feedback & Explanation Box after Answering -->
          ${hasAnswered ? `
            <div class="mb-5 p-3.5 rounded-[12px] border text-[12.5px] leading-relaxed ${isUserCorrect ? 'bg-[#10B981]/12 border-[#10B981]/30 text-[#A7F3D0]' : 'bg-[#EF4444]/12 border-[#EF4444]/30 text-[#FECACA]'}">
              <div class="font-semibold mb-1">
                ${isUserCorrect ? 'Richtig beantwortet!' : 'Leider falsch — die richtige Antwort ist grün markiert.'}
              </div>
              <div class="text-[#E4E4E7]/90">${escapeHtml(q.explanation)}</div>
            </div>
          ` : ''}

          <!-- Bottom Bar: Tipp (replaces Back) & Skip / Weiter -->
          <div class="flex items-center justify-between gap-3 pt-1">
            <button onclick="toggleQuizTip()"
                    class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-white/[0.05] hover:bg-white/[0.1] border border-white/[0.08] text-[12.5px] font-medium text-[#D4D4D8] transition">
              <span>Tipp</span>
            </button>

            ${hasAnswered ? `
              <button onclick="nextQuizQuestion()"
                      class="inline-flex items-center gap-2 px-5 py-2 rounded-full ${isUserCorrect ? 'bg-[#10B981] hover:bg-[#059669] text-[#052E16]' : 'bg-[#F4F4F6] hover:bg-white text-[#111113]'} text-[12.5px] font-semibold transition">
                <span>${session.currentIndex + 1 >= totalQ ? 'Ergebnis anzeigen' : 'Nächste Frage'}</span>
                <span>→</span>
              </button>
            ` : `
              <button onclick="skipQuizQuestion()"
                      class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-white/[0.05] hover:bg-white/[0.1] border border-white/[0.08] text-[12.5px] font-medium text-[#D4D4D8] transition">
                <span>Skip</span>
              </button>
            `}
          </div>

        </div>
      `;
    }

      renderModuleDrawerContent();
    }

    function renderSearchResults(query) {
      const q = query.trim().toLowerCase();
      const allCards = COURSES.flatMap(course => course.cards.map(card => ({ ...card, courseTitle: course.title, courseId: course.id })));
      const matches = q
        ? allCards.filter(c => c.title.toLowerCase().includes(q) || c.courseTitle.toLowerCase().includes(q))
        : allCards;

      if (matches.length === 0) {
        return `<div class="py-8 text-center text-[13px] text-[#78787F]">Keine passenden Lernmodule gefunden.</div>`;
      }

      return matches.map(m => `
        <button onclick="selectSearchResult('${m.courseId}', '${m.id}')"
                class="w-full text-left p-2.5 rounded-[8px] hover:bg-[#222227] flex items-center justify-between gap-3 transition">
          <div>
            <div class="text-[13.5px] font-medium text-[#F4F4F6]">${escapeHtml(m.title)}</div>
            <div class="text-[11.5px] text-[#78787F]">${escapeHtml(m.courseTitle)}</div>
          </div>
          <span class="text-[12px] text-[#60A5FA] font-medium">${m.completedSteps}/${m.totalSteps}</span>
        </button>
      `).join('');
    }

    function filterSearchResults(val) {
      const list = document.getElementById('search-results-list');
      if (list) list.innerHTML = renderSearchResults(val);
    }

    function syncNavHighlight(navId) {
      document.querySelectorAll('.nav-item').forEach(btn => {

      syncNavHighlight(navId);
      toggleMobileSidebar(false);
      renderWorkspace();

    function handleFolderCardMove(event, cardEl) {
      const rect = cardEl.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;
      const centerX = rect.width / 2;
      const centerY = rect.height / 2;
      const rotateX = ((y - centerY) / centerY) * -3.5;
      const rotateY = ((x - centerX) / centerX) * 3.5;

      cardEl.style.setProperty('--mouse-x', `${x}px`);
      cardEl.style.setProperty('--mouse-y', `${y}px`);
      cardEl.style.setProperty('--tilt-x', `${rotateX.toFixed(2)}deg`);
      cardEl.style.setProperty('--tilt-y', `${rotateY.toFixed(2)}deg`);
    }

    function handleFolderCardLeave(cardEl) {
      cardEl.style.setProperty('--tilt-x', '0deg');
      cardEl.style.setProperty('--tilt-y', '0deg');
    }

    function handleCardSpotlightOnly(event, cardEl) {
      const rect = cardEl.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;
      cardEl.style.setProperty('--mouse-x', `${x}px`);
      cardEl.style.setProperty('--mouse-y', `${y}px`);
    }

    function switchViewTab(tabId) {
      appState.activeViewTab = tabId;
      savePersistedState();
      renderWorkspace();
    }

    function switchCourseById(courseId) {
      appState.activeCourseId = courseId;
      appState.showSubjectOverview = false;
      appState.activeNav = 'projects';
      savePersistedState();
      renderWorkspace();
    }

    function toggleMobileSidebar(open) {
      const sidebar = document.getElementById('left-sidebar');
      const backdrop = document.getElementById('mobile-sidebar-backdrop');
      if (open) {
        sidebar.classList.remove('-translate-x-full');
        backdrop.classList.remove('hidden');
      } else {
        sidebar.classList.add('-translate-x-full');
        backdrop.classList.add('hidden');
      }
    }

    // Drag & Drop handlers
    function handleDragStart(event, cardId) {
      appState.draggedCardId = cardId;
      event.currentTarget.classList.add('dragging');
      event.dataTransfer.effectAllowed = 'move';
    }

    function handleDragEnd(event) {
      event.currentTarget.classList.remove('dragging');
      document.querySelectorAll('.kanban-column').forEach(col => col.classList.remove('drag-over'));
    }

    function handleDragOver(event) {
      event.preventDefault();
      event.currentTarget.classList.add('drag-over');
    }

    function handleDragLeave(event) {
      event.currentTarget.classList.remove('drag-over');
    }

    function handleDrop(event, targetColumn) {
      event.preventDefault();
      event.currentTarget.classList.remove('drag-over');
      if (!appState.draggedCardId) return;
      moveCardColumn(appState.draggedCardId, targetColumn);
      appState.draggedCardId = null;
    }

    function moveCardColumn(cardId, targetColumn) {
      const card = getCardById(cardId);
      if (!card) return;
      card.column = targetColumn;
      if (targetColumn === 'completed') {
        const diff = Math.max(0, card.totalSteps - card.completedSteps);
        card.completedSteps = card.totalSteps;
        if (diff > 0) recordLessonCompletion(1);
      }
      savePersistedState();
      renderWorkspace();
      if (appState.selectedCardId === cardId) {
        renderModuleDrawerContent();
      }
      showToast(`Thema nach „${targetColumn === 'completed' ? 'Done' : 'To Do'}“ verschoben`);
    }

    function adjustSteps(cardId, delta) {
      const card = getCardById(cardId);
      if (!card) return;
      card.completedSteps = Math.max(0, Math.min(card.totalSteps, card.completedSteps + delta));
      if (card.completedSteps >= card.totalSteps) {
        card.column = 'completed';
      } else {
        card.column = 'todo';
      }
      if (delta > 0) recordLessonCompletion(1);
      savePersistedState();
      renderWorkspace();
      renderModuleDrawerContent();
    }

    function toggleChecklistItem(cardId, itemIdx) {
      const card = getCardById(cardId);
      if (!card || !card.checklist[itemIdx]) return;
      const item = card.checklist[itemIdx];
      item.done = !item.done;
      const stepDelta = item.done ? 3 : -3;
      card.completedSteps = Math.max(0, Math.min(card.totalSteps, card.completedSteps + stepDelta));
      if (item.done) recordLessonCompletion(1);
      if (card.completedSteps >= card.totalSteps || card.checklist.every(c => c.done)) {
        card.completedSteps = card.totalSteps;
        card.column = 'completed';
      } else {
        card.column = 'todo';
      }
      savePersistedState();
      renderWorkspace();
      renderModuleDrawerContent();
    }

    function addModuleNote(event, cardId) {
      event.preventDefault();
      const input = document.getElementById('new-note-input');
      if (!input || !input.value.trim()) return;
      const card = getCardById(cardId);
      if (!card) return;
      card.notes.unshift({
        author: appState.userName,
        time: 'Gerade eben',
        text: input.value.trim()
      });
      card.notesCount = card.notes.length;
      savePersistedState();
      renderWorkspace();
      renderModuleDrawerContent();
      showToast('Lernnotiz gespeichert');
    }

    // Calendar & Exam handlers
    function changeCalendarMonth(delta) {
      let m = appState.calendarMonth + delta;
      let y = appState.calendarYear;
      if (m < 0) { m = 11; y -= 1; }
      if (m > 11) { m = 0; y += 1; }
      appState.calendarMonth = m;
      appState.calendarYear = y;
      renderWorkspace();
    }

    function submitNewExam(event) {
      event.preventDefault();
      const subject = document.getElementById('exam-subject-input')?.value || 'Rechnungswesen';
      const type = document.getElementById('exam-type-input')?.value || 'Klassenarbeit';
      const date = document.getElementById('exam-date-input')?.value;
      const title = document.getElementById('exam-title-input')?.value.trim();
      const topics = document.getElementById('exam-topics-input')?.value.trim();
      if (!date || !title || !topics) return;

      const newExam = {
        id: 'exam-' + Date.now(),
        date,
        subject,
        type,
        title,
        topics
      };
      appState.exams.push(newExam);
      appState.notifications.unshift({
        id: 'notif-' + Date.now(),
        title: `Neuer Prüfungstermin: ${subject}`,
        desc: `${title} am ${formatGermanDate(date)} eingetragen.`,
        time: 'Gerade eben',
        unread: true
      });
      const badge = document.getElementById('notif-badge');
      if (badge) badge.classList.remove('hidden');

      savePersistedState();
      closeModal();
      renderWorkspace();
      showToast('Klassenarbeit / Test im Kalender gespeichert');
    }

    function deleteExam(examId) {
      appState.exams = appState.exams.filter(e => e.id !== examId);
      savePersistedState();
      renderWorkspace();
      showToast('Termin entfernt');
    }

    function handleFlashcardTilt(event, shellEl) {
      const rect = shellEl.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;
      const centerX = rect.width / 2;
      const centerY = rect.height / 2;
      const rotateX = ((y - centerY) / centerY) * -2.8;
      const rotateY = ((x - centerX) / centerX) * 2.8;

      shellEl.style.setProperty('--mouse-x', `${x}px`);
      shellEl.style.setProperty('--mouse-y', `${y}px`);
      shellEl.style.setProperty('--tilt-x', `${rotateX.toFixed(2)}deg`);
      shellEl.style.setProperty('--tilt-y', `${rotateY.toFixed(2)}deg`);
    }

    function resetFlashcardTilt(shellEl) {
      shellEl.style.setProperty('--tilt-x', '0deg');
      shellEl.style.setProperty('--tilt-y', '0deg');
    }

    function toggleFlashcardItem(cardId) {
      const nextFlipped = !appState.flippedFlashcardIds[cardId];
      appState.flippedFlashcardIds[cardId] = nextFlipped;
      const flipper = document.getElementById('active-flashcard-flipper');
      if (flipper) {
        flipper.classList.toggle('is-flipped', nextFlipped);
      } else {
        renderWorkspace();
      }
    }

    function jumpToFlashcard(targetIdx) {
      const current = appState.flashcardPage || 0;
      appState.flashcardTransitionDir = targetIdx > current ? 'slide-next' : 'slide-prev';
      appState.flashcardPage = Math.max(0, targetIdx);
      appState.flippedFlashcardIds = {};
      renderWorkspace();
    }

    function changeFlashcardPage(delta) {
      appState.flashcardTransitionDir = delta > 0 ? 'slide-next' : 'slide-prev';
      appState.flashcardPage = Math.max(0, (appState.flashcardPage || 0) + delta);
      appState.flippedFlashcardIds = {};
      renderWorkspace();
    }

    function submitNewFlashcard(event) {
      event.preventDefault();
      const subject = document.getElementById('fc-subject-input')?.value || 'Rechnungswesen';
      const question = document.getElementById('fc-question-input')?.value.trim();
      const answer = document.getElementById('fc-answer-input')?.value.trim();
      if (!question || !answer) return;

      appState.flashcards.unshift({
        id: 'fc-' + Date.now(),
        subject,
        topic: subject,
        question,
        answer,
        mastered: false
      });
      appState.selectedFlashcardSubject = subject;
      appState.flashcardPage = 0;
      appState.flippedFlashcardIds = {};
      savePersistedState();
      closeModal();
      renderWorkspace();
      showToast('Neue Lernkarte hinzugefügt');
    }

    function markFlashcard(cardId, mastered) {
      const card = appState.flashcards.find(c => c.id === cardId);
      if (card) card.mastered = mastered;
      if (mastered) recordLessonCompletion(1);
      savePersistedState();
      renderWorkspace();
      showToast(mastered ? 'Als gewusst markiert' : 'Markierung „Gewusst“ aufgehoben');
    }

    function addQuickNote(event) {
      event.preventDefault();
      const subject = document.getElementById('quick-note-subject')?.value || 'Rechnungswesen';
      const input = document.getElementById('quick-note-text');
      if (!input || !input.value.trim()) return;
      appState.quickNotes.unshift({
        id: 'qn-' + Date.now(),
        subject,
        text: input.value.trim(),
        time: 'Gerade eben'
      });
      savePersistedState();
      renderWorkspace();
      showToast('Merkzettel hinzugefügt');
    }

    function deleteQuickNote(noteId) {
      appState.quickNotes = appState.quickNotes.filter(n => n.id !== noteId);
      savePersistedState();
      renderWorkspace();
    }

    // Settings handlers
    function adjustTodayProgress(delta) {
      recordLessonCompletion(delta);
      savePersistedState();
      renderWorkspace();
      if (appState.completedToday === appState.dailyGoal) {
        showToast('🎉 Tagesziel erreicht! Starke Leistung!');
      } else {
        showToast(`Tagesfortschritt: ${appState.completedToday} / ${appState.dailyGoal} Einheiten`);
      }
    }

    function saveSettings() {
      const nameVal = document.getElementById('user-name-input')?.value.trim();
      const goalVal = parseInt(document.getElementById('daily-goal-input')?.value || '6', 10);
      if (nameVal) appState.userName = nameVal;
      if (goalVal >= 1 && goalVal <= 30) appState.dailyGoal = goalVal;
      savePersistedState();
      showToast('Einstellungen gespeichert');
    }

    function handleProfileImageUpload(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) {
        showToast('Bitte wähle eine gültige Bilddatei aus');
        return;
      }

      const reader = new FileReader();
      reader.onload = function (e) {
        const img = new Image();
        img.onload = function () {
          const size = 200;
          const canvas = document.createElement('canvas');
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext('2d');
          const minSide = Math.min(img.width, img.height);
          const sx = (img.width - minSide) / 2;
          const sy = (img.height - minSide) / 2;
          ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, size, size);

          appState.profileImage = canvas.toDataURL('image/jpeg', 0.85);
          savePersistedState();
          updateSidebarAvatar();
          renderWorkspace();
          showToast('Profilbild aktualisiert');
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function removeProfileImage() {
      appState.profileImage = null;
      savePersistedState();
      updateSidebarAvatar();
      renderWorkspace();
      showToast('Profilbild entfernt');
    }

    function resetAllData() {
      try {
        localStorage.removeItem(STORAGE_KEY);
      } catch (e) {}
      COURSES = getDefaultCourses();
      appState.exams = getDefaultExams();
      appState.flashcards = getDefaultFlashcards();
      appState.quickNotes = [];
      appState.notifications = [];
      appState.seenQuestionIds = {};
      appState.dailyHistory = {};
      appState.userName = 'Marlii';
      appState.profileImage = null;
      appState.dailyGoal = 6;
      appState.completedToday = 0;
      appState.activeCourseId = 'rechnungswesen';
      updateSidebarAvatar();
      const badge = document.getElementById('notif-badge');
      if (badge) badge.classList.add('hidden');
      renderWorkspace();
      showToast('Alle Lernprojekte & Termine zurückgesetzt');
    }

    function showToast(message) {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      toast.className = 'bg-[#202024] border border-[#34343B] text-[#F4F4F6] text-[12.5px] font-medium px-3.5 py-2.5 rounded-[9px] shadow-xl animate-scale-in';
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.2s ease';
        setTimeout(() => toast.remove(), 220);
      }, 2400);
    }

    function formatGermanDate(isoStr) {
      if (!isoStr || !isoStr.includes('-')) return isoStr || '';
      const [y, m, d] = isoStr.split('-');
      return `${d}.${m}.${y}`;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // Keyboard shortcuts (Cmd/Ctrl+K for Search, Escape to close overlays)
    document.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        openSearchModal();
      } else if (e.key === 'Escape') {
        closeQuizPopup();
        closeModal();
        closeModuleDrawer();
      }
    });

    /**
     * Renders IconV.png onto a solid dark obsidian app-icon tile (#111113)
     * so the white StudyV logo is clearly visible on iOS & Android Home Screens
     * (iOS fills transparent apple-touch-icons with white by default).
     */
    function renderHomeScreenIconDataUrl(size, loadedImg) {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      if (!ctx) return null;

      // Solid dark background matching StudyV theme
      const bgGrad = ctx.createRadialGradient(size * 0.3, size * 0.2, size * 0.05, size * 0.5, size * 0.5, size * 0.85);
      bgGrad.addColorStop(0, '#1D1D23');
      bgGrad.addColorStop(1, '#111113');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, size, size);

      if (loadedImg && loadedImg.naturalWidth > 0) {
        const pad = Math.round(size * 0.18);
        const drawSize = size - pad * 2;
        ctx.drawImage(loadedImg, pad, pad, drawSize, drawSize);
      } else {
        // Fallback outer StudyV triangle glyph while IconV.png loads
        ctx.save();
        ctx.strokeStyle = '#F4F4F6';
        ctx.lineWidth = Math.max(4, size * 0.075);
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(size * 0.24, size * 0.26);
        ctx.lineTo(size * 0.78, size * 0.49);
        ctx.lineTo(size * 0.44, size * 0.78);
        ctx.closePath();
        ctx.stroke();
        ctx.restore();
      }

      return canvas.toDataURL('image/png');
    }

    function resolveAssetUrl(relativePath) {
      try {
        if (window.location && (window.location.protocol === 'http:' || window.location.protocol === 'https:')) {
          return new URL(relativePath, window.location.href).href;
        }
      } catch (e) {
        // Fallback for blob: or opaque preview origins
      }
      return relativePath;
    }

    function applyHomeScreenManifest(icon180, icon192, icon512, fallbackUrl) {
      try {
        const appleIcon = document.getElementById('studyv-apple-icon');
        const appleIcon180 = document.getElementById('studyv-apple-icon-180');
        const favicon = document.getElementById('studyv-favicon');
        const manifestLink = document.getElementById('studyv-manifest');

        if (appleIcon && icon180) appleIcon.setAttribute('href', icon180);
        if (appleIcon180 && icon180) appleIcon180.setAttribute('href', icon180);
        if (favicon && icon192) favicon.setAttribute('href', icon192);

        if (manifestLink) {
          const isHttpOrigin = window.location && (window.location.protocol === 'http:' || window.location.protocol === 'https:');
          const manifestData = {
            name: 'StudyV',
            short_name: 'StudyV',
            start_url: isHttpOrigin ? window.location.href : './',
            scope: './',
            display: 'standalone',
            background_color: '#111113',
            theme_color: '#111113',
            icons: [
              {
                src: icon192 || fallbackUrl,
                sizes: '192x192',
                type: 'image/png',
                purpose: 'any'
              },
              {
                src: icon512 || fallbackUrl,
                sizes: '512x512',
                type: 'image/png',
                purpose: 'any maskable'
              }
            ]
          };
          const encodedManifest = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifestData));
          manifestLink.setAttribute('href', encodedManifest);
        }
      } catch (e) {
        // Ignore manifest errors in restricted frames
      }
    }

    function setupMobileAppManifest() {
      const fallbackUrl = resolveAssetUrl('IconV.png');

      // Apply immediate dark-tile icon before async image load finishes
      const initial180 = renderHomeScreenIconDataUrl(180, null);
      const initial192 = renderHomeScreenIconDataUrl(192, null);
      const initial512 = renderHomeScreenIconDataUrl(512, null);
      applyHomeScreenManifest(initial180, initial192, initial512, fallbackUrl);

      // Load IconV.png and composite it onto the dark Home Screen app tile
      const iconImg = new Image();
      iconImg.onload = function () {
        const png180 = renderHomeScreenIconDataUrl(180, iconImg);
        const png192 = renderHomeScreenIconDataUrl(192, iconImg);
        const png512 = renderHomeScreenIconDataUrl(512, iconImg);
        applyHomeScreenManifest(png180, png192, png512, fallbackUrl);
      };
      iconImg.src = 'IconV.png';
    }

    // Initial load & render
    function initStudyV() {
      setupMobileAppManifest();
      try {
        loadPersistedState();
      } catch (e) {
        COURSES = getDefaultCourses();
      }
      updateSidebarAvatar();
      syncNavHighlight(appState.activeNav);
      const hasUnread = Array.isArray(appState.notifications) && appState.notifications.some(n => n.unread);
      const badge = document.getElementById('notif-badge');
      if (badge) badge.classList.toggle('hidden', !hasUnread);
      renderWorkspace();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initStudyV);
    } else {
      initStudyV();
    }
  </script>
