<!DOCTYPE html>
<html lang="de" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyV</title>
  <meta name="application-name" content="StudyV" />
  <meta name="apple-mobile-web-app-title" content="StudyV" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#111113" />
  <link id="studyv-favicon" rel="icon" type="image/png" href="IconV.png" />
  <link rel="shortcut icon" type="image/png" href="IconV.png" />
  <link id="studyv-apple-icon" rel="apple-touch-icon" href="IconV.png" />
  <link id="studyv-apple-icon-180" rel="apple-touch-icon" sizes="180x180" href="IconV.png" />
  <link rel="manifest" id="studyv-manifest" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #111113;
      color: #F4F4F6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Subtle Dark Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #27272C;
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #383840;
    }

    /* 16-Tick Segmented Vertical Progress Bar */
    .tick-bar-container {
      display: inline-flex;
      align-items: center;
      gap: 2.5px;
      height: 12px;
    }

    .tick-segment {
      width: 2.5px;
      height: 11px;
      border-radius: 1px;
      transition: background-color 0.25s ease, transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), filter 0.25s ease;
    }

    .dash-bento-card:hover .tick-segment.is-filled,
    .nebula-study-card:hover .tick-segment.is-filled {
      transform: scaleY(1.22);
      filter: brightness(1.2);
      transition-delay: calc(var(--tick-idx, 0) * 14ms);
    }

    /* Drawer, Modal & Toast Animations */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideRight {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.96) translateY(6px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .animate-fade-in {
      animation: fadeIn 0.18s ease-out forwards;
    }

    .animate-slide-right {
      animation: slideRight 0.24s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .animate-scale-in {
      animation: scaleIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Overarching Folder Cards (Glow + Sparkle Design + Micro-Animations) */
    @keyframes folderSlotReveal {
      from {
        opacity: 0;
        transform: translateY(14px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes ambientGlowBreath {
      0%, 100% {
        opacity: 0.82;
        transform: scale(1) translate(0, 0);
      }
      50% {
        opacity: 1;
        transform: scale(1.07) translate(-3px, 2px);
      }
    }

    @keyframes starTwinkle {
      0%, 100% {
        opacity: 0.34;
        transform: scale(0.9) rotate(0deg);
      }
      50% {
        opacity: 0.95;
        transform: scale(1.16) rotate(8deg);
      }
    }

    @keyframes starFloatGlint {
      0%, 100% {
        opacity: 0.25;
        transform: translateY(0px) scale(0.95);
      }
      50% {
        opacity: 0.85;
        transform: translateY(-2.5px) scale(1.2);
      }
    }

    .folder-card-slot {
      perspective: 950px;
      opacity: 0;
      animation: folderSlotReveal 0.48s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: calc(var(--stagger, 0) * 95ms);
    }

    .folder-glow-card {
      position: relative;
      background-color: #141416;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      overflow: hidden;
      transform-style: preserve-3d;
      transform: rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg)) translateY(0px);
      transition: transform 0.24s cubic-bezier(0.16, 1, 0.3, 1),
                  border-color 0.25s ease,
                  box-shadow 0.28s ease,
                  background-color 0.25s ease;
    }

    .folder-glow-card:hover {
      background-color: #17171a;
      border-color: rgba(var(--accent-rgb, 96, 165, 250), 0.45);
      transform: rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg)) translateY(-4px);
      box-shadow: 0 18px 38px -8px rgba(0, 0, 0, 0.65),
                  0 0 28px -6px rgba(var(--accent-rgb, 96, 165, 250), 0.22);
    }

    .folder-glow-card:active {
      transform: rotateX(0deg) rotateY(0deg) translateY(-1px) scale(0.985);
      transition-duration: 0.1s;
    }

    .folder-glow-orb {
      animation: ambientGlowBreath 6s ease-in-out infinite;
      transition: opacity 0.35s ease, transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .folder-glow-card:hover .folder-glow-orb {
      opacity: 1;
      transform: scale(1.14) translate(-4px, 3px);
    }

    .folder-cursor-spotlight {
      opacity: 0;
      background: radial-gradient(
        240px circle at var(--mouse-x, 82%) var(--mouse-y, 18%),
        rgba(var(--accent-rgb, 96, 165, 250), 0.16),
        transparent 70%
      );
      transition: opacity 0.28s ease;
    }

    .folder-glow-card:hover .folder-cursor-spotlight {
      opacity: 1;
    }

    .folder-edge-shimmer {
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 1px;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(var(--accent-rgb, 255, 255, 255), 0.65) 50%,
        transparent 100%
      );
      opacity: 0;
      transition: left 0.75s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
    }

    .folder-glow-card:hover .folder-edge-shimmer {
      left: 100%;
      opacity: 1;
    }

    .folder-icon-wrap {
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1), filter 0.28s ease;
    }

    .folder-glow-card:hover .folder-icon-wrap {
      transform: translateY(-2px) scale(1.07);
      filter: drop-shadow(0 0 12px rgba(var(--accent-rgb, 96, 165, 250), 0.55));
    }

    .sparkle-star-lg {
      transform-origin: 111px 58px;
      animation: starTwinkle 3.8s ease-in-out infinite;
    }

    .sparkle-star-md {
      transform-origin: 77px 28.2px;
      animation: starTwinkle 4.4s ease-in-out 1.1s infinite;
    }

    .sparkle-star-sm {
      transform-origin: 104px 17.2px;
      animation: starFloatGlint 3.2s ease-in-out 0.6s infinite;
    }

    .sparkle-glint-dot {
      animation: starFloatGlint 4.1s ease-in-out 1.7s infinite;
    }

    .folder-glow-card:hover .sparkle-star-lg,
    .folder-glow-card:hover .sparkle-star-md,
    .folder-glow-card:hover .sparkle-star-sm {
      animation-duration: 1.9s;
    }

    /* Topic Learning Cards (Slightly Lighter Dark Surface + Animated Headline Shimmer) */
    @keyframes nebulaCardReveal {
      from {
        opacity: 0;
        transform: translateY(14px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes artworkFloat {
      0%, 100% {
        transform: translateY(0px) scale(1);
      }
      50% {
        transform: translateY(-4px) scale(1.03);
      }
    }

    @keyframes titleSheen {
      0% {
        background-position: 0% 50%;
      }
      100% {
        background-position: 200% 50%;
      }
    }

    .nebula-card-slot {
      perspective: 1000px;
      opacity: 0;
      animation: nebulaCardReveal 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: calc(var(--stagger, 0) * 80ms);
    }

    .nebula-study-card {
      position: relative;
      background: linear-gradient(155deg, var(--card-bg-1, #202026) 0%, var(--card-bg-2, #18181D) 52%, var(--card-bg-3, #141418) 100%);
      border: 1px solid rgba(255, 255, 255, 0.085);
      border-top-color: rgba(255, 255, 255, 0.14);
      border-radius: 18px;
      overflow: hidden;
      clip-path: inset(0 round 18px);
      -webkit-mask-image: -webkit-radial-gradient(white, black);
      isolation: isolate;
      transform: translateY(0px) scale(1);
      transition: transform 0.26s cubic-bezier(0.16, 1, 0.3, 1),
                  border-color 0.25s ease,
                  box-shadow 0.28s ease,
                  background 0.28s ease;
    }

    .nebula-study-card:hover {
      background: linear-gradient(155deg, var(--card-bg-hover-1, #25252D) 0%, var(--card-bg-hover-2, #1C1C23) 52%, var(--card-bg-hover-3, #16161C) 100%);
      border-color: rgba(var(--card-rgb, 96, 165, 250), 0.45);
      transform: translateY(-4px) scale(1.006);
      box-shadow: 0 20px 38px -12px rgba(0, 0, 0, 0.75),
                  0 0 26px -8px rgba(var(--card-rgb, 96, 165, 250), 0.24);
    }

    .nebula-study-card .folder-cursor-spotlight {
      border-radius: 18px;
    }

    .nebula-study-card.dragging {
      opacity: 0.48;
      transform: scale(0.97);
    }

    .nebula-artwork-layer {
      animation: artworkFloat 6.5s ease-in-out infinite;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
    }

    .nebula-study-card:hover .nebula-artwork-layer {
      transform: scale(1.06) translate(-2px, -2px);
    }

    .nebula-card-title {
      background: linear-gradient(
        110deg,
        #FFFFFF 0%,
        #F4F4F6 35%,
        var(--title-accent, #93C5FD) 50%,
        #F4F4F6 65%,
        #FFFFFF 100%
      );
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), filter 0.25s ease;
    }

    .nebula-study-card:hover .nebula-card-title {
      animation: titleSheen 2.2s linear infinite;
      filter: drop-shadow(0 0 12px rgba(var(--card-rgb, 96, 165, 250), 0.32));
    }

    .nebula-title-underline {
      height: 2px;
      width: 28px;
      border-radius: 999px;
      background: var(--title-accent, #60A5FA);
      opacity: 0.55;
      transition: width 0.32s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
    }

    .nebula-study-card:hover .nebula-title-underline {
      width: 68px;
      opacity: 1;
    }

    .kanban-column {
      border-radius: 16px;
      border: 1px solid transparent;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .kanban-column.drag-over {
      background-color: rgba(59, 130, 246, 0.05);
      border-color: rgba(59, 130, 246, 0.28);
    }

    /* Dashboard Cobalt Bento Cards & Animations */
    @keyframes dashCardReveal {
      from {
        opacity: 0;
        transform: translateY(14px) scale(0.985);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes dashHeaderSlide {
      from {
        opacity: 0;
        transform: translateY(-8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulseBeacon {
      0%, 100% {
        transform: scale(1);
        opacity: 0.95;
      }
      50% {
        transform: scale(1.45);
        opacity: 0.35;
      }
    }

    @keyframes beamSway {
      0%, 100% {
        opacity: 0.72;
        transform: rotate(-18deg) translateY(0px) scale(1);
      }
      50% {
        opacity: 1;
        transform: rotate(-14deg) translateY(-5px) scale(1.04);
      }
    }

    @keyframes barShimmerSweep {
      0% {
        transform: translateX(-120%);
      }
      100% {
        transform: translateX(240%);
      }
    }

    @keyframes stripeFlow {
      0% {
        background-position: 0 0;
      }
      100% {
        background-position: 22.6px 0;
      }
    }

    @keyframes barGrowUp {
      from {
        transform: scaleY(0.15);
        opacity: 0.4;
      }
      to {
        transform: scaleY(1);
        opacity: 1;
      }
    }

    @keyframes badgeBob {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-3px);
      }
    }

    @keyframes clockTickWobble {
      0%, 100% {
        transform: rotate(0deg) scale(1);
      }
      25% {
        transform: rotate(-9deg) scale(1.06);
      }
      75% {
        transform: rotate(9deg) scale(1.06);
      }
    }

    @keyframes chartLineDraw {
      from {
        stroke-dashoffset: 1000;
      }
      to {
        stroke-dashoffset: 0;
      }
    }

    @keyframes chartAreaFade {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    @keyframes metricNumberPop {
      from {
        opacity: 0;
        transform: translateY(6px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .dash-header-enter {
      animation: dashHeaderSlide 0.38s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .dash-bento-card {
      position: relative;
      background: linear-gradient(165deg, #17171B 0%, #121215 100%);
      border: 1px solid #23232A;
      border-radius: 18px;
      overflow: hidden;
      transform-style: preserve-3d;
      transform: rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg)) translateY(0px);
      transition: transform 0.24s cubic-bezier(0.16, 1, 0.3, 1),
                  border-color 0.24s ease,
                  box-shadow 0.28s ease,
                  background 0.28s ease;
      animation: dashCardReveal 0.45s cubic-bezier(0.16, 1, 0.3, 1) both;
      animation-delay: calc(var(--stagger, 0) * 65ms);
    }

    .dash-bento-card:hover {
      background: linear-gradient(165deg, #1A1A20 0%, #131317 100%);
      border-color: rgba(59, 130, 246, 0.42);
      transform: rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg)) translateY(-4px);
      box-shadow: 0 20px 38px -12px rgba(0, 0, 0, 0.78),
                  0 0 28px -8px rgba(59, 130, 246, 0.24);
    }

    .dash-edge-shimmer {
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 1px;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(96, 165, 250, 0.75) 50%,
        transparent 100%
      );
      opacity: 0;
      transition: left 0.75s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
      pointer-events: none;
    }

    .dash-bento-card:hover .dash-edge-shimmer {
      left: 100%;
      opacity: 1;
    }

    .dash-spotlight {
      opacity: 0;
      background: radial-gradient(
        250px circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
        rgba(59, 130, 246, 0.14),
        transparent 70%
      );
      transition: opacity 0.25s ease;
    }

    .dash-bento-card:hover .dash-spotlight {
      opacity: 1;
    }

    .dash-metric-value {
      display: inline-block;
      animation: metricNumberPop 0.45s cubic-bezier(0.16, 1, 0.3, 1) both;
      animation-delay: calc(var(--stagger, 0) * 65ms + 90ms);
    }

    .dash-progress-shimmer {
      position: relative;
      overflow: hidden;
    }

    .dash-progress-shimmer::after {
      content: '';
      position: absolute;
      inset: 0;
      width: 55%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.45), transparent);
      animation: barShimmerSweep 2.4s ease-in-out infinite;
    }

    .dash-icon-tile {
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.25s ease, box-shadow 0.28s ease;
    }

    .dash-bento-card:hover .dash-icon-tile {
      transform: scale(1.08) translateY(-1px);
      background-color: #222229;
      box-shadow: 0 0 18px -4px rgba(59, 130, 246, 0.4);
    }

    .dash-bento-card:hover .dash-clock-svg {
      animation: clockTickWobble 0.65s ease-in-out;
    }

    .dash-chart-line {
      stroke-dasharray: 1000;
      stroke-dashoffset: 0;
      animation: chartLineDraw 0.95s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .dash-chart-area {
      animation: chartAreaFade 0.85s ease-out both;
    }

    .dash-bar-pillar {
      transform-origin: bottom center;
      animation: barGrowUp 0.55s cubic-bezier(0.16, 1, 0.3, 1) both;
      animation-delay: calc(var(--bar-idx, 0) * 75ms + 140ms);
    }

    .dash-striped-bar {
      background-image: repeating-linear-gradient(
        -45deg,
        rgba(59, 130, 246, 0.42),
        rgba(59, 130, 246, 0.42) 4px,
        rgba(30, 58, 138, 0.62) 4px,
        rgba(30, 58, 138, 0.62) 8px
      );
      background-size: 22.6px 22.6px;
      animation: barGrowUp 0.55s cubic-bezier(0.16, 1, 0.3, 1) both, stripeFlow 2.6s linear infinite;
      box-shadow: 0 0 20px -4px rgba(59, 130, 246, 0.45);
    }

    .dash-badge-bob {
      animation: badgeBob 2.6s ease-in-out infinite;
    }

    .dash-cta-pill {
      position: relative;
      overflow: hidden;
    }

    .dash-cta-pill::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 70%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.26), transparent);
      transition: left 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .dash-cta-pill:hover::after {
      left: 140%;
    }

    .cobalt-spotlight-beam {
      animation: beamSway 5.5s ease-in-out infinite;
    }

    /* Neon Gradient Frame Flashcards (Single Wide 3D Flip Card + Rich Animations) */
    @keyframes frameReveal {
      from {
        opacity: 0;
        transform: translateY(16px) scale(0.975);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes flashcardSlideNext {
      from {
        opacity: 0;
        transform: translateX(28px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateX(0) scale(1);
      }
    }

    @keyframes flashcardSlidePrev {
      from {
        opacity: 0;
        transform: translateX(-28px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateX(0) scale(1);
      }
    }

    @keyframes neonGlowBreath {
      0%, 100% {
        box-shadow: 0 0 42px -10px var(--frame-glow), 0 22px 40px -14px rgba(0, 0, 0, 0.88);
      }
      50% {
        box-shadow: 0 0 58px -6px var(--frame-glow), 0 26px 46px -14px rgba(0, 0, 0, 0.92);
      }
    }

    @keyframes cardEdgeSweep {
      0% {
        transform: translateX(-100%);
        opacity: 0;
      }
      35% {
        opacity: 0.85;
      }
      70% {
        opacity: 0.85;
      }
      100% {
        transform: translateX(200%);
        opacity: 0;
      }
    }

    @keyframes cardSparkFloat {
      0%, 100% {
        opacity: 0.28;
        transform: translateY(0px) scale(0.92);
      }
      50% {
        opacity: 0.85;
        transform: translateY(-4px) scale(1.15);
      }
    }

    .flashcard-stage {
      perspective: 1800px;
      animation: frameReveal 0.42s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .flashcard-stage.slide-next {
      animation: flashcardSlideNext 0.36s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .flashcard-stage.slide-prev {
      animation: flashcardSlidePrev 0.36s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .flashcard-tilt-shell {
      transform-style: preserve-3d;
      transform: rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg)) translateY(0px);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .flashcard-tilt-shell:hover {
      transform: rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg)) translateY(-4px);
    }

    .flashcard-flipper {
      position: relative;
      width: 100%;
      height: 350px;
      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;
      transition: transform 0.72s cubic-bezier(0.22, 1, 0.36, 1);
      cursor: pointer;
    }

    .flashcard-flipper.is-flipped {
      transform: rotateY(180deg);
    }

    .flashcard-face {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
    }

    /* Clean cross-fade at 90° midpoint so front text NEVER bleeds onto the back face */
    .flashcard-face-front {
      transform: rotateY(0deg);
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transition: opacity 0.24s ease 0.16s, visibility 0s linear 0s;
    }

    .flashcard-flipper.is-flipped .flashcard-face-front {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.18s ease 0s, visibility 0s linear 0.18s;
    }

    .flashcard-face-back {
      transform: rotateY(180deg);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.18s ease 0s, visibility 0s linear 0.18s;
    }

    .flashcard-flipper.is-flipped .flashcard-face-back {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transition: opacity 0.24s ease 0.16s, visibility 0s linear 0s;
    }

    .neon-frame-outer {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 24px;
      padding: 2px;
      background: var(--frame-border-gradient);
      animation: neonGlowBreath 4.8s ease-in-out infinite;
      transition: filter 0.28s ease, transform 0.28s ease;
    }

    .flashcard-flipper:hover .neon-frame-outer {
      filter: brightness(1.06);
    }

    .neon-frame-inner {
      position: relative;
      height: 100%;
      width: 100%;
      border-radius: 22px;
      background: radial-gradient(115% 85% at 18% 0%, rgba(255, 255, 255, 0.06) 0%, rgba(19, 19, 23, 0.99) 54%, #111114 100%);
      overflow: hidden;
    }

    .neon-frame-inner.is-back {
      background: radial-gradient(120% 90% at 82% 100%, var(--frame-inner-tint, rgba(56, 189, 248, 0.18)) 0%, rgba(18, 18, 22, 0.99) 58%, #111114 100%);
    }

    .neon-frame-shimmer {
      position: absolute;
      top: 0;
      left: 0;
      width: 50%;
      height: 1.5px;
      background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.75) 50%, transparent 100%);
      animation: cardEdgeSweep 4.6s ease-in-out infinite;
    }

    .neon-frame-spotlight {
      opacity: 0;
      background: radial-gradient(
        300px circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
        rgba(255, 255, 255, 0.09),
        transparent 70%
      );
      transition: opacity 0.25s ease;
    }

    .flashcard-flipper:hover .neon-frame-spotlight {
      opacity: 1;
    }

    .card-glyph-badge {
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s ease;
    }

    .flashcard-flipper:hover .card-glyph-badge {
      transform: scale(1.08) translateY(-1px);
      box-shadow: 0 0 18px -4px var(--frame-glow);
    }

    .card-ambient-spark {
      animation: cardSparkFloat 3.6s ease-in-out infinite;

    function getTodayIsoKey() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function recordLessonCompletion(delta = 1) {
      const todayKey = getTodayIsoKey();
      const currentDayVal = appState.dailyHistory[todayKey] || 0;
      const nextDayVal = Math.max(0, currentDayVal + delta);
      appState.dailyHistory[todayKey] = nextDayVal;
      appState.completedToday = Math.max(0, (appState.completedToday || 0) + delta);
    }

    function loadPersistedState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        if (parsed.courses && Array.isArray(parsed.courses) && parsed.courses.length >= 3) {
          COURSES = parsed.courses;
          const defaults = getDefaultCourses();
          const ggCourse = COURSES.find(c => c.id === 'gespraechsgestaltung');
          if (ggCourse && ggCourse.cards.some(card => card.title === 'Beschwerdemanagement & Reklamation')) {
            const freshGG = defaults.find(c => c.id === 'gespraechsgestaltung');
            COURSES = COURSES.map(c => c.id === 'gespraechsgestaltung' ? freshGG : c);
          }
          const skCourse = COURSES.find(c => c.id === 'sozialkunde');
          if (skCourse && skCourse.cards.some(card => card.title === 'Tarifautonomie, Streik & Betriebsrat')) {
            const freshSK = defaults.find(c => c.id === 'sozialkunde');
            COURSES = COURSES.map(c => c.id === 'sozialkunde' ? freshSK : c);
          }
          // Ensure newly added subjects (Englisch & Kunden akquirieren und binden) are merged in
          for (const defCourse of defaults) {
            if (!COURSES.some(c => c.id === defCourse.id)) {
              COURSES.push(defCourse);
            }
          }
        }
        if (parsed.appState) {
          appState = {
            ...appState,
            ...parsed.appState,
            activeNav: 'dashboard',
            selectedCardId: null,
            draggedCardId: null,
            activeQuizSession: null
          };
          if (Array.isArray(appState.flashcards)) {
            for (const defCard of getDefaultFlashcards()) {
              if (!appState.flashcards.some(fc => fc.id === defCard.id)) {
                appState.flashcards.push(defCard);
              }
            }
          }
        }
      } catch (e) {
        // Fallback silently to defaults
      }
    }

    function savePersistedState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          courses: COURSES,
          appState: {
            userName: appState.userName,
            profileImage: appState.profileImage,
            activeCourseId: appState.activeCourseId,

      } catch (e) {

      }
    }

    function renderSegmentedTicks(completedSteps, totalSteps, fillColor = '#3B82F6', totalTicks = 16) {
      const ratio = totalSteps > 0 ? Math.min(1, Math.max(0, completedSteps / totalSteps)) : 0;
      const activeTicks = Math.round(ratio * totalTicks);
      let ticksHtml = '<div class="tick-bar-container" aria-hidden="true">';
      for (let i = 0; i < totalTicks; i++) {
        const isFilled = i < activeTicks;
        ticksHtml += `<span class="tick-segment ${isFilled ? 'is-filled' : ''}" style="--tick-idx: ${i}; background-color: ${isFilled ? fillColor : '#2C2C33'};"></span>`;
      }
      ticksHtml += '</div>';
      return ticksHtml;
    }

        <div class="nebula-card-slot" style="--stagger: ${index};">
          <article
            draggable="true"
            ondragstart="handleDragStart(event, '${card.id}')"
            ondragend="handleDragEnd(event)"
            onmousemove="handleCardSpotlightOnly(event, this)"
            onclick="openQuizPopup('${card.id}')"
            class="nebula-study-card group p-6 min-h-[188px] flex flex-col justify-between cursor-pointer"
            style="--card-rgb: ${palette.rgb}; --title-accent: ${palette.accent}; --card-bg-1: ${palette.bg1}; --card-bg-2: ${palette.bg2}; --card-bg-3: ${palette.bg3}; --card-bg-hover-1: ${palette.hBg1}; --card-bg-hover-2: ${palette.hBg2}; --card-bg-hover-3: ${palette.hBg3};"
          >
            <!-- Ambient Theme Glow -->
            <div class="absolute inset-0 pointer-events-none rounded-[18px]" style="background: ${palette.glow};"></div>

            <!-- Cursor-Following Spotlight (Strictly Clipped Inside Rounded Card) -->
            <div class="folder-cursor-spotlight absolute inset-0 pointer-events-none rounded-[18px]" style="--accent-rgb: ${palette.rgb};"></div>

            <!-- Unique Topic Illustration (Never Duplicated) -->
            ${getTopicArtwork(card, index)}

            <!-- Top Headline -->
            <div class="relative z-10 pr-14">
              <h3 class="nebula-card-title text-[21px] sm:text-[22.5px] font-extrabold leading-[1.25] tracking-[-0.025em] mb-2">
                ${escapeHtml(card.title)}
              </h3>
              <div class="nebula-title-underline mb-3"></div>
              <p class="text-[12.5px] text-[#A1A1AC] leading-[1.5] line-clamp-2 max-w-[84%]">
                ${escapeHtml(card.summary)}
              </p>
            </div>

            <!-- Bottom Progress Bar -->
            <div class="relative z-10 pt-4 mt-4 border-t border-white/[0.08] flex items-center justify-between gap-3">
              <div class="flex items-center gap-2.5">
                ${renderSegmentedTicks(card.completedSteps, card.totalSteps, palette.accent)}
                <span class="text-[12px] font-medium text-[#A1A1AA]">
                  <strong class="text-[#F4F4F6]">${card.completedSteps}</strong> / ${card.totalSteps} (${pct}%)
                </span>
              </div>
              <span class="text-[12px] font-semibold inline-flex items-center gap-1 transition-transform duration-200 group-hover:translate-x-1" style="color: ${palette.accent};">
                6 Fragen Quiz <span>→</span>
              </span>
            </div>
          </article>
        </div>
      `;
    }

    // =========================================================================
    // 3. MAIN WORKSPACE ROUTER
    // =========================================================================

    function renderWorkspace() {
      const container = document.getElementById('workspace-container');
      if (!container) return;

      if (appState.activeNav === 'projects') {
        container.innerHTML = appState.showSubjectOverview
          ? renderSubjectsOverview()
          : renderProjectsWorkspace();
      } else if (appState.activeNav === 'dashboard') {
        container.innerHTML = renderDashboardView();
      } else if (appState.activeNav === 'inbox') {
        container.innerHTML = renderInboxView();
      } else if (appState.activeNav === 'calendar') {
        container.innerHTML = renderCalendarView();
      } else if (appState.activeNav === 'reports') {
        container.innerHTML = renderReportsView();
      } else if (appState.activeNav === 'settings') {
        container.innerHTML = renderSettingsView();
      }
    }

    // =========================================================================
    // 3A. DASHBOARD VIEW (Cobalt Bento Design + Real Daily Curve + Cutout Icons)
    // =========================================================================

    function switchChartRange(range) {
      appState.chartRange = range;
      savePersistedState();
      renderWorkspace();
    }

    function focusChartPoint(x, y, val, svgW, padL) {
      const guide = document.getElementById('chart-guide-line');
      const pulse = document.getElementById('chart-pulse-circle');
      const dot = document.getElementById('chart-dot-circle');
      const pillRect = document.getElementById('chart-tooltip-rect');
      const pillArrow = document.getElementById('chart-tooltip-arrow');
      const pillText = document.getElementById('chart-tooltip-text');
      if (!pulse || !dot || !pillRect || !pillText) return;

      const pillW = 74;
      const pillCenterX = Math.min(svgW - pillW / 2 - 4, Math.max(padL + pillW / 2 - 4, x));
      const pillY = y - 31;

      if (guide) {
        guide.setAttribute('x1', x.toFixed(1));
        guide.setAttribute('x2', x.toFixed(1));
      }
      pulse.setAttribute('cx', x.toFixed(1));
      pulse.setAttribute('cy', y.toFixed(1));
      dot.setAttribute('cx', x.toFixed(1));
      dot.setAttribute('cy', y.toFixed(1));

      pillRect.setAttribute('x', (pillCenterX - pillW / 2).toFixed(1));
      pillRect.setAttribute('y', pillY.toFixed(1));
      if (pillArrow) {
        pillArrow.setAttribute('points', `${(x - 4).toFixed(1)},${(y - 10).toFixed(1)} ${(x + 4).toFixed(1)},${(y - 10).toFixed(1)} ${x.toFixed(1)},${(y - 6).toFixed(1)}`);
      }
      pillText.setAttribute('x', pillCenterX.toFixed(1));
      pillText.setAttribute('y', (pillY + 14).toFixed(1));
      pillText.textContent = `${val} Lekt.`;
    }

    function renderDashboardView() {
      const totalDone = COURSES.reduce((sum, c) => sum + c.cards.reduce((s, m) => s + m.completedSteps, 0), 0);
      const totalAll = COURSES.reduce((sum, c) => sum + c.cards.reduce((s, m) => s + m.totalSteps, 0), 0);
      const overallPct = totalAll > 0 ? Math.round((totalDone / totalAll) * 100) : 0;
      const dailyPct = appState.dailyGoal > 0 ? Math.min(100, Math.round((appState.completedToday / appState.dailyGoal) * 100)) : 0;

      const sortedExams = [...appState.exams].sort((a, b) => a.date.localeCompare(b.date));
      const nextExam = sortedExams[0] || null;
      const upcomingExams = sortedExams.slice(0, 3);
      const masteredFlashcards = appState.flashcards.filter(f => f.mastered).length;

      const getDaysCountdown = (isoDate) => {
        if (!isoDate) return '';
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const target = new Date(isoDate + 'T00:00:00');
        const diffDays = Math.round((target - today) / (1000 * 60 * 60 * 24));
        if (diffDays < 0) return 'Vorbei';
        if (diffDays === 0) return 'Heute';
        if (diffDays === 1) return 'Morgen';
        return `${diffDays}d`;
      };

      const rangeDays = appState.chartRange === '1T' ? 5 : appState.chartRange === '1M' ? 14 : 7;
      const todayKey = getTodayIsoKey();
      const seriesPoints = [];
      for (let i = rangeDays - 1; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const iso = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        const label = `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth() + 1).padStart(2, '0')}.`;
        const val = iso === todayKey
          ? Math.max(appState.dailyHistory[iso] || 0, appState.completedToday || 0)
          : (appState.dailyHistory[iso] || 0);
        seriesPoints.push({ iso, label, val, isToday: iso === todayKey });
      }

      const maxVal = Math.max(20, ...seriesPoints.map(p => p.val));
      const svgW = 540;
      const svgH = 168;
      const padL = 34;
      const padR = 42;
      const padT = 30;
      const padB = 26;
      const plotW = svgW - padL - padR;
      const plotH = svgH - padT - padB;

      const coords = seriesPoints.map((pt, idx) => {
        const x = padL + (seriesPoints.length > 1 ? (idx / (seriesPoints.length - 1)) * plotW : plotW / 2);
        const y = padT + plotH - (pt.val / maxVal) * plotH;
        return { ...pt, x, y };
      });

      let linePath = '';
      if (coords.length > 0) {
        linePath = `M ${coords[0].x.toFixed(1)} ${coords[0].y.toFixed(1)}`;
        for (let i = 0; i < coords.length - 1; i++) {
          const p0 = coords[i];
          const p1 = coords[i + 1];
          const cpx = ((p0.x + p1.x) / 2).toFixed(1);
          linePath += ` C ${cpx} ${p0.y.toFixed(1)}, ${cpx} ${p1.y.toFixed(1)}, ${p1.x.toFixed(1)} ${p1.y.toFixed(1)}`;
        }
      }
      const areaPath = coords.length > 0
        ? `${linePath} L ${coords[coords.length - 1].x.toFixed(1)} ${(padT + plotH).toFixed(1)} L ${coords[0].x.toFixed(1)} ${(padT + plotH).toFixed(1)} Z`
        : '';
      const lastPt = coords[coords.length - 1] || { x: padL, y: padT + plotH, val: 0 };
      const pillW = 74;
      const pillCenterX = Math.min(svgW - pillW / 2 - 4, Math.max(padL + pillW / 2 - 4, lastPt.x));
      const pillY = lastPt.y - 31;

      // Live Lernquote Gesamt (combines completed steps, mastered flashcards, and daily units)
      const totalWeightedDone = totalDone + masteredFlashcards + Math.max(0, appState.completedToday);
      const totalWeightedAll = totalAll + appState.flashcards.length + Math.max(1, appState.dailyGoal);
      const exactQuote = totalWeightedAll > 0 ? Math.min(100, (totalWeightedDone / totalWeightedAll) * 100) : 0;
      const formattedQuote = `${exactQuote.toFixed(2)}%`;

      const comparisonBars = COURSES.map(c => {
        const d = c.cards.reduce((s, m) => s + m.completedSteps, 0);
        const t = c.cards.reduce((s, m) => s + m.totalSteps, 0);
        const pct = t > 0 ? Math.round((d / t) * 100) : 0;
        const shortMap = {
          rechnungswesen: 'RW',
          gespraechsgestaltung: 'GG',
          sozialkunde: 'SK',
          englisch: 'EN',
          'kunden-akquirieren-binden': 'KAB'
        };
        const short = shortMap[c.id] || c.title.slice(0, 3).toUpperCase();
        return {
          id: c.id,
          short,
          pct,
          action: `openSubjectBoard('${c.id}')`
        };
      });

      const flashcardsPct = appState.flashcards.length > 0
        ? Math.round((masteredFlashcards / appState.flashcards.length) * 100)
        : 0;
      comparisonBars.push({
        id: 'karten',
        short: 'Karten',
        pct: flashcardsPct,
        action: "navigateSection('inbox')"
      });

      let topBar = comparisonBars[0];
      for (const bar of comparisonBars) {
        if (bar.pct > topBar.pct) {
          topBar = bar;
        }
      }

      return `
        <div class="flex-1 overflow-y-auto px-6 sm:px-9 py-7">
          <div class="max-w-[1160px]">

            <!-- Top Header Row -->
            <div class="dash-header-enter flex items-center justify-between flex-wrap gap-4 mb-6">
              <div>
                <h1 class="text-[24px] sm:text-[26px] font-bold text-[#F4F4F6] tracking-[-0.02em]">Dashboard Overview</h1>
                <div class="flex items-center gap-2 mt-0.5">
                  <span class="w-1.5 h-1.5 rounded-full bg-[#3B82F6] animate-pulse"></span>
                  <p class="text-[12.5px] text-[#7E7E87]">StudyV • Lernfortschritt &amp; Prüfungsübersicht</p>
                </div>
              </div>

              <div class="flex items-center gap-3 flex-wrap">
                <button onclick="openAddExamModal()"
                        class="dash-cta-pill group inline-flex items-center gap-2 px-4 py-2 rounded-full bg-[#3B82F6] hover:bg-[#2563EB] active:scale-95 text-white text-[12.5px] font-semibold shadow-lg shadow-[#3B82F6]/20 transition">
                  <span class="w-4 h-4 rounded-full bg-white/20 flex items-center justify-center text-[12px] font-bold transition-transform duration-300 group-hover:rotate-90">+</span>
                  <span>Klausur eintragen</span>
                </button>

                <button onclick="navigateSection('settings')"
                        class="group flex items-center gap-2.5 bg-[#161619] hover:bg-[#1C1C20] border border-[#24242A] hover:border-[#3B82F6]/40 active:scale-95 rounded-full pl-3.5 pr-1.5 py-1 transition">
                  <div class="text-right">
                    <div class="text-[12.5px] font-semibold text-[#F4F4F6] leading-tight">${escapeHtml(appState.userName)}</div>
                    <div class="text-[10px] uppercase tracking-wider text-[#60A5FA] font-semibold">Lernprofil</div>
                  </div>
                  <div class="w-8 h-8 rounded-full overflow-hidden border border-[#2E2E36] group-hover:border-[#60A5FA] transition">
                    ${getUserAvatarMarkup()}
                  </div>
                </button>
              </div>
            </div>

            <!-- Row 1: 3 Cobalt Bento KPI Cards -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-5">
              
              <!-- KPI 1: Gesamte Lerneinheiten -->
              <div onmousemove="handleFolderCardMove(event, this)" onmouseleave="handleFolderCardLeave(this)"
                   class="dash-bento-card p-5 flex flex-col justify-between min-h-[126px]" style="--stagger: 0;">
                <div class="dash-edge-shimmer"></div>
                <div class="dash-spotlight absolute inset-0 pointer-events-none"></div>
                <div class="absolute -right-8 -top-8 w-28 h-28 rounded-full bg-[#3B82F6]/10 blur-2xl pointer-events-none"></div>
                <div class="relative z-10 text-[12.5px] font-medium text-[#8E8E93]">Gesamte Lerneinheiten</div>
                <div class="relative z-10 flex items-baseline gap-2.5 mt-3">
                  <span class="dash-metric-value text-[30px] font-bold text-[#F4F4F6] tracking-[-0.03em]">${totalDone} <span class="text-[16px] font-medium text-[#7E7E87]">/ ${totalAll}</span></span>
                  <span class="dash-badge-bob px-2.5 py-0.5 rounded-full bg-[#3B82F6]/15 border border-[#3B82F6]/30 text-[11.5px] font-semibold text-[#60A5FA]">
                    +${overallPct}%
                  </span>
                </div>
              </div>

              <!-- KPI 2: Tagesziel Fortschritt -->
              <div onmousemove="handleFolderCardMove(event, this)" onmouseleave="handleFolderCardLeave(this)"
                   class="dash-bento-card p-5 flex flex-col justify-between min-h-[126px]" style="--stagger: 1;">
                <div class="dash-edge-shimmer"></div>
                <div class="dash-spotlight absolute inset-0 pointer-events-none"></div>
                <div class="relative z-10 flex items-center justify-between">
                  <span class="text-[12.5px] font-medium text-[#8E8E93]">Tagesziel Fortschritt</span>
                  <div class="flex items-center gap-1 bg-[#101013] border border-[#24242A] rounded-[7px] p-0.5">
                    <button onclick="adjustTodayProgress(-1)" class="w-5 h-5 rounded hover:bg-[#222228] active:scale-90 text-[#9A9AA0] hover:text-white text-[12px] font-bold transition">−</button>
                    <button onclick="adjustTodayProgress(1)" class="w-5 h-5 rounded bg-[#3B82F6]/20 hover:bg-[#3B82F6]/35 active:scale-90 text-[#60A5FA] text-[12px] font-bold transition">+</button>
                  </div>
                </div>
                <div class="relative z-10 mt-3">
                  <div class="flex items-baseline justify-between mb-2">
                    <span class="dash-metric-value text-[26px] font-bold text-[#F4F4F6] tracking-[-0.025em]">${appState.completedToday} Einheiten</span>
                    <span class="text-[12px] text-[#7E7E87]">Ziel: ${appState.dailyGoal}</span>
                  </div>
                  <div class="w-full h-1.5 bg-[#1F1F25] rounded-full overflow-hidden">
                    <div class="dash-progress-shimmer h-full bg-gradient-to-r from-[#2563EB] to-[#60A5FA] rounded-full transition-all duration-500" style="width: ${dailyPct}%;"></div>
                  </div>
                </div>
              </div>

              <!-- KPI 3: Nächste Klassenarbeit (Plump Solid Clock Icon) -->
              <div onclick="navigateSection('calendar')"
                   onmousemove="handleFolderCardMove(event, this)" onmouseleave="handleFolderCardLeave(this)"
                   class="dash-bento-card p-5 flex flex-col justify-between min-h-[126px] cursor-pointer" style="--stagger: 2;">
                <div class="dash-edge-shimmer"></div>
                <div class="dash-spotlight absolute inset-0 pointer-events-none"></div>
                <div class="relative z-10 text-[12.5px] font-medium text-[#8E8E93]">Nächste Klassenarbeit</div>
                <div class="relative z-10 flex items-center gap-3.5 mt-3">
                  <div class="dash-icon-tile w-11 h-11 rounded-[14px] bg-[#1D1D22] flex items-center justify-center shrink-0">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" class="dash-clock-svg text-[#60A5FA]">
                      <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2.2C6.58761 2.2 2.2 6.58761 2.2 12C2.2 17.4124 6.58761 21.8 12 21.8C17.4124 21.8 21.8 17.4124 21.8 12C21.8 6.58761 17.4124 2.2 12 2.2ZM13.15 7.1C13.15 6.46487 12.6351 5.95 12 5.95C11.3649 5.95 10.85 6.46487 10.85 7.1V12.1C10.85 12.46 11.02 12.8 11.31 13.02L14.51 15.42C15.02 15.8 15.74 15.7 16.12 15.19C16.5 14.68 16.4 13.96 15.89 13.58L13.15 11.52V7.1Z" />
                    </svg>
                  </div>
                  <div class="min-w-0">
                    <div class="dash-metric-value text-[22px] font-bold text-[#F4F4F6] tracking-[-0.02em] leading-tight">
                      ${nextExam ? getDaysCountdown(nextExam.date) : 'Keine geplant'}
                    </div>
                    <div class="text-[12px] text-[#8E8E93] truncate mt-0.5">
                      ${nextExam ? `${escapeHtml(nextExam.subject)} • ${formatGermanDate(nextExam.date)}` : 'Klicke zum Eintragen'}
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- Row 2: Dein Lernverlauf (Real Daily Wave Chart) + Profile Spotlight Card -->
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 mb-6">

              <!-- Left 8 Cols: Real Daily Learning Curve -->
              <div onmousemove="handleFolderCardMove(event, this)" onmouseleave="handleFolderCardLeave(this)"
                   class="lg:col-span-8 dash-bento-card p-5 sm:p-6 flex flex-col justify-between" style="--stagger: 3;">
                <div class="dash-edge-shimmer"></div>
                <div class="dash-spotlight absolute inset-0 pointer-events-none"></div>

                <div class="relative z-10 flex items-center justify-between flex-wrap gap-3 mb-4">
                  <div class="flex items-center gap-3">
                    <div class="dash-icon-tile w-10 h-10 rounded-[13px] bg-[#1D1D22] flex items-center justify-center text-[#60A5FA]">
                      <svg width="21" height="21" viewBox="0 0 24 24" fill="currentColor">
                        <path fill-rule="evenodd" clip-rule="evenodd" d="M6.2 2.8C4.32 2.8 2.8 4.32 2.8 6.2V17.8C2.8 19.68 4.32 21.2 6.2 21.2H17.8C19.68 21.2 21.2 19.68 21.2 17.8V6.2C21.2 4.32 19.68 2.8 17.8 2.8H6.2ZM8.3 11.4C7.58 11.4 7 11.98 7 12.7V16.7C7 17.42 7.58 18 8.3 18C9.02 18 9.6 17.42 9.6 16.7V12.7C9.6 11.98 9.02 11.4 8.3 11.4ZM12 7.1C11.28 7.1 10.7 7.68 10.7 8.4V16.7C10.7 17.42 11.28 18 12 18C12.72 18 13.3 17.42 13.3 16.7V8.4C13.3 7.68 12.72 7.1 12 7.1ZM15.7 9.6C14.98 9.6 14.4 10.18 14.4 10.9V16.7C14.4 17.42 14.98 18 15.7 18C16.42 18 17 17.42 17 16.7V10.9C17 10.18 16.42 9.6 15.7 9.6Z" />
                      </svg>
                    </div>
                    <div>
                      <div class="text-[12px] text-[#8E8E93]">Dein Lernverlauf</div>
                      <div class="dash-metric-value text-[22px] font-bold text-[#F4F4F6] tracking-[-0.02em]">
                        ${appState.completedToday} Lektionen heute
                      </div>
                    </div>
                  </div>

                  <!-- Timeframe Pills (1T, 1W, 1M) -->
                  <div class="flex items-center gap-1 bg-[#101013] border border-[#232329] rounded-full p-1">
                    ${['1T', '1W', '1M'].map(r => `
                      <button onclick="switchChartRange('${r}')"
                              class="px-3 py-1 rounded-full text-[11.5px] font-semibold transition ${appState.chartRange === r ? 'bg-[#3B82F6] text-white' : 'text-[#8E8E93] hover:text-white'}">
                        ${r}
                      </button>
                    `).join('')}
                  </div>
                </div>

                <!-- SVG Area Line Chart -->
                <div class="relative z-10 w-full mt-1">
                  <svg viewBox="0 0 ${svgW} ${svgH}" class="w-full h-[175px]">
                    <defs>
                      <linearGradient id="cobaltAreaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.34" />
                        <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.0" />
                      </linearGradient>
                    </defs>

                    ${[0, 0.25, 0.5, 0.75, 1].map(frac => {
                      const yPos = padT + plotH - frac * plotH;
                      const labelVal = Math.round(frac * maxVal);
                      return `
                        <line x1="${padL}" y1="${yPos.toFixed(1)}" x2="${svgW - padR}" y2="${yPos.toFixed(1)}" stroke="#202026" stroke-width="1" />
                        <text x="${padL - 8}" y="${(yPos + 3.5).toFixed(1)}" text-anchor="end" fill="#686873" font-size="9.5" font-family="Inter, sans-serif">${labelVal}</text>
                      `;
                    }).join('')}

                    <path d="${areaPath}" fill="url(#cobaltAreaGrad)" />
                    <path d="${linePath}" fill="none" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round" />

                    ${coords.filter((_, i) => coords.length <= 7 || i % 2 === 0 || i === coords.length - 1).map(pt => `
                      <text x="${pt.x.toFixed(1)}" y="${svgH - 4}" text-anchor="middle" fill="${pt.isToday ? '#93C5FD' : '#686873'}" font-size="9.5" font-family="Inter, sans-serif">${pt.label}</text>
                    `).join('')}

                    <!-- Vertical Guide Line directly through the active data point -->
                    <line id="chart-guide-line"
                          x1="${lastPt.x.toFixed(1)}" y1="${padT}"
                          x2="${lastPt.x.toFixed(1)}" y2="${(padT + plotH).toFixed(1)}"
                          stroke="#3B82F6" stroke-opacity="0.24" stroke-width="1" stroke-dasharray="3 3" />

                    <!-- Native SVG Pulsing Halo locked strictly to (cx, cy) -->
                    <circle id="chart-pulse-circle" cx="${lastPt.x.toFixed(1)}" cy="${lastPt.y.toFixed(1)}" r="7" fill="#3B82F6" fill-opacity="0.32">
                      <animate attributeName="r" values="5;10.5;5" dur="2.4s" repeatCount="indefinite" />
                      <animate attributeName="fill-opacity" values="0.38;0.08;0.38" dur="2.4s" repeatCount="indefinite" />
                    </circle>
                    <circle id="chart-dot-circle" cx="${lastPt.x.toFixed(1)}" cy="${lastPt.y.toFixed(1)}" r="4.2" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2" />

                    <!-- Centered Tooltip Pill + Pointer Triangle aligned directly above the dot -->
                    <rect id="chart-tooltip-rect"
                          x="${(pillCenterX - pillW / 2).toFixed(1)}" y="${pillY.toFixed(1)}"
                          width="${pillW}" height="21" rx="10.5"
                          fill="#1E1E24" stroke="#32323C" />
                    <polygon id="chart-tooltip-arrow"

                      <div onclick="${bar.action}" class="flex flex-col items-center gap-1.5 cursor-pointer group">

                             style="--bar-idx: ${idx}; height: ${barH}px; ${!isHighlight ? 'background: linear-gradient(180deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.02) 100%);' : ''}"></div>
                        <span class="text-[11px] font-medium ${isHighlight ? 'text-[#93C5FD] font-semibold' : 'text-[#8E8E93]'} group-hover:text-white transition">${bar.short}</span>

                const total = c.cards.reduce((s, m) => s + m.totalSteps, 0);

        },
        {
          id: 'timeline',
          label: 'Timeline',
          icon: `<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><rect x="2.5" y="4.5" width="12.5" height="3.8" rx="1.9"/><rect x="7.5" y="10.1" width="14" height="3.8" rx="1.9"/><rect x="4.5" y="15.7" width="11.5" height="3.8" rx="1.9"/></svg>`
        },
        {
          id: 'table',
          label: 'Table',
          icon: `<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" clip-rule="evenodd" d="M6.2 3.2C4.1 3.2 2.4 4.9 2.4 7V17C2.4 19.1 4.1 20.8 6.2 20.8H17.8C19.9 20.8 21.6 19.1 21.6 17V7C21.6 4.9 19.9 3.2 17.8 3.2H6.2ZM5.6 9.8C5.6 9.25 6.05 8.8 6.6 8.8H9.8C10.35 8.8 10.8 9.25 10.8 9.8V12.2C10.8 12.75 10.35 13.2 9.8 13.2H6.6C6.05 13.2 5.6 12.75 5.6 12.2V9.8ZM12.8 9.8C12.8 9.25 13.25 8.8 13.8 8.8H17.4C17.95 8.8 18.4 9.25 18.4 9.8V12.2C18.4 12.75 17.95 13.2 17.4 13.2H13.8C13.25 13.2 12.8 12.75 12.8 12.2V9.8ZM5.6 15.2C5.6 14.76 5.96 14.4 6.4 14.4H10C10.44 14.4 10.8 14.76 10.8 15.2V17.2C10.8 17.64 10.44 18 10 18H6.4C5.96 18 5.6 17.64 5.6 17.2V15.2ZM12.8 15.2C12.8 14.76 13.16 14.4 13.6 14.4H17.6C18.04 14.4 18.4 14.76 18.4 15.2V17.2C18.4 17.64 18.04 18 17.6 18H13.6C13.16 18 12.8 17.64 12.8 17.2V15.2Z"/></svg>`
        }
      ];

      let activeBoardHtml = '';
      if (appState.activeViewTab === 'kanban') {
        activeBoardHtml = renderKanbanBoard(course);
      } else if (appState.activeViewTab === 'list') {
        activeBoardHtml = renderListView(course);
      } else if (appState.activeViewTab === 'timeline') {
        activeBoardHtml = renderTimelineView(course);
      } else {
        activeBoardHtml = renderTableView(course);
      }

      return `
        <div class="flex-1 flex flex-col overflow-hidden">
          <div class="px-6 sm:px-9 pt-6 pb-4 shrink-0">
            <div class="flex items-center justify-between flex-wrap gap-3 mb-5">
              <div class="flex items-center gap-2.5 text-[13.5px]">
                <button onclick="openSubjectsOverview()" class="inline-flex items-center gap-2 text-[#8E8E93] hover:text-[#F4F4F6] transition focus:outline-none">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12.7 5.3C13.3 5.9 13.3 6.9 12.7 7.5L9.9 10.3H19C19.9 10.3 20.6 11 20.6 11.9C20.6 12.8 19.9 13.5 19 13.5H9.9L12.7 16.3C13.3 16.9 13.3 17.9 12.7 18.5C12.1 19.1 11.1 19.1 10.5 18.5L5.1 13.1C4.4 12.4 4.4 11.4 5.1 10.7L10.5 5.3C11.1 4.7 12.1 4.7 12.7 5.3Z" />
                  </svg>
                  <span>Project</span>
                </button>
                <span class="text-[#52525B]">/</span>
                <span class="font-medium text-[#E4E4E7]">${escapeHtml(course.title)}</span>
              </div>
            </div>

            <div class="flex items-center gap-3.5 mb-5">
              <div class="w-[34px] h-[28px] shrink-0 flex items-center justify-center text-[#4B7BF5]">
                <svg width="32" height="28" viewBox="0 0 24 24" fill="currentColor">
                  <path fill-rule="evenodd" clip-rule="evenodd" d="M2.2 7.2C2.2 4.99 3.99 3.2 6.2 3.2H9.45C10.45 3.2 11.41 3.6 12.11 4.31L13.15 5.35H17.8C20.01 5.35 21.8 7.14 21.8 9.35V16.8C21.8 19.01 20.01 20.8 17.8 20.8H6.2C3.99 20.8 2.2 19.01 2.2 16.8V7.2ZM9 11.8C8.23 11.8 7.6 12.43 7.6 13.2C7.6 13.97 8.23 14.6 9 14.6H15C15.77 14.6 16.4 13.97 16.4 13.2C16.4 12.43 15.77 11.8 15 11.8H9Z" />
                </svg>
              </div>
              <h1 class="text-[27px] sm:text-[31px] font-bold text-[#F4F4F6] tracking-[-0.025em] leading-tight">
                ${escapeHtml(course.title)}
              </h1>
            </div>

            <div class="flex items-center gap-1.5 overflow-x-auto pb-1">
              ${viewTabs.map(tab => {
                const isActive = appState.activeViewTab === tab.id;
                return `
                  <button onclick="switchViewTab('${tab.id}')"
                          class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-[9px] text-[13px] transition shrink-0 ${isActive ? 'bg-[#242428] border border-[#343439] text-[#F4F4F6] font-medium shadow-sm' : 'text-[#8E8E93] hover:text-[#E4E4E7] hover:bg-[#19191D] border border-transparent'}">
                    <span class="${isActive ? 'text-[#F4F4F6]' : 'text-[#7E7E86]'}">${tab.icon}</span>
                    <span>${tab.label}</span>
                  </button>
                `;
              }).join('')}
            </div>
          </div>

          <div class="h-px bg-[#202024] mx-6 sm:mx-9 shrink-0"></div>

          <div class="flex-1 overflow-auto px-6 sm:px-9 py-5">
            ${activeBoardHtml}
          </div>
        </div>
      `;
    }

    function renderKanbanBoard(course) {
      const columns = [
        { id: 'todo', title: 'To Do', barColor: '#7E7E87' },
        { id: 'completed', title: 'Done', barColor: '#10B981' }
      ];

      return `
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 items-start min-w-0">
          ${columns.map(col => {
            const colCards = col.id === 'todo'
              ? course.cards.filter(c => c.column !== 'completed')
              : course.cards.filter(c => c.column === 'completed');

            return `
              <section
                ondragover="handleDragOver(event)"
                ondragleave="handleDragLeave(event)"
                ondrop="handleDrop(event, '${col.id}')"
                class="kanban-column flex flex-col min-w-0 p-1.5 transition-colors"
              >
                <div class="flex items-center justify-between px-1 mb-4">
                  <div class="flex items-center gap-2.5">
                    <span class="w-[3px] h-[15px] rounded-full" style="background-color: ${col.barColor};"></span>
                    <h2 class="text-[15px] font-semibold text-[#E4E4E7]">${col.title}</h2>
                    <span class="text-[12px] text-[#6E6E77] font-medium">${colCards.length}</span>
                  </div>
                </div>

                <div class="space-y-4">
                  ${colCards.length === 0 ? `
                    <div class="border border-dashed border-[#27272E] rounded-[16px] p-8 text-center text-[13px] text-[#6E6E77]">
                      ${col.id === 'completed' ? 'Schließe ein Thema im Quiz ab, damit es automatisch hier landet.' : 'Alle Themen in diesem Fach wurden abgeschlossen!'}
                    </div>
                  ` : colCards.map((card, idx) => renderNebulaCard(card, idx)).join('')}
                </div>
              </section>
            `;
          }).join('')}
        </div>
      `;
    }

    function renderListView(course) {
      return `
        <div class="space-y-3 max-w-4xl">
          ${course.cards.map(card => `
            <div onclick="openQuizPopup('${card.id}')"
                 class="flex items-center justify-between gap-4 bg-[#19191E] hover:bg-[#202026] border border-[#282830] rounded-[13px] px-5 py-4 cursor-pointer transition">
              <div class="flex items-center gap-3 min-w-0">
                <span class="w-2.5 h-2.5 rounded-full ${card.column === 'completed' ? 'bg-[#10B981]' : 'bg-[#60A5FA]'}"></span>
                <span class="text-[16px] font-bold text-[#F4F4F6] truncate">${escapeHtml(card.title)}</span>
              </div>
              <div class="flex items-center gap-4 shrink-0">
                ${renderSegmentedTicks(card.completedSteps, card.totalSteps)}
                <span class="text-[12.5px] font-semibold text-[#E4E4E7] w-14 text-right">${card.completedSteps}/${card.totalSteps}</span>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderTimelineView(course) {
      return `
        <div class="space-y-4 max-w-4xl">
          ${course.cards.map(card => {
            const pct = card.totalSteps > 0 ? Math.round((card.completedSteps / card.totalSteps) * 100) : 0;
            return `
              <div onclick="openQuizPopup('${card.id}')"
                   class="bg-[#19191E] hover:bg-[#202026] border border-[#282830] rounded-[14px] p-5 cursor-pointer transition">
                <div class="flex items-center justify-between gap-3 mb-3">
                  <span class="text-[16px] font-bold text-[#F4F4F6]">${escapeHtml(card.title)}</span>
                  <span class="text-[12.5px] font-semibold text-[#60A5FA]">${pct}%</span>
                </div>
                <div class="w-full h-2.5 bg-[#111113] rounded-full overflow-hidden border border-[#252529]">
                  <div class="h-full bg-[#3B82F6] rounded-full transition-all" style="width: ${pct}%;"></div>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function renderTableView(course) {
      return `
        <div class="overflow-x-auto bg-[#161618] border border-[#242428] rounded-[14px]">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="border-b border-[#242428] text-[12px] text-[#8E8E93]">
                <th class="py-3.5 px-5 font-medium">Lernmodul</th>
                <th class="py-3.5 px-5 font-medium">Status</th>
                <th class="py-3.5 px-5 font-medium">Fortschritt</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-[#222226] text-[13.5px]">
              ${course.cards.map(card => `
                <tr onclick="openQuizPopup('${card.id}')" class="hover:bg-[#1C1C22] cursor-pointer transition">
                  <td class="py-3.5 px-5 font-bold text-[#F4F4F6]">${escapeHtml(card.title)}</td>
                  <td class="py-3.5 px-5 text-[#A1A1AA]">${card.column === 'completed' ? 'Done' : 'To Do'}</td>
                  <td class="py-3.5 px-5">
                    <div class="flex items-center gap-2.5">
                      ${renderSegmentedTicks(card.completedSteps, card.totalSteps)}
                      <span class="text-[12px] text-[#E4E4E7]">${card.completedSteps}/${card.totalSteps}</span>
                    </div>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    // =========================================================================
    // 3C. KARTEN VIEW (Single Large 3D Flip Card + Subject Filter + Extra Button)
    // =========================================================================

    function renderInboxView() {
      const subjects = ['ALL', 'Rechnungswesen', 'Gesprächsgestaltung', 'Sozialkunde', 'Englisch', 'Kunden akquirieren und binden'];
      const activeSubject = appState.selectedFlashcardSubject || 'ALL';

      const filteredCards = activeSubject === 'ALL'
        ? appState.flashcards
        : appState.flashcards.filter(c => c.subject === activeSubject);

      const masteredInView = filteredCards.filter(c => c.mastered).length;
      const totalCardsCount = appState.flashcards.length;
      const totalMasteredCount = appState.flashcards.filter(c => c.mastered).length;

      const totalPages = Math.max(1, filteredCards.length);
      const safePage = Math.min(Math.max(0, appState.flashcardPage || 0), totalPages - 1);
      const currentCard = filteredCards[safePage] || null;

      const frameVariants = [
        {
          borderGradient: 'linear-gradient(180deg, #F472B6 0%, #FB7185 45%, #FB923C 100%)',
          glowColor: 'rgba(251, 113, 133, 0.34)',
          innerTint: 'rgba(251, 146, 60, 0.14)',
          accentText: '#FB923C'
        },
        {
          borderGradient: 'linear-gradient(180deg, #E2E8F0 0%, #7DD3FC 48%, #0EA5E9 100%)',
          glowColor: 'rgba(56, 189, 248, 0.34)',
          innerTint: 'rgba(56, 189, 248, 0.14)',
          accentText: '#38BDF8'
        },
        {
          borderGradient: 'linear-gradient(180deg, #60A5FA 0%, #A855F7 52%, #F472B6 100%)',
          glowColor: 'rgba(168, 85, 247, 0.34)',
          innerTint: 'rgba(192, 132, 252, 0.15)',
          accentText: '#C084FC'
        }
      ];

      const getSubjectWhiteGlyph = (subject) => {
        if (subject === 'Rechnungswesen') {
          return `
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" class="text-white">
              <path fill-rule="evenodd" clip-rule="evenodd" d="M6.8 2.2C4.59 2.2 2.8 3.99 2.8 6.2V17.8C2.8 20.01 4.59 21.8 6.8 21.8H17.2C19.41 21.8 21.2 20.01 21.2 17.8V6.2C21.2 3.99 19.41 2.2 17.2 2.2H6.8ZM7.2 5.6C6.54 5.6 6 6.14 6 6.8V8.4C6 9.06 6.54 9.6 7.2 9.6H16.8C17.46 9.6 18 9.06 18 8.4V6.8C18 6.14 17.46 5.6 16.8 5.6H7.2ZM7.6 12C6.72 12 6 12.72 6 13.6C6 14.48 6.72 15.2 7.6 15.2C8.48 15.2 9.2 14.48 9.2 13.6C9.2 12.72 8.48 12 7.6 12ZM12 12C11.12 12 10.4 12.72 10.4 13.6C10.4 14.48 11.12 15.2 12 15.2C12.88 15.2 13.6 14.48 13.6 13.6C13.6 12.72 12.88 12 12 12ZM16.4 12C15.52 12 14.8 12.72 14.8 13.6C14.8 14.48 15.52 15.2 16.4 15.2C17.28 15.2 18 14.48 18 13.6C18 12.72 17.28 12 16.4 12ZM7.4 16.8C6.63 16.8 6 17.43 6 18.2C6 18.97 6.63 19.6 7.4 19.6H12.2C12.97 19.6 13.6 18.97 13.6 18.2C13.6 17.43 12.97 16.8 12.2 16.8H7.4ZM16.4 16.8C15.52 16.8 14.8 17.52 14.8 18.4C14.8 19.28 15.52 20 16.4 20C17.28 20 18 19.28 18 18.4C18 17.52 17.28 16.8 16.4 16.8Z" />
            </svg>
          `;
        }
        if (subject === 'Gesprächsgestaltung') {
          return `
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" class="text-white">
              <path fill-rule="evenodd" clip-rule="evenodd" d="M6.8 3.2C4.26 3.2 2.2 5.26 2.2 7.8V14.4C2.2 16.94 4.26 19 6.8 19H7.4V20.55C7.4 21.48 8.48 21.99 9.21 21.41L12.22 19H17.2C19.74 19 21.8 16.94 21.8 14.4V7.8C21.8 5.26 19.74 3.2 17.2 3.2H6.8ZM7.8 9.6C6.97 9.6 6.3 10.27 6.3 11.1C6.3 11.93 6.97 12.6 7.8 12.6C8.63 12.6 9.3 11.93 9.3 11.1C9.3 10.27 8.63 9.6 7.8 9.6ZM12 9.6C11.17 9.6 10.5 10.27 10.5 11.1C10.5 11.93 11.17 12.6 12 12.6C12.83 12.6 13.5 11.93 13.5 11.1C13.5 10.27 12.83 9.6 12 9.6ZM16.2 9.6C15.37 9.6 14.7 10.27 14.7 11.1C14.7 11.93 15.37 12.6 16.2 12.6C17.03 12.6 17.7 11.93 17.7 11.1C17.7 10.27 17.03 9.6 16.2 9.6Z" />
            </svg>
          `;
        }
        if (subject === 'Englisch') {
          return `
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" class="text-white">
              <circle cx="12" cy="12" r="9.2" />
            </svg>
          `;
        }
        if (subject === 'Kunden akquirieren und binden') {
          return `
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" class="text-white">
              <circle cx="9.2" cy="7.6" r="3.9" />
              <path d="M2.6 18.4C2.6 15.1 5.5 12.9 9.2 12.9C12.9 12.9 15.8 15.1 15.8 18.4C15.8 19.7 14.7 20.6 13.4 20.6H5C3.7 20.6 2.6 19.7 2.6 18.4Z" />
              <path d="M18.6 7.4C19.3 7.4 19.8 7.9 19.8 8.6V10.1H21.3C22 10.1 22.5 10.6 22.5 11.3C22.5 12 22 12.5 21.3 12.5H19.8V14C19.8 14.7 19.3 15.2 18.6 15.2C17.9 15.2 17.4 14.7 17.4 14V12.5H15.9C15.2 12.5 14.7 12 14.7 11.3C14.7 10.6 15.2 10.1 15.9 10.1H17.4V8.6C17.4 7.9 17.9 7.4 18.6 7.4Z" />
            </svg>
          `;
        }
        return `
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" class="text-white">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M10.92 2.48C11.58 2.09 12.42 2.09 13.08 2.48L20.38 6.82C21.55 7.51 21.06 9.3 19.7 9.3H4.3C2.94 9.3 2.45 7.51 3.62 6.82L10.92 2.48ZM12 5.2C11.28 5.2 10.7 5.78 10.7 6.5C10.7 7.22 11.28 7.8 12 7.8C12.72 7.8 13.3 7.22 13.3 6.5C13.3 5.78 12.72 5.2 12 5.2Z" />
            <rect x="4.6" y="10.4" width="3.3" height="6.8" rx="1.4" />
            <rect x="10.35" y="10.4" width="3.3" height="6.8" rx="1.4" />
            <rect x="16.1" y="10.4" width="3.3" height="6.8" rx="1.4" />
            <rect x="2.4" y="18.3" width="19.2" height="3.2" rx="1.6" />
          </svg>
        `;
      };

      const variant = frameVariants[safePage % frameVariants.length];
      const isFlipped = currentCard ? !!appState.flippedFlashcardIds[currentCard.id] : false;

      return `
        <div class="flex-1 overflow-y-auto px-6 sm:px-9 py-7">
          <div class="max-w-[1140px]">

            <!-- Header Bar -->
            <div class="flex items-center justify-between flex-wrap gap-4 mb-6">
              <div>
                <h1 class="text-[26px] font-bold text-[#F4F4F6] tracking-[-0.02em]">Karten</h1>
                <p class="text-[13.5px] text-[#8E8E93] mt-0.5">Wähle dein Fach aus — klicke auf die Karte, um sie mit 3D-Animation umzudrehen</p>
              </div>
              <div class="flex items-center gap-2.5 flex-wrap">
                <span class="px-3 py-1.5 rounded-[9px] bg-[#161619] border border-[#26262D] text-[12.5px] text-[#C4C4CC] font-medium">
                  ${totalMasteredCount} / ${totalCardsCount} gewusst
                </span>
                <button onclick="openAddFlashcardModal()"
                        class="px-3.5 py-1.5 rounded-[9px] bg-[#3B82F6] hover:bg-[#2563EB] text-white text-[12.5px] font-medium transition">
                  + Neue Karte
                </button>
              </div>
            </div>

            <!-- Fach-Auswahl (Punkt "Thema" entfernt) -->
            <div class="bg-[#151518] border border-[#232329] rounded-[16px] p-4 sm:p-5 mb-8">
              <div class="flex items-center justify-between flex-wrap gap-3">
                <div class="flex items-center gap-2 flex-wrap">
                  <span class="text-[11.5px] font-semibold uppercase tracking-wider text-[#7E7E87] mr-1">Fach:</span>
                  ${subjects.map(subj => {
                    const isSelected = activeSubject === subj;
                    const label = subj === 'ALL' ? 'Alle Fächer' : subj;
                    return `
                      <button onclick="selectFlashcardSubject('${subj}')"
                              class="px-3.5 py-1.5 rounded-[9px] text-[12.5px] font-medium transition ${isSelected ? 'bg-[#F4F4F6] text-[#111113] shadow-sm' : 'bg-[#1B1B20] hover:bg-[#232329] border border-[#2A2A32] text-[#A1A1AA] hover:text-white'}">
                        ${escapeHtml(label)}
                      </button>
                    `;
                  }).join('')}
                </div>

                <span class="text-[12px] text-[#8E8E93]">
                  Auswahl: <strong class="text-[#E4E4E7]">${masteredInView}/${filteredCards.length}</strong> gemeistert
                </span>
              </div>
            </div>

            <!-- Single Long 3D Flip Flashcard -->
            ${!currentCard ? `
              <div class="max-w-[780px] mx-auto bg-[#151518] border border-[#24242A] rounded-[22px] p-10 text-center mb-8">
                <p class="text-[14px] text-[#8E8E93] mb-3">Für dieses Fach sind noch keine Karten vorhanden.</p>
                <button onclick="openAddFlashcardModal()" class="px-4 py-2 rounded-[9px] bg-[#3B82F6] hover:bg-[#2563EB] text-white text-[13px] font-medium transition">
                  + Erste Karte erstellen
                </button>
              </div>
            ` : `
              <div class="max-w-[780px] mx-auto mb-9">
                <!-- Interactive Deck Progress Pills -->
                <div class="flex items-center justify-center gap-1.5 mb-4">
                  ${filteredCards.map((fc, idx) => {
                    const isCurrent = idx === safePage;
                    const pillColor = isCurrent
                      ? 'w-7 bg-[#F4F4F6]'
                      : fc.mastered
                        ? 'w-2.5 bg-[#10B981]/80 hover:bg-[#10B981]'
                        : 'w-2.5 bg-[#2A2A32] hover:bg-[#3F3F4B]';
                    return `
                      <button onclick="jumpToFlashcard(${idx})" title="Karte ${idx + 1}"
                              class="h-1.5 rounded-full transition-all duration-300 ${pillColor}"></button>
                    `;
                  }).join('')}
                </div>

                <div class="flashcard-stage ${appState.flashcardTransitionDir || ''} mb-5">
                  <div id="active-flashcard-tilt"
                       onmousemove="handleFlashcardTilt(event, this)"
                       onmouseleave="resetFlashcardTilt(this)"
                       class="flashcard-tilt-shell">
                    <div id="active-flashcard-flipper"
                         onclick="toggleFlashcardItem('${currentCard.id}')"
                         class="flashcard-flipper ${isFlipped ? 'is-flipped' : ''}">
                      
                      <!-- FRONT FACE (FRAGE) -->
                      <div class="flashcard-face flashcard-face-front">
                        <div class="neon-frame-outer"
                             style="--frame-border-gradient: ${variant.borderGradient}; --frame-glow: ${variant.glowColor};">
                          <div class="neon-frame-inner p-7 sm:p-9 flex flex-col justify-between">
                            <div class="neon-frame-shimmer pointer-events-none"></div>
                            <div class="neon-frame-spotlight absolute inset-0 pointer-events-none"></div>

    // =========================================================================
