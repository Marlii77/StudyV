                </span>
              </div>
            </div>

            <div class="flex items-center gap-2 flex-wrap mb-6">
              <button type="button" onclick="toggleFlashcardDueFilter()"
                      class="px-3.5 py-1.5 rounded-full text-[12.5px] font-semibold border transition ${appState.flashcardDueFilterOnly ? 'bg-[#F59E0B] border-[#F59E0B] text-[#111113]' : 'bg-[#161619] border-[#2C2C35] text-[#FBBF24] hover:border-[#F59E0B]/50'}">
                Heute fällig (${dueInPoolCount})
              </button>
              ${visibleSubjects.map(subj => {
                const active = appState.selectedFlashcardSubject === subj;
                const label = subj === 'ALL' ? 'Alle Fächer' : subj;
                return `
                  <button onclick="selectFlashcardSubject('${subj}')"
                          class="px-3.5 py-1.5 rounded-full text-[12.5px] font-medium transition ${active ? 'bg-[#3B82F6] text-white shadow-md shadow-[#3B82F6]/20' : 'bg-[#161619] border border-[#24242B] text-[#8E8E93] hover:text-white'}">
                    ${escapeHtml(label)}
                  </button>
                `;
              }).join('')}
              <button type="button" onclick="toggleFlashcardSubjectsExpand()"
                      class="px-3.5 py-1.5 rounded-full text-[12.5px] font-medium bg-[#161619] hover:bg-[#1E1E24] border border-[#2C2C35] text-[#60A5FA] transition">
                ${appState.showAllFlashcardSubjects ? 'Weniger anzeigen ▴' : 'Mehr anzeigen ▾'}
              </button>
            </div>

            ${totalCount > 0 ? `
              <div class="flex items-center gap-1.5 mb-5">
                ${filtered.map((fc, idx) => `
                  <button onclick="selectFlashcardByIndex(${idx})"
                          title="Karte ${idx + 1}"
                          class="h-1.5 flex-1 rounded-full transition-all duration-300 ${idx === safeIdx ? 'bg-[#3B82F6] scale-y-125' : fc.mastered ? 'bg-[#10B981]/65 hover:bg-[#10B981]' : 'bg-[#25252D] hover:bg-[#3A3A46]'}"></button>
                `).join('')}
              </div>
            ` : ''}

            ${activeCard ? `
              <div class="flashcard-stage ${slideClass}">
                <div onmousemove="handleFolderCardMove(event, this)" onmouseleave="handleFolderCardLeave(this)" class="flashcard-tilt-shell">
                  <div id="flipper-${activeCard.id}"
                       onclick="flipFlashcard('${activeCard.id}')"
                       class="flashcard-flipper ${isFlipped ? 'is-flipped' : ''}"
                       style="--frame-border-gradient: ${pal.borderGrad}; --frame-glow: ${pal.glowColor}; --frame-inner-tint: ${pal.innerTint};">

                    <!-- FRONT FACE -->
                    <div class="flashcard-face flashcard-face-front">
                      <div class="neon-frame-outer">
                        <div class="neon-frame-inner p-7 sm:p-9 flex flex-col justify-between">
                          <div class="relative z-10 flex items-center justify-between gap-3">
                            <div class="flex items-center gap-3">
                              <div class="card-glyph-badge w-10 h-10 rounded-[12px] bg-white/[0.06] border border-white/[0.1] flex items-center justify-center text-white">
                                ${pal.glyphSvg}
                              </div>
                              <div>
                                <div class="flex items-center gap-2">
                                  <span class="text-[13px] font-semibold text-[#F4F4F6]">${escapeHtml(activeCard.subject)}</span>
                                  ${activeCard.isCustom ? `<span class="px-2 py-0.5 rounded-full bg-[#3B82F6]/20 text-[#60A5FA] text-[10px] font-semibold">Eigene Karte</span>` : ''}
                                </div>
                                <div class="text-[11px] text-[#8E8E93]">
                                  Vorderseite • ${activeCard.intervalDays ? `Intervall: ${activeCard.intervalDays} Tage` : 'Neue Karte'}
                                </div>
                              </div>
                            </div>

                            <div class="flex items-center gap-2">
                              ${activeCard.isCustom ? `
                                <button type="button" onclick="event.stopPropagation(); openFlashcardEditorModal('${activeCard.id}')"
                                        class="px-2.5 py-1 rounded-full bg-white/[0.06] hover:bg-white/[0.14] text-[11px] font-medium text-[#D4D4D8] transition">
                                  Bearbeiten
                                </button>
                                <button type="button" onclick="event.stopPropagation(); openDeleteFlashcardModal('${activeCard.id}')"
                                        class="px-2.5 py-1 rounded-full bg-[#EF4444]/15 hover:bg-[#EF4444]/30 text-[11px] font-medium text-[#FCA5A5] transition">
                                  Löschen
                                </button>
                              ` : ''}
                              <span class="px-3 py-1 rounded-full bg-white/[0.05] border border-white/[0.08] text-[11.5px] font-semibold text-[#A1A1AA]">
                                Karte ${safeIdx + 1} von ${totalCount}
                              </span>
                            </div>
                          </div>

                          <div class="relative z-10 my-auto py-4">
                            <p class="text-[19px] sm:text-[22px] font-bold text-[#F4F4F6] leading-[1.42] tracking-[-0.015em]">
                              ${escapeHtml(activeCard.question)}
                            </p>
                          </div>

                          <div class="relative z-10 flex items-center justify-between text-[12px] text-[#8E8E93] pt-3 border-t border-white/[0.06]">
                            <span>Klicken oder Leertaste zum Umdrehen</span>
                            <span class="text-[#60A5FA] font-medium">Lösung anzeigen ↻</span>
                          </div>
                        </div>
                      </div>
                    </div>

                    <!-- BACK FACE -->
                    <div class="flashcard-face flashcard-face-back">
                      <div class="neon-frame-outer">
                        <div class="neon-frame-inner is-back p-7 sm:p-9 flex flex-col justify-between">
                          <div class="relative z-10 flex items-center justify-between gap-3">
                            <div class="flex items-center gap-3">
                              <div class="card-glyph-badge w-10 h-10 rounded-[12px] bg-[#10B981]/15 border border-[#10B981]/30 flex items-center justify-center text-[#34D399]">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                                  <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2.5C6.75 2.5 2.5 6.75 2.5 12C2.5 17.25 6.75 21.5 12 21.5C17.25 21.5 21.5 17.25 21.5 12C21.5 6.75 17.25 2.5 12 2.5ZM16.3 9.7C16.69 9.31 16.69 8.68 16.3 8.29C15.91 7.9 15.28 7.9 14.89 8.29L10.75 12.43L9.11 10.79C8.72 10.4 8.09 10.4 7.7 10.79C7.31 11.18 7.31 11.81 7.7 12.2L10.05 14.55C10.44 14.94 11.07 14.94 11.46 14.55L16.3 9.7Z" />
                                </svg>
                              </div>
                              <div>
                                <div class="text-[13px] font-semibold text-[#34D399]">Lösung &amp; Antwort</div>
                                <div class="text-[11px] text-[#8E8E93]">${escapeHtml(activeCard.subject)}</div>
                              </div>
                            </div>
                            <span class="px-3 py-1 rounded-full bg-white/[0.05] border border-white/[0.08] text-[11.5px] font-semibold text-[#A1A1AA]">
                              Karte ${safeIdx + 1} von ${totalCount}
                            </span>
                          </div>

                          <div class="relative z-10 my-auto py-4">
                            <p class="text-[18px] sm:text-[20.5px] font-semibold text-[#F4F4F6] leading-[1.48]">
                              ${escapeHtml(activeCard.answer)}
                            </p>
                          </div>

                          <div class="relative z-10 flex items-center justify-between text-[12px] text-[#8E8E93] pt-3 border-t border-white/[0.06]">
                            <span>Bewerte unten deinen Lernstand (1 / 2 / 3)</span>
                            <span class="text-[#34D399] font-medium">Zurück zur Frage ↺</span>
                          </div>
                        </div>
                      </div>
                    </div>

                  </div>
                </div>
              </div>

              <div class="mt-5 flex items-center justify-between flex-wrap gap-3">
                <div class="flex items-center gap-2">
                  <button onclick="prevFlashcard()" class="px-4 py-2.5 rounded-[11px] bg-[#161619] hover:bg-[#1E1E24] border border-[#26262F] text-[13px] font-medium text-[#E4E4E7] transition">
                    ← Vorherige
                  </button>
                  <button onclick="flipFlashcard('${activeCard.id}')" class="px-4 py-2.5 rounded-[11px] bg-[#161619] hover:bg-[#1E1E24] border border-[#26262F] text-[13px] font-medium text-[#E4E4E7] transition">
                    Karte umdrehen
                  </button>
                  <button onclick="nextFlashcard()" class="px-4 py-2.5 rounded-[11px] bg-[#161619] hover:bg-[#1E1E24] border border-[#26262F] text-[13px] font-medium text-[#E4E4E7] transition">
                    Nächste →
                  </button>
                </div>

                <div class="flex items-center gap-2 flex-wrap">
                  <button type="button" onclick="rateFlashcardSpaced('${activeCard.id}', 'again')"
                          class="px-3.5 py-2.5 rounded-[11px] bg-[#EF4444]/15 hover:bg-[#EF4444]/25 border border-[#EF4444]/35 text-[#FCA5A5] text-[12.5px] font-semibold transition">
                    1 • Nochmal (1d)
                  </button>
                  <button type="button" onclick="rateFlashcardSpaced('${activeCard.id}', 'hard')"
                          class="px-3.5 py-2.5 rounded-[11px] bg-[#F59E0B]/15 hover:bg-[#F59E0B]/25 border border-[#F59E0B]/35 text-[#FBBF24] text-[12.5px] font-semibold transition">
                    2 • Unsicher (+2d)
                  </button>
                  <button type="button" onclick="rateFlashcardSpaced('${activeCard.id}', 'good')"
                          class="px-4 py-2.5 rounded-[11px] bg-[#10B981]/20 hover:bg-[#10B981]/30 border border-[#10B981]/45 text-[#34D399] text-[12.5px] font-semibold transition">
                    3 • Gewusst (${nextGoodDays}d)
                  </button>
                </div>
              </div>
            ` : `
              <div class="bg-[#161619] border border-[#25252D] rounded-[18px] p-10 text-center space-y-3">
                <p class="text-[14px] font-semibold text-[#F4F4F6]">
                  ${appState.flashcardDueFilterOnly ? 'Super! Alle heute fälligen Karteikarten in diesem Fach sind erledigt.' : 'Für dieses Fach sind noch keine Karteikarten vorhanden.'}
                </p>
                ${appState.flashcardDueFilterOnly ? `
                  <button type="button" onclick="toggleFlashcardDueFilter()"
                          class="px-4 py-2 rounded-full bg-[#3B82F6] text-white text-[12.5px] font-semibold">
                    Alle Karten anzeigen
                  </button>
                ` : ''}
              </div>
            `}

            <div class="mt-8 bg-[#161619] border border-[#24242B] rounded-[18px] p-5">
              <h2 class="text-[14.5px] font-semibold text-[#F4F4F6] mb-3">Eigene Merkzettel</h2>
              <form onsubmit="addQuickNote(event)" class="flex flex-col sm:flex-row gap-2.5 mb-3">
                <select id="quick-note-subject" class="bg-[#111114] border border-[#2A2A32] rounded-[10px] px-3 py-2 text-[12.5px] text-[#E4E4E7] focus:outline-none">
                  ${COURSES.map(c => `<option value="${escapeHtml(c.title)}">${escapeHtml(c.title)}</option>`).join('')}
                </select>
                <input id="quick-note-text" type="text" placeholder="Wichtige Formel, Vokabel oder Paragraf festhalten..."
                       class="flex-1 bg-[#111114] border border-[#2A2A32] rounded-[10px] px-3.5 py-2 text-[12.5px] text-[#F4F4F6] placeholder-[#686870] focus:outline-none focus:border-[#3B82F6]" />
                <button type="submit" class="px-4 py-2 rounded-[10px] bg-[#3B82F6] hover:bg-[#2563EB] text-white text-[12.5px] font-semibold transition">
                  Speichern
                </button>
              </form>
              ${appState.quickNotes.length > 0 ? `
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 pt-2">
                  ${appState.quickNotes.map(n => `
                    <div class="bg-[#111114] border border-[#23232A] rounded-[11px] p-3 flex items-start justify-between gap-2">
                      <div>
                        <div class="text-[11px] font-semibold text-[#60A5FA] mb-1">${escapeHtml(n.subject)}</div>
                        <p class="text-[12.5px] text-[#D4D4D8] leading-relaxed">${escapeHtml(n.text)}</p>
                      </div>
                      <button onclick="deleteQuickNote('${n.id}')" class="text-[11px] text-[#78787F] hover:text-[#F87171] p-1">✕</button>
                    </div>
                  `).join('')}
                </div>
              ` : ''}
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 3D. CALENDAR VIEW
    // =========================================================================

    function renderCalendarView() {
      const monthNames = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
      const year = appState.calendarYear;
      const month = appState.calendarMonth;
      const firstDayRaw = new Date(year, month, 1).getDay();
      const startOffset = firstDayRaw === 0 ? 6 : firstDayRaw - 1;
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const daysHeader = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
      const todayIso = getTodayIsoKey();

      const subjectAccentMap = {
        Rechnungswesen: { hex: '#60A5FA', rgb: '59, 130, 246' },
        Gesprächsgestaltung: { hex: '#FB923C', rgb: '249, 115, 22' },
        Sozialkunde: { hex: '#C084FC', rgb: '168, 85, 247' },
        Englisch: { hex: '#F87171', rgb: '239, 68, 68' },
        'Kunden akquirieren und binden': { hex: '#34D399', rgb: '16, 185, 129' }
      };

      const filteredExams = [...appState.exams]
        .filter(e => appState.calendarSubjectFilter === 'ALL' || e.subject === appState.calendarSubjectFilter)
        .sort((a, b) => a.date.localeCompare(b.date));

      const slideClass = appState.calendarSlideDir === 'next' ? 'cal-month-slide-next'
        : appState.calendarSlideDir === 'prev' ? 'cal-month-slide-prev' : '';
      appState.calendarSlideDir = '';

      const getCountdownMeta = (isoDate) => {
        const now = new Date();
        now.setHours(0, 0, 0, 0);
        const target = new Date(isoDate + 'T00:00:00');
        const diff = Math.round((target - now) / (1000 * 60 * 60 * 24));
        const pct = diff <= 0 ? 100 : Math.max(12, Math.min(95, Math.round(100 - (diff / 30) * 100)));
        const label = diff < 0 ? 'Vorbei' : diff === 0 ? 'Heute' : diff === 1 ? '1d' : `${diff}d`;
        return { diff, pct, label };
      };

      const filterSubjects = ['ALL', ...COURSES.map(c => c.title)];

      return `
        <div class="flex-1 overflow-y-auto px-6 sm:px-9 py-7 max-w-6xl">
          <div class="flex items-center justify-between flex-wrap gap-4 mb-5">
            <div>
              <h1 class="text-[26px] font-bold text-[#F4F4F6] tracking-[-0.02em]">Klassenarbeiten &amp; Test-Kalender</h1>
              <p class="text-[13px] text-[#8E8E93] mt-0.5">Klicke auf einen Tag, um eine Prüfung einzutragen und Themen festzuhalten</p>
            </div>
            <button onclick="openAddExamModal()" class="dash-cta-pill px-4 py-2 rounded-full bg-[#3B82F6] hover:bg-[#2563EB] text-white text-[12.5px] font-semibold shadow-lg shadow-[#3B82F6]/20 transition">
              + Termin eintragen
            </button>
          </div>

          <div class="flex items-center gap-2 flex-wrap mb-5">
            ${filterSubjects.map(subj => {
              const active = appState.calendarSubjectFilter === subj;
              return `
                <button onclick="selectCalendarSubjectFilter('${subj}')"
                        class="px-3 py-1 rounded-full text-[12px] font-medium transition ${active ? 'bg-[#3B82F6] text-white' : 'bg-[#161619] border border-[#24242B] text-[#8E8E93] hover:text-white'}">
                  ${subj === 'ALL' ? 'Alle Fächer' : escapeHtml(subj)}
                </button>
              `;
            }).join('')}
          </div>

          <div class="grid grid-cols-1 xl:grid-cols-12 gap-6 items-start">
            <div onmousemove="handleCalendarGridMove(event, this)" class="xl:col-span-7 cal-matrix-shell cal-matrix-scanlines p-5">
              <div class="cal-grid-magnetic-glow absolute inset-0 pointer-events-none"></div>

              <div class="relative z-10 flex items-center justify-between mb-4">
                <h2 class="text-[16px] font-bold text-[#F4F4F6] tracking-[-0.01em]">${monthNames[month]} ${year}</h2>
                <div class="flex items-center gap-1.5">
                  <button onclick="changeCalendarMonth(-1)" class="px-2.5 py-1 rounded-[8px] bg-[#1E1E24] hover:bg-[#282830] border border-[#2C2C35] text-[12px] text-[#E4E4E7] transition">←</button>
                  <button onclick="appState.calendarMonth = new Date().getMonth(); appState.calendarYear = new Date().getFullYear(); appState.calendarSlideDir = 'next'; renderWorkspace();"
                          class="px-2.5 py-1 rounded-[8px] bg-[#1E1E24] hover:bg-[#282830] border border-[#2C2C35] text-[11.5px] font-medium text-[#60A5FA] transition">Heute</button>
                  <button onclick="changeCalendarMonth(1)" class="px-2.5 py-1 rounded-[8px] bg-[#1E1E24] hover:bg-[#282830] border border-[#2C2C35] text-[12px] text-[#E4E4E7] transition">→</button>
                </div>
              </div>

              <div class="relative z-10 grid grid-cols-7 gap-2 mb-2 text-center text-[11px] font-semibold uppercase tracking-wider text-[#7E7E87]">
                ${daysHeader.map(d => `<div class="py-1">${d}</div>`).join('')}
              </div>

              <div class="relative z-10 grid grid-cols-7 gap-2 ${slideClass}">
                ${Array.from({ length: startOffset }).map(() => `<div class="min-h-[78px] rounded-[13px] bg-[#131317]/40 border border-white/[0.02]"></div>`).join('')}
                ${Array.from({ length: daysInMonth }, (_, i) => {
                  const dayNum = i + 1;
                  const iso = `${year}-${String(month + 1).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}`;
                  const isToday = iso === todayIso;
                  const dayExams = filteredExams.filter(e => e.date === iso);
                  const waveIdx = Math.floor((startOffset + i) / 7) + ((startOffset + i) % 7);

                  return `
                    <div onclick="openAddExamModal('${iso}')" style="--wave: ${waveIdx};"
                         class="cal-day-tile ${isToday ? 'is-today' : ''} min-h-[78px] p-2 cursor-pointer flex flex-col justify-between">
                      <span class="cal-reticle cal-reticle-tl"></span>
                      <span class="cal-reticle cal-reticle-br"></span>
                      <div class="flex items-center justify-between">
                        <span class="relative inline-flex items-center justify-center w-6 h-6 rounded-full text-[11.5px] font-semibold ${isToday ? 'bg-[#3B82F6] text-white' : 'text-[#A1A1AA]'}">
                          ${isToday ? '<span class="cal-today-orbit"></span>' : ''}
                          ${dayNum}
                        </span>
                      </div>
                      <div class="mt-1 space-y-1">
                        ${dayExams.map(ex => {
                          const acc = subjectAccentMap[ex.subject] || { hex: '#60A5FA', rgb: '59, 130, 246' };
                          return `
                            <div onclick="event.stopPropagation(); openExamDetailModal('${ex.id}')"
                                 style="background: rgba(${acc.rgb}, 0.18); border-color: rgba(${acc.rgb}, 0.4); color: ${acc.hex};"
                                 class="px-1.5 py-0.5 rounded-[5px] border text-[9.5px] font-semibold truncate">
                              ${escapeHtml(ex.subject)}
                            </div>
                          `;
                        }).join('')}
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>

            <div class="xl:col-span-5 space-y-3.5">
              <div class="flex items-center justify-between">
                <h2 class="text-[15px] font-semibold text-[#F4F4F6]">Prüfungs-Fahrplan (${filteredExams.length})</h2>
              </div>

              ${filteredExams.length === 0 ? `
                <div class="exam-chrono-card p-6 text-center text-[13px] text-[#8E8E93]">
                  Keine Termine für diese Auswahl eingetragen. Klicke auf einen Kalendertag oder „+ Termin eintragen“.
                </div>
              ` : filteredExams.map((ex, idx) => {
                const acc = subjectAccentMap[ex.subject] || { hex: '#60A5FA', rgb: '59, 130, 246' };
                const cd = getCountdownMeta(ex.date);
                const r = 15, c = 2 * Math.PI * r, off = c - (cd.pct / 100) * c;
                const targetCourse = COURSES.find(course => course.title === ex.subject);

                return `
                  <div style="--stagger: ${idx}; --subj-hex: ${acc.hex}; --subj-rgb: ${acc.rgb};" class="exam-chrono-card p-4 pl-5">
                    <div class="exam-chrono-bar"></div>
                    <div class="flex items-start justify-between gap-3 mb-2">
                      <div>
                        <div class="flex items-center gap-2 flex-wrap mb-1">
                          <span style="color: ${acc.hex};" class="text-[12px] font-bold">${escapeHtml(ex.subject)}</span>
                          <span class="text-[10.5px] px-2 py-0.5 rounded bg-white/[0.06] text-[#D4D4D8]">${escapeHtml(ex.type)}</span>
                          <span class="text-[11.5px] font-medium text-[#8E8E93]">${formatGermanDate(ex.date)}</span>
                        </div>
                        <h3 class="text-[15px] font-bold text-[#F4F4F6]">${escapeHtml(ex.title)}</h3>
                      </div>

                      <div class="flex items-center gap-1.5 shrink-0">
                        <div class="relative w-10 h-10 flex items-center justify-center">
                          <svg class="w-full h-full -rotate-90" viewBox="0 0 38 38">
                            <circle cx="19" cy="19" r="${r}" fill="none" stroke="#23232B" stroke-width="3" />
                            <circle cx="19" cy="19" r="${r}" fill="none" stroke="${acc.hex}" stroke-width="3"
                                    stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" />
                          </svg>
                          <span class="absolute text-[9.5px] font-bold text-[#F4F4F6]">${cd.label}</span>
                        </div>
                        <button onclick="deleteExam('${ex.id}')" title="Termin löschen" class="text-[#78787F] hover:text-[#F87171] text-[12px] p-1">✕</button>
                      </div>
                    </div>

                    <div class="bg-[#101014] border border-[#22222A] rounded-[10px] p-3 mb-3">
                      <div class="text-[10.5px] font-semibold uppercase tracking-wider mb-1" style="color: ${acc.hex};">Was kommt dran?</div>
                      <p class="text-[12.5px] text-[#C4C4CC] leading-relaxed whitespace-pre-line">${escapeHtml(ex.topics)}</p>
                    </div>

                    <div class="flex items-center justify-between gap-2 flex-wrap">
                      ${targetCourse ? `
                        <button onclick="openSubjectBoard('${targetCourse.id}')" style="color: ${acc.hex};" class="text-[12px] font-semibold hover:underline inline-flex items-center gap-1">
                          Fach jetzt üben →
                        </button>
                      ` : '<span></span>'}
                      <button onclick="openExamSimSetupModal('${targetCourse ? targetCourse.id : 'ALL'}')"
                              class="px-3 py-1 rounded-full bg-[#3B82F6]/15 hover:bg-[#3B82F6]/25 border border-[#3B82F6]/30 text-[11.5px] font-semibold text-[#60A5FA] transition">
                        Prüfung simulieren →
                      </button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 3E. REPORTS VIEW
    // =========================================================================

    let shouldAnimateReports = true;

    function toggleReportSubjectExpand(courseId) {
      const scroller = document.getElementById('reports-scroll-container');
      const savedScrollTop = scroller ? scroller.scrollTop : 0;
      shouldAnimateReports = false;
      appState.expandedReportSubjectId = appState.expandedReportSubjectId === courseId ? null : courseId;
      renderWorkspace();
      const restoredScroller = document.getElementById('reports-scroll-container');
      if (restoredScroller) {
        restoredScroller.scrollTop = savedScrollTop;
      }
    }

    function renderReportsView() {
      const animateReports = shouldAnimateReports;
      const repAnim = animateReports ? 'rep-anim' : '';
      shouldAnimateReports = false;

      const totalCards = COURSES.reduce((s, c) => s + c.cards.length, 0);
      const doneCards = COURSES.reduce((s, c) => s + c.cards.filter(m => m.column === 'completed').length, 0);
      const totalQuestionsDone = COURSES.reduce((s, c) => s + c.cards.reduce((a, m) => a + m.completedSteps, 0), 0);
      const totalQuestionsAll = COURSES.reduce((s, c) => s + c.cards.reduce((a, m) => a + m.totalSteps, 0), 0);
      const questionsPct = totalQuestionsAll > 0 ? Math.round((totalQuestionsDone / totalQuestionsAll) * 100) : 0;
      const modulesPct = totalCards > 0 ? Math.round((doneCards / totalCards) * 100) : 0;

      const masteredCards = appState.flashcards.filter(f => f.mastered).length;
      const totalFlashcards = appState.flashcards.length;
      const flashcardsPct = totalFlashcards > 0 ? Math.round((masteredCards / totalFlashcards) * 100) : 0;
      const dailyPct = appState.dailyGoal > 0 ? Math.min(100, Math.round((appState.completedToday / appState.dailyGoal) * 100)) : 0;

      const subjectThemes = {
        rechnungswesen: { hex: '#60A5FA', rgb: '59, 130, 246', short: 'RW' },
        gespraechsgestaltung: { hex: '#FB923C', rgb: '249, 115, 22', short: 'GG' },
        sozialkunde: { hex: '#C084FC', rgb: '168, 85, 247', short: 'SK' },
        englisch: { hex: '#F87171', rgb: '239, 68, 68', short: 'EN' },
        kundenbindung: { hex: '#34D399', rgb: '16, 185, 129', short: 'KAB' }
      };

      const subjectMetrics = COURSES.map(c => {
        const done = c.cards.reduce((s, m) => s + m.completedSteps, 0);
        const total = c.cards.reduce((s, m) => s + m.totalSteps, 0);
        const pct = total > 0 ? Math.round((done / total) * 100) : 0;
        const completedMods = c.cards.filter(m => m.column === 'completed').length;
        const theme = subjectThemes[c.id] || subjectThemes.rechnungswesen;
        return { id: c.id, title: c.title, short: theme.short, hex: theme.hex, rgb: theme.rgb, done, total, pct, completedMods, totalMods: c.cards.length, cards: c.cards };
      });

      const allModules = COURSES.flatMap(c => c.cards.map(m => ({ ...m, courseTitle: c.title, courseId: c.id })));
      const unfinishedModules = allModules.filter(m => m.completedSteps < m.totalSteps).sort((a, b) => a.completedSteps - b.completedSteps);
      const focusModule = unfinishedModules[0] || allModules[0] || null;

      const cx = 150, cy = 150, maxR = 94;
      const axisCount = subjectMetrics.length;
      const radarVertices = subjectMetrics.map((sm, idx) => {
        const angle = (-Math.PI / 2) + (idx * 2 * Math.PI) / axisCount;
        const effectiveRatio = Math.max(0.14, sm.pct / 100);
        return {
          ...sm, angle,
          vx: cx + Math.cos(angle) * (maxR * effectiveRatio),
          vy: cy + Math.sin(angle) * (maxR * effectiveRatio),
          lx: cx + Math.cos(angle) * (maxR + 24),
          ly: cy + Math.sin(angle) * (maxR + 24),
          ox: cx + Math.cos(angle) * maxR,
          oy: cy + Math.sin(angle) * maxR
        };
      });

      const polygonPoints = radarVertices.map(v => `${v.vx.toFixed(1)},${v.vy.toFixed(1)}`).join(' ');
      const ringConfigs = [
        { label: 'Fragen-Beherrschung', value: `${totalQuestionsDone}/${totalQuestionsAll}`, pct: questionsPct, color: '#3B82F6', sub: 'Richtig beantwortet' },
        { label: 'Module Done', value: `${doneCards}/${totalCards}`, pct: modulesPct, color: '#10B981', sub: '30/30 erreicht' },
        { label: 'Karten-Retention', value: `${masteredCards}/${totalFlashcards}`, pct: flashcardsPct, color: '#A855F7', sub: 'Als gewusst markiert' },
        { label: 'Tagesziel Heute', value: `${appState.completedToday}/${appState.dailyGoal}`, pct: dailyPct, color: '#F59E0B', sub: 'Aktive Einheiten' }
      ];

      const isLight = appState.appTheme === 'daylight';
      const ringTrackColor = isLight ? '#E2E8F0' : '#22222B';
      const radarGridStroke = isLight ? '#CBD5E1' : '#282834';

      return `
        <div id="reports-scroll-container" class="flex-1 overflow-y-auto px-6 sm:px-9 py-7">
          <div class="max-w-[1140px]">
            <div class="flex items-center justify-between flex-wrap gap-4 mb-6">
              <div>
                <div class="inline-flex items-center gap-2 px-2.5 py-0.5 rounded-full bg-[#3B82F6]/12 border border-[#3B82F6]/25 text-[11px] font-semibold text-[#60A5FA] mb-1.5">
                  <span>● LIVE LERN-TELEMETRIE</span>
                </div>
                <h1 class="text-[26px] font-bold text-[#F4F4F6] tracking-[-0.02em]">Kompetenz-Observatorium &amp; Reports</h1>
                <p class="text-[13px] text-[#8E8E93] mt-0.5">Fortschrittsanalyse über alle ${COURSES.length} Fächer, 20 Lernmodule und dein Karteikarten-Deck</p>
              </div>

              ${focusModule ? `
                <button onclick="openQuizPopup('${focusModule.id}')"
                        class="dash-cta-pill inline-flex items-center gap-2.5 px-4 py-2.5 rounded-full bg-[#3B82F6] hover:bg-[#2563EB] text-white text-[12.5px] font-semibold shadow-lg shadow-[#3B82F6]/25 transition">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" class="shrink-0">
                    <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2.5C6.75329 2.5 2.5 6.75329 2.5 12C2.5 17.2467 6.75329 21.5 12 21.5C17.2467 21.5 21.5 17.2467 21.5 12C21.5 6.75329 17.2467 2.5 12 2.5ZM6.2 12C6.2 8.79675 8.79675 6.2 12 6.2C15.2033 6.2 17.8 8.79675 17.8 12C17.8 15.2033 15.2033 17.8 12 17.8C8.79675 17.8 6.2 15.2033 6.2 12ZM12 8.8C10.2327 8.8 8.8 10.2327 8.8 12C8.8 13.7673 10.2327 15.2 12 15.2C13.7673 15.2 15.2 13.7673 15.2 12C15.2 10.2327 13.7673 8.8 12 8.8Z" />
                  </svg>
                  <span>Schwachstelle trainieren: ${escapeHtml(focusModule.title)}</span>
                  <span>→</span>
                </button>
              ` : ''}
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
              ${ringConfigs.map((rc, idx) => {
                const r = 24, circ = 2 * Math.PI * r, offset = circ - (rc.pct / 100) * circ;
                return `
                  <div style="--stagger: ${idx};" class="report-telemetry-card ${repAnim} p-4 flex items-center gap-4">
                    <div class="relative w-16 h-16 shrink-0 flex items-center justify-center">
                      <svg class="w-full h-full -rotate-90" viewBox="0 0 60 60">
                        <circle cx="30" cy="30" r="${r}" fill="none" stroke="${ringTrackColor}" stroke-width="5" />
                        <circle cx="30" cy="30" r="${r}" fill="none" stroke="${rc.color}" stroke-width="5"
                                stroke-linecap="round" stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}" />
                      </svg>
                      <span class="absolute text-[12.5px] font-bold text-[#F4F4F6]">${rc.pct}%</span>
                    </div>
                    <div class="min-w-0">
                      <div class="text-[11.5px] font-medium text-[#8E8E93] truncate">${rc.label}</div>
                      <div class="text-[20px] font-bold text-[#F4F4F6] tracking-[-0.02em] leading-tight mt-0.5">${rc.value}</div>
                      <div class="text-[11px] text-[#7E7E87] mt-0.5 truncate">${rc.sub}</div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
              <div style="--stagger: 4;" class="lg:col-span-5 report-telemetry-card ${repAnim} p-5 sm:p-6">
                <div class="flex items-center justify-between mb-2">
                  <div>
                    <h2 class="text-[15.5px] font-bold text-[#F4F4F6]">5-Fächer Kompetenz-Netz</h2>
                    <p class="text-[11.5px] text-[#8E8E93]">Klicke auf einen Achsenpunkt, um das Fach zu öffnen</p>
                  </div>
                  <span class="px-2.5 py-1 rounded-full bg-[#3B82F6]/15 text-[11px] font-semibold text-[#60A5FA]">Radar</span>
                </div>

                <div class="w-full flex items-center justify-center my-2">
                  <svg viewBox="0 0 300 300" class="w-full max-w-[300px] h-auto overflow-visible">
                    <defs>
                      <radialGradient id="radarPolyGrad" cx="50%" cy="50%" r="55%">
                        <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.45" />
                        <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.14" />
                      </radialGradient>
                    </defs>
                    ${[0.25, 0.5, 0.75, 1].map(scale => {
                      const pts = radarVertices.map(v => `${(cx + Math.cos(v.angle) * (maxR * scale)).toFixed(1)},${(cy + Math.sin(v.angle) * (maxR * scale)).toFixed(1)}`).join(' ');
                      return `<polygon points="${pts}" fill="none" stroke="${radarGridStroke}" stroke-width="1" stroke-dasharray="${scale < 1 ? '2 2' : '0'}" />`;
                    }).join('')}
                    ${radarVertices.map(v => `<line x1="${cx}" y1="${cy}" x2="${v.ox.toFixed(1)}" y2="${v.oy.toFixed(1)}" stroke="${radarGridStroke}" stroke-width="1" />`).join('')}
                    <g class="radar-sweep-cone">
                      <line x1="${cx}" y1="${cy}" x2="${cx}" y2="${cy - maxR}" stroke="#60A5FA" stroke-opacity="0.45" stroke-width="1.5" />
                    </g>
                    <polygon points="${polygonPoints}" fill="url(#radarPolyGrad)" stroke="#60A5FA" stroke-width="2.2" stroke-linejoin="round"
                             style="${animateReports ? '' : 'animation: none; opacity: 1;'}" class="radar-polygon-shape" />
                    ${radarVertices.map(v => `
                      <g class="cursor-pointer group" onclick="openSubjectBoard('${v.id}')">
                        <circle cx="${v.vx.toFixed(1)}" cy="${v.vy.toFixed(1)}" r="8" fill="${v.hex}" fill-opacity="0.24" />
                        <circle cx="${v.vx.toFixed(1)}" cy="${v.vy.toFixed(1)}" r="4.5" fill="${v.hex}" stroke="#FFFFFF" stroke-width="1.5" />
                        <text x="${v.lx.toFixed(1)}" y="${(v.ly - 3).toFixed(1)}" text-anchor="middle" fill="${v.hex}" font-size="11" font-weight="700" font-family="Inter, sans-serif">${v.short}</text>
                        <text x="${v.lx.toFixed(1)}" y="${(v.ly + 10).toFixed(1)}" text-anchor="middle" fill="${isLight ? '#475569' : '#9A9AA4'}" font-size="9.5" font-weight="600" font-family="Inter, sans-serif">${v.pct}%</text>
                      </g>
                    `).join('')}
                  </svg>
                </div>

                <div class="pt-3 border-t border-[#24242C] flex flex-wrap gap-2 justify-center">
                  ${subjectMetrics.map(sm => `
                    <button onclick="openSubjectBoard('${sm.id}')"
                            class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-white/[0.04] hover:bg-white/[0.09] text-[11px] text-[#A1A1AA] transition">
                      <span class="w-2 h-2 rounded-full" style="background: ${sm.hex};"></span>
                      <span>${sm.short}: <strong class="text-[#F4F4F6]">${sm.pct}%</strong></span>
                    </button>
                  `).join('')}
                </div>
              </div>

              <div class="lg:col-span-7 space-y-3.5">
                <div class="flex items-center justify-between">
                  <h2 class="text-[15.5px] font-bold text-[#F4F4F6]">Fächer-Spektrum &amp; Modul-Equalizer</h2>
                  <span class="text-[12px] text-[#8E8E93]">Klicke ein Fach für Modul-Details</span>
                </div>

                ${subjectMetrics.map((sm, sIdx) => {
                  const isExpanded = appState.expandedReportSubjectId === sm.id || (sIdx === 0 && appState.expandedReportSubjectId === null);
                  return `
                    <div style="--stagger: ${sIdx + 5}; --subj-rgb: ${sm.rgb};" class="report-subject-accordion ${repAnim} p-4 sm:p-5">
                      <div onclick="toggleReportSubjectExpand('${sm.id}')" class="flex items-center justify-between gap-4 cursor-pointer">
                        <div class="flex items-center gap-3 min-w-0">
                          <span class="w-3 h-3 rounded-full shrink-0" style="background: ${sm.hex}; box-shadow: 0 0 12px ${sm.hex};"></span>
                          <div class="min-w-0">
                            <div class="text-[15px] font-bold text-[#F4F4F6] truncate">${escapeHtml(sm.title)}</div>
                            <div class="text-[11.5px] text-[#8E8E93]">${sm.completedMods} von ${sm.totalMods} Modulen Done • ${sm.done}/${sm.total} Fragen</div>
                          </div>
                        </div>

                        <div class="flex items-center gap-3 shrink-0">
                          <div class="hidden sm:flex items-end gap-1 h-6 px-2 py-1 rounded-lg bg-white/[0.03]">
                            ${sm.cards.map((m, mIdx) => {
                              const mPct = m.totalSteps > 0 ? Math.max(18, Math.round((m.completedSteps / m.totalSteps) * 100)) : 18;
                              return `<span style="--eq-idx: ${mIdx}; height: ${mPct}%; background: ${m.completedSteps > 0 ? sm.hex : '#32323C'}; ${animateReports ? '' : 'animation: none; opacity: 1;'}" class="eq-bar-fill w-1.5 rounded-t-sm"></span>`;
                            }).join('')}
                          </div>
                          <span class="text-[14px] font-bold" style="color: ${sm.hex};">${sm.pct}%</span>
                          <span class="text-[12px] text-[#8E8E93] transition-transform duration-200 ${isExpanded ? 'rotate-180' : ''}">▼</span>
                        </div>
                      </div>

                      <div class="w-full h-1.5 bg-[#111114] rounded-full overflow-hidden mt-3">
                        <div class="h-full rounded-full transition-all duration-500" style="width: ${sm.pct}%; background: ${sm.hex};"></div>
                      </div>

                      ${isExpanded ? `
                        <div class="mt-4 pt-3.5 border-t border-[#24242C] grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                          ${sm.cards.map(mod => {
                            const modPct = mod.totalSteps > 0 ? Math.round((mod.completedSteps / mod.totalSteps) * 100) : 0;
                            const isModDone = mod.completedSteps >= mod.totalSteps;
                            return `
                              <div onclick="openQuizPopup('${mod.id}')"
                                   class="report-sub-panel bg-[#111114] hover:bg-[#191920] border border-[#24242D] rounded-[11px] p-3 cursor-pointer transition flex flex-col justify-between gap-2">
                                <div class="flex items-start justify-between gap-2">
                                  <span class="text-[12.5px] font-semibold text-[#F4F4F6] leading-snug">${escapeHtml(mod.title)}</span>
                                  <span class="text-[11px] font-bold shrink-0 ${isModDone ? 'text-[#34D399]' : 'text-[#8E8E93]'}">${mod.completedSteps}/${mod.totalSteps}</span>
                                </div>
                                <div class="flex items-center justify-between gap-2">
                                  <div class="flex-1 h-1.5 bg-[#1E1E26] rounded-full overflow-hidden">
                                    <div class="h-full rounded-full" style="width: ${modPct}%; background: ${isModDone ? '#10B981' : sm.hex};"></div>
                                  </div>
                                  <span class="text-[10.5px] font-semibold" style="color: ${sm.hex};">Üben →</span>
                                </div>
                              </div>
                            `;
                          }).join('')}
                        </div>
                      ` : ''}
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 3F. SETTINGS VIEW
    // =========================================================================

    function syncGoalSlider(val) {
      const parsed = Math.max(1, Math.min(30, parseInt(val || '6', 10)));
      const slider = document.getElementById('daily-goal-slider');
      const numInput = document.getElementById('daily-goal-input');
      const badge = document.getElementById('daily-goal-live-badge');
      if (slider) slider.value = parsed;
      if (numInput) numInput.value = parsed;
      if (badge) badge.textContent = `${parsed} Einheiten / Tag`;
    }

    function renderSettingsView() {
      const cloudReady = !!(window.StudyVCloudBridge && window.StudyVCloudBridge.ready);

      return `
        <div class="flex-1 overflow-y-auto px-6 sm:px-9 pt-7 pb-14">

            <div class="space-y-5">

    function shuffleQuestionOptions(rawQ, cardId, poolIndex) {
      const indexedOptions = rawQ.options.map((text, origIdx) => ({
        text,
        isCorrect: origIdx === rawQ.correctIndex
      }));
      for (let i = indexedOptions.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [indexedOptions[i], indexedOptions[j]] = [indexedOptions[j], indexedOptions[i]];
      }
      return {
        ...rawQ,
        cardId,
        poolIndex,
        options: indexedOptions.map(o => o.text),
        correctIndex: indexedOptions.findIndex(o => o.isCorrect)
      };
    }

    function buildQuizRound(cardId) {
      const pool = QUESTION_POOLS[cardId] || [];
      if (pool.length === 0) return [];
      const seenSet = new Set(appState.seenQuestionIds[cardId] || []);
      let unseen = pool.map((q, idx) => ({ ...q, poolIndex: idx })).filter(q => !seenSet.has(q.poolIndex));
      if (unseen.length < 6) {
        appState.seenQuestionIds[cardId] = [];
        unseen = pool.map((q, idx) => ({ ...q, poolIndex: idx }));
      }
      for (let i = unseen.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [unseen[i], unseen[j]] = [unseen[j], unseen[i]];
      }
      const selected = unseen.slice(0, Math.min(6, unseen.length));
      const updatedSeen = new Set(appState.seenQuestionIds[cardId] || []);
      selected.forEach(q => updatedSeen.add(q.poolIndex));
      appState.seenQuestionIds[cardId] = Array.from(updatedSeen);
      return selected.map(q => shuffleQuestionOptions(q, cardId, q.poolIndex));
    }

    function openQuizPopup(cardId) {
      const card = getCardById(cardId);
      if (!card) return;
      const questions = buildQuizRound(cardId);
      if (questions.length === 0) {
        openModuleDrawer(cardId);
        return;
      }

      if (appState.examTimerId) {
        clearInterval(appState.examTimerId);
        appState.examTimerId = null;
      }

      appState.activeQuizSession = {
        mode: 'module',
        cardId,
        questions,
        currentIndex: 0,
        selectedOption: null,
        showTip: false,
        correctCount: 0,
        finished: false
      };

      document.body.classList.add('quiz-open');
      const box = document.getElementById('quiz-popup-box');
      if (box) box.className = 'w-full max-w-[440px]';
      const overlay = document.getElementById('quiz-popup-overlay');
      if (overlay) {
        overlay.classList.remove('hidden');
        overlay.classList.add('flex');
      }
      renderQuizPopup(true);
    }

    function openMistakeTrainerQuiz() {
      const entries = Object.values(appState.wrongQuestions || {});
      if (entries.length === 0) {
        showToast('Aktuell sind keine offenen Fehlerfragen gespeichert!');
        return;
      }

      const questions = [];
      entries.forEach(entry => {
        const pool = QUESTION_POOLS[entry.cardId] || [];
        const rawQ = pool[entry.poolIndex];
        if (rawQ) {
          questions.push(shuffleQuestionOptions(rawQ, entry.cardId, entry.poolIndex));
        }
      });

      if (questions.length === 0) {
        appState.wrongQuestions = {};
        savePersistedState();
        showToast('Keine offenen Fehlerfragen gefunden.');
        return;
      }

      for (let i = questions.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [questions[i], questions[j]] = [questions[j], questions[i]];
      }

      if (appState.examTimerId) {
        clearInterval(appState.examTimerId);
        appState.examTimerId = null;
      }

      appState.activeQuizSession = {
        mode: 'mistakes',
        cardId: questions[0].cardId,
        questions: questions.slice(0, 12),
        currentIndex: 0,
        selectedOption: null,
        showTip: false,
        correctCount: 0,
        resolvedCount: 0,
        finished: false
      };

      document.body.classList.add('quiz-open');
      const box = document.getElementById('quiz-popup-box');
      if (box) box.className = 'w-full max-w-[440px]';
      const overlay = document.getElementById('quiz-popup-overlay');
      if (overlay) {
        overlay.classList.remove('hidden');
        overlay.classList.add('flex');
      }
      renderQuizPopup(true);
    }

    function startExamSimulation(event) {
      event.preventDefault();
      const subjectId = document.getElementById('exam-sim-subject')?.value || 'ALL';
      const count = parseInt(document.getElementById('exam-sim-count')?.value || '30', 10);
      const minutes = parseInt(document.getElementById('exam-sim-time')?.value || '30', 10);

      const targetCourses = subjectId === 'ALL' ? COURSES : COURSES.filter(c => c.id === subjectId);
      const allPool = [];
      targetCourses.forEach(course => {
        course.cards.forEach(card => {
          const qList = QUESTION_POOLS[card.id] || [];
          qList.forEach((rawQ, idx) => {
            allPool.push({ rawQ, cardId: card.id, poolIndex: idx, subjectTitle: course.title });
          });
        });
      });

      for (let i = allPool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [allPool[i], allPool[j]] = [allPool[j], allPool[i]];
      }

      const selected = allPool.slice(0, Math.min(count, allPool.length)).map(item => ({
        ...shuffleQuestionOptions(item.rawQ, item.cardId, item.poolIndex),
        subjectTitle: item.subjectTitle
      }));

      if (selected.length === 0) {
        showToast('Keine Prüfungsfragen verfügbar');
        return;
      }

      closeModal();
      if (appState.examTimerId) {
        clearInterval(appState.examTimerId);
        appState.examTimerId = null;
      }

      const examTitle = subjectId === 'ALL'
        ? 'IHK-Gesamtprüfung (Alle Fächer)'
        : `IHK-Klausur: ${targetCourses[0]?.title || ''}`;

      appState.activeQuizSession = {
        mode: 'exam',
        examTitle,
        cardId: selected[0].cardId,
        questions: selected,
        currentIndex: 0,
        selectedOption: null,
        showTip: false,
        correctCount: 0,
        examAnswers: [],
        remainingSeconds: minutes * 60,
        finished: false
      };

      document.body.classList.add('quiz-open');
      const box = document.getElementById('quiz-popup-box');
      if (box) box.className = 'w-full max-w-[540px]';
      const overlay = document.getElementById('quiz-popup-overlay');
      if (overlay) {
        overlay.classList.remove('hidden');
        overlay.classList.add('flex');
      }

      appState.examTimerId = setInterval(() => {
        const sess = appState.activeQuizSession;
        if (!sess || sess.mode !== 'exam' || sess.finished) {
          clearInterval(appState.examTimerId);
          appState.examTimerId = null;
          return;
        }
        if (sess.remainingSeconds > 1) {
          sess.remainingSeconds -= 1;
          const timerEl = document.getElementById('exam-live-timer');
          if (timerEl) timerEl.textContent = formatPomodoroTime(sess.remainingSeconds);
        } else {
          sess.remainingSeconds = 0;
          sess.finished = true;
          clearInterval(appState.examTimerId);
          appState.examTimerId = null;
          showToast('Prüfungszeit abgelaufen!');
          renderQuizPopup(false);
        }
      }, 1000);

      renderQuizPopup(true);
    }

    function getIhkGradeInfo(pct) {
      if (pct >= 92) return { grade: '1 (Sehr gut)', passed: true, color: '#34D399' };
      if (pct >= 81) return { grade: '2 (Gut)', passed: true, color: '#60A5FA' };
      if (pct >= 67) return { grade: '3 (Befriedigend)', passed: true, color: '#93C5FD' };
      if (pct >= 50) return { grade: '4 (Ausreichend)', passed: true, color: '#FBBF24' };
      if (pct >= 30) return { grade: '5 (Mangelhaft)', passed: false, color: '#FB923C' };
      return { grade: '6 (Ungenügend)', passed: false, color: '#F87171' };
    }

    function handleQuizBackdropClick() {
      const session = appState.activeQuizSession;
      if (session && session.mode === 'exam' && !session.finished) return;
      closeQuizPopup();
    }

    function closeQuizPopup() {
      if (appState.examTimerId) {
        clearInterval(appState.examTimerId);
        appState.examTimerId = null;
      }
      appState.activeQuizSession = null;
      document.body.classList.remove('quiz-open');
      const box = document.getElementById('quiz-popup-box');
      if (box) box.className = 'w-full max-w-[440px]';
      const overlay = document.getElementById('quiz-popup-overlay');
      if (overlay) {
        overlay.classList.add('hidden');
        overlay.classList.remove('flex');
      }
      if (saveDebounceTimer) savePersistedState();
      if (quizWorkspaceDirty) {
        quizWorkspaceDirty = false;
        shouldAnimateDashboard = false;
        shouldAnimateReports = false;
        renderWorkspace();
      }
    }

    function selectQuizOption(optionIdx) {
      const session = appState.activeQuizSession;
      if (!session || session.selectedOption !== null) return;
      session.selectedOption = optionIdx;
      const currentQ = session.questions[session.currentIndex];
      const isCorrect = optionIdx === currentQ.correctIndex;
      const qCardId = currentQ.cardId || session.cardId;

      if (session.mode === 'exam') {
        session.examAnswers[session.currentIndex] = {
          question: currentQ.question,
          selectedText: currentQ.options[optionIdx],
          correctText: currentQ.options[currentQ.correctIndex],
          explanation: currentQ.explanation,
          isCorrect
        };
        if (isCorrect) {
          session.correctCount += 1;
          awardXp(10);
        } else {
          recordMistakeQuestion(qCardId, currentQ.poolIndex);
        }
        quizWorkspaceDirty = true;
        scheduleSavePersistedState();
        if (session.currentIndex + 1 < session.questions.length) {
          session.currentIndex += 1;
          session.selectedOption = null;
        } else {
          session.finished = true;
          if (appState.examTimerId) {
            clearInterval(appState.examTimerId);
            appState.examTimerId = null;
          }
          playStudySound('levelup');
        }
        renderQuizPopup(false);
        return;
      }

      if (isCorrect) {
        session.correctCount += 1;
        playStudySound('correct');
        const card = getCardById(qCardId);
        let moduleCompletedNow = false;
        if (card) {
          const wasCompleted = card.completedSteps >= card.totalSteps;
          card.completedSteps = Math.min(card.totalSteps, card.completedSteps + 1);
          if (card.completedSteps >= card.totalSteps) {
            card.column = 'completed';
            if (!wasCompleted) moduleCompletedNow = true;
          }
        }
        if (session.mode === 'mistakes') {
          const resolved = resolveMistakeQuestionHit(qCardId, currentQ.poolIndex);
          if (resolved) session.resolvedCount = (session.resolvedCount || 0) + 1;
          awardXp(resolved ? 25 : 15);
        } else {
          awardXp(moduleCompletedNow ? 110 : 10);
        }
        recordLessonCompletion(1);
        quizWorkspaceDirty = true;
        scheduleSavePersistedState();
        triggerAutoSync();
      } else {
        playStudySound('wrong');
        recordMistakeQuestion(qCardId, currentQ.poolIndex);
        quizWorkspaceDirty = true;
        scheduleSavePersistedState();
        triggerAutoSync();
      }
      renderQuizPopup(false);
    }

    function toggleQuizTip() {
      const session = appState.activeQuizSession;
      if (!session || session.mode === 'exam') return;
      session.showTip = !session.showTip;
      renderQuizPopup(false);
    }

    function skipQuizQuestion() {
      const session = appState.activeQuizSession;
      if (!session) return;
      if (session.mode === 'exam') {
        const currentQ = session.questions[session.currentIndex];
        session.examAnswers[session.currentIndex] = {
          question: currentQ.question,
          selectedText: 'Übersprungen',
          correctText: currentQ.options[currentQ.correctIndex],
          explanation: currentQ.explanation,
          isCorrect: false
        };
      }
      if (session.currentIndex + 1 < session.questions.length) {
        session.currentIndex += 1;
        session.selectedOption = null;
        session.showTip = false;
      } else {
        session.finished = true;
        if (appState.examTimerId) {
          clearInterval(appState.examTimerId);
          appState.examTimerId = null;
        }
      }
      renderQuizPopup(false);
    }

    function nextQuizQuestion() {
      const session = appState.activeQuizSession;
      if (!session) return;
      if (session.currentIndex + 1 < session.questions.length) {
        session.currentIndex += 1;
        session.selectedOption = null;
        session.showTip = false;
      } else {
        session.finished = true;
      }
      renderQuizPopup(false);
    }

    function renderQuizPopup(isInitialOpen = false) {
      const box = document.getElementById('quiz-popup-box');
      const session = appState.activeQuizSession;
      if (!box || !session) return;

      const totalQ = session.questions.length;
      const entryAnim = isInitialOpen ? 'animate-scale-in' : '';

        if (session.mode === 'exam') {
          const pct = totalQ > 0 ? Math.round((session.correctCount / totalQ) * 100) : 0;
          const ihk = getIhkGradeInfo(pct);

          box.innerHTML = `
            <div class="quiz-glass-card p-6 sm:p-7 max-h-[85vh] overflow-y-auto"
                 style="--quiz-ambient-glow: radial-gradient(95% 65% at 50% 0%, ${ihk.passed ? 'rgba(16, 185, 129, 0.28)' : 'rgba(239, 68, 68, 0.28)'} 0%, rgba(19, 21, 20, 0) 72%);">
              <div class="text-center mb-5">
                <span class="px-3 py-1 rounded-full text-[11px] font-bold uppercase tracking-wider ${ihk.passed ? 'bg-[#10B981]/20 text-[#34D399]' : 'bg-[#EF4444]/20 text-[#FCA5A5]'}">

                    <div class="text-[18px] font-extrabold text-[#F4F4F6]">${session.correctCount}/${totalQ} (${pct}%)</div>
                  </div>
                </div>
              </div>

              ${wrongList.length > 0 ? `
                <div class="mb-5 space-y-2.5">
                  <div class="text-[12px] font-bold text-[#FCA5A5]">Falsch beantwortete Fragen (${wrongList.length}):</div>
                  <div class="max-h-[240px] overflow-y-auto space-y-2 pr-1">
                    ${wrongList.map(w => `
                      <div class="p-3 rounded-[12px] bg-white/[0.04] border border-white/[0.08] text-[12px]">
                        <div class="font-semibold text-[#F4F4F6] mb-1">${escapeHtml(w.question)}</div>
                        <div class="text-[#FCA5A5]">Deine Wahl: ${escapeHtml(w.selectedText)}</div>
                        <div class="text-[#6EE7B7] font-medium mt-0.5">Richtig: ${escapeHtml(w.correctText)}</div>
                      </div>
                    `).join('')}
                  </div>
                </div>
              ` : `
                <div class="mb-5 p-3.5 rounded-[12px] bg-[#10B981]/15 border border-[#10B981]/30 text-center text-[13px] text-[#6EE7B7]">
                  Fehlerfreie Leistung! Alle Prüfungsfragen richtig beantwortet.
                </div>
              `}

              <div class="flex items-center justify-center gap-2.5">
                <button onclick="closeQuizPopup(); openExamSimSetupModal();"
                        class="px-4 py-2.5 rounded-full bg-[#3B82F6] hover:bg-[#2563EB] text-white text-[13px] font-semibold transition">
                  Neue Prüfung
                </button>
                <button onclick="closeQuizPopup()"
                        class="px-5 py-2.5 rounded-full bg-[#222228] hover:bg-[#2B2B33] text-[#E4E4E7] text-[13px] font-medium transition">
                  Schließen
                </button>
              </div>
            </div>
          `;
          return;
        }

        const isDone = card && card.completedSteps >= card.totalSteps;
        box.innerHTML = `
          <div class="quiz-glass-card p-6 sm:p-7 text-center"
               style="--quiz-ambient-glow: radial-gradient(95% 65% at 50% 0%, rgba(16, 185, 129, 0.28) 0%, rgba(19, 21, 20, 0) 72%);">
            <div class="w-12 h-12 rounded-full bg-[#10B981]/20 border border-[#10B981]/40 text-[#34D399] flex items-center justify-center mx-auto mb-3 text-[20px] font-bold">
              ✓
            </div>
            <h3 class="text-[20px] font-bold text-[#F4F4F6] mb-1">
              ${session.mode === 'mistakes' ? 'Fehler-Training beendet!' : 'Runde abgeschlossen!'}
            </h3>
            <p class="text-[13.5px] text-[#9A9AA4] mb-4">
              Du hast <strong class="text-[#F4F4F6]">${session.correctCount} von ${totalQ}</strong> Fragen richtig beantwortet.
              ${session.mode === 'mistakes'
                ? `<br/><strong class="text-[#34D399]">${session.resolvedCount || 0} Fehlerfragen</strong> wurden 2x richtig gelöst und aus dem Fehler-Pool entfernt!`
                : (card ? `<br/>Gesamtstand in diesem Modul: <strong class="text-[#60A5FA]">${card.completedSteps} / ${card.totalSteps}</strong> ${isDone ? '— Modul abgeschlossen (Done)!' : ''}` : '')}
            </p>
            <div class="flex items-center justify-center gap-2.5 flex-wrap">
              <button onclick="${session.mode === 'mistakes' ? 'openMistakeTrainerQuiz()' : `openQuizPopup('${session.cardId}')`}"
                      class="px-4 py-2.5 rounded-full bg-[#3B82F6] hover:bg-[#2563EB] text-white text-[13px] font-semibold transition">
                ${session.mode === 'mistakes' ? 'Weitere Fehler üben' : 'Nächste 6 Fragen'}

              <button onclick="closeQuizPopup()"
                      class="px-4 py-2.5 rounded-full bg-[#222228] hover:bg-[#2B2B33] text-[#E4E4E7] text-[13px] font-medium transition">
                Schließen
              </button>
            </div>
          </div>
        `;
        return;
      }

      const q = session.questions[session.currentIndex];
      const isExam = session.mode === 'exam';
      const hasAnswered = !isExam && session.selectedOption !== null;
      const isCorrect = session.selectedOption === q.correctIndex;
      const ambientGlow = isExam
        ? 'radial-gradient(95% 65% at 50% 0%, rgba(245, 158, 11, 0.2) 0%, rgba(19, 21, 20, 0) 72%)'
        : !hasAnswered
          ? 'radial-gradient(95% 65% at 50% 0%, rgba(59, 130, 246, 0.22) 0%, rgba(19, 21, 20, 0) 72%)'
          : isCorrect
            ? 'radial-gradient(95% 65% at 50% 0%, rgba(16, 185, 129, 0.28) 0%, rgba(19, 21, 20, 0) 72%)'
            : 'radial-gradient(95% 65% at 50% 0%, rgba(239, 68, 68, 0.28) 0%, rgba(19, 21, 20, 0) 72%)';

      box.innerHTML = `
        <div class="quiz-glass-card p-6 sm:p-7 ${entryAnim}" style="--quiz-ambient-glow: ${ambientGlow};">

              </span>
              ${session.mode === 'mistakes' ? `<span class="px-2.5 py-0.5 rounded-full bg-[#EF4444]/20 text-[#FCA5A5] text-[10.5px] font-semibold">Fehler-Trainer</span>` : ''}
            </div>
            <div class="flex items-center gap-2">
              ${isExam ? `
                <span id="exam-live-timer" class="px-3 py-1 rounded-full bg-[#F59E0B]/20 border border-[#F59E0B]/40 font-mono text-[12px] font-bold text-[#FBBF24]">
                  ${formatPomodoroTime(session.remainingSeconds)}
                </span>
              ` : `
                ${card ? `<span class="text-[11.5px] font-semibold text-[#60A5FA]">${card.completedSteps}/${card.totalSteps}</span>` : ''}
                <button onclick="closeQuizPopup(); openModuleDrawer('${q.cardId || session.cardId}')"
                        class="px-2.5 py-1 rounded-full bg-white/[0.06] hover:bg-white/[0.12] text-[11px] font-medium text-[#D4D4D8] transition">
                  Lernstoff
                </button>
              `}
              <button onclick="closeQuizPopup()" class="w-7 h-7 rounded-full bg-white/[0.06] hover:bg-white/[0.14] text-[#9A9AA4] hover:text-white flex items-center justify-center text-[13px] transition">
                ✕
              </button>
            </div>
          </div>

          <div class="flex items-center gap-1.5 mb-5">
            ${session.questions.map((_, idx) => `
              <div class="h-1 flex-1 rounded-full ${idx < session.currentIndex ? 'bg-[#10B981]' : idx === session.currentIndex ? 'bg-[#3B82F6]' : 'bg-white/[0.12]'}"></div>
            `).join('')}
          </div>

          <h3 class="text-[16.5px] sm:text-[17.5px] font-bold text-[#F4F4F6] leading-[1.4] mb-4">
            ${escapeHtml(q.question)}
          </h3>

          <div class="space-y-2.5 mb-4">
            ${q.options.map((opt, idx) => {
              let rowClass = 'bg-white/[0.04] hover:bg-white/[0.08] border-white/[0.09] text-[#E4E4E7]';
              let iconHtml = `<span class="w-5 h-5 rounded-full border border-white/20 text-[11px] flex items-center justify-center shrink-0 text-[#9A9AA4]">${idx + 1}</span>`;

              if (hasAnswered) {

                } else if (idx === session.selectedOption) {
                  rowClass = 'bg-[#EF4444]/20 border-[#EF4444]/60 text-[#FCA5A5] font-semibold';
                  iconHtml = `<span class="w-5 h-5 rounded-full bg-[#EF4444] text-white text-[11px] font-bold flex items-center justify-center shrink-0">✕</span>`;

              return `

          ${hasAnswered ? `
            <div class="mb-4 p-3.5 rounded-[13px] border text-[12.5px] leading-relaxed ${isCorrect ? 'bg-[#10B981]/12 border-[#10B981]/30 text-[#A7F3D0]' : 'bg-[#EF4444]/12 border-[#EF4444]/30 text-[#FECACA]'}">

              ${escapeHtml(q.explanation)}

          <div class="flex items-center justify-between pt-2 border-t border-white/[0.08]">
            ${isExam ? `
              <span class="text-[11.5px] text-[#8E8E93]">Prüfungsmodus • Tasten 1–4</span>
            ` : `
              <button type="button" onclick="toggleQuizTip()"
                      class="px-3.5 py-2 rounded-full bg-white/[0.06] hover:bg-white/[0.12] text-[12.5px] font-medium text-[#FBBF24] transition">
                Tipp (T)
              </button>
            `}

            ${hasAnswered ? `
              <button type="button" onclick="nextQuizQuestion()"
                      class="px-5 py-2 rounded-full bg-[#3B82F6] hover:bg-[#2563EB] text-white text-[13px] font-semibold transition">
                ${session.currentIndex + 1 < totalQ ? 'Weiter →' : 'Auswertung →'}
              </button>
            ` : `
              <button type="button" onclick="skipQuizQuestion()"
                      class="px-4 py-2 rounded-full bg-white/[0.06] hover:bg-white/[0.12] text-[12.5px] font-medium text-[#A1A1AA] hover:text-white transition">
                Überspringen →
              </button>
            `}
          </div>
        </div>
      `;
    }

    function openModal(html) {
      const overlay = document.getElementById('modal-overlay');
      const content = document.getElementById('modal-content');
      if (!overlay || !content) return;
      content.innerHTML = html;
      overlay.classList.remove('hidden');
      overlay.classList.add('flex');
    }

    function closeModal() {
      const overlay = document.getElementById('modal-overlay');
      const box = document.getElementById('modal-box');
      if (box) {
        box.className = 'w-full max-w-[520px] bg-[#18181B] border border-[#2A2A30] rounded-[14px] shadow-2xl overflow-hidden animate-scale-in';
      }
      if (!overlay) return;
      overlay.classList.add('hidden');
      overlay.classList.remove('flex');
    }

    function highlightSearchMatch(text, query) {
      const safe = escapeHtml(text || '');
      if (!query) return safe;
      const escapedQ = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      return safe.replace(new RegExp(`(${escapedQ})`, 'gi'), '<mark class="bg-[#3B82F6]/30 text-[#93C5FD] rounded px-0.5">$1</mark>');
    }

    function renderSearchResults(query) {
      const q = query.trim().toLowerCase();
      const results = [];

      if (!q) {
        COURSES.forEach(course => {
          course.cards.forEach(card => {
            results.push({ kind: 'module', badge: 'Modul', title: card.title, sub: `${course.title} • ${card.completedSteps}/${card.totalSteps}`, id1: course.id, id2: card.id });
          });
        });
      } else {
        COURSES.forEach(course => {
          if (course.title.toLowerCase().includes(q) || course.description.toLowerCase().includes(q)) {
            results.push({ kind: 'course', badge: 'Fach', title: course.title, sub: course.description, id1: course.id, id2: '' });
          }
          course.cards.forEach(card => {
            if (card.title.toLowerCase().includes(q) || card.summary.toLowerCase().includes(q)) {
              results.push({ kind: 'module', badge: 'Modul', title: card.title, sub: `${course.title} • ${card.completedSteps}/${card.totalSteps}`, id1: course.id, id2: card.id });
            }
            const qList = QUESTION_POOLS[card.id] || [];
            qList.forEach(qq => {
              if (qq.question.toLowerCase().includes(q) || (qq.explanation && qq.explanation.toLowerCase().includes(q))) {
                results.push({ kind: 'module', badge: 'Quizfrage', title: qq.question, sub: `${course.title} → ${card.title}`, id1: course.id, id2: card.id });
              }
            });
          });
        });

        appState.flashcards.forEach(fc => {
          if (fc.question.toLowerCase().includes(q) || fc.answer.toLowerCase().includes(q) || fc.subject.toLowerCase().includes(q)) {
            results.push({ kind: 'flashcard', badge: 'Karteikarte', title: fc.question, sub: `${fc.subject} • ${fc.answer}`, id1: fc.id, id2: '' });
          }
        });

        appState.exams.forEach(ex => {
          if (ex.title.toLowerCase().includes(q) || ex.subject.toLowerCase().includes(q) || ex.topics.toLowerCase().includes(q)) {
            results.push({ kind: 'exam', badge: 'Klausur', title: ex.title, sub: `${ex.subject} • ${formatGermanDate(ex.date)}`, id1: ex.id, id2: '' });
          }
        });
      }

      if (results.length === 0) {
        return `<div class="py-8 text-center text-[13px] text-[#78787F]">Keine passenden Ergebnisse für „${escapeHtml(query)}“ gefunden.</div>`;
      }

      return results.slice(0, 30).map(item => `
        <button onclick="executeSearchJump('${item.kind}', '${item.id1}', '${item.id2}')"
                class="w-full text-left p-2.5 rounded-[10px] hover:bg-[#222227] flex items-center justify-between gap-3 transition">
          <div class="min-w-0">
            <div class="text-[13.5px] font-medium text-[#F4F4F6] truncate">${highlightSearchMatch(item.title, query.trim())}</div>
            <div class="text-[11.5px] text-[#78787F] truncate">${highlightSearchMatch(item.sub, query.trim())}</div>
          </div>
          <span class="px-2 py-0.5 rounded-full bg-white/[0.06] text-[10.5px] font-semibold text-[#60A5FA] shrink-0">${item.badge}</span>
        </button>
      `).join('');
    }

    function executeSearchJump(kind, id1, id2) {
      closeModal();
      if (kind === 'course') {
        openSubjectBoard(id1);
      } else if (kind === 'module') {
        selectSearchResult(id1, id2);
      } else if (kind === 'flashcard') {
        appState.activeNav = 'inbox';
        appState.selectedFlashcardSubject = 'ALL';
        appState.flashcardDueFilterOnly = false;
        const idx = appState.flashcards.findIndex(f => f.id === id1);
        appState.flashcardPage = idx >= 0 ? idx : 0;
        appState.flippedFlashcardIds = {};
        syncNavHighlight('inbox');
        renderWorkspace();
      } else if (kind === 'exam') {
        const ex = appState.exams.find(e => e.id === id1);
        if (ex && ex.date) {
          const parts = ex.date.split('-');
          if (parts.length === 3) {
            appState.calendarYear = parseInt(parts[0], 10);
            appState.calendarMonth = parseInt(parts[1], 10) - 1;
          }
        }
        appState.activeNav = 'calendar';
        syncNavHighlight('calendar');
        renderWorkspace();
        if (ex) openExamDetailModal(ex.id);
      }
    }

    function filterSearchResults(val) {
      const list = document.getElementById('search-results-list');
      if (list) list.innerHTML = renderSearchResults(val);
    }

    let cardMoveRafId = null;

    function handleFolderCardMove(event, cardEl) {
      if (appState.activeQuizSession || cardMoveRafId) return;
      const clientX = event.clientX;
      const clientY = event.clientY;
      cardMoveRafId = requestAnimationFrame(() => {
        cardMoveRafId = null;
        if (!cardEl || appState.activeQuizSession) return;
        const rect = cardEl.getBoundingClientRect();
        const x = clientX - rect.left;
        const y = clientY - rect.top;
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        const rotateX = ((y - centerY) / centerY) * -3.5;
        const rotateY = ((x - centerX) / centerX) * 3.5;

        cardEl.style.setProperty('--mouse-x', `${x}px`);
        cardEl.style.setProperty('--mouse-y', `${y}px`);
        cardEl.style.setProperty('--tilt-x', `${rotateX.toFixed(2)}deg`);
        cardEl.style.setProperty('--tilt-y', `${rotateY.toFixed(2)}deg`);
      });
    }

    function handleFolderCardLeave(cardEl) {
      cardEl.style.setProperty('--tilt-x', '0deg');
      cardEl.style.setProperty('--tilt-y', '0deg');
    }

    function moveCardColumn(cardId, targetColumn) {
      const card = getCardById(cardId);
      if (!card) return;
      card.column = targetColumn;

      savePersistedState();
      triggerAutoSync();
      renderWorkspace();
      if (appState.selectedCardId === cardId) renderModuleDrawerContent();
      showToast(`Modul nach „${targetColumn === 'todo' ? 'To Do' : 'Done'}“ verschoben`);

    function adjustSteps(cardId, delta) {
      const card = getCardById(cardId);
      if (!card) return;
      const prev = card.completedSteps;
      card.completedSteps = Math.max(0, Math.min(card.totalSteps, card.completedSteps + delta));
      card.column = card.completedSteps >= card.totalSteps ? 'completed' : 'todo';
      if (card.completedSteps > prev) recordLessonCompletion(card.completedSteps - prev);
      savePersistedState();
      triggerAutoSync();
      renderWorkspace();
      renderModuleDrawerContent();
    }

    function toggleChecklistItem(cardId, itemIdx) {
      const card = getCardById(cardId);
      if (!card || !card.checklist[itemIdx]) return;
      const item = card.checklist[itemIdx];
      item.done = !item.done;
      card.completedSteps = Math.max(0, Math.min(card.totalSteps, card.completedSteps + (item.done ? 1 : -1)));
      card.column = card.completedSteps >= card.totalSteps ? 'completed' : 'todo';
      if (item.done) recordLessonCompletion(1);
      savePersistedState();
      triggerAutoSync();
      renderWorkspace();
      renderModuleDrawerContent();
    }

    function rateFlashcardSpaced(cardId, rating) {
      const card = appState.flashcards.find(c => c.id === cardId);
      if (!card) return;
      const wasMastered = !!card.mastered;
      const cur = card.intervalDays || 0;

      if (rating === 'again') {
        card.intervalDays = 1;
        card.dueDate = addDaysIso(1);
        card.mastered = false;
        playStudySound('wrong');
        showToast('Wiederholung morgen (1 Tag)');
      } else if (rating === 'hard') {
        card.intervalDays = Math.max(2, cur + 2);
        card.dueDate = addDaysIso(2);
        card.mastered = false;
        playStudySound('flip');
        showToast('Als unsicher markiert (+2 Tage)');
      } else {
        const nextDays = cur >= 8 ? 16 : cur >= 4 ? 8 : 4;
        card.intervalDays = nextDays;
        card.dueDate = addDaysIso(nextDays);
        card.mastered = true;
        recordLessonCompletion(1);
        if (!wasMastered) awardXp(5);
        playStudySound('correct');
        showToast(`Gewusst! Nächste Wiederholung in ${nextDays} Tagen`);
      }

      appState.flippedFlashcardIds = {};
      savePersistedState();
      triggerAutoSync();
      renderWorkspace();
    }

        appState.flashcards.unshift({

          isCustom: true
