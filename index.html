<!DOCTYPE html>
<html lang="de" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyV — Lernplattform</title>
  <link rel="icon" type="image/png" href="IconV.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #111113;
      color: #F4F4F6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Subtle Dark Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #27272C;
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #383840;
    }

    /* 16-Tick Segmented Vertical Progress Bar */
    .tick-bar-container {
      display: inline-flex;
      align-items: center;
      gap: 2.5px;
      height: 12px;
    }

    .tick-segment {
      width: 2.5px;
      height: 11px;
      border-radius: 1px;
      transition: background-color 0.2s ease;
    }

    /* Kanban Column Drag-and-Drop States */
    .kanban-column {
      border-radius: 14px;
      border: 1px solid transparent;
    }

    .kanban-column.drag-over {
      background-color: rgba(59, 130, 246, 0.05);
      border-color: rgba(59, 130, 246, 0.28);
    }

    /* Drawer, Modal & Toast Animations */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideRight {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.96) translateY(6px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .animate-fade-in {
      animation: fadeIn 0.18s ease-out forwards;
    }

    .animate-slide-right {
      animation: slideRight 0.24s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .animate-scale-in {
      animation: scaleIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Overarching Folder Cards (Glow + Twinkling Sparkles + 3D Tilt) */
    @keyframes folderSlotReveal {
      from {
        opacity: 0;
        transform: translateY(14px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes ambientGlowBreath {
      0%, 100% {
        opacity: 0.82;
        transform: scale(1) translate(0, 0);
      }
      50% {
        opacity: 1;
        transform: scale(1.07) translate(-3px, 2px);
      }
    }

    @keyframes starTwinkle {
      0%, 100% {
        opacity: 0.34;
        transform: scale(0.9) rotate(0deg);
      }
      50% {
        opacity: 0.95;
        transform: scale(1.16) rotate(8deg);
      }
    }

    @keyframes starFloatGlint {
      0%, 100% {
        opacity: 0.25;
        transform: translateY(0px) scale(0.95);
      }
      50% {
        opacity: 0.85;
        transform: translateY(-2.5px) scale(1.2);
      }
    }

    .folder-card-slot {
      perspective: 950px;
      opacity: 0;
      animation: folderSlotReveal 0.48s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: calc(var(--stagger, 0) * 95ms);
    }

    .folder-glow-card {
      position: relative;
      background-color: #141416;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      overflow: hidden;
      transform-style: preserve-3d;
      transform: rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg)) translateY(0px);
      transition: transform 0.24s cubic-bezier(0.16, 1, 0.3, 1),
                  border-color 0.25s ease,
                  box-shadow 0.28s ease,
                  background-color 0.25s ease;
    }

    .folder-glow-card:hover {
      background-color: #17171a;
      border-color: rgba(var(--accent-rgb, 96, 165, 250), 0.45);
      transform: rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg)) translateY(-4px);
      box-shadow: 0 18px 38px -8px rgba(0, 0, 0, 0.65),
                  0 0 28px -6px rgba(var(--accent-rgb, 96, 165, 250), 0.22);
    }

    .folder-glow-card:active {
      transform: rotateX(0deg) rotateY(0deg) translateY(-1px) scale(0.985);
      transition-duration: 0.1s;
    }

    .folder-glow-orb {
      animation: ambientGlowBreath 6s ease-in-out infinite;
      transition: opacity 0.35s ease, transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .folder-glow-card:hover .folder-glow-orb {
      opacity: 1;
      transform: scale(1.14) translate(-4px, 3px);
    }

    .folder-cursor-spotlight {
      opacity: 0;
      background: radial-gradient(
        240px circle at var(--mouse-x, 82%) var(--mouse-y, 18%),
        rgba(var(--accent-rgb, 96, 165, 250), 0.16),
        transparent 70%
      );
      transition: opacity 0.28s ease;
    }

    .folder-glow-card:hover .folder-cursor-spotlight {
      opacity: 1;
    }

    .folder-edge-shimmer {
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 1px;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(var(--accent-rgb, 255, 255, 255), 0.65) 50%,
        transparent 100%
      );
      opacity: 0;
      transition: left 0.75s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
    }

    .folder-glow-card:hover .folder-edge-shimmer {
      left: 100%;
      opacity: 1;
    }

    .folder-icon-wrap {
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1), filter 0.28s ease;
    }

    .folder-glow-card:hover .folder-icon-wrap {
      transform: translateY(-2px) scale(1.07);
      filter: drop-shadow(0 0 12px rgba(var(--accent-rgb, 96, 165, 250), 0.55));
    }

    .sparkle-star-lg {
      transform-origin: 111px 58px;
      animation: starTwinkle 3.8s ease-in-out infinite;
    }

    .sparkle-star-md {
      transform-origin: 77px 28.2px;
      animation: starTwinkle 4.4s ease-in-out 1.1s infinite;
    }

    .sparkle-star-sm {
      transform-origin: 104px 17.2px;
      animation: starFloatGlint 3.2s ease-in-out 0.6s infinite;
    }

    .sparkle-glint-dot {
      animation: starFloatGlint 4.1s ease-in-out 1.7s infinite;
    }

    .folder-glow-card:hover .sparkle-star-lg,
    .folder-glow-card:hover .sparkle-star-md,
    .folder-glow-card:hover .sparkle-star-sm {
      animation-duration: 1.9s;
    }

    /* Topic-Adapted Cosmic Bento / Nebula Study Cards (Soft-Dark Design + Animations) */
    @keyframes nebulaCardReveal {
      from {
        opacity: 0;
        transform: translateY(14px) scale(0.975);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes nebulaOrbitFloat {
      0%, 100% {
        transform: translateY(0px) scale(1);
      }
      50% {
        transform: translateY(-4px) scale(1.03);
      }
    }

    @keyframes nebulaGlowBreath {
      0%, 100% {
        opacity: 0.78;
      }
      50% {
        opacity: 1;
      }
    }

    @keyframes titleShimmerSweep {
      0% {
        background-position: 140% center;
      }
      100% {
        background-position: -60% center;
      }
    }

    .nebula-card-slot {
      perspective: 950px;
      opacity: 0;
      animation: nebulaCardReveal 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: calc(var(--card-stagger, 0) * 80ms);
    }

    .nebula-study-card {
      position: relative;
      background: linear-gradient(155deg, #202026 0%, #19191F 56%, #15151A 100%);
      border: 1px solid rgba(255, 255, 255, 0.11);
      border-radius: 18px;
      overflow: hidden;
      transform-style: preserve-3d;
      transform: rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg)) translateY(0px);
      box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.08),
                  0 12px 30px -12px rgba(0, 0, 0, 0.68);
      transition: transform 0.24s cubic-bezier(0.16, 1, 0.3, 1),
                  border-color 0.26s ease,
                  box-shadow 0.28s ease,
                  background 0.26s ease;
    }

    .nebula-study-card:hover {
      background: linear-gradient(155deg, #26262E 0%, #1E1E25 56%, #18181E 100%);
      border-color: rgba(var(--nebula-rgb, 236, 72, 153), 0.46);
      transform: rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg)) translateY(-4px);
      box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.14),
                  0 20px 40px -10px rgba(0, 0, 0, 0.78),
                  0 0 30px -8px rgba(var(--nebula-rgb, 236, 72, 153), 0.32);
    }

    .nebula-study-card:active {
      transform: rotateX(0deg) rotateY(0deg) translateY(-1px) scale(0.988);
      transition-duration: 0.1s;
    }

    .nebula-study-card.dragging {
      opacity: 0.45;
      transform: scale(0.98);
    }

    .nebula-cursor-spotlight {
      opacity: 0;
      background: radial-gradient(
        260px circle at var(--mouse-x, 80%) var(--mouse-y, 20%),
        rgba(var(--nebula-rgb, 236, 72, 153), 0.18),
        transparent 72%
      );
      transition: opacity 0.28s ease;
    }

    .nebula-study-card:hover .nebula-cursor-spotlight {
      opacity: 1;
    }

    .nebula-edge-shimmer {
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 1.5px;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(var(--nebula-rgb, 255, 255, 255), 0.85) 50%,
        transparent 100%
      );
      opacity: 0;
      transition: left 0.75s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
    }

    .nebula-study-card:hover .nebula-edge-shimmer {
      left: 100%;
      opacity: 1;
    }

    .nebula-art-glow {
      animation: nebulaGlowBreath 5.5s ease-in-out infinite;
      transition: opacity 0.35s ease, transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .nebula-study-card:hover .nebula-art-glow {
      opacity: 1;
      transform: scale(1.08);
    }

    .nebula-art-svg {
      animation: nebulaOrbitFloat 6.2s ease-in-out infinite;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .nebula-study-card:hover .nebula-art-svg {
      transform: translateY(-3px) scale(1.05);
    }

    .nebula-title-gradient {
      background: linear-gradient(
        110deg,
        #FFFFFF 0%,
        #F5F5F8 34%,
        var(--nebula-accent-light, #F9A8D4) 50%,
        #FFFFFF 66%,
        #B4B4C0 100%
      );
      background-size: 220% auto;
      background-position: 140% center;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1),
                  filter 0.28s ease;
    }

    .nebula-study-card:hover .nebula-title-gradient {
      animation: titleShimmerSweep 1.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      transform: translateX(2px);
      filter: drop-shadow(0 0 16px rgba(var(--nebula-rgb, 236, 72, 153), 0.38));
    }

    .nebula-title-bar {
      width: 28px;
      height: 2.5px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--nebula-accent, #F472B6), transparent);
      opacity: 0.72;
      transition: width 0.32s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
    }

    .nebula-study-card:hover .nebula-title-bar {
      width: 68px;
      opacity: 1;
    }

    .nebula-starfield {
      background-image:
        radial-gradient(1px 1px at 18% 24%, rgba(255, 255, 255, 0.45) 50%, transparent 100%),
        radial-gradient(1.2px 1.2px at 74% 19%, rgba(255, 255, 255, 0.38) 50%, transparent 100%),
        radial-gradient(1px 1px at 46% 68%, rgba(255, 255, 255, 0.30) 50%, transparent 100%),
        radial-gradient(1.3px 1.3px at 86% 54%, rgba(255, 255, 255, 0.40) 50%, transparent 100%),
        radial-gradient(1px 1px at 28% 82%, rgba(255, 255, 255, 0.26) 50%, transparent 100%);
    }

    /* Interactive Emerald Quiz Pop-up (matching Question Design reference) */
    @keyframes quizCardPopIn {
      from {
        opacity: 0;
        transform: scale(0.94) translateY(14px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    @keyframes optionSlideIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes shakeWrong {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    .quiz-backdrop-rays {
      background:
        radial-gradient(60% 55% at 15% 10%, rgba(255, 255, 255, 0.09) 0%, rgba(16, 185, 129, 0.11) 32%, rgba(0, 0, 0, 0.84) 78%),
        rgba(8, 8, 10, 0.86);
      transition: background 0.45s ease;
    }

    .quiz-backdrop-red {
      background:
        radial-gradient(60% 55% at 15% 10%, rgba(255, 255, 255, 0.07) 0%, rgba(239, 68, 68, 0.16) 34%, rgba(0, 0, 0, 0.86) 78%),
        rgba(10, 8, 8, 0.88);
      transition: background 0.45s ease;
    }

    .quiz-pop-enter {
      animation: quizCardPopIn 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .quiz-emerald-card {
      position: relative;
      background:
        radial-gradient(90% 70% at 18% 8%, rgba(34, 197, 94, 0.20) 0%, rgba(16, 185, 129, 0.07) 45%, rgba(20, 21, 22, 0.98) 82%),
        linear-gradient(180deg, #1E2120 0%, #141516 100%);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-top-color: rgba(52, 211, 153, 0.38);
      border-left-color: rgba(52, 211, 153, 0.24);
      border-radius: 28px;
      box-shadow:
        0 32px 70px -12px rgba(0, 0, 0, 0.88),
        0 0 46px -10px rgba(16, 185, 129, 0.28),
        inset 0 1px 0 0 rgba(255, 255, 255, 0.12);
      transition: background 0.45s ease, border-color 0.45s ease, box-shadow 0.45s ease;
    }

    .quiz-crimson-card {
      position: relative;
      background:
        radial-gradient(90% 70% at 18% 8%, rgba(239, 68, 68, 0.25) 0%, rgba(220, 38, 38, 0.09) 45%, rgba(22, 19, 20, 0.98) 82%),
        linear-gradient(180deg, #231D1E 0%, #161414 100%);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-top-color: rgba(248, 113, 113, 0.45);
      border-left-color: rgba(248, 113, 113, 0.30);
      border-radius: 28px;
      box-shadow:
        0 32px 70px -12px rgba(0, 0, 0, 0.88),
        0 0 48px -10px rgba(239, 68, 68, 0.32),
        inset 0 1px 0 0 rgba(255, 255, 255, 0.12);
      transition: background 0.45s ease, border-color 0.45s ease, box-shadow 0.45s ease;
    }

    .quiz-dot-matrix {
      background-image: radial-gradient(rgba(255, 255, 255, 0.075) 1px, transparent 1px);
      background-size: 14px 14px;
      mask-image: radial-gradient(ellipse 80% 55% at 50% 24%, black 25%, transparent 80%);
      -webkit-mask-image: radial-gradient(ellipse 80% 55% at 50% 24%, black 25%, transparent 80%);
    }

    .quiz-option-row {
      opacity: 0;
      animation: optionSlideIn 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: calc(var(--opt-idx, 0) * 55ms);
      transition: background-color 0.18s ease, border-color 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
    }

    .quiz-option-row:hover:not(:disabled) {
      background-color: rgba(255, 255, 255, 0.045);
      border-color: rgba(255, 255, 255, 0.22);
      transform: translateY(-1px);
    }

    .quiz-option-row:hover:not(:disabled) .quiz-arrow-btn {
      background-color: rgba(255, 255, 255, 0.10);
      border-color: rgba(255, 255, 255, 0.28);
      color: #FFFFFF;
      transform: translateX(2px);
    }

    .quiz-option-wrong {
      animation: shakeWrong 0.32s ease;
    }

    /* Next-Level Cobalt-Blue Dashboard Styling (adapted from reference) */
    @keyframes dashboardBeamSway {
      0%, 100% {
        opacity: 0.78;
        transform: translate(0, 0) scale(1);
      }
      50% {
        opacity: 1;
        transform: translate(-6px, 4px) scale(1.05);
      }
    }

    @keyframes dashCardFadeUp {
      from {
        opacity: 0;
        transform: translateY(14px) scale(0.985);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes dashCurveDraw {
      from {
        stroke-dashoffset: 900;
      }
      to {
        stroke-dashoffset: 0;
      }
    }

    @keyframes dashPointSonar {
      0% {
        transform: scale(0.85);
        opacity: 0.75;
      }
      70% {
        transform: scale(2.1);
        opacity: 0;
      }
      100% {
        transform: scale(2.1);
        opacity: 0;
      }
    }

    @keyframes dashBadgeBob {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-3px);
      }
    }

    .dash-card-surface {
      position: relative;
      overflow: hidden;
      background: linear-gradient(180deg, #17181C 0%, #131417 100%);
      border: 1px solid #22242B;
      border-radius: 18px;
      transform-style: preserve-3d;
      transform: perspective(950px) rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg)) translateY(0px);
      box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.05),
                  0 14px 32px -14px rgba(0, 0, 0, 0.7);
      transition: transform 0.24s cubic-bezier(0.16, 1, 0.3, 1),
                  border-color 0.24s ease,
                  box-shadow 0.28s ease,
                  background 0.24s ease;
    }

    .dash-card-surface:hover {
      border-color: rgba(96, 165, 250, 0.32);
      transform: perspective(950px) rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg)) translateY(-3px);
      box-shadow: inset 0 1px 0 0 rgba(147, 197, 253, 0.12),
                  0 20px 40px -12px rgba(0, 0, 0, 0.8),
                  0 0 28px -10px rgba(59, 130, 246, 0.24);
    }

    .dash-cursor-spotlight {
      opacity: 0;
      background: radial-gradient(
        260px circle at var(--mouse-x, 75%) var(--mouse-y, 25%),
        rgba(96, 165, 250, 0.13),
        transparent 72%
      );
      transition: opacity 0.28s ease;
    }

    .dash-card-surface:hover .dash-cursor-spotlight {
      opacity: 1;
    }

    .dash-edge-shimmer {
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 1.5px;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(147, 197, 253, 0.75) 50%,
        transparent 100%
      );
      opacity: 0;
      transition: left 0.78s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
    }

    .dash-card-surface:hover .dash-edge-shimmer {
      left: 100%;
      opacity: 1;
    }

    /* Borderless Solid-Glyph Icon Container for Dashboard (no blue border) */
    .dash-icon-box {
      background: #1D1F27;
      border: none;
      box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.07),
                  0 8px 18px -6px rgba(0, 0, 0, 0.55);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1),
                  background-color 0.25s ease,
                  box-shadow 0.25s ease;
    }

    .dash-card-surface:hover .dash-icon-box {
      background: #232631;
      transform: translateY(-2px) scale(1.06);
      box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.12),
                  0 10px 22px -6px rgba(59, 130, 246, 0.28);
    }

    .dash-stagger {
      opacity: 0;
      animation: dashCardFadeUp 0.44s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: calc(var(--d-idx, 0) * 65ms);
    }

    .dash-curve-path {
      stroke-dasharray: 900;
      stroke-dashoffset: 0;
      animation: dashCurveDraw 0.95s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .dash-pulse-ring {
      transform-box: fill-box;
      transform-origin: center;
      animation: dashPointSonar 2.4s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }

    .dash-badge-float {
      animation: dashBadgeBob 3.2s ease-in-out infinite;
    }

    .dash-blue-rays {
      background:
        radial-gradient(75% 75% at 88% 8%, rgba(147, 197, 253, 0.44) 0%, rgba(59, 130, 246, 0.26) 36%, rgba(29, 78, 216, 0.08) 64%, rgba(19, 20, 23, 0) 85%),
        linear-gradient(135deg, rgba(96, 165, 250, 0.14) 0%, transparent 52%);
      animation: dashboardBeamSway 6.5s ease-in-out infinite;
    }

    .dash-striped-bar {
      background:
        repeating-linear-gradient(
          -45deg,
          rgba(96, 165, 250, 0.26),
          rgba(96, 165, 250, 0.26) 4px,
          rgba(30, 58, 138, 0.35) 4px,
          rgba(30, 58, 138, 0.35) 8px
        ),
        linear-gradient(180deg, rgba(59, 130, 246, 0.32) 0%, rgba(23, 37, 84, 0.22) 100%);
      border: 1px solid rgba(96, 165, 250, 0.32);
      border-top: 2px solid #93C5FD;
      box-shadow: 0 0 20px -4px rgba(59, 130, 246, 0.45);
    }

    function getTodayIsoDate() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function recordDailyProgress(delta) {
      if (!appState.dailyHistory || typeof appState.dailyHistory !== 'object') {
        appState.dailyHistory = {};
      }
      const key = getTodayIsoDate();
      appState.dailyHistory[key] = Math.max(0, (appState.dailyHistory[key] || 0) + delta);
    }

    function recordLearningSnapshot() {
      if (!appState.learningHistory || typeof appState.learningHistory !== 'object') {
        appState.learningHistory = {};
      }
      const totalDone = COURSES.reduce((sum, c) => sum + c.cards.reduce((s, m) => s + m.completedSteps, 0), 0);
      appState.learningHistory[getTodayIsoDate()] = totalDone;
    }

    function loadPersistedState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        if (parsed.courses && Array.isArray(parsed.courses) && parsed.courses.length === 3) {
          COURSES = parsed.courses;
          const ggCourse = COURSES.find(c => c.id === 'gespraechsgestaltung');
          if (ggCourse && ggCourse.cards.some(card => ['gg-1', 'gg-2', 'gg-3', 'gg-4'].includes(card.id))) {
            const freshGG = getDefaultCourses().find(c => c.id === 'gespraechsgestaltung');
            COURSES = COURSES.map(c => c.id === 'gespraechsgestaltung' ? freshGG : c);
          }
        }
        if (parsed.appState) {
          appState = {
            ...appState,
            ...parsed.appState,
            activeNav: 'dashboard',
            selectedCardId: null,
            draggedCardId: null
          };
          if (Array.isArray(appState.flashcards) && appState.flashcards.some(f => f.id === 'fc-2' && f.question.includes('Kommunikationsquadrat'))) {
            const freshCards = getDefaultFlashcards().filter(f => f.subject === 'Gesprächsgestaltung');
            appState.flashcards = [
              ...appState.flashcards.filter(f => f.subject !== 'Gesprächsgestaltung'),
              ...freshCards
            ];
          }
        }
      } catch (e) {
        // Fallback silently to defaults
      }
    }

    function renderSegmentedTicks(completedSteps, totalSteps) {
      const totalTicks = 16;
      const ratio = totalSteps > 0 ? Math.min(1, Math.max(0, completedSteps / totalSteps)) : 0;
      const activeTicks = Math.round(ratio * totalTicks);
      let ticksHtml = '<div class="tick-bar-container" aria-hidden="true">';
      for (let i = 0; i < totalTicks; i++) {
        const isFilled = i < activeTicks;
        ticksHtml += `<span class="tick-segment" style="background-color: ${isFilled ? '#3B82F6' : '#323237'};"></span>`;
      }
      ticksHtml += '</div>';
      return ticksHtml;
    }

    function renderWorkspace() {

      if (!container) return;

      if (appState.activeNav === 'projects') {
        container.innerHTML = appState.showSubjectOverview
          ? renderSubjectsOverview()
          : renderProjectsWorkspace();
      } else if (appState.activeNav === 'dashboard') {
        container.innerHTML = renderDashboardView();
      } else if (appState.activeNav === 'inbox') {
        container.innerHTML = renderInboxView();
      } else if (appState.activeNav === 'calendar') {
        container.innerHTML = renderCalendarView();
      } else if (appState.activeNav === 'reports') {
        container.innerHTML = renderReportsView();
      } else if (appState.activeNav === 'settings') {
        container.innerHTML = renderSettingsView();

    function renderDashboardView() {
      const totalDone = COURSES.reduce((sum, c) => sum + c.cards.reduce((s, m) => s + m.completedSteps, 0), 0);
      const totalAll = COURSES.reduce((sum, c) => sum + c.cards.reduce((s, m) => s + m.totalSteps, 0), 0);
      const overallPct = totalAll > 0 ? Math.round((totalDone / totalAll) * 100) : 0;
      const dailyPct = appState.dailyGoal > 0 ? Math.min(100, Math.round((appState.completedToday / appState.dailyGoal) * 100)) : 0;

      const sortedExams = [...appState.exams].sort((a, b) => a.date.localeCompare(b.date));
      const nextExam = sortedExams[0] || null;
      const upcomingExams = sortedExams.slice(0, 3);

      const masteredFlashcards = appState.flashcards.filter(f => f.mastered).length;
      const flashcardPct = appState.flashcards.length > 0
        ? Math.round((masteredFlashcards / appState.flashcards.length) * 100)
        : 0;

      const getDaysCountdown = (isoDate) => {
        if (!isoDate) return '';
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const target = new Date(isoDate + 'T00:00:00');
        const diffDays = Math.round((target - today) / (1000 * 60 * 60 * 24));
        if (diffDays < 0) return 'Vorbei';
        if (diffDays === 0) return 'Heute';
        if (diffDays === 1) return '1d 0h';
        return `${diffDays}d 12h`;
      };

      // Build real daily history series: 0 lessons = wave sits flat at the very bottom (y = 184)
      const range = appState.dashboardChartRange || '1T';
      const historyMap = { ...(appState.dailyHistory || {}) };
      const todayKey = getTodayIsoDate();
      historyMap[todayKey] = Math.max(historyMap[todayKey] || 0, appState.completedToday || 0);

      const dayCount = range === '1T' ? 5 : range === '1W' ? 7 : 10;
      const series = [];
      const baseDate = new Date();
      baseDate.setHours(0, 0, 0, 0);

      for (let offset = -(dayCount - 1); offset <= 0; offset++) {
        const d = new Date(baseDate);
        d.setDate(baseDate.getDate() + offset);
        const iso = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        const label = `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth() + 1).padStart(2, '0')}`;
        const val = historyMap[iso] || 0;
        series.push({ iso, label, val });
      }

      const maxRecorded = Math.max(...series.map(s => s.val), 0);
      const yScaleMax = Math.max(20, Math.ceil(maxRecorded / 5) * 5);
      const yStep = Math.round(yScaleMax / 4);

      const xStart = 48;
      const xEnd = 592;
      const yBottom = 184;
      const yTop = 38;
      const ySpan = yBottom - yTop;

      const pts = series.map((item, idx) => {
        const x = series.length > 1
          ? Math.round(xStart + (idx / (series.length - 1)) * (xEnd - xStart))
          : Math.round((xStart + xEnd) / 2);
        const clampedVal = Math.max(0, item.val);
        const y = clampedVal === 0
          ? yBottom
          : Math.round(yBottom - Math.min(1, clampedVal / yScaleMax) * ySpan);
        return { x, y, val: clampedVal, label: item.label };
      });

      // Smooth cubic bezier SVG path (stays completely flat at yBottom when all values are 0)
      let linePath = `M ${pts[0].x} ${pts[0].y}`;
      for (let i = 0; i < pts.length - 1; i++) {
        const curr = pts[i];
        const next = pts[i + 1];
        const midX = ((curr.x + next.x) / 2).toFixed(1);
        linePath += ` C ${midX} ${curr.y}, ${midX} ${next.y}, ${next.x} ${next.y}`;
      }
      const areaPath = `${linePath} L ${pts[pts.length - 1].x} ${yBottom} L ${pts[0].x} ${yBottom} Z`;
      const focusPt = pts[pts.length - 1];
      const todayTooltip = `${focusPt.val} Lektionen heute`;

      // Axis labels (5 evenly spaced dates)
      const xAxisLabels = [0, 1, 2, 3, 4].map(slot => {
        const idx = Math.min(pts.length - 1, Math.round((slot / 4) * (pts.length - 1)));
        return { x: pts[idx].x, text: pts[idx].label };
      });

      // 4 vertical comparison bars for right spotlight card
      const subjectPcts = COURSES.map(c => {
        const d = c.cards.reduce((s, m) => s + m.completedSteps, 0);
        const t = c.cards.reduce((s, m) => s + m.totalSteps, 0);
        return t > 0 ? Math.round((d / t) * 100) : 0;
      });
      const spotlightBars = [
        { label: 'ReWe', pct: Math.max(24, subjectPcts[0] || 28), featured: false },
        { label: 'Gespr.', pct: Math.max(20, subjectPcts[1] || 22), featured: false },
        { label: 'Sozi', pct: Math.max(46, subjectPcts[2] || 52), featured: true },
        { label: 'Karten', pct: Math.max(26, flashcardPct || 30), featured: false }
      ];

      // Helper for dense vertical tick bar at the bottom of the bottom cards
      const renderDenseVerticalTicks = (pctVal) => {
        const totalBars = 42;
        const litBars = Math.round((Math.min(100, Math.max(0, pctVal)) / 100) * totalBars);
        let html = '<div class="flex items-center justify-between gap-[2px] w-full h-[14px]">';
        for (let i = 0; i < totalBars; i++) {
          const isLit = i < litBars;
          html += `<span class="flex-1 h-full rounded-[1.5px] transition-colors duration-300 ${isLit ? 'bg-[#60A5FA]' : 'bg-[#252830]'}"></span>`;
        }
        html += '</div>';
        return html;
      };

      // Solid rounded-cutout SVG glyphs matching IMG_2189.JPG (no blue borders)
      const solidClockSvg = `
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none">
          <defs>
            <mask id="dash-clock-cutout">
              <rect width="24" height="24" fill="black" />
              <circle cx="12" cy="12" r="9.5" fill="white" />
              <path d="M12 7.2V12.2L15.3 14.3" stroke="black" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" />
            </mask>
          </defs>
          <rect width="24" height="24" fill="#F4F4F6" mask="url(#dash-clock-cutout)" />
        </svg>
      `;

      const solidChartSvg = `
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <defs>
            <mask id="dash-chart-cutout">
              <rect width="24" height="24" fill="black" />
              <rect x="3" y="3" width="18" height="18" rx="5" fill="white" />
              <line x1="8" y1="16.5" x2="8" y2="12" stroke="black" stroke-width="2.2" stroke-linecap="round" />
              <line x1="12" y1="16.5" x2="12" y2="8" stroke="black" stroke-width="2.2" stroke-linecap="round" />
              <line x1="16" y1="16.5" x2="16" y2="10.5" stroke="black" stroke-width="2.2" stroke-linecap="round" />
            </mask>
          </defs>
          <rect width="24" height="24" fill="#F4F4F6" mask="url(#dash-chart-cutout)" />
        </svg>
      `;

      const solidCalendarMiniSvg = `
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" class="shrink-0">
          <defs>
            <mask id="dash-cal-cutout">
              <rect width="24" height="24" fill="black" />
              <rect x="3" y="4.5" width="18" height="16" rx="4.5" fill="white" />
              <rect x="3" y="4.5" width="18" height="5" fill="black" />
              <rect x="6.5" y="2.5" width="2.6" height="4.2" rx="1.3" fill="white" />
              <rect x="14.9" y="2.5" width="2.6" height="4.2" rx="1.3" fill="white" />
            </mask>
          </defs>
          <rect width="24" height="24" fill="#8B8F9C" mask="url(#dash-cal-cutout)" />
        </svg>
      `;

      const solidFlashcardSvg = `
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <defs>
            <mask id="dash-cards-cutout">
              <rect width="24" height="24" fill="black" />
              <rect x="7" y="2.5" width="12.5" height="16" rx="3" transform="rotate(9 7 2.5)" fill="white" />
              <rect x="3.5" y="5" width="13" height="16.5" rx="3.2" fill="black" />
              <rect x="4.5" y="5.8" width="11.5" height="15" rx="2.8" fill="white" />
              <path d="M11 9.2L8.2 13.6H10.4L9.7 17.4L12.7 12.9H10.5L11 9.2Z" fill="black" />
            </mask>
          </defs>
          <rect width="24" height="24" fill="#F4F4F6" mask="url(#dash-cards-cutout)" />
        </svg>
      `;

      return `
        <div class="flex-1 overflow-y-auto px-6 sm:px-9 py-6">
          <div class="max-w-[1160px]">

            <!-- TOP WORKSPACE HEADER (1:1 layout to reference, adapted to StudyV Blue) -->
            <div class="flex items-center justify-between flex-wrap gap-4 pb-5 mb-6 border-b border-[#1E2026]">
              <div>
                <h1 class="text-[20px] sm:text-[22px] font-bold text-[#F4F4F6] tracking-[-0.02em] leading-tight">
                  Dashboard Overview
                </h1>
                <div class="flex items-center gap-1.5 text-[12px] text-[#7E828E] mt-0.5">
                  <span>StudyV</span>
                  <span>›</span>
                  <span class="text-[#A1A5B2]">Overview</span>
                </div>
              </div>

              <div class="flex items-center gap-4">
                <button onclick="openAddExamModal()"
                        class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-[#93C5FD] hover:bg-[#BFDBFE] text-[#0B1324] text-[12.5px] font-bold shadow-[0_6px_22px_-4px_rgba(96,165,250,0.45)] transition transform hover:-translate-y-0.5">
                  <span class="w-4 h-4 rounded-full bg-[#0B1324] text-[#93C5FD] inline-flex items-center justify-center text-[12px] leading-none font-bold">+</span>
                  <span>Klausur eintragen</span>
                </button>

                <div onclick="navigateSection('settings')" class="flex items-center gap-3 cursor-pointer group">
                  <div class="text-right hidden sm:block">
                    <div class="text-[13px] font-semibold text-[#F4F4F6] group-hover:text-[#93C5FD] transition">${escapeHtml(appState.userName)}</div>
                    <div class="text-[10px] font-semibold uppercase tracking-wider text-[#60A5FA]">LERNPROFIL</div>
                  </div>
                  <div class="w-9 h-9 rounded-full overflow-hidden border border-[#2F333D] group-hover:border-[#60A5FA] transition shrink-0">
                    ${getUserAvatarMarkup()}
                  </div>
                </div>
              </div>
            </div>

            <!-- ROW 1: 3 TOP KPI CARDS -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-5 mb-5">

              <!-- KPI 1: Total Lessons / Learning Units -->
              <div onclick="navigateSection('projects')"
                   onmousemove="handleDashCardMove(event, this)"
                   onmouseleave="handleDashCardLeave(this)"
                   style="--d-idx: 0;"
                   class="dash-stagger dash-card-surface p-5 cursor-pointer flex flex-col justify-between min-h-[124px]">
                <div class="dash-edge-shimmer pointer-events-none"></div>
                <div class="dash-cursor-spotlight absolute inset-0 pointer-events-none"></div>
                <div class="relative z-10 text-[12.5px] font-medium text-[#8B8F9C]">Gesamte Lerneinheiten</div>
                <div class="relative z-10 flex items-center gap-3 mt-3 flex-wrap">
                  <span class="text-[28px] sm:text-[31px] font-bold text-[#F4F4F6] tracking-[-0.03em] leading-none">
                    ${totalDone} <span class="text-[18px] font-semibold text-[#6E7280]">/ ${totalAll}</span>
                  </span>
                  <span class="inline-flex items-center px-2.5 py-1 rounded-full bg-[#3B82F6]/15 text-[11.5px] font-semibold text-[#93C5FD]">
                    +${overallPct}%
                  </span>
                </div>
              </div>

              <!-- KPI 2: Target Progress -->
              <div onmousemove="handleDashCardMove(event, this)"
                   onmouseleave="handleDashCardLeave(this)"
                   style="--d-idx: 1;"
                   class="dash-stagger dash-card-surface p-5 flex flex-col justify-between min-h-[124px]">
                <div class="dash-edge-shimmer pointer-events-none"></div>
                <div class="dash-cursor-spotlight absolute inset-0 pointer-events-none"></div>
                <div class="relative z-10 flex items-center justify-between gap-2">
                  <span class="text-[12.5px] font-medium text-[#8B8F9C]">Tagesziel Fortschritt</span>
                  <div class="flex items-center gap-1">
                    <button onclick="adjustTodayProgress(-1)" title="Einheit abziehen"
                            class="w-6 h-6 rounded-md bg-[#1C1E24] hover:bg-[#252830] border border-[#2B2E38] text-[12px] text-[#A1A5B2] hover:text-white transition">−</button>
                    <button onclick="adjustTodayProgress(1)" title="Einheit abschließen"
                            class="w-6 h-6 rounded-md bg-[#3B82F6]/20 hover:bg-[#3B82F6]/35 text-[12px] text-[#93C5FD] font-bold transition">+</button>
                  </div>
                </div>

                <div class="relative z-10 mt-3">
                  <div class="flex items-baseline justify-between gap-2 mb-2.5">
                    <span class="text-[26px] sm:text-[28px] font-bold text-[#F4F4F6] tracking-[-0.025em] leading-none">
                      ${appState.completedToday} Einh.
                    </span>
                    <span class="text-[12.5px] font-medium text-[#7E828E]">Ziel: ${appState.dailyGoal}</span>
                  </div>
                  <div class="w-full h-[5px] bg-[#22252E] rounded-full overflow-hidden">
                    <div class="h-full rounded-full bg-gradient-to-r from-[#3B82F6] to-[#93C5FD] shadow-[0_0_12px_rgba(96,165,250,0.65)] transition-all duration-500"
                         style="width: ${dailyPct}%;"></div>
                  </div>
                </div>
              </div>

              <!-- KPI 3: Next Exam / Countdown with Solid Cutout Clock Icon (NO blue border) -->
              <div onclick="navigateSection('calendar')"
                   onmousemove="handleDashCardMove(event, this)"
                   onmouseleave="handleDashCardLeave(this)"
                   style="--d-idx: 2;"
                   class="dash-stagger dash-card-surface p-5 cursor-pointer flex flex-col justify-between min-h-[124px]">
                <div class="dash-edge-shimmer pointer-events-none"></div>
                <div class="dash-cursor-spotlight absolute inset-0 pointer-events-none"></div>
                <div class="relative z-10 text-[12.5px] font-medium text-[#8B8F9C]">Nächste Klassenarbeit</div>
                <div class="relative z-10 flex items-center gap-3.5 mt-3">
                  <div class="dash-icon-box w-11 h-11 rounded-[13px] flex items-center justify-center shrink-0">
                    ${solidClockSvg}
                  </div>
                  <div class="min-w-0">
                    <div class="text-[22px] sm:text-[24px] font-bold text-[#F4F4F6] tracking-[-0.02em] leading-tight truncate">
                      ${nextExam ? getDaysCountdown(nextExam.date) : 'Kein Termin'}
                    </div>
                    <div class="text-[12px] text-[#7E828E] truncate mt-0.5">
                      ${nextExam ? `${escapeHtml(nextExam.subject)} • ${formatGermanDate(nextExam.date)}` : 'Termin im Kalender anlegen'}
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- ROW 2: ASYMMETRIC BENTO ANALYTICS -->
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 mb-6">

              <!-- Left Card (8 cols): Accurate Daily Learning Wave Chart -->
              <div onmousemove="handleDashCardMove(event, this)"
                   onmouseleave="handleDashCardLeave(this)"
                   style="--d-idx: 3;"
                   class="dash-stagger lg:col-span-8 dash-card-surface p-5 sm:p-6 flex flex-col justify-between">
                <div class="dash-edge-shimmer pointer-events-none"></div>
                <div class="dash-cursor-spotlight absolute inset-0 pointer-events-none"></div>

                <div class="relative z-10 flex items-start justify-between gap-4 flex-wrap mb-3">
                  <div class="flex items-center gap-3.5">
                    <div class="dash-icon-box w-10 h-10 rounded-[12px] flex items-center justify-center shrink-0">
                      ${solidChartSvg}
                    </div>
                    <div>
                      <div class="text-[12px] font-medium text-[#8B8F9C]">Dein Lernverlauf</div>
                      <div class="text-[24px] sm:text-[27px] font-bold text-[#F4F4F6] tracking-[-0.025em] leading-tight">
                        ${focusPt.val} Lektionen <span class="text-[13px] font-medium text-[#60A5FA]">heute • ${overallPct}% Gesamt</span>
                      </div>
                    </div>
                  </div>

                  <!-- Timeframe Pill Toggle (1T / 1W / 1M) -->
                  <div class="flex items-center gap-1.5">
                    ${['1T', '1W', '1M'].map(tf => {
                      const active = range === tf;
                      return `
                        <button onclick="setDashboardChartRange('${tf}')"
                                class="px-3.5 py-1 rounded-full text-[11.5px] font-semibold transition ${active ? 'bg-[#93C5FD] text-[#0B1324] shadow-[0_0_16px_rgba(147,197,253,0.45)]' : 'bg-[#1B1D23] hover:bg-[#23262E] text-[#8B8F9C] hover:text-white'}">
                          ${tf}
                        </button>
                      `;
                    }).join('')}
                  </div>
                </div>

                <!-- Smooth SVG Area Line Chart (0 lessons = flat on bottom 0 line, rises with daily lessons) -->
                <div class="relative z-10 w-full mt-2">
                  <svg viewBox="0 0 620 212" class="w-full h-[205px] overflow-visible">
                    <defs>
                      <linearGradient id="cobaltAreaGrad" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.30" />
                        <stop offset="75%" stop-color="#3B82F6" stop-opacity="0.06" />
                        <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.00" />
                      </linearGradient>
                      <linearGradient id="cobaltLineStroke" x1="0" y1="0" x2="1" y2="0">
                        <stop offset="0%" stop-color="#3B82F6" />
                        <stop offset="55%" stop-color="#60A5FA" />
                        <stop offset="100%" stop-color="#93C5FD" />
                      </linearGradient>
                    </defs>

                    <!-- Horizontal Y-Axis Gridlines & Labels (top = yScaleMax, bottom = 0) -->
                    ${[0, 1, 2, 3, 4].map(stepIdx => {
                      const yPos = Math.round(yTop + (stepIdx / 4) * ySpan);
                      const tickVal = Math.max(0, yScaleMax - stepIdx * yStep);
                      return `
                        <line x1="${xStart}" y1="${yPos}" x2="${xEnd}" y2="${yPos}" stroke="#22252E" stroke-width="1" />
                        <text x="36" y="${yPos + 3.5}" text-anchor="end" fill="#6E7280" font-size="10.5" font-family="Inter, sans-serif">${tickVal}</text>
                      `;
                    }).join('')}

                    <!-- Area Fill & Animated Smooth Wave Curve -->
                    <path d="${areaPath}" fill="url(#cobaltAreaGrad)" />
                    <path d="${linePath}" fill="none" stroke="url(#cobaltLineStroke)" stroke-width="2.6" stroke-linecap="round" class="dash-curve-path" />

                    <!-- Data Point Dots -->
                    ${pts.map((p, i) => i < pts.length - 1 ? `
                      <circle cx="${p.x}" cy="${p.y}" r="3" fill="#17181C" stroke="#60A5FA" stroke-width="1.8" />
                    ` : '').join('')}

                    <!-- Vertical Dashed Guide & Highlighted Current Day Point -->
                    <line x1="${focusPt.x}" y1="${yTop}" x2="${focusPt.x}" y2="${yBottom}" stroke="#3B82F6" stroke-opacity="0.35" stroke-dasharray="3 3" />
                    <circle cx="${focusPt.x}" cy="${focusPt.y}" r="8" fill="#60A5FA" fill-opacity="0.28" class="dash-pulse-ring" />
                    <circle cx="${focusPt.x}" cy="${focusPt.y}" r="4.5" fill="#F4F4F6" stroke="#3B82F6" stroke-width="2.4" />

                    <!-- Floating Tooltip Pill above Current Day Point -->
                    <g transform="translate(${Math.min(516, Math.max(58, focusPt.x - 56))}, ${Math.max(6, focusPt.y - 34)})">
                      <rect x="0" y="0" width="112" height="23" rx="11.5" fill="#1F222B" stroke="#343A4A" stroke-width="1" />
                      <text x="56" y="14.8" text-anchor="middle" fill="#F4F4F6" font-size="10.5" font-weight="600" font-family="Inter, sans-serif">${todayTooltip}</text>
                    </g>

                    <!-- X-Axis Date Labels -->
                    ${xAxisLabels.map(lbl => `
                      <text x="${lbl.x}" y="205" text-anchor="middle" fill="#6E7280" font-size="10.5" font-family="Inter, sans-serif">${lbl.text}</text>
                    `).join('')}
                  </svg>
                </div>
              </div>

              <!-- Right Card (4 cols): Blue Spotlight Profile & Subject Comparison Bars -->
              <div onmousemove="handleDashCardMove(event, this)"
                   onmouseleave="handleDashCardLeave(this)"
                   style="--d-idx: 4;"
                   class="dash-stagger lg:col-span-4 dash-card-surface p-5 sm:p-6 flex flex-col justify-between">
                <div class="dash-blue-rays absolute inset-0 pointer-events-none"></div>
                <div class="dash-edge-shimmer pointer-events-none"></div>
                <div class="dash-cursor-spotlight absolute inset-0 pointer-events-none"></div>

                <!-- Profile Header Row -->
                <div class="relative z-10 flex items-center gap-3">
                  <div class="w-10 h-10 rounded-full overflow-hidden border border-white/15 shrink-0 shadow-md">
                    ${getUserAvatarMarkup()}
                  </div>
                  <div class="min-w-0">
                    <div class="flex items-center gap-1.5">
                      <span class="text-[14.5px] font-bold text-[#F4F4F6] truncate">${escapeHtml(appState.userName)}</span>
                      <span class="w-2 h-2 rounded-full bg-[#60A5FA] shrink-0"></span>
                    </div>
                    <div class="text-[11.5px] text-[#9BA3B8]">Aktiv in 3 Lernfächern</div>
                  </div>
                </div>

                <!-- Main Percentage Stat -->
                <div class="relative z-10 my-4">
                  <div class="text-[12px] font-medium text-[#9BA3B8]">Lernquote Gesamt</div>
                  <div class="text-[32px] font-bold text-[#F4F4F6] tracking-[-0.03em] leading-tight mt-0.5">
                    ${overallPct}%
                  </div>
                </div>

                <!-- 4 Vertical Comparison Bars (Featured Striped Bar with Floating Badge) -->
                <div class="relative z-10 grid grid-cols-4 gap-2.5 items-end h-[116px] pt-5">
                  ${spotlightBars.map(bar => `
                    <div class="flex flex-col items-center h-full justify-end">
                      <div class="relative w-full flex flex-col items-center justify-end flex-1">
                        ${bar.featured ? `
                          <span class="dash-badge-float mb-1.5 px-2 py-0.5 rounded-full bg-[#F4F4F6] text-[#0B1324] text-[10px] font-extrabold shadow-md whitespace-nowrap">
                            ↑ ${bar.pct}%
                          </span>
                        ` : ''}
                        <div class="w-full rounded-t-[10px] rounded-b-[6px] transition-all duration-500 ${bar.featured ? 'dash-striped-bar' : 'dash-muted-bar'}"
                             style="height: ${Math.max(24, bar.pct)}%;"></div>
                      </div>
                      <span class="text-[11px] mt-2 ${bar.featured ? 'text-[#F4F4F6] font-semibold' : 'text-[#7E828E]'}">${bar.label}</span>
                    </div>
                  `).join('')}
                </div>
              </div>
            </div>

            <!-- ROW 3: ACTIVE SUBJECTS (with Dense Vertical Tick Progress Bars) + QUICK ACTIONS -->
            <div class="flex items-center justify-between mb-3.5">
              <h2 class="text-[15px] font-semibold text-[#F4F4F6]">Aktive Lernfächer</h2>
              <button onclick="openSubjectsOverview()" class="text-[12px] font-medium text-[#8B8F9C] hover:text-[#F4F4F6] transition">
                Alle Ordner anzeigen ›
              </button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-5 mb-6">
              ${COURSES.map((c, idx) => {
                const doneSteps = c.cards.reduce((s, m) => s + m.completedSteps, 0);
                const allSteps = c.cards.reduce((s, m) => s + m.totalSteps, 0);
                const doneModules = c.cards.filter(m => m.column === 'completed').length;
                const openModules = c.cards.length - doneModules;
                const pct = allSteps > 0 ? Math.round((doneSteps / allSteps) * 100) : 0;

                return `
                  <div onclick="openSubjectBoard('${c.id}')"
                       onmousemove="handleDashCardMove(event, this)"
                       onmouseleave="handleDashCardLeave(this)"
                       style="--d-idx: ${5 + idx};"
                       class="dash-stagger dash-card-surface p-5 cursor-pointer flex flex-col justify-between">
                    <div class="dash-edge-shimmer pointer-events-none"></div>
                    <div class="dash-cursor-spotlight absolute inset-0 pointer-events-none"></div>

                    <div class="relative z-10">
                      <div class="flex items-center justify-between gap-2 mb-1.5">
                        <h3 class="text-[19px] font-bold text-[#F4F4F6] tracking-[-0.02em] truncate">${escapeHtml(c.title)}</h3>
                        <span class="px-2.5 py-0.5 rounded-full bg-[#3B82F6]/15 text-[11px] font-semibold text-[#93C5FD] shrink-0">

          <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">

                <div class="flex items-center gap-2">
                  ${currentCard ? renderCategoryBadge(currentCard.subject) : ''}
                  <span class="text-[12px] text-[#7E7E87]">Karte ${(appState.activeFlashcardIndex % Math.max(1, cards.length)) + 1} von ${cards.length}</span>
                </div>
                ${currentCard?.mastered ? `<span class="text-[11.5px] text-[#34D399] font-medium">✓ Gewusst</span>` : `<span class="text-[11.5px] text-[#8E8E93]">Offen</span>`}

                <div class="mt-4 flex items-center justify-between flex-wrap gap-2">
                  <div class="flex items-center gap-2">

                    <button onclick="nextFlashcard()" class="px-3 py-1.5 rounded-[8px] bg-[#1F1F24] hover:bg-[#28282E] text-[12.5px] text-[#E4E4E7]">Weiter →</button>
                  </div>
                  <div class="flex items-center gap-2">
                    <button onclick="markFlashcard('${currentCard.id}', false)" class="px-3 py-1.5 rounded-[8px] bg-[#F59E0B]/15 hover:bg-[#F59E0B]/25 text-[#FBBF24] text-[12px] font-medium">Nochmal üben</button>
                    <button onclick="markFlashcard('${currentCard.id}', true)" class="px-3 py-1.5 rounded-[8px] bg-[#10B981]/20 hover:bg-[#10B981]/30 text-[#34D399] text-[12px] font-medium">✓ Gewusst</button>

                    </div>
                    <p class="text-[12.5px] text-[#D4D4D8] leading-relaxed mt-1.5">${escapeHtml(n.text)}</p>

              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderCalendarView() {
      const monthNames = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
      const year = appState.calendarYear;
      const month = appState.calendarMonth;
      const firstDayRaw = new Date(year, month, 1).getDay();
      const startOffset = firstDayRaw === 0 ? 6 : firstDayRaw - 1;
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const daysHeader = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
      const todayIso = getTodayIsoDate();

      const sortedExams = [...appState.exams].sort((a, b) => a.date.localeCompare(b.date));

      return `
        <div class="flex-1 overflow-y-auto px-6 sm:px-9 py-7 max-w-6xl">
          <div class="flex items-center justify-between flex-wrap gap-4 mb-6">
            <div>
              <h1 class="text-[26px] font-bold text-[#F4F4F6] tracking-[-0.02em]">Klassenarbeiten &amp; Test-Kalender</h1>
              <p class="text-[13.5px] text-[#8E8E93]">Trage deine Prüfungstermine ein und notiere direkt, was in der Arbeit dran kommt</p>
            </div>
            <button onclick="openAddExamModal()" class="px-4 py-2 rounded-[8px] bg-[#3B82F6] hover:bg-[#2563EB] text-white text-[13px] font-medium transition">
              + Termin eintragen
            </button>
          </div>

          <div class="grid grid-cols-1 xl:grid-cols-12 gap-6">
            <!-- Monthly Grid (7 cols) -->
            <div class="xl:col-span-7 bg-[#161618] border border-[#242428] rounded-[12px] p-4">
              <div class="flex items-center justify-between mb-4">
                <h2 class="text-[15px] font-semibold text-[#F4F4F6]">${monthNames[month]} ${year}</h2>
                <div class="flex items-center gap-1.5">
                  <button onclick="changeCalendarMonth(-1)" class="px-2.5 py-1 rounded bg-[#222226] hover:bg-[#2B2B30] text-[12.5px] text-[#E4E4E7]">←</button>
                  <button onclick="changeCalendarMonth(1)" class="px-2.5 py-1 rounded bg-[#222226] hover:bg-[#2B2B30] text-[12.5px] text-[#E4E4E7]">→</button>
                </div>
              </div>

              <div class="grid grid-cols-7 gap-1.5 mb-2 text-center text-[11.5px] font-medium text-[#8E8E93]">
                ${daysHeader.map(d => `<div class="py-1">${d}</div>`).join('')}
              </div>

              <div class="grid grid-cols-7 gap-1.5">
                ${Array.from({ length: startOffset }).map(() => `<div class="min-h-[76px] rounded-[8px] bg-[#131315]/50"></div>`).join('')}
                ${Array.from({ length: daysInMonth }, (_, i) => {
                  const dayNum = i + 1;
                  const iso = `${year}-${String(month + 1).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}`;
                  const isToday = iso === todayIso;
                  const dayExams = sortedExams.filter(e => e.date === iso);

                  return `
                    <div onclick="openAddExamModal('${iso}')"
                         class="min-h-[76px] rounded-[8px] p-1.5 border cursor-pointer transition ${isToday ? 'bg-[#1D2330] border-[#3B82F6]' : 'bg-[#1A1A1D] hover:bg-[#1F1F23] border-[#252529]'}">
                      <div class="flex items-center justify-between">
                        <span class="text-[11.5px] font-medium ${isToday ? 'text-[#60A5FA]' : 'text-[#9A9AA0]'}">${dayNum}</span>
                      </div>
                      <div class="mt-1 space-y-1">
                        ${dayExams.map(ex => `
                          <div onclick="event.stopPropagation(); openExamDetailModal('${ex.id}')"
                               class="px-1.5 py-0.5 rounded text-[10px] font-medium truncate ${ex.type === 'Klassenarbeit' ? 'bg-[#EF4444]/20 border border-[#EF4444]/35 text-[#FCA5A5]' : 'bg-[#3B82F6]/20 border border-[#3B82F6]/35 text-[#93C5FD]'}">
                            ${escapeHtml(ex.subject)}
                          </div>
                        `).join('')}
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>

            <!-- Upcoming Exams & "Was kommt dran?" List (5 cols) -->
            <div class="xl:col-span-5 space-y-3.5">
              <h2 class="text-[15px] font-semibold text-[#F4F4F6]">Anstehende Klassenarbeiten &amp; Tests (${sortedExams.length})</h2>
              ${sortedExams.length === 0 ? `
                <div class="bg-[#1A1A1D] border border-[#26262A] rounded-[12px] p-6 text-center text-[13px] text-[#8E8E93]">
                  Noch keine Termine eingetragen. Klicke auf „+ Termin eintragen“.
                </div>
              ` : sortedExams.map(ex => `
                <div class="bg-[#1A1A1D] border border-[#26262A] rounded-[12px] p-4">
                  <div class="flex items-center justify-between gap-2 mb-2">
                    <div class="flex items-center gap-2">
                      ${renderCategoryBadge(ex.subject)}
                      <span class="text-[11px] font-medium px-2 py-0.5 rounded bg-[#252529] text-[#D4D4D8]">${escapeHtml(ex.type)}</span>
                    </div>
                    <div class="flex items-center gap-2">
                      <span class="text-[12px] font-semibold text-[#E59A3C]">${formatGermanDate(ex.date)}</span>
                      <button onclick="deleteExam('${ex.id}')" title="Termin löschen" class="text-[#78787F] hover:text-[#F87171] text-[12px] px-1">✕</button>
                    </div>
                  </div>
                  <h3 class="text-[14.5px] font-semibold text-[#F4F4F6] mb-2">${escapeHtml(ex.title)}</h3>
                  <div class="bg-[#131315] border border-[#242429] rounded-[8px] p-3">
                    <div class="text-[11px] font-semibold uppercase tracking-wider text-[#60A5FA] mb-1">Was kommt dran?</div>
                    <p class="text-[12.5px] text-[#C4C4CC] leading-relaxed whitespace-pre-line">${escapeHtml(ex.topics)}</p>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function renderReportsView() {
      const totalCards = COURSES.reduce((s, c) => s + c.cards.length, 0);
      const todoCount = COURSES.reduce((s, c) => s + c.cards.filter(m => m.column !== 'completed').length, 0);
      const doneCount = COURSES.reduce((s, c) => s + c.cards.filter(m => m.column === 'completed').length, 0);

      return `
        <div class="flex-1 overflow-y-auto px-6 sm:px-9 py-7 max-w-4xl">
          <h1 class="text-[26px] font-bold text-[#F4F4F6] tracking-[-0.02em] mb-1">Lernfortschritt &amp; Reports</h1>
          <p class="text-[13.5px] text-[#8E8E93] mb-6">Auswertung über Rechnungswesen, Gesprächsgestaltung und Sozialkunde</p>

          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
            <div class="bg-[#1A1A1D] border border-[#26262A] rounded-[12px] p-4">
              <div class="text-[12px] text-[#8E8E93]">Module Gesamt</div>
              <div class="text-[22px] font-bold text-[#F4F4F6] mt-1">${totalCards}</div>
            </div>
            <div class="bg-[#1A1A1D] border border-[#26262A] rounded-[12px] p-4">
              <div class="text-[12px] text-[#60A5FA]">Offen (To Do)</div>
              <div class="text-[22px] font-bold text-[#F4F4F6] mt-1">${todoCount} <span class="text-[13px] font-normal text-[#78787F]">von ${totalCards}</span></div>
            </div>
            <div class="bg-[#1A1A1D] border border-[#26262A] rounded-[12px] p-4">
              <div class="text-[12px] text-[#34D399]">Abgeschlossen (Done)</div>
              <div class="text-[22px] font-bold text-[#F4F4F6] mt-1">${doneCount} <span class="text-[13px] font-normal text-[#78787F]">von ${totalCards}</span></div>
            </div>
          </div>

          <div class="bg-[#1A1A1D] border border-[#26262A] rounded-[12px] p-5 space-y-5">
            ${COURSES.map(c => {
              const done = c.cards.reduce((s, m) => s + m.completedSteps, 0);
              const total = c.cards.reduce((s, m) => s + m.totalSteps, 0);
              const pct = total > 0 ? Math.round((done / total) * 100) : 0;
              return `
                <div>
                  <div class="flex items-center justify-between text-[13.5px] mb-2">
                    <span class="font-semibold text-[#F4F4F6]">${escapeHtml(c.title)}</span>
                    <span class="text-[#9A9AA0]">${done} / ${total} Lektionen (${pct}%)</span>
                  </div>
                  <div class="w-full h-2.5 bg-[#111113] rounded-full overflow-hidden border border-[#242428]">
                    <div class="h-full bg-[#3B82F6] rounded-full transition-all" style="width: ${pct}%;"></div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 4. INTERACTIVE QUIZ POP-UP (Rotating 6-Question Pool per Topic)
    // =========================================================================
    const QUESTION_POOLS = {
      'gg-grundlagen': [

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function buildQuestionRound(cardId) {
      const pool = QUESTION_POOLS[cardId] || [];
      if (pool.length === 0) return [];

      if (!appState.seenQuestionIds || typeof appState.seenQuestionIds !== 'object') {
        appState.seenQuestionIds = {};
      }
      const seenList = Array.isArray(appState.seenQuestionIds[cardId]) ? appState.seenQuestionIds[cardId] : [];
      let unseen = pool.filter(q => !seenList.includes(q.id));

      let picked = [];
      if (unseen.length >= QUIZ_SESSION_SIZE) {
        picked = shuffleArray(unseen).slice(0, QUIZ_SESSION_SIZE);
        appState.seenQuestionIds[cardId] = [...seenList, ...picked.map(q => q.id)];
      } else {
        const remaining = shuffleArray(pool.filter(q => !unseen.some(u => u.id === q.id)));
        picked = [...shuffleArray(unseen), ...remaining].slice(0, Math.min(QUIZ_SESSION_SIZE, pool.length));
        appState.seenQuestionIds[cardId] = picked.map(q => q.id);
      }

      savePersistedState();

      return picked.map(q => {
        const taggedOptions = q.options.map((opt, idx) => ({
          ...opt,
          isRight: idx === q.correctIndex
        }));
        const shuffledOptions = shuffleArray(taggedOptions);
        return {
          id: q.id,
          question: q.question,
          subtitle: q.subtitle,
          tip: q.tip || 'Achte auf die Schlüsselbegriffe aus dem Lernstoff zu diesem Thema.',
          options: shuffledOptions,
          correctIndex: shuffledOptions.findIndex(o => o.isRight),
          explanation: q.explanation
        };
      });
    }

            <button onclick="toggleQuizTip()"

              <span class="w-4 h-4 rounded-[5px] bg-white/[0.06] flex items-center justify-center text-[10px] text-[#FBBF24]">?</span>
              <span>Tipp</span>
            </button>

            <span class="text-[11.5px] text-[#84868E]">
              ${quizSession.solvedCount} / ${totalSteps} richtig
            </span>

            ${quizSession.isAnswered ? `
              <button onclick="nextQuizStep()"
                      class="inline-flex items-center gap-2 px-4 py-2 rounded-[11px] ${isRed ? 'bg-[#EF4444] hover:bg-[#DC2626] text-white shadow-[0_6px_18px_-4px_rgba(239,68,68,0.55)]' : 'bg-[#22C55E] hover:bg-[#16A34A] text-[#06140C] shadow-[0_6px_18px_-4px_rgba(34,197,94,0.55)]'} text-[12.5px] font-bold transition">
                <span>${currentIdx + 1 >= totalSteps ? 'Ergebnis anzeigen' : 'Weiter'}</span>
                <span>→</span>
              </button>
            ` : `
              <button onclick="skipQuizStep()"
                      class="inline-flex items-center gap-2 px-3.5 py-2 rounded-[11px] bg-[#1C1E20] hover:bg-[#25282B] border border-white/[0.08] text-[12.5px] font-medium text-[#D4D4D8] transition">
                <span class="w-4 h-4 rounded-[5px] bg-white/[0.06] flex items-center justify-center text-[10px] text-[#9A9AA2]">↳</span>
                <span>Skip</span>
              </button>
            `}
          </div>
        </div>
      `;
    }

    function selectQuizOption(optIdx) {
      if (quizSession.isAnswered) return;
      const q = quizSession.questions[quizSession.currentIndex];
      if (!q) return;

      const isRight = optIdx === q.correctIndex;
      quizSession.selectedOptionIdx = optIdx;
      quizSession.isAnswered = true;
      quizSession.isCorrect = isRight;
      quizSession.results[quizSession.currentIndex] = {
        questionId: q.id,
        selectedOptionIdx: optIdx,
        isRight
      };

      if (isRight) {
        quizSession.solvedCount += 1;
        quizSession.isRedTheme = false;

        const card = getCardById(quizSession.cardId);
        if (card) {
          const stepGain = Math.max(1, Math.ceil(card.totalSteps / QUIZ_SESSION_SIZE));
          card.completedSteps = Math.min(card.totalSteps, card.completedSteps + stepGain);
          appState.completedToday += 1;
          recordDailyProgress(1);
          if (card.completedSteps >= card.totalSteps) {
            card.column = 'completed';
            card.checklist.forEach(item => { item.done = true; });
          }
          savePersistedState();
          renderWorkspace();
        }
      } else {
        quizSession.wrongAttempts += 1;
        quizSession.isRedTheme = true;
      }

      renderQuizPopup();
    }

    function nextQuizStep() {
      if (quizSession.currentIndex + 1 >= quizSession.questions.length) {
        quizSession.completed = true;
        const card = getCardById(quizSession.cardId);
        if (card && quizSession.solvedCount === quizSession.questions.length) {
          card.completedSteps = card.totalSteps;
          card.column = 'completed';
          card.checklist.forEach(item => { item.done = true; });
          savePersistedState();
          renderWorkspace();
          showToast(`🎉 „${card.title}“ abgeschlossen & nach Done verschoben!`);
        }
      } else {
        quizSession.currentIndex += 1;
        quizSession.selectedOptionIdx = null;
        quizSession.isAnswered = false;
        quizSession.isCorrect = false;
        quizSession.showTip = false;
      }
      renderQuizPopup();
    }

    function toggleQuizTip() {
      quizSession.showTip = !quizSession.showTip;
      renderQuizPopup();
    }

    function skipQuizStep() {
      const q = quizSession.questions[quizSession.currentIndex];
      if (!q) return;
      quizSession.results[quizSession.currentIndex] = {
        questionId: q.id,
        selectedOptionIdx: -1,
        isRight: false
      };
      quizSession.wrongAttempts += 1;
      quizSession.isRedTheme = true;
      if (quizSession.currentIndex + 1 >= quizSession.questions.length) {
        quizSession.completed = true;
      } else {
        quizSession.currentIndex += 1;
        quizSession.selectedOptionIdx = null;
        quizSession.isAnswered = false;
        quizSession.isCorrect = false;
        quizSession.showTip = false;
      }
      renderQuizPopup();
    }
