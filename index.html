    function renderProjectsWorkspace() {
      const course = getCurrentCourse();
      const folderFill = course.id === 'englisch'
        ? '#EF4444'
        : course.id === 'kundenbindung'
          ? '#10B981'
          : course.id === 'gespraechsgestaltung'
            ? '#F97316'
            : course.id === 'sozialkunde'
              ? '#8B5CF6'
              : '#4B7BF5';

      const viewTabs = [
        {
          id: 'kanban',
          label: 'Kanban',
          icon: `<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="4" width="7" height="16" rx="2"/><rect x="14" y="4" width="7" height="11" rx="2"/></svg>`
        },
        {
          id: 'list',
          label: 'List',
          icon: `<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="5" width="3" height="3" rx="1"/><rect x="8" y="5" width="13" height="3" rx="1.5"/><rect x="3" y="10.5" width="3" height="3" rx="1"/><rect x="8" y="10.5" width="13" height="3" rx="1.5"/><rect x="3" y="16" width="3" height="3" rx="1"/><rect x="8" y="16" width="13" height="3" rx="1.5"/></svg>`
        },
        {
          id: 'timeline',
          label: 'Timeline',
          icon: `<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="5.5" width="12" height="3" rx="1.5"/><rect x="8" y="10.5" width="13" height="3" rx="1.5"/><rect x="5" y="15.5" width="11" height="3" rx="1.5"/></svg>`
        },
        {
          id: 'table',
          label: 'Table',
          icon: `<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" clip-rule="evenodd" d="M3 6.5C3 5.12 4.12 4 5.5 4H18.5C19.88 4 21 5.12 21 6.5V17.5C21 18.88 19.88 20 18.5 20H5.5C4.12 20 3 18.88 3 17.5V6.5ZM5.5 9.5H10V13H5.5V9.5ZM12 9.5H18.5V13H12V9.5ZM5.5 15H10V17.5H5.5V15ZM12 15H18.5V17.5H12V15Z"/></svg>`
        }
      ];

      let activeBoardHtml = '';
      if (appState.activeViewTab === 'kanban') {
        activeBoardHtml = renderKanbanBoard(course);
      } else if (appState.activeViewTab === 'list') {
        activeBoardHtml = renderListView(course);
      } else if (appState.activeViewTab === 'timeline') {
        activeBoardHtml = renderTimelineView(course);
      } else {
        activeBoardHtml = renderTableView(course);
      }

      return `
        <div class="flex-1 flex flex-col overflow-hidden">
          <div class="px-6 sm:px-9 pt-6 pb-4 shrink-0">
            <div class="flex items-center justify-between flex-wrap gap-3 mb-5">
              <div class="flex items-center gap-2.5 text-[13.5px]">
                <button onclick="openSubjectsOverview()" class="inline-flex items-center gap-2 text-[#8E8E93] hover:text-[#F4F4F6] transition focus:outline-none">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12" />
                    <polyline points="12 19 5 12 12 5" />
                  </svg>
                  <span>Project</span>
                </button>
                <span class="text-[#52525B]">/</span>
                <span class="font-medium text-[#E4E4E7]">${escapeHtml(course.title)}</span>
              </div>
            </div>

            <div class="flex items-center gap-3.5 mb-5">
              <div class="w-[34px] h-[28px] shrink-0 flex items-center justify-center">
                <svg width="32" height="26" viewBox="0 0 36 30" fill="none">
                  <path d="M1 5.5C1 3.29086 2.79086 1.5 5 1.5H12.2C13.3 1.5 14.35 1.95 15.1 2.75L16.9 4.65C17.45 5.2 18.2 5.5 19 5.5H31C33.2091 5.5 35 7.29086 35 9.5V24.5C35 26.7091 33.2091 28.5 31 28.5H5C2.79086 28.5 1 26.7091 1 24.5V5.5Z" fill="${folderFill}" fill-opacity="0.82" />
                  <path d="M1 9.5C1 7.84315 2.34315 6.5 4 6.5H32C33.6569 6.5 35 7.84315 35 9.5V24.5C35 26.7091 33.2091 28.5 31 28.5H5C2.79086 28.5 1 26.7091 1 24.5V9.5Z" fill="${folderFill}" />
                </svg>
              </div>
              <h1 class="text-[27px] sm:text-[31px] font-bold text-[#F4F4F6] tracking-[-0.025em] leading-tight">
                ${escapeHtml(course.title)}
              </h1>
            </div>

            <div class="flex items-center gap-1.5 overflow-x-auto pb-1">
              ${viewTabs.map(tab => {
                const isActive = appState.activeViewTab === tab.id;
                return `
                  <button onclick="switchViewTab('${tab.id}')"
                          class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-[9px] text-[13px] transition shrink-0 ${isActive ? 'bg-[#242428] border border-[#343439] text-[#F4F4F6] font-medium shadow-sm' : 'text-[#8E8E93] hover:text-[#E4E4E7] hover:bg-[#19191D] border border-transparent'}">
                    <span class="${isActive ? 'text-[#F4F4F6]' : 'text-[#7E7E86]'}">${tab.icon}</span>
                    <span>${tab.label}</span>
                  </button>
                `;
              }).join('')}
            </div>
          </div>

          <div class="h-px bg-[#202024] mx-6 sm:mx-9 shrink-0"></div>

          <div class="flex-1 overflow-auto px-6 sm:px-9 py-5">
            ${activeBoardHtml}
          </div>
        </div>
      `;
    }

    function renderKanbanBoard(course) {
      const columns = [
        { id: 'todo', title: 'To Do', barColor: '#7E7E87' },
        { id: 'completed', title: 'Done', barColor: '#10B981' }
      ];

      return `
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 items-start min-w-0">
          ${columns.map(col => {
            const colCards = col.id === 'todo'
              ? course.cards.filter(c => c.column !== 'completed')
              : course.cards.filter(c => c.column === 'completed');

            return `
              <section
                ondragover="handleDragOver(event)"
                ondragleave="handleDragLeave(event)"
                ondrop="handleDrop(event, '${col.id}')"
                class="kanban-column flex flex-col min-w-0 p-1.5 transition-colors"
              >
                <div class="flex items-center justify-between px-1 mb-4">
                  <div class="flex items-center gap-2.5">
                    <span class="w-[3px] h-[15px] rounded-full" style="background-color: ${col.barColor};"></span>
                    <h2 class="text-[15px] font-semibold text-[#E4E4E7]">${col.title}</h2>
                    <span class="text-[12px] text-[#6E6E77] font-medium">${colCards.length}</span>
                  </div>
                </div>

                <div class="space-y-4">
                  ${colCards.length === 0 ? `
                    <div class="border border-dashed border-[#27272E] rounded-[16px] p-8 text-center text-[13px] text-[#6E6E77]">
                      ${col.id === 'completed' ? 'Beantworte 30 Fragen in einem Modul richtig, damit es automatisch hier landet.' : 'Alle Themen in diesem Fach wurden abgeschlossen!'}
                    </div>
                  ` : colCards.map((card, idx) => renderNebulaCard(card, idx)).join('')}
                </div>
              </section>
            `;
          }).join('')}
        </div>
      `;
    }

    function renderListView(course) {
      return `
        <div class="space-y-3 max-w-4xl">
          ${course.cards.map(card => `
            <div onclick="openQuizPopup('${card.id}')"
                 class="flex items-center justify-between gap-4 bg-[#19191E] hover:bg-[#202026] border border-[#282830] rounded-[13px] px-5 py-4 cursor-pointer transition">
              <div class="flex items-center gap-3 min-w-0">
                <span class="w-2.5 h-2.5 rounded-full ${card.column === 'completed' ? 'bg-[#10B981]' : 'bg-[#60A5FA]'}"></span>
                <span class="text-[16px] font-bold text-[#F4F4F6] truncate">${escapeHtml(card.title)}</span>
              </div>
              <div class="flex items-center gap-3 shrink-0">
                ${renderSegmentedTicks(card.completedSteps, card.totalSteps)}
                <span class="text-[12.5px] font-semibold text-[#E4E4E7] w-14 text-right">${card.completedSteps}/${card.totalSteps}</span>
                <button type="button" onclick="event.stopPropagation(); openResetModuleModal('${card.id}')" title="Modul zurücksetzen"
                        class="w-7 h-7 rounded-[7px] bg-white/[0.04] hover:bg-[#EF4444]/20 text-[#8E8E93] hover:text-[#FCA5A5] flex items-center justify-center transition">↺</button>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderTimelineView(course) {
      return `
        <div class="space-y-4 max-w-4xl">
          ${course.cards.map(card => {
            const pct = card.totalSteps > 0 ? Math.round((card.completedSteps / card.totalSteps) * 100) : 0;
            return `
              <div onclick="openQuizPopup('${card.id}')"
                   class="bg-[#19191E] hover:bg-[#202026] border border-[#282830] rounded-[14px] p-5 cursor-pointer transition">
                <div class="flex items-center justify-between gap-3 mb-3">
                  <span class="text-[16px] font-bold text-[#F4F4F6]">${escapeHtml(card.title)}</span>
                  <div class="flex items-center gap-2.5">
                    <span class="text-[12.5px] font-semibold text-[#60A5FA]">${card.completedSteps}/${card.totalSteps} (${pct}%)</span>
                    <button type="button" onclick="event.stopPropagation(); openResetModuleModal('${card.id}')" title="Modul zurücksetzen"
                            class="w-7 h-7 rounded-[7px] bg-white/[0.04] hover:bg-[#EF4444]/20 text-[#8E8E93] hover:text-[#FCA5A5] flex items-center justify-center transition">↺</button>
                  </div>
                </div>
                <div class="w-full h-2.5 bg-[#111113] rounded-full overflow-hidden border border-[#252529]">
                  <div class="h-full bg-[#3B82F6] rounded-full transition-all" style="width: ${pct}%;"></div>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function renderTableView(course) {
      return `
        <div class="overflow-x-auto bg-[#161618] border border-[#242428] rounded-[14px]">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="border-b border-[#242428] text-[12px] text-[#8E8E93]">
                <th class="py-3.5 px-5 font-medium">Lernmodul</th>
                <th class="py-3.5 px-5 font-medium">Status</th>
                <th class="py-3.5 px-5 font-medium">Fortschritt</th>
                <th class="py-3.5 px-5 font-medium text-right">Aktion</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-[#222226] text-[13.5px]">
              ${course.cards.map(card => `
                <tr onclick="openQuizPopup('${card.id}')" class="hover:bg-[#1C1C22] cursor-pointer transition">
                  <td class="py-3.5 px-5 font-bold text-[#F4F4F6]">${escapeHtml(card.title)}</td>
                  <td class="py-3.5 px-5 text-[#A1A1AA]">${card.column === 'completed' ? 'Done' : 'To Do'}</td>
                  <td class="py-3.5 px-5">
                    <div class="flex items-center gap-2.5">
                      ${renderSegmentedTicks(card.completedSteps, card.totalSteps)}
                      <span class="text-[12px] text-[#E4E4E7]">${card.completedSteps}/${card.totalSteps}</span>
                    </div>
                  </td>
                  <td class="py-3.5 px-5 text-right">
                    <button type="button" onclick="event.stopPropagation(); openResetModuleModal('${card.id}')"
                            class="px-2.5 py-1 rounded-[7px] bg-white/[0.05] hover:bg-[#EF4444]/20 text-[11.5px] text-[#A1A1AA] hover:text-[#FCA5A5] transition">
                      ↺ Reset
                    </button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    // =========================================================================
    // 3C. KARTEN VIEW (Single Large 3D Flip Card + Subject Filter + Extra Button)
    // =========================================================================

    function renderInboxView() {
      const subjects = ['ALL', 'Rechnungswesen', 'Gesprächsgestaltung', 'Sozialkunde', 'Englisch', 'Kunden akquirieren und binden'];
      const filtered = appState.selectedFlashcardSubject === 'ALL'
        ? appState.flashcards
        : appState.flashcards.filter(c => c.subject === appState.selectedFlashcardSubject);

      const totalCount = filtered.length;
      const safeIdx = totalCount > 0 ? ((appState.flashcardPage || 0) % totalCount + totalCount) % totalCount : 0;
      const activeCard = totalCount > 0 ? filtered[safeIdx] : null;
      const isFlipped = activeCard ? !!appState.flippedFlashcardIds[activeCard.id] : false;
      const masteredCount = filtered.filter(c => c.mastered).length;

      const framePalettes = {
        Rechnungswesen: {
          borderGrad: 'linear-gradient(135deg, #F8FAFC 0%, #7DD3FC 45%, #38BDF8 100%)',
          glowColor: 'rgba(56, 189, 248, 0.34)',
          innerTint: 'rgba(56, 189, 248, 0.16)',
          glyphSvg: `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 2C4.34 2 3 3.34 3 5V19C3 20.66 4.34 22 6 22H18C19.66 22 21 20.66 21 19V5C21 3.34 19.66 2 18 2H6ZM7 6H17V9.5H7V6ZM8 12.5C8.83 12.5 9.5 13.17 9.5 14C9.5 14.83 8.83 15.5 8 15.5C7.17 15.5 6.5 14.83 6.5 14C6.5 13.17 7.17 12.5 8 12.5ZM12 12.5C12.83 12.5 13.5 13.17 13.5 14C13.5 14.83 12.83 15.5 12 15.5C11.17 15.5 10.5 14.83 10.5 14C10.5 13.17 11.17 12.5 12 12.5ZM16 12.5C16.83 12.5 17.5 13.17 17.5 14C17.5 14.83 16.83 15.5 16 15.5C15.17 15.5 14.5 14.83 14.5 14C14.5 13.17 15.17 12.5 16 12.5Z"/></svg>`
        },
        Gesprächsgestaltung: {
          borderGrad: 'linear-gradient(135deg, #F472B6 0%, #FB7185 45%, #FB923C 100%)',
          glowColor: 'rgba(251, 113, 133, 0.34)',
          innerTint: 'rgba(251, 146, 60, 0.16)',
          glyphSvg: `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3C6.48 3 2 6.92 2 11.75C2 14.2 3.16 16.41 5.04 18L4.1 21.35C3.96 21.84 4.44 22.27 4.91 22.07L8.78 20.43C9.81 20.67 10.89 20.8 12 20.8C17.52 20.8 22 16.88 22 12.05C22 7.22 17.52 3 12 3ZM8 13C7.17 13 6.5 12.33 6.5 11.5C6.5 10.67 7.17 10 8 10C8.83 10 9.5 10.67 9.5 11.5C9.5 12.33 8.83 13 8 13ZM12 13C11.17 13 10.5 12.33 10.5 11.5C10.5 10.67 11.17 10 12 10C12.83 10 13.5 10.67 13.5 11.5C13.5 12.33 12.83 13 12 13ZM16 13C15.17 13 14.5 12.33 14.5 11.5C14.5 10.67 15.17 10 16 10C16.83 10 17.5 10.67 17.5 11.5C17.5 12.33 16.83 13 16 13Z"/></svg>`
        },
        Sozialkunde: {
          borderGrad: 'linear-gradient(135deg, #3B82F6 0%, #8B5CF6 50%, #F0ABFC 100%)',
          glowColor: 'rgba(168, 85, 247, 0.34)',
          innerTint: 'rgba(139, 92, 246, 0.16)',
          glyphSvg: `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5L2.5 7.5V9.5H21.5V7.5L12 2.5ZM5 11V18H8V11H5ZM10.5 11V18H13.5V11H10.5ZM16 11V18H19V11H16ZM2.5 19.5V21.5H21.5V19.5H2.5Z"/></svg>`
        },
        Englisch: {
          borderGrad: 'linear-gradient(135deg, #FCA5A5 0%, #EF4444 50%, #B91C1C 100%)',
          glowColor: 'rgba(239, 68, 68, 0.34)',
          innerTint: 'rgba(239, 68, 68, 0.16)',
          glyphSvg: `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 2.5C6.75 2.5 2.5 6.75 2.5 12C2.5 17.25 6.75 21.5 12 21.5C17.25 21.5 21.5 17.25 21.5 12C21.5 6.75 17.25 2.5 12 2.5ZM7.2 8.2C7.2 7.54 7.74 7 8.4 7H15.6C16.26 7 16.8 7.54 16.8 8.2C16.8 8.86 16.26 9.4 15.6 9.4H8.4C7.74 9.4 7.2 8.86 7.2 8.2ZM7.2 12C7.2 11.34 7.74 10.8 8.4 10.8H13.6C14.26 10.8 14.8 11.34 14.8 12C14.8 12.66 14.26 13.2 13.6 13.2H8.4C7.74 13.2 7.2 12.66 7.2 12Z"/></svg>`
        },
        'Kunden akquirieren und binden': {
          borderGrad: 'linear-gradient(135deg, #6EE7B7 0%, #10B981 50%, #059669 100%)',
          glowColor: 'rgba(16, 185, 129, 0.34)',
          innerTint: 'rgba(16, 185, 129, 0.16)',
          glyphSvg: `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.2C11.55 21.2 11.12 21.03 10.78 20.73C5.8 16.25 2.75 13.45 2.75 9.65C2.75 6.55 5.15 4.2 8.2 4.2C9.95 4.2 11.6 5.02 12 6.25C12.4 5.02 14.05 4.2 15.8 4.2C18.85 4.2 21.25 6.55 21.25 9.65C21.25 13.45 18.2 16.25 13.22 20.73C12.88 21.03 12.45 21.2 12 21.2Z"/></svg>`
        }
      };

      const pal = activeCard ? (framePalettes[activeCard.subject] || framePalettes.Rechnungswesen) : framePalettes.Rechnungswesen;
      const slideClass = appState.flashcardSlideDir === 'next' ? 'slide-next' : appState.flashcardSlideDir === 'prev' ? 'slide-prev' : '';
      appState.flashcardSlideDir = '';

      return `
        <div class="flex-1 overflow-y-auto px-6 sm:px-9 py-7">
          <div class="max-w-[920px] mx-auto">

            <!-- Header -->
            <div class="flex items-center justify-between flex-wrap gap-3 mb-5">
              <div>
                <h1 class="text-[26px] font-bold text-[#F4F4F6] tracking-[-0.02em]">Karten</h1>
                <p class="text-[13px] text-[#8E8E93] mt-0.5">Klicke auf die Karteikarte zum Umdrehen • Markiere gewusste Karten über den Button darunter</p>
              </div>
              <span class="px-3.5 py-1.5 rounded-full bg-[#161619] border border-[#26262E] text-[12px] font-semibold text-[#60A5FA]">
                ${masteredCount} / ${totalCount} Gewusst
              </span>
            </div>

            <!-- Subject Filter Pills (Only Subject, no Thema filter) -->
            <div class="flex items-center gap-2 flex-wrap mb-6">
              ${subjects.map(subj => {
                const active = appState.selectedFlashcardSubject === subj;
                const label = subj === 'ALL' ? 'Alle Fächer' : subj;
                return `
                  <button onclick="selectFlashcardSubject('${subj}')"
                          class="px-3.5 py-1.5 rounded-full text-[12.5px] font-medium transition ${active ? 'bg-[#3B82F6] text-white shadow-md shadow-[#3B82F6]/20' : 'bg-[#161619] border border-[#24242B] text-[#8E8E93] hover:text-white'}">
                    ${escapeHtml(label)}
                  </button>
                `;
              }).join('')}
            </div>

            <!-- Deck Progress Pills -->
            ${totalCount > 0 ? `
              <div class="flex items-center gap-1.5 mb-5">
                ${filtered.map((fc, idx) => `
                  <button onclick="selectFlashcardByIndex(${idx})"
                          title="Karte ${idx + 1}"
                          class="h-1.5 flex-1 rounded-full transition-all duration-300 ${idx === safeIdx ? 'bg-[#3B82F6] scale-y-125' : fc.mastered ? 'bg-[#10B981]/65 hover:bg-[#10B981]' : 'bg-[#25252D] hover:bg-[#3A3A46]'}"></button>
                `).join('')}
              </div>
            ` : ''}

            <!-- Single Wide 3D Flip Flashcard in Neon Gradient Frame -->
            ${activeCard ? `
              <div class="flashcard-stage ${slideClass}">
                <div onmousemove="handleFolderCardMove(event, this)" onmouseleave="handleFolderCardLeave(this)" class="flashcard-tilt-shell">
                  <div id="flipper-${activeCard.id}"
                       onclick="flipFlashcard('${activeCard.id}')"
                       class="flashcard-flipper ${isFlipped ? 'is-flipped' : ''}"
                       style="--frame-border-gradient: ${pal.borderGrad}; --frame-glow: ${pal.glowColor}; --frame-inner-tint: ${pal.innerTint};">

                    <!-- FRONT FACE (Prüfungsfrage) -->
                    <div class="flashcard-face flashcard-face-front">
                      <div class="neon-frame-outer">
                        <div class="neon-frame-inner p-7 sm:p-9 flex flex-col justify-between">
                          <div class="neon-frame-shimmer pointer-events-none"></div>

                          <!-- Top Row: Solid Icon + Subject + Card Counter -->
                          <div class="relative z-10 flex items-center justify-between gap-3">
                            <div class="flex items-center gap-3">
                              <div class="card-glyph-badge w-10 h-10 rounded-[12px] bg-white/[0.06] border border-white/[0.1] flex items-center justify-center text-white">
                                ${pal.glyphSvg}
                              </div>
                              <div>
                                <div class="text-[13px] font-semibold text-[#F4F4F6]">${escapeHtml(activeCard.subject)}</div>
                                <div class="text-[11px] text-[#8E8E93]">Vorderseite • Frage</div>
                              </div>
                            </div>
                            <span class="px-3 py-1 rounded-full bg-white/[0.05] border border-white/[0.08] text-[11.5px] font-semibold text-[#A1A1AA]">
                              Karte ${safeIdx + 1} von ${totalCount}
                            </span>
                          </div>

                          <!-- Center Question -->
                          <div class="relative z-10 my-auto py-4">
                            <p class="text-[19px] sm:text-[22px] font-bold text-[#F4F4F6] leading-[1.42] tracking-[-0.015em]">
                              ${escapeHtml(activeCard.question)}
                            </p>
                          </div>

                          <!-- Bottom Flip Hint -->
                          <div class="relative z-10 flex items-center justify-between text-[12px] text-[#8E8E93] pt-3 border-t border-white/[0.06]">
                            <span>Klicken zum Umdrehen</span>
                            <span class="text-[#60A5FA] font-medium">Lösung anzeigen ↻</span>
                          </div>
                        </div>
                      </div>
                    </div>

                    <!-- BACK FACE (Antwort & Lösung — Front text completely hidden!) -->
                    <div class="flashcard-face flashcard-face-back">
                      <div class="neon-frame-outer">
                        <div class="neon-frame-inner is-back p-7 sm:p-9 flex flex-col justify-between">
                          <div class="neon-frame-shimmer pointer-events-none"></div>

                          <!-- Top Row -->
                          <div class="relative z-10 flex items-center justify-between gap-3">
                            <div class="flex items-center gap-3">
                              <div class="card-glyph-badge w-10 h-10 rounded-[12px] bg-[#10B981]/15 border border-[#10B981]/30 flex items-center justify-center text-[#34D399]">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                                  <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2.5C6.75 2.5 2.5 6.75 2.5 12C2.5 17.25 6.75 21.5 12 21.5C17.25 21.5 21.5 17.25 21.5 12C21.5 6.75 17.25 2.5 12 2.5ZM16.3 9.7C16.69 9.31 16.69 8.68 16.3 8.29C15.91 7.9 15.28 7.9 14.89 8.29L10.75 12.43L9.11 10.79C8.72 10.4 8.09 10.4 7.7 10.79C7.31 11.18 7.31 11.81 7.7 12.2L10.05 14.55C10.44 14.94 11.07 14.94 11.46 14.55L16.3 9.7Z" />
                                </svg>
                              </div>
                              <div>
                                <div class="text-[13px] font-semibold text-[#34D399]">Lösung &amp; Antwort</div>
                                <div class="text-[11px] text-[#8E8E93]">${escapeHtml(activeCard.subject)}</div>
                              </div>
                            </div>
                            <span class="px-3 py-1 rounded-full bg-white/[0.05] border border-white/[0.08] text-[11.5px] font-semibold text-[#A1A1AA]">
                              Karte ${safeIdx + 1} von ${totalCount}
                            </span>
                          </div>

                          <!-- Center Answer -->
                          <div class="relative z-10 my-auto py-4">
                            <p class="text-[18px] sm:text-[20.5px] font-semibold text-[#F4F4F6] leading-[1.48]">
                              ${escapeHtml(activeCard.answer)}
                            </p>
                          </div>

                          <!-- Bottom Flip Back Hint -->
                          <div class="relative z-10 flex items-center justify-between text-[12px] text-[#8E8E93] pt-3 border-t border-white/[0.06]">
                            <span>Klicken für die Frage</span>
                            <span class="text-[#34D399] font-medium">Zurück zur Frage ↺</span>
                          </div>
                        </div>
                      </div>
                    </div>

                  </div>
                </div>
              </div>

              <!-- Controls Row Below Card (Navigation + Dedicated "Gewusst" Button) -->
              <div class="mt-5 flex items-center justify-between flex-wrap gap-3">
                <div class="flex items-center gap-2">
                  <button onclick="prevFlashcard()" class="px-4 py-2.5 rounded-[11px] bg-[#161619] hover:bg-[#1E1E24] border border-[#26262F] text-[13px] font-medium text-[#E4E4E7] transition">
                    ← Vorherige
                  </button>
                  <button onclick="flipFlashcard('${activeCard.id}')" class="px-4 py-2.5 rounded-[11px] bg-[#161619] hover:bg-[#1E1E24] border border-[#26262F] text-[13px] font-medium text-[#E4E4E7] transition">
                    Karte umdrehen
                  </button>
                  <button onclick="nextFlashcard()" class="px-4 py-2.5 rounded-[11px] bg-[#161619] hover:bg-[#1E1E24] border border-[#26262F] text-[13px] font-medium text-[#E4E4E7] transition">
                    Nächste →
                  </button>
                </div>

                <!-- Separate Explicit Button for Marking "Gewusst" -->
                <button onclick="markFlashcard('${activeCard.id}', ${!activeCard.mastered})"
                        class="px-5 py-2.5 rounded-[11px] text-[13px] font-semibold transition flex items-center gap-2 ${activeCard.mastered ? 'bg-[#10B981]/20 border border-[#10B981]/45 text-[#34D399]' : 'bg-[#3B82F6] hover:bg-[#2563EB] text-white shadow-lg shadow-[#3B82F6]/20'}">

    // =========================================================================
    // 3D. CALENDAR VIEW (Chrono-Matrix + HUD Reticles + Countdown Passes)
    // =========================================================================

    function renderCalendarView() {
      const monthNames = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
      const year = appState.calendarYear;
      const month = appState.calendarMonth;
      const firstDayRaw = new Date(year, month, 1).getDay();
      const startOffset = firstDayRaw === 0 ? 6 : firstDayRaw - 1;
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const daysHeader = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
      const todayIso = getTodayIsoKey();

      const subjectAccentMap = {
        Rechnungswesen: { hex: '#60A5FA', rgb: '59, 130, 246' },
        Gesprächsgestaltung: { hex: '#FB923C', rgb: '249, 115, 22' },
        Sozialkunde: { hex: '#C084FC', rgb: '168, 85, 247' },
        Englisch: { hex: '#F87171', rgb: '239, 68, 68' },
        'Kunden akquirieren und binden': { hex: '#34D399', rgb: '16, 185, 129' }
      };

      const filteredExams = [...appState.exams]
        .filter(e => appState.calendarSubjectFilter === 'ALL' || e.subject === appState.calendarSubjectFilter)
        .sort((a, b) => a.date.localeCompare(b.date));

      const slideClass = appState.calendarSlideDir === 'next'
        ? 'cal-month-slide-next'
        : appState.calendarSlideDir === 'prev'
          ? 'cal-month-slide-prev'
          : '';
      appState.calendarSlideDir = '';

      const getCountdownMeta = (isoDate) => {
        const now = new Date();
        now.setHours(0, 0, 0, 0);
        const target = new Date(isoDate + 'T00:00:00');
        const diff = Math.round((target - now) / (1000 * 60 * 60 * 24));
        const pct = diff <= 0 ? 100 : Math.max(12, Math.min(95, Math.round(100 - (diff / 30) * 100)));
        const label = diff < 0 ? 'Vorbei' : diff === 0 ? 'Heute' : diff === 1 ? '1d' : `${diff}d`;
        return { diff, pct, label };
      };

      const filterSubjects = ['ALL', ...COURSES.map(c => c.title)];

      return `
        <div class="flex-1 overflow-y-auto px-6 sm:px-9 py-7 max-w-6xl">
          <div class="flex items-center justify-between flex-wrap gap-4 mb-5">
            <div>
              <h1 class="text-[26px] font-bold text-[#F4F4F6] tracking-[-0.02em]">Klassenarbeiten &amp; Test-Kalender</h1>
              <p class="text-[13px] text-[#8E8E93] mt-0.5">Klicke auf einen Tag, um eine Prüfung einzutragen und Themen festzuhalten</p>
            </div>
            <button onclick="openAddExamModal()" class="dash-cta-pill px-4 py-2 rounded-full bg-[#3B82F6] hover:bg-[#2563EB] text-white text-[12.5px] font-semibold shadow-lg shadow-[#3B82F6]/20 transition">
              + Termin eintragen
            </button>
          </div>

          <!-- Subject Filter Pills -->
          <div class="flex items-center gap-2 flex-wrap mb-5">
            ${filterSubjects.map(subj => {
              const active = appState.calendarSubjectFilter === subj;
              return `
                <button onclick="selectCalendarSubjectFilter('${subj}')"
                        class="px-3 py-1 rounded-full text-[12px] font-medium transition ${active ? 'bg-[#3B82F6] text-white' : 'bg-[#161619] border border-[#24242B] text-[#8E8E93] hover:text-white'}">
                  ${subj === 'ALL' ? 'Alle Fächer' : escapeHtml(subj)}
                </button>
              `;
            }).join('')}
          </div>

          <div class="grid grid-cols-1 xl:grid-cols-12 gap-6 items-start">
            <!-- Left 7 Cols: Chrono-Matrix Monthly Grid -->
            <div onmousemove="handleCalendarGridMove(event, this)"
                 class="xl:col-span-7 cal-matrix-shell cal-matrix-scanlines p-5">
              <div class="cal-grid-magnetic-glow absolute inset-0 pointer-events-none"></div>

              <div class="relative z-10 flex items-center justify-between mb-4">
                <h2 class="text-[16px] font-bold text-[#F4F4F6] tracking-[-0.01em]">${monthNames[month]} ${year}</h2>
                <div class="flex items-center gap-1.5">
                  <button onclick="changeCalendarMonth(-1)" class="px-2.5 py-1 rounded-[8px] bg-[#1E1E24] hover:bg-[#282830] border border-[#2C2C35] text-[12px] text-[#E4E4E7] transition">←</button>
                  <button onclick="appState.calendarMonth = new Date().getMonth(); appState.calendarYear = new Date().getFullYear(); appState.calendarSlideDir = 'next'; renderWorkspace();"
                          class="px-2.5 py-1 rounded-[8px] bg-[#1E1E24] hover:bg-[#282830] border border-[#2C2C35] text-[11.5px] font-medium text-[#60A5FA] transition">Heute</button>
                  <button onclick="changeCalendarMonth(1)" class="px-2.5 py-1 rounded-[8px] bg-[#1E1E24] hover:bg-[#282830] border border-[#2C2C35] text-[12px] text-[#E4E4E7] transition">→</button>
                </div>
              </div>

              <div class="relative z-10 grid grid-cols-7 gap-2 mb-2 text-center text-[11px] font-semibold uppercase tracking-wider text-[#7E7E87]">
                ${daysHeader.map(d => `<div class="py-1">${d}</div>`).join('')}
              </div>

              <div class="relative z-10 grid grid-cols-7 gap-2 ${slideClass}">
                ${Array.from({ length: startOffset }).map(() => `<div class="min-h-[78px] rounded-[13px] bg-[#131317]/40 border border-white/[0.02]"></div>`).join('')}
                ${Array.from({ length: daysInMonth }, (_, i) => {
                  const dayNum = i + 1;
                  const iso = `${year}-${String(month + 1).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}`;
                  const isToday = iso === todayIso;
                  const dayExams = filteredExams.filter(e => e.date === iso);
                  const waveIdx = Math.floor((startOffset + i) / 7) + ((startOffset + i) % 7);

                  return `
                    <div onclick="openAddExamModal('${iso}')"
                         style="--wave: ${waveIdx};"
                         class="cal-day-tile ${isToday ? 'is-today' : ''} ${dayExams.length > 0 ? 'has-exam' : ''} min-h-[78px] p-2 cursor-pointer flex flex-col justify-between">
                      <span class="cal-reticle cal-reticle-tl"></span>
                      <span class="cal-reticle cal-reticle-br"></span>

                      <div class="flex items-center justify-between">
                        <span class="relative inline-flex items-center justify-center w-6 h-6 rounded-full text-[11.5px] font-semibold ${isToday ? 'bg-[#3B82F6] text-white' : 'text-[#A1A1AA]'}">
                          ${isToday ? '<span class="cal-today-orbit"></span>' : ''}
                          ${dayNum}
                        </span>
                      </div>

                      <div class="mt-1 space-y-1">
                        ${dayExams.map(ex => {
                          const acc = subjectAccentMap[ex.subject] || { hex: '#60A5FA', rgb: '59, 130, 246' };
                          return `
                            <div onclick="event.stopPropagation(); openExamDetailModal('${ex.id}')"
                                 style="background: rgba(${acc.rgb}, 0.18); border-color: rgba(${acc.rgb}, 0.4); color: ${acc.hex};"
                                 class="px-1.5 py-0.5 rounded-[5px] border text-[9.5px] font-semibold truncate">
                              ${escapeHtml(ex.subject)}
                            </div>
                          `;
                        }).join('')}
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>

            <!-- Right 5 Cols: Countdown Exam Cards -->
            <div class="xl:col-span-5 space-y-3.5">
              <div class="flex items-center justify-between">
                <h2 class="text-[15px] font-semibold text-[#F4F4F6]">Prüfungs-Fahrplan (${filteredExams.length})</h2>
              </div>

              ${filteredExams.length === 0 ? `
                <div class="exam-chrono-card p-6 text-center text-[13px] text-[#8E8E93]">
                  Keine Termine für diese Auswahl eingetragen. Klicke auf einen Kalendertag oder „+ Termin eintragen“.
                </div>
              ` : filteredExams.map((ex, idx) => {
                const acc = subjectAccentMap[ex.subject] || { hex: '#60A5FA', rgb: '59, 130, 246' };
                const cd = getCountdownMeta(ex.date);
                const r = 15;
                const c = 2 * Math.PI * r;
                const off = c - (cd.pct / 100) * c;
                const targetCourse = COURSES.find(course => course.title === ex.subject);

                return `
                  <div style="--stagger: ${idx}; --subj-hex: ${acc.hex}; --subj-rgb: ${acc.rgb};"
                       class="exam-chrono-card p-4 pl-5">
                    <div class="exam-chrono-bar"></div>

                    <div class="flex items-start justify-between gap-3 mb-2">
                      <div>
                        <div class="flex items-center gap-2 flex-wrap mb-1">
                          <span style="color: ${acc.hex};" class="text-[12px] font-bold">${escapeHtml(ex.subject)}</span>
                          <span class="text-[10.5px] px-2 py-0.5 rounded bg-white/[0.06] text-[#D4D4D8]">${escapeHtml(ex.type)}</span>
                          <span class="text-[11.5px] font-medium text-[#8E8E93]">${formatGermanDate(ex.date)}</span>
                        </div>
                        <h3 class="text-[15px] font-bold text-[#F4F4F6]">${escapeHtml(ex.title)}</h3>
                      </div>

                      <!-- Radial Countdown Ring -->
                      <div class="flex items-center gap-1.5 shrink-0">
                        <div class="relative w-10 h-10 flex items-center justify-center">
                          <svg class="w-full h-full -rotate-90" viewBox="0 0 38 38">
                            <circle cx="19" cy="19" r="${r}" fill="none" stroke="#23232B" stroke-width="3" />
                            <circle cx="19" cy="19" r="${r}" fill="none" stroke="${acc.hex}" stroke-width="3"
                                    stroke-linecap="round"
                                    stroke-dasharray="${c.toFixed(1)}"
                                    stroke-dashoffset="${off.toFixed(1)}" />
                          </svg>
                          <span class="absolute text-[9.5px] font-bold text-[#F4F4F6]">${cd.label}</span>
                        </div>
                        <button onclick="deleteExam('${ex.id}')" title="Termin löschen" class="text-[#78787F] hover:text-[#F87171] text-[12px] p-1">✕</button>
                      </div>
                    </div>

                    <div class="bg-[#101014] border border-[#22222A] rounded-[10px] p-3 mb-3">
                      <div class="text-[10.5px] font-semibold uppercase tracking-wider mb-1" style="color: ${acc.hex};">Was kommt dran?</div>
                      <p class="text-[12.5px] text-[#C4C4CC] leading-relaxed whitespace-pre-line">${escapeHtml(ex.topics)}</p>
                    </div>

                    ${targetCourse ? `
                      <button onclick="openSubjectBoard('${targetCourse.id}')"
                              style="color: ${acc.hex};"
                              class="text-[12px] font-semibold hover:underline inline-flex items-center gap-1">
                        Fach jetzt üben →
                      </button>
                    ` : ''}
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 4. INTERACTIVE 6-QUESTION QUIZ POP-UP (30 Correct Answers = Done!)
    // =========================================================================

    function buildQuizRound(cardId) {
      const pool = QUESTION_POOLS[cardId] || [];
      if (pool.length === 0) return [];
      const seenSet = new Set(appState.seenQuestionIds[cardId] || []);
      let unseen = pool.map((q, idx) => ({ ...q, poolIndex: idx })).filter(q => !seenSet.has(q.poolIndex));
      if (unseen.length < 6) {
        appState.seenQuestionIds[cardId] = [];
        unseen = pool.map((q, idx) => ({ ...q, poolIndex: idx }));
      }
      for (let i = unseen.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [unseen[i], unseen[j]] = [unseen[j], unseen[i]];
      }
      const selected = unseen.slice(0, Math.min(6, unseen.length));
      const updatedSeen = new Set(appState.seenQuestionIds[cardId] || []);
      selected.forEach(q => updatedSeen.add(q.poolIndex));
      appState.seenQuestionIds[cardId] = Array.from(updatedSeen);
      return selected;
    }

    function openQuizPopup(cardId) {
      const card = getCardById(cardId);
      if (!card) return;
      const questions = buildQuizRound(cardId);
      if (questions.length === 0) {
        openModuleDrawer(cardId);
        return;
      }

      appState.activeQuizSession = {
        cardId,
        questions,
        currentIndex: 0,
        selectedOption: null,
        showTip: false,
        correctCount: 0,
        finished: false
      };

      const overlay = document.getElementById('quiz-popup-overlay');
      if (overlay) {
        overlay.classList.remove('hidden');
        overlay.classList.add('flex');
      }
      renderQuizPopup();
    }

    function closeQuizPopup() {
      appState.activeQuizSession = null;
      const overlay = document.getElementById('quiz-popup-overlay');
      if (overlay) {
        overlay.classList.add('hidden');
        overlay.classList.remove('flex');
      }
    }

    function selectQuizOption(optionIdx) {
      const session = appState.activeQuizSession;
      if (!session || session.selectedOption !== null) return;
      session.selectedOption = optionIdx;
      const currentQ = session.questions[session.currentIndex];
      const isCorrect = optionIdx === currentQ.correctIndex;

      if (isCorrect) {
        session.correctCount += 1;
        const card = getCardById(session.cardId);
        if (card) {
          card.completedSteps = Math.min(card.totalSteps, card.completedSteps + 1);
          if (card.completedSteps >= card.totalSteps) {
            card.column = 'completed';
          }
        }
        recordLessonCompletion(1);
        savePersistedState();
        triggerAutoSync();
        renderWorkspace();
      }
      renderQuizPopup();
    }

    function toggleQuizTip() {
      const session = appState.activeQuizSession;
      if (!session) return;
      session.showTip = !session.showTip;
      renderQuizPopup();
    }

    function skipQuizQuestion() {
      const session = appState.activeQuizSession;
      if (!session) return;
      if (session.currentIndex + 1 < session.questions.length) {
        session.currentIndex += 1;
        session.selectedOption = null;
        session.showTip = false;
      } else {
        session.finished = true;
      }
      renderQuizPopup();
    }

    function nextQuizQuestion() {
      const session = appState.activeQuizSession;
      if (!session) return;
      if (session.currentIndex + 1 < session.questions.length) {
        session.currentIndex += 1;
        session.selectedOption = null;
        session.showTip = false;
      } else {
        session.finished = true;
      }
      renderQuizPopup();
    }

    function renderQuizPopup() {
      const box = document.getElementById('quiz-popup-box');
      const session = appState.activeQuizSession;
      if (!box || !session) return;

      const card = getCardById(session.cardId);
      const totalQ = session.questions.length;

      if (session.finished) {
        const isDone = card && card.completedSteps >= card.totalSteps;
        box.innerHTML = `
          <div class="quiz-glass-card p-6 sm:p-7 text-center animate-scale-in"
               style="--quiz-ambient-glow: radial-gradient(95% 65% at 50% 0%, rgba(16, 185, 129, 0.28) 0%, rgba(19, 21, 20, 0) 72%);">
            <div class="w-12 h-12 rounded-full bg-[#10B981]/20 border border-[#10B981]/40 text-[#34D399] flex items-center justify-center mx-auto mb-3 text-[20px] font-bold">
              ✓
            </div>
            <h3 class="text-[20px] font-bold text-[#F4F4F6] mb-1">Runde abgeschlossen!</h3>
            <p class="text-[13.5px] text-[#9A9AA4] mb-4">
              Du hast <strong class="text-[#F4F4F6]">${session.correctCount} von ${totalQ}</strong> Fragen richtig beantwortet.
              ${card ? `<br/>Gesamtstand in diesem Modul: <strong class="text-[#60A5FA]">${card.completedSteps} / ${card.totalSteps}</strong> ${isDone ? '— 🎉 Modul abgeschlossen (Done)!' : ''}` : ''}
            </p>
            <div class="flex items-center justify-center gap-2.5 flex-wrap">
              <button onclick="openQuizPopup('${session.cardId}')"
                      class="px-4 py-2.5 rounded-full bg-[#3B82F6] hover:bg-[#2563EB] text-white text-[13px] font-semibold transition">
                Nächste 6 Fragen
              </button>
              <button onclick="closeQuizPopup()"
                      class="px-4 py-2.5 rounded-full bg-[#222228] hover:bg-[#2B2B33] text-[#E4E4E7] text-[13px] font-medium transition">
                Schließen
              </button>
            </div>
          </div>
        `;
        return;
      }

      const q = session.questions[session.currentIndex];
      const hasAnswered = session.selectedOption !== null;
      const isCorrect = session.selectedOption === q.correctIndex;
      const ambientGlow = !hasAnswered
        ? 'radial-gradient(95% 65% at 50% 0%, rgba(59, 130, 246, 0.22) 0%, rgba(19, 21, 20, 0) 72%)'
        : isCorrect
          ? 'radial-gradient(95% 65% at 50% 0%, rgba(16, 185, 129, 0.28) 0%, rgba(19, 21, 20, 0) 72%)'
          : 'radial-gradient(95% 65% at 50% 0%, rgba(239, 68, 68, 0.28) 0%, rgba(19, 21, 20, 0) 72%)';

      box.innerHTML = `
        <div class="quiz-glass-card p-6 sm:p-7 animate-scale-in" style="--quiz-ambient-glow: ${ambientGlow};">
          <!-- Top Bar -->
          <div class="flex items-center justify-between gap-2 mb-4">
            <span class="px-3 py-1 rounded-full bg-white/[0.06] border border-white/[0.1] text-[11.5px] font-semibold text-[#E4E4E7]">
              Frage ${session.currentIndex + 1} / ${totalQ}
            </span>
            <div class="flex items-center gap-2">
              ${card ? `<span class="text-[11.5px] font-semibold text-[#60A5FA]">${card.completedSteps}/${card.totalSteps}</span>` : ''}
              <button onclick="closeQuizPopup(); openModuleDrawer('${session.cardId}')"
                      title="Lernstoff &amp; Theorie öffnen"
                      class="px-2.5 py-1 rounded-full bg-white/[0.06] hover:bg-white/[0.12] text-[11px] font-medium text-[#D4D4D8] transition">
                Lernstoff
              </button>
              <button onclick="closeQuizPopup()" class="w-7 h-7 rounded-full bg-white/[0.06] hover:bg-white/[0.14] text-[#9A9AA4] hover:text-white flex items-center justify-center text-[13px] transition">
                ✕
              </button>
            </div>
          </div>

          <!-- Progress Pills -->
          <div class="flex items-center gap-1.5 mb-5">
            ${session.questions.map((_, idx) => `
              <div class="h-1 flex-1 rounded-full ${idx < session.currentIndex ? 'bg-[#10B981]' : idx === session.currentIndex ? 'bg-[#3B82F6]' : 'bg-white/[0.12]'}"></div>
            `).join('')}
          </div>

          <!-- Question Text -->
          <h3 class="text-[16.5px] sm:text-[17.5px] font-bold text-[#F4F4F6] leading-[1.4] mb-4">
            ${escapeHtml(q.question)}
          </h3>

          <!-- Answer Options (Shows BOTH wrong red ✕ and correct green ✓ when wrong!) -->
          <div class="space-y-2.5 mb-4">
            ${q.options.map((opt, idx) => {
              let rowClass = 'bg-white/[0.04] hover:bg-white/[0.08] border-white/[0.09] text-[#E4E4E7]';
              let iconHtml = `<span class="w-5 h-5 rounded-full border border-white/20 text-[11px] flex items-center justify-center shrink-0 text-[#9A9AA4]">${String.fromCharCode(65 + idx)}</span>`;

              if (hasAnswered) {
                if (idx === q.correctIndex) {
                  rowClass = 'bg-[#10B981]/20 border-[#10B981]/60 text-[#6EE7B7] font-semibold';
                  iconHtml = `<span class="w-5 h-5 rounded-full bg-[#10B981] text-[#052E16] text-[11px] font-bold flex items-center justify-center shrink-0">✓</span>`;
                } else if (idx === session.selectedOption) {
                  rowClass = 'bg-[#EF4444]/20 border-[#EF4444]/60 text-[#FCA5A5] font-semibold';
                  iconHtml = `<span class="w-5 h-5 rounded-full bg-[#EF4444] text-white text-[11px] font-bold flex items-center justify-center shrink-0">✕</span>`;
                } else {
                  rowClass = 'bg-white/[0.02] border-white/[0.05] text-[#787882] opacity-65';
                }
              }

              return `
                <button onclick="selectQuizOption(${idx})"
                        ${hasAnswered ? 'disabled' : ''}
                        class="w-full text-left p-3.5 rounded-[14px] border text-[13.5px] leading-snug transition flex items-center gap-3 ${rowClass}">
                  ${iconHtml}
                  <span class="flex-1">${escapeHtml(opt)}</span>
                </button>
              `;
            }).join('')}
          </div>

          <!-- Optional Tip Box -->
          ${session.showTip && !hasAnswered ? `
            <div class="mb-4 p-3 rounded-[12px] bg-[#F59E0B]/12 border border-[#F59E0B]/30 text-[12.5px] text-[#FDE68A] leading-relaxed">

        </div>
      `;

    function renderSearchResults(query) {
      const q = query.trim().toLowerCase();
      const allCards = COURSES.flatMap(course => course.cards.map(card => ({ ...card, courseTitle: course.title, courseId: course.id })));
      const matches = q
        ? allCards.filter(c => c.title.toLowerCase().includes(q) || c.summary.toLowerCase().includes(q) || c.courseTitle.toLowerCase().includes(q))
        : allCards;

      if (matches.length === 0) {
        return `<div class="py-8 text-center text-[13px] text-[#78787F]">Keine passenden Lernmodule gefunden.</div>`;
      }

      return matches.map(m => `
        <button onclick="selectSearchResult('${m.courseId}', '${m.id}')"
                class="w-full text-left p-2.5 rounded-[8px] hover:bg-[#222227] flex items-center justify-between gap-3 transition">
          <div>
            <div class="text-[13.5px] font-medium text-[#F4F4F6]">${escapeHtml(m.title)}</div>
            <div class="text-[11.5px] text-[#78787F]">${escapeHtml(m.courseTitle)}</div>
          </div>
          <span class="text-[12px] text-[#60A5FA] font-medium">${m.completedSteps}/${m.totalSteps}</span>
        </button>
      `).join('');
    }

    function filterSearchResults(val) {
      const list = document.getElementById('search-results-list');
      if (list) list.innerHTML = renderSearchResults(val);
    }

    function resetSingleModuleProgress(cardId) {
      const card = getCardById(cardId);
      if (!card) return;
      card.completedSteps = 0;
      card.column = 'todo';
      if (Array.isArray(card.checklist)) {
        card.checklist.forEach(item => { item.done = false; });
      }
      if (appState.seenQuestionIds && appState.seenQuestionIds[cardId]) {
        delete appState.seenQuestionIds[cardId];
      }
      savePersistedState();
      if (appState.selectedCardId === cardId) {
        renderModuleDrawerContent();
      }
      renderWorkspace();
      showToast(`Lernstand von „${card.title}“ auf 0/30 zurückgesetzt`);

    function handleFolderCardMove(event, cardEl) {
      const rect = cardEl.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;
      const centerX = rect.width / 2;
      const centerY = rect.height / 2;
      const rotateX = ((y - centerY) / centerY) * -3.5;
      const rotateY = ((x - centerX) / centerX) * 3.5;

      cardEl.style.setProperty('--mouse-x', `${x}px`);
      cardEl.style.setProperty('--mouse-y', `${y}px`);
      cardEl.style.setProperty('--tilt-x', `${rotateX.toFixed(2)}deg`);
      cardEl.style.setProperty('--tilt-y', `${rotateY.toFixed(2)}deg`);
    }

    function handleFolderCardLeave(cardEl) {
      cardEl.style.setProperty('--tilt-x', '0deg');
      cardEl.style.setProperty('--tilt-y', '0deg');
    }

      if (open) {
        sidebar.classList.remove('-translate-x-full');
        backdrop.classList.remove('hidden');
      } else {
        sidebar.classList.add('-translate-x-full');
        backdrop.classList.add('hidden');
      }
    }

    // Drag & Drop handlers
    function handleDragStart(event, cardId) {
      appState.draggedCardId = cardId;
      event.currentTarget.classList.add('dragging');
      event.dataTransfer.effectAllowed = 'move';
    }

    function handleDragEnd(event) {
      event.currentTarget.classList.remove('dragging');
      document.querySelectorAll('.kanban-column').forEach(col => col.classList.remove('drag-over'));
    }

    function handleDragOver(event) {
      event.preventDefault();
      event.currentTarget.classList.add('drag-over');
    }

    function handleDragLeave(event) {
      event.currentTarget.classList.remove('drag-over');
    }

    function handleDrop(event, targetColumn) {
      event.preventDefault();
      event.currentTarget.classList.remove('drag-over');
      if (!appState.draggedCardId) return;
      moveCardColumn(appState.draggedCardId, targetColumn);
      appState.draggedCardId = null;
    }

    function moveCardColumn(cardId, targetColumn) {
      const card = getCardById(cardId);
      if (!card) return;
      card.column = targetColumn;
      if (targetColumn === 'completed') {
        card.completedSteps = card.totalSteps;
      }
      savePersistedState();
      triggerAutoSync();
      renderWorkspace();
      if (appState.selectedCardId === cardId) {
        renderModuleDrawerContent();
      }
      showToast(`Modul nach „${targetColumn === 'todo' ? 'To Do' : 'Done'}“ verschoben`);
    }

    function adjustSteps(cardId, delta) {
      const card = getCardById(cardId);
      if (!card) return;
      const prev = card.completedSteps;
      card.completedSteps = Math.max(0, Math.min(card.totalSteps, card.completedSteps + delta));
      if (card.completedSteps >= card.totalSteps) {
        card.column = 'completed';
      } else {
        card.column = 'todo';
      }
      if (card.completedSteps > prev) {
        recordLessonCompletion(card.completedSteps - prev);
      }
      savePersistedState();
      triggerAutoSync();
      renderWorkspace();
      renderModuleDrawerContent();
    }

    function toggleChecklistItem(cardId, itemIdx) {
      const card = getCardById(cardId);
      if (!card || !card.checklist[itemIdx]) return;
      const item = card.checklist[itemIdx];
      item.done = !item.done;
      card.completedSteps = Math.max(0, Math.min(card.totalSteps, card.completedSteps + (item.done ? 1 : -1)));
      card.column = card.completedSteps >= card.totalSteps ? 'completed' : 'todo';
      if (item.done) recordLessonCompletion(1);
      savePersistedState();
      triggerAutoSync();
      renderWorkspace();
      renderModuleDrawerContent();
    }

    function addModuleNote(event, cardId) {
      event.preventDefault();
      const input = document.getElementById('new-note-input');
      if (!input || !input.value.trim()) return;
      const card = getCardById(cardId);
      if (!card) return;
      card.notes.unshift({
        author: appState.userName,
        time: 'Gerade eben',
        text: input.value.trim()
      });
      card.notesCount = card.notes.length;
      savePersistedState();
      triggerAutoSync();
      renderWorkspace();
      renderModuleDrawerContent();
      showToast('Lernnotiz gespeichert');
    }

    // Calendar & Exam handlers
    function changeCalendarMonth(delta) {
      let m = appState.calendarMonth + delta;
      let y = appState.calendarYear;
      if (m < 0) { m = 11; y -= 1; }
      if (m > 11) { m = 0; y += 1; }
      appState.calendarMonth = m;
      appState.calendarYear = y;
      appState.calendarSlideDir = delta >= 0 ? 'next' : 'prev';
      renderWorkspace();
    }

    function selectCalendarSubjectFilter(subj) {
      appState.calendarSubjectFilter = subj;
      renderWorkspace();
    }

    function handleCalendarGridMove(event, el) {
      const rect = el.getBoundingClientRect();
      el.style.setProperty('--grid-x', `${event.clientX - rect.left}px`);
      el.style.setProperty('--grid-y', `${event.clientY - rect.top}px`);
    }

    function submitNewExam(event) {
      event.preventDefault();
      const subject = document.getElementById('exam-subject-input')?.value || 'Rechnungswesen';
      const type = document.getElementById('exam-type-input')?.value || 'Klassenarbeit';
      const date = document.getElementById('exam-date-input')?.value;
      const title = document.getElementById('exam-title-input')?.value.trim();
      const topics = document.getElementById('exam-topics-input')?.value.trim();
      if (!date || !title || !topics) return;

      appState.exams.push({
        id: 'exam-' + Date.now(),
        date,
        subject,
        type,
        title,
        topics
      });
      appState.notifications.unshift({
        id: 'notif-' + Date.now(),
        title: `Neuer Prüfungstermin: ${subject}`,
        desc: `${title} am ${formatGermanDate(date)} eingetragen.`,
        time: 'Gerade eben',
        unread: true
      });
      const badge = document.getElementById('notif-badge');
      if (badge) badge.classList.remove('hidden');

      savePersistedState();
      triggerAutoSync();
      closeModal();
      renderWorkspace();
      showToast('Klassenarbeit / Test im Kalender gespeichert');
    }

    function deleteExam(examId) {
      appState.exams = appState.exams.filter(e => e.id !== examId);
      savePersistedState();
      triggerAutoSync();
      renderWorkspace();
      showToast('Termin entfernt');
    }

    // Karten (Flashcards) & Quick Notes handlers
    function selectFlashcardSubject(subj) {
      appState.selectedFlashcardSubject = subj;
      appState.flashcardPage = 0;
      appState.flippedFlashcardIds = {};
      savePersistedState();
      renderWorkspace();
    }

    function flipFlashcard(cardId) {
      if (!cardId) return;
      appState.flippedFlashcardIds[cardId] = !appState.flippedFlashcardIds[cardId];
      const flipper = document.getElementById(`flipper-${cardId}`);
      if (flipper) {
        flipper.classList.toggle('is-flipped', !!appState.flippedFlashcardIds[cardId]);
      } else {
        renderWorkspace();
      }
    }

    function nextFlashcard() {
      const filtered = appState.selectedFlashcardSubject === 'ALL'
        ? appState.flashcards
        : appState.flashcards.filter(c => c.subject === appState.selectedFlashcardSubject);
      if (filtered.length === 0) return;
      appState.flashcardPage = ((appState.flashcardPage || 0) + 1) % filtered.length;
      appState.flashcardSlideDir = 'next';
      appState.flippedFlashcardIds = {};
      savePersistedState();
      renderWorkspace();
    }

    function prevFlashcard() {
      const filtered = appState.selectedFlashcardSubject === 'ALL'
        ? appState.flashcards
        : appState.flashcards.filter(c => c.subject === appState.selectedFlashcardSubject);
      if (filtered.length === 0) return;
      appState.flashcardPage = ((appState.flashcardPage || 0) - 1 + filtered.length) % filtered.length;
      appState.flashcardSlideDir = 'prev';
      appState.flippedFlashcardIds = {};
      savePersistedState();
      renderWorkspace();
    }

    function selectFlashcardByIndex(idx) {
      appState.flashcardSlideDir = idx >= (appState.flashcardPage || 0) ? 'next' : 'prev';
      appState.flashcardPage = idx;
      appState.flippedFlashcardIds = {};
      savePersistedState();
      renderWorkspace();
    }

    function markFlashcard(cardId, mastered) {
      const card = appState.flashcards.find(c => c.id === cardId);
      if (card) card.mastered = mastered;
      if (mastered) recordLessonCompletion(1);
      savePersistedState();
      triggerAutoSync();
      renderWorkspace();
      showToast(mastered ? 'Als gewusst markiert' : 'Markierung „Gewusst“ aufgehoben');
    }

    function addQuickNote(event) {
      event.preventDefault();
      const subject = document.getElementById('quick-note-subject')?.value || 'Rechnungswesen';
      const input = document.getElementById('quick-note-text');
      if (!input || !input.value.trim()) return;
      appState.quickNotes.unshift({
        id: 'qn-' + Date.now(),
        subject,
        text: input.value.trim(),
        time: 'Gerade eben'
      });
      savePersistedState();
      triggerAutoSync();
      renderWorkspace();
      showToast('Merkzettel hinzugefügt');
    }

    function deleteQuickNote(noteId) {
      appState.quickNotes = appState.quickNotes.filter(n => n.id !== noteId);
      savePersistedState();
      triggerAutoSync();
      renderWorkspace();
    }

    // Settings, Themes & Handy/PC Sync handlers
    function adjustTodayProgress(delta) {
      shouldAnimateDashboard = false;
      recordLessonCompletion(delta);
      savePersistedState();
      triggerAutoSync();
      renderWorkspace();
      if (appState.completedToday === appState.dailyGoal) {
        showToast('🎉 Tagesziel erreicht! Starke Leistung!');
      } else {
        showToast(`Tagesfortschritt: ${appState.completedToday} / ${appState.dailyGoal} Einheiten`);
      }
    }

    function applyAppTheme(themeId) {
      const valid = APP_THEMES.some(t => t.id === themeId) ? themeId : 'obsidian';
      document.documentElement.setAttribute('data-theme', valid);
      const themeMeta = document.querySelector('meta[name="theme-color"]');
      if (themeMeta) {
        const bgMap = {
          obsidian: '#111113',
          midnight: '#0B0F1A',
          emerald: '#0A110F',
          sunset: '#14100E',
          daylight: '#F3F4F8'
        };
        themeMeta.setAttribute('content', bgMap[valid] || '#111113');
      }
    }

    function selectAppTheme(themeId) {
      appState.appTheme = themeId;
      applyAppTheme(themeId);
      savePersistedState();
      triggerAutoSync();
      renderWorkspace();
      const found = APP_THEMES.find(t => t.id === themeId);
      showToast(`Design gewechselt: ${found ? found.name : themeId}`);
    }

    function saveSettings() {
      const nameVal = document.getElementById('user-name-input')?.value.trim();
      const goalVal = parseInt(document.getElementById('daily-goal-input')?.value || '6', 10);
      if (nameVal) appState.userName = nameVal;
      if (goalVal >= 1 && goalVal <= 30) appState.dailyGoal = goalVal;
      savePersistedState();
      triggerAutoSync();
      renderWorkspace();
      showToast('Einstellungen gespeichert');
    }

    function handleProfileImageUpload(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) {
        showToast('Bitte wähle eine gültige Bilddatei aus');
        return;
      }

      const reader = new FileReader();
      reader.onload = function (e) {
        const img = new Image();
        img.onload = function () {
          const size = 200;
          const canvas = document.createElement('canvas');
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext('2d');
          const minSide = Math.min(img.width, img.height);
          const sx = (img.width - minSide) / 2;
          const sy = (img.height - minSide) / 2;
          ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, size, size);

          appState.profileImage = canvas.toDataURL('image/jpeg', 0.85);
          savePersistedState();
          updateSidebarAvatar();
          renderWorkspace();
          showToast('Profilbild aktualisiert');
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function removeProfileImage() {
      appState.profileImage = null;
      savePersistedState();
      updateSidebarAvatar();
      renderWorkspace();
      showToast('Profilbild entfernt');
    }

    function generateRoomCode() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let code = 'SV-';
      for (let i = 0; i < 4; i++) {
        code += chars[Math.floor(Math.random() * chars.length)];
      }
      return code;
    }

    function buildSyncPayload() {
      return {
        v: 1,
        ts: Date.now(),
        userName: appState.userName,
        appTheme: appState.appTheme || 'obsidian',
        dailyGoal: appState.dailyGoal,
        completedToday: appState.completedToday,
        dailyHistory: appState.dailyHistory,
        seenQuestionIds: appState.seenQuestionIds,
        exams: appState.exams,
        quickNotes: appState.quickNotes,
        flashcards: appState.flashcards.map(f => ({ id: f.id, mastered: !!f.mastered })),
        modules: COURSES.flatMap(c => c.cards.map(m => ({
          id: m.id,
          column: m.column,
          completedSteps: m.completedSteps,
          checklist: (m.checklist || []).map(ch => !!ch.done),
          notes: m.notes || []
        })))
      };
    }

    function applyIncomingSyncPayload(payload) {
      if (!payload || typeof payload !== 'object') return false;
      if (payload.userName) appState.userName = payload.userName;
      if (payload.appTheme) {
        appState.appTheme = payload.appTheme;
        applyAppTheme(payload.appTheme);
      }
      if (typeof payload.dailyGoal === 'number') appState.dailyGoal = payload.dailyGoal;
      if (typeof payload.completedToday === 'number') appState.completedToday = payload.completedToday;
      if (payload.dailyHistory && typeof payload.dailyHistory === 'object') appState.dailyHistory = payload.dailyHistory;
      if (payload.seenQuestionIds && typeof payload.seenQuestionIds === 'object') appState.seenQuestionIds = payload.seenQuestionIds;
      if (Array.isArray(payload.exams)) appState.exams = payload.exams;
      if (Array.isArray(payload.quickNotes)) appState.quickNotes = payload.quickNotes;

      if (Array.isArray(payload.flashcards)) {
        payload.flashcards.forEach(item => {
          const fc = appState.flashcards.find(f => f.id === item.id);
          if (fc) fc.mastered = !!item.mastered;
        });
      }

      if (Array.isArray(payload.modules)) {
        payload.modules.forEach(mod => {
          const card = getCardById(mod.id);
          if (!card) return;
          card.completedSteps = Math.max(0, Math.min(card.totalSteps, mod.completedSteps || 0));
          card.column = card.completedSteps >= card.totalSteps ? 'completed' : (mod.column || 'todo');
          if (Array.isArray(mod.checklist) && Array.isArray(card.checklist)) {
            mod.checklist.forEach((doneVal, idx) => {
              if (card.checklist[idx]) card.checklist[idx].done = !!doneVal;
            });
          }
          if (Array.isArray(mod.notes)) {
            card.notes = mod.notes;
            card.notesCount = mod.notes.length;
          }
        });
      }

      appState.lastSyncTime = new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
      savePersistedState();
      renderWorkspace();
      return true;
    }

    async function connectSyncRoom() {
      const input = document.getElementById('sync-room-input');
      const rawCode = (input ? input.value : appState.syncRoomCode || '').trim().toUpperCase();
      if (!rawCode) {
        showToast('Bitte gib einen Sync-Raum-Code ein');
        return;
      }
      appState.syncRoomCode = rawCode;
      savePersistedState();

      if (window.StudyVCloudBridge && window.StudyVCloudBridge.ready) {
        const remote = await window.StudyVCloudBridge.pullRoom(rawCode);
        if (remote) {
          applyIncomingSyncPayload(remote);
          showToast(`Mit Raum ${rawCode} synchronisiert!`);
        } else {
          await window.StudyVCloudBridge.pushRoom(rawCode, buildSyncPayload());
          appState.lastSyncTime = new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
          savePersistedState();
          showToast(`Sync-Raum ${rawCode} erstellt & hochgeladen`);
        }
        window.StudyVCloudBridge.subscribeRoom(rawCode, (remoteData) => {
          applyIncomingSyncPayload(remoteData);
          showToast('Live-Update vom anderen Gerät empfangen');
        });
      } else {
        appState.lastSyncTime = new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
        savePersistedState();
        showToast(`Raum-Code ${rawCode} gespeichert (nutze Schlüssel/Datei für Sofort-Transfer)`);
      }
      renderWorkspace();
    }

    function copySyncKey() {
      try {
        const jsonStr = JSON.stringify(buildSyncPayload());
        const encoded = 'STUDY-V1:' + btoa(unescape(encodeURIComponent(jsonStr)));
        const temp = document.createElement('textarea');
        temp.value = encoded;
        temp.style.position = 'fixed';
        temp.style.opacity = '0';
        document.body.appendChild(temp);
        temp.select();
        document.execCommand('copy');
        temp.remove();
        showToast('Sync-Schlüssel in die Zwischenablage kopiert!');
      } catch (e) {
        showToast('Sync-Schlüssel konnte nicht erstellt werden');
      }
    }

    function importSyncKey() {
      const input = document.getElementById('sync-key-input');
      const raw = (input?.value || '').trim();
      if (!raw) {
        showToast('Bitte füge zuerst einen Sync-Schlüssel ein');
        return;
      }
      try {
        const clean = raw.startsWith('STUDY-V1:') ? raw.slice(9) : raw;
        const jsonStr = decodeURIComponent(escape(atob(clean)));
        const parsed = JSON.parse(jsonStr);
        if (applyIncomingSyncPayload(parsed)) {
          if (input) input.value = '';
          showToast('Lernstand erfolgreich übertragen!');
        } else {
          showToast('Ungültiger Sync-Schlüssel');
        }
      } catch (e) {
        showToast('Sync-Schlüssel konnte nicht gelesen werden');
      }
    }

    function exportSyncFile() {
      try {
        const blob = new Blob([JSON.stringify(buildSyncPayload(), null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `StudyV-Sync-${getTodayIsoKey()}.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        showToast('Sync-Datei heruntergeladen');
      } catch (e) {
        showToast('Export fehlgeschlagen');
      }
    }

    function importSyncFile(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (e) {
        try {
          const parsed = JSON.parse(e.target.result);
          if (applyIncomingSyncPayload(parsed)) {
            showToast('Sync-Datei erfolgreich geladen!');
          } else {
            showToast('Ungültige Sync-Datei');
          }
        } catch (err) {
          showToast('Datei konnte nicht gelesen werden');
        }
      };
      reader.readAsText(file);
    }

    function triggerAutoSync() {
      if (appState.syncRoomCode && window.StudyVCloudBridge && window.StudyVCloudBridge.ready) {
        window.StudyVCloudBridge.pushRoom(appState.syncRoomCode, buildSyncPayload());
      }
    }

    window.onStudyVCloudReady = function () {
      if (appState.syncRoomCode && window.StudyVCloudBridge) {
        window.StudyVCloudBridge.subscribeRoom(appState.syncRoomCode, (remoteData) => {
          applyIncomingSyncPayload(remoteData);
        });
      }
      if (appState.activeNav === 'settings') {
        renderWorkspace();
      }
    };

    function showToast(message) {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      toast.className = 'bg-[#202024] border border-[#34343B] text-[#F4F4F6] text-[12.5px] font-medium px-3.5 py-2.5 rounded-[9px] shadow-xl animate-scale-in';
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.2s ease';
        setTimeout(() => toast.remove(), 220);
      }, 2400);
    }

    function formatGermanDate(isoStr) {
      if (!isoStr || !isoStr.includes('-')) return isoStr || '';
      const [y, m, d] = isoStr.split('-');
      return `${d}.${m}.${y}`;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // Keyboard shortcuts (Cmd/Ctrl+K for Search, Escape to close overlays)
    document.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        openSearchModal();
      } else if (e.key === 'Escape') {
        closeQuizPopup();
        closeModal();
        closeModuleDrawer();
      }
    });

    function resolveAssetUrl(relPath) {
      try {
        const href = window.location && window.location.href ? window.location.href : '';
        if (href.startsWith('http://') || href.startsWith('https://')) {
          return new URL(relPath, href).href;
        }
      } catch (e) {}
      return relPath;
    }

    function buildSolidAppIconDataUrl(size = 512) {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#111113';
      ctx.fillRect(0, 0, size, size);

      ctx.strokeStyle = '#F4F4F6';
      ctx.lineWidth = Math.round(size * 0.072);
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      const s = size / 24;
      ctx.beginPath();
      ctx.moveTo(4 * s, 5.5 * s);
      ctx.lineTo(19.6 * s, 11.4 * s);
      ctx.lineTo(10.2 * s, 19.3 * s);
      ctx.lineTo(8.5 * s, 13.5 * s);
      ctx.closePath();
      ctx.stroke();
      return canvas.toDataURL('image/png');
    }

    function setupMobileAppManifest() {
      try {
        const fallbackDataUrl = buildSolidAppIconDataUrl(512);
        const manifestLink = document.getElementById('studyv-manifest');
        const applyManifest = (iconHref) => {
          if (!manifestLink) return;
          const manifestData = {
            name: 'StudyV',
            short_name: 'StudyV',
            start_url: './',
            display: 'standalone',
            background_color: '#111113',
            theme_color: '#111113',
            icons: [
              { src: iconHref, sizes: '192x192', type: 'image/png', purpose: 'any maskable' },
              { src: iconHref, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
            ]
          };
          const encoded = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifestData));
          manifestLink.setAttribute('href', encoded);
        };

        applyManifest(fallbackDataUrl);

        const img = new Image();
        img.onload = function () {
          try {
            const size = 512;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#111113';
            ctx.fillRect(0, 0, size, size);
            const pad = Math.round(size * 0.16);
            ctx.drawImage(img, pad, pad, size - pad * 2, size - pad * 2);
            const renderedIcon = canvas.toDataURL('image/png');
            document.getElementById('studyv-apple-icon')?.setAttribute('href', renderedIcon);
            document.getElementById('studyv-apple-icon-180')?.setAttribute('href', renderedIcon);
            document.getElementById('studyv-favicon')?.setAttribute('href', renderedIcon);
            applyManifest(renderedIcon);
          } catch (err) {}
        };
        img.src = resolveAssetUrl('IconV.png');
      } catch (e) {}
    }

    // Initial load & render
    function initStudyV() {
      setupMobileAppManifest();
      try {
        loadPersistedState();
      } catch (e) {
        COURSES = getDefaultCourses();
      }
      if (!appState.appTheme) appState.appTheme = 'obsidian';
      if (!appState.syncRoomCode) appState.syncRoomCode = generateRoomCode();
      applyAppTheme(appState.appTheme);
      updateSidebarAvatar();
      syncNavHighlight(appState.activeNav);
      const hasUnread = Array.isArray(appState.notifications) && appState.notifications.some(n => n.unread);
      const badge = document.getElementById('notif-badge');
      if (badge) badge.classList.toggle('hidden', !hasUnread);
      renderWorkspace();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initStudyV);
    } else {
      initStudyV();
    }
  </script>
