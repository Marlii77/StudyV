    /* Apply active theme surfaces across layout & cards */
    html[data-theme] body,
    html[data-theme] #app-root,
    html[data-theme] main {
      background-color: var(--theme-bg) !important;
      color: var(--theme-text) !important;
    }

    html[data-theme] #left-sidebar {
      background-color: var(--theme-sidebar) !important;
      border-color: var(--theme-border) !important;
    }

    html[data-theme="midnight"] .dash-bento-card,
    html[data-theme="emerald"] .dash-bento-card,
    html[data-theme="sunset"] .dash-bento-card {
      background: linear-gradient(165deg, var(--theme-card) 0%, var(--theme-card-deep) 100%) !important;
      border-color: var(--theme-border) !important;
    }

    html[data-theme="midnight"] .folder-glow-card,
    html[data-theme="emerald"] .folder-glow-card,
    html[data-theme="sunset"] .folder-glow-card,
    html[data-theme="midnight"] .cal-matrix-shell,
    html[data-theme="emerald"] .cal-matrix-shell,
    html[data-theme="sunset"] .cal-matrix-shell,
    html[data-theme="midnight"] .exam-chrono-card,
    html[data-theme="emerald"] .exam-chrono-card,
    html[data-theme="sunset"] .exam-chrono-card {
      background: var(--theme-card) !important;
      border-color: var(--theme-border) !important;

    html[data-theme="daylight"] #left-sidebar img[alt="StudyV Logo"] {
      filter: invert(1) brightness(0.15);
    }

    /* Subtle Dark Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #27272C;
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #383840;
    }

    /* 16-Tick Segmented Vertical Progress Bar */
    .tick-bar-container {
      display: inline-flex;
      align-items: center;
      gap: 2.5px;
      height: 12px;
    }

    .tick-segment {
      width: 2.5px;
      height: 11px;
      border-radius: 1px;
      transition: background-color 0.25s ease, transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), filter 0.25s ease;
    }

    .dash-bento-card:hover .tick-segment.is-filled,
    .nebula-study-card:hover .tick-segment.is-filled {
      transform: scaleY(1.22);
      filter: brightness(1.2);
      transition-delay: calc(var(--tick-idx, 0) * 14ms);
    }

    /* Drawer, Modal & Toast Animations */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideRight {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.96) translateY(6px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .animate-fade-in {
      animation: fadeIn 0.18s ease-out forwards;
    }

    .animate-slide-right {
      animation: slideRight 0.24s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .animate-scale-in {
      animation: scaleIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Overarching Folder Cards (Glow + Sparkle Design + Micro-Animations) */
    @keyframes folderSlotReveal {
      from {
        opacity: 0;
        transform: translateY(14px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes ambientGlowBreath {
      0%, 100% {
        opacity: 0.82;
        transform: scale(1) translate(0, 0);
      }
      50% {
        opacity: 1;
        transform: scale(1.07) translate(-3px, 2px);
      }
    }

    @keyframes starTwinkle {
      0%, 100% {
        opacity: 0.34;
        transform: scale(0.9) rotate(0deg);
      }
      50% {
        opacity: 0.95;
        transform: scale(1.16) rotate(8deg);
      }
    }

    @keyframes starFloatGlint {
      0%, 100% {
        opacity: 0.25;
        transform: translateY(0px) scale(0.95);
      }
      50% {
        opacity: 0.85;
        transform: translateY(-2.5px) scale(1.2);
      }
    }

    .folder-card-slot {
      perspective: 950px;
      opacity: 0;
      animation: folderSlotReveal 0.48s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: calc(var(--stagger, 0) * 95ms);
    }

    .folder-glow-card {
      position: relative;
      background-color: #141416;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      overflow: hidden;
      transform-style: preserve-3d;
      transform: rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg)) translateY(0px);
      transition: transform 0.24s cubic-bezier(0.16, 1, 0.3, 1),
                  border-color 0.25s ease,
                  box-shadow 0.28s ease,
                  background-color 0.25s ease;
    }

    .folder-glow-card:hover {
      background-color: #17171a;
      border-color: rgba(var(--accent-rgb, 96, 165, 250), 0.45);
      transform: rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg)) translateY(-4px);
      box-shadow: 0 18px 38px -8px rgba(0, 0, 0, 0.65),
                  0 0 28px -6px rgba(var(--accent-rgb, 96, 165, 250), 0.22);
    }

    .folder-glow-card:active {
      transform: rotateX(0deg) rotateY(0deg) translateY(-1px) scale(0.985);
      transition-duration: 0.1s;
    }

    .folder-glow-orb {
      animation: ambientGlowBreath 6s ease-in-out infinite;
      transition: opacity 0.35s ease, transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .folder-glow-card:hover .folder-glow-orb {
      opacity: 1;
      transform: scale(1.14) translate(-4px, 3px);
    }

    .folder-cursor-spotlight {
      opacity: 0;
      background: radial-gradient(
        240px circle at var(--mouse-x, 82%) var(--mouse-y, 18%),
        rgba(var(--accent-rgb, 96, 165, 250), 0.16),
        transparent 70%
      );
      transition: opacity 0.28s ease;
    }

    .folder-glow-card:hover .folder-cursor-spotlight {
      opacity: 1;
    }

    .folder-edge-shimmer {
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 1px;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(var(--accent-rgb, 255, 255, 255), 0.65) 50%,
        transparent 100%
      );
      opacity: 0;
      transition: left 0.75s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
    }

    .folder-glow-card:hover .folder-edge-shimmer {
      left: 100%;
      opacity: 1;
    }

    .folder-icon-wrap {
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1), filter 0.28s ease;
    }

    .folder-glow-card:hover .folder-icon-wrap {
      transform: translateY(-2px) scale(1.07);
      filter: drop-shadow(0 0 12px rgba(var(--accent-rgb, 96, 165, 250), 0.55));
    }

    .sparkle-star-lg {
      transform-origin: 111px 58px;
      animation: starTwinkle 3.8s ease-in-out infinite;
    }

    .sparkle-star-md {
      transform-origin: 77px 28.2px;
      animation: starTwinkle 4.4s ease-in-out 1.1s infinite;
    }

    .sparkle-star-sm {
      transform-origin: 104px 17.2px;
      animation: starFloatGlint 3.2s ease-in-out 0.6s infinite;
    }

    .sparkle-glint-dot {
      animation: starFloatGlint 4.1s ease-in-out 1.7s infinite;
    }

    .folder-glow-card:hover .sparkle-star-lg,
    .folder-glow-card:hover .sparkle-star-md,
    .folder-glow-card:hover .sparkle-star-sm {
      animation-duration: 1.9s;
    }

    /* Topic Learning Cards (Slightly Lighter Dark Surface + Animated Headline Shimmer) */
    @keyframes nebulaCardReveal {
      from {
        opacity: 0;
        transform: translateY(14px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes artworkFloat {
      0%, 100% {
        transform: translateY(0px) scale(1);
      }
      50% {
        transform: translateY(-4px) scale(1.03);
      }
    }

    @keyframes titleSheen {
      0% {
        background-position: 0% 50%;
      }
      100% {
        background-position: 200% 50%;
      }
    }

    .nebula-card-slot {
      perspective: 1000px;
      opacity: 0;
      animation: nebulaCardReveal 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: calc(var(--stagger, 0) * 80ms);
    }

    .nebula-study-card {
      position: relative;
      background: linear-gradient(155deg, var(--card-bg-1, #202026) 0%, var(--card-bg-2, #18181D) 52%, var(--card-bg-3, #141418) 100%);
      border: 1px solid rgba(255, 255, 255, 0.085);
      border-top-color: rgba(255, 255, 255, 0.14);
      border-radius: 18px;
      overflow: hidden;
      clip-path: inset(0 round 18px);
      -webkit-mask-image: -webkit-radial-gradient(white, black);
      isolation: isolate;
      transform: translateY(0px) scale(1);
      transition: transform 0.26s cubic-bezier(0.16, 1, 0.3, 1),
                  border-color 0.25s ease,
                  box-shadow 0.28s ease,
                  background 0.28s ease;
    }

    .nebula-study-card:hover {
      background: linear-gradient(155deg, var(--card-bg-hover-1, #25252D) 0%, var(--card-bg-hover-2, #1C1C23) 52%, var(--card-bg-hover-3, #16161C) 100%);
      border-color: rgba(var(--card-rgb, 96, 165, 250), 0.45);
      transform: translateY(-4px) scale(1.006);
      box-shadow: 0 20px 38px -12px rgba(0, 0, 0, 0.75),
                  0 0 26px -8px rgba(var(--card-rgb, 96, 165, 250), 0.24);
    }

    .nebula-study-card .folder-cursor-spotlight {
      border-radius: 18px;
    }

    .nebula-study-card.dragging {
      opacity: 0.48;
      transform: scale(0.97);
    }

    .nebula-artwork-layer {
      animation: artworkFloat 6.5s ease-in-out infinite;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
    }

    .nebula-study-card:hover .nebula-artwork-layer {
      transform: scale(1.06) translate(-2px, -2px);
    }

    .nebula-card-title {
      background: linear-gradient(
        110deg,
        #FFFFFF 0%,
        #F4F4F6 35%,
        var(--title-accent, #93C5FD) 50%,
        #F4F4F6 65%,
        #FFFFFF 100%
      );
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), filter 0.25s ease;
    }

    /* Neon Gradient Frame Flashcards (Single Wide 3D Flip Card + Rich Animations) */
    @keyframes frameReveal {
      from {
        opacity: 0;
        transform: translateY(16px) scale(0.975);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes flashcardSlideNext {
      from {
        opacity: 0;
        transform: translateX(28px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateX(0) scale(1);
      }
    }

    @keyframes flashcardSlidePrev {
      from {
        opacity: 0;
        transform: translateX(-28px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateX(0) scale(1);
      }
    }

    @keyframes neonGlowBreath {
      0%, 100% {
        filter: hue-rotate(0deg);
        box-shadow: 0 0 36px -8px rgba(59, 130, 246, 0.45),
                    0 0 18px -4px rgba(168, 85, 247, 0.35),
                    0 22px 40px -14px rgba(0, 0, 0, 0.85);
      }
      50% {
        filter: hue-rotate(180deg);
        box-shadow: 0 0 44px -6px rgba(236, 72, 153, 0.48),
                    0 0 22px -4px rgba(16, 185, 129, 0.38),
                    0 26px 46px -14px rgba(0, 0, 0, 0.9);
      }
    }

    @keyframes cardEdgeSweep {
      0% {
        transform: translateX(-100%);
        opacity: 0;
      }
      35% {
        opacity: 0.85;
      }
      70% {
        opacity: 0.85;
      }
      100% {
        transform: translateX(200%);
        opacity: 0;
      }
    }

    @keyframes cardSparkFloat {
      0%, 100% {
        opacity: 0.28;
        transform: translateY(0px) scale(0.92);
      }
      50% {
        opacity: 0.85;
        transform: translateY(-4px) scale(1.15);
      }
    }

    .flashcard-stage {
      perspective: 1800px;
      animation: frameReveal 0.42s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .flashcard-stage.slide-next {
      animation: flashcardSlideNext 0.36s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .flashcard-stage.slide-prev {
      animation: flashcardSlidePrev 0.36s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .flashcard-tilt-shell {
      transform-style: preserve-3d;
      transform: rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg)) translateY(0px);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .flashcard-tilt-shell:hover {
      transform: rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg)) translateY(-4px);
    }

    .flashcard-flipper {
      position: relative;
      width: 100%;
      height: 350px;
      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;
      transition: transform 0.72s cubic-bezier(0.22, 1, 0.36, 1);
      cursor: pointer;
    }

    .flashcard-flipper.is-flipped {
      transform: rotateY(180deg);
    }

    .flashcard-face {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
    }

    /* Clean cross-fade at 90° midpoint so front text NEVER bleeds onto the back face */
    .flashcard-face-front {
      transform: rotateY(0deg);
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transition: opacity 0.24s ease 0.16s, visibility 0s linear 0s;
    }

    .flashcard-flipper.is-flipped .flashcard-face-front {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.18s ease 0s, visibility 0s linear 0.18s;
    }

    .flashcard-face-back {
      transform: rotateY(180deg);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.18s ease 0s, visibility 0s linear 0.18s;
    }

    .flashcard-flipper.is-flipped .flashcard-face-back {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transition: opacity 0.24s ease 0.16s, visibility 0s linear 0s;
    }

    /* Outer-only shifting rainbow/neon border & outer aura glow */
    .neon-frame-outer {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 24px;
      padding: 2.5px;
      background: linear-gradient(135deg, #3B82F6 0%, #8B5CF6 35%, #EC4899 70%, #10B981 100%);
      animation: neonGlowBreath 7s ease-in-out infinite;
      transition: transform 0.28s ease;
    }

    .flashcard-flipper:hover .neon-frame-outer {
      transform: scale(1.004);
    }

    .neon-frame-inner,
    .neon-frame-inner.is-back {
      position: relative;
      height: 100%;
      width: 100%;
      border-radius: 21.5px;
      background: #141418;
      overflow: hidden;
    }

    .neon-frame-shimmer {
      border-radius: 27px;
      background: inherit;
      background-size: inherit;
      animation: inherit;
      filter: blur(18px);
      opacity: 0.55;
      z-index: -1;
      pointer-events: none;
      transition: opacity 0.28s ease, filter 0.28s ease;

    .flashcard-flipper:hover .neon-frame-outer::before {

    /* Clean, neutral interior without any color tint inside the tile */

    .neon-frame-inner.is-back {

      width: 100%;
      border-radius: 21.5px;
      background: #141418;
      overflow: hidden;

  <!-- Optional Live Cloud Sync Module (activates automatically when cloud config is present) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    window.StudyVCloudBridge = {
      available: false,
      ready: false,
      user: null,
      db: null,
      appId: typeof __app_id !== 'undefined' ? __app_id : 'studyv-app',
      unsubscribe: null,

      async init() {
        try {
          if (typeof __firebase_config === 'undefined' || !__firebase_config) return false;
          const firebaseConfig = typeof __firebase_config === 'string' ? JSON.parse(__firebase_config) : __firebase_config;
          const app = initializeApp(firebaseConfig);
          const auth = getAuth(app);
          this.db = getFirestore(app);
          this.available = true;

          if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
            const cred = await signInWithCustomToken(auth, __initial_auth_token);
            this.user = cred.user;
          } else {
            const cred = await signInAnonymously(auth);
            this.user = cred.user;
          }
          this.ready = !!this.user;
          return this.ready;
        } catch (err) {
          this.available = false;
          this.ready = false;
          return false;
        }
      },

      getRoomRef(roomCode) {
        const cleanCode = String(roomCode || '').trim().toUpperCase().replace(/[^A-Z0-9-]/g, '');
        return doc(this.db, 'artifacts', this.appId, 'public', 'data', 'studyv_sync_rooms', cleanCode);
      },

      async pushRoom(roomCode, payload) {
        if (!this.ready || !this.user || !roomCode) return false;
        try {
          const ref = this.getRoomRef(roomCode);
          await setDoc(ref, {
            payloadJson: JSON.stringify(payload),
            updatedAt: Date.now(),
            updatedBy: this.user.uid
          });
          return true;
        } catch (err) {
          return false;
        }
      },

      async pullRoom(roomCode) {
        if (!this.ready || !this.user || !roomCode) return null;
        try {
          const ref = this.getRoomRef(roomCode);
          const snap = await getDoc(ref);
          if (!snap.exists()) return null;
          const data = snap.data();
          return data && data.payloadJson ? JSON.parse(data.payloadJson) : null;
        } catch (err) {
          return null;
        }
      },

      subscribeRoom(roomCode, onRemoteData) {
        if (this.unsubscribe) {
          this.unsubscribe();
          this.unsubscribe = null;
        }
        if (!this.ready || !this.user || !roomCode) return;
        const ref = this.getRoomRef(roomCode);
        this.unsubscribe = onSnapshot(
          ref,
          (snap) => {
            if (!snap.exists()) return;
            const data = snap.data();
            if (!data || data.updatedBy === this.user.uid || !data.payloadJson) return;
            try {
              const parsed = JSON.parse(data.payloadJson);
              if (typeof onRemoteData === 'function') onRemoteData(parsed, data.updatedAt);
            } catch (e) {}
          },
          (error) => {
            // Error callback required for onSnapshot
          }
        );
      }
    };

    window.StudyVCloudBridge.init().then((ok) => {
      if (ok && typeof window.onStudyVCloudReady === 'function') {
        window.onStudyVCloudReady();
      }
    });
  </script>

    function loadPersistedState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        if (parsed.courses && Array.isArray(parsed.courses) && parsed.courses.length === 5) {
          COURSES = parsed.courses;
        }
        if (parsed.appState) {
          appState = {
            ...appState,
            ...parsed.appState,
            activeNav: 'dashboard',
            selectedCardId: null,
            draggedCardId: null,
            activeQuizSession: null
          };
        }
      } catch (e) {
        // Fallback silently to defaults
      }
    }

    function savePersistedState() {

    function renderSegmentedTicks(completedSteps, totalSteps, fillColor = '#3B82F6', totalTicks = 16) {
      const ratio = totalSteps > 0 ? Math.min(1, Math.max(0, completedSteps / totalSteps)) : 0;
      const activeTicks = Math.round(ratio * totalTicks);
      const emptyColor = (appState && appState.appTheme === 'daylight') ? '#CBD5E1' : '#2C2C33';
      let ticksHtml = '<div class="tick-bar-container" aria-hidden="true">';
      for (let i = 0; i < totalTicks; i++) {
        const isFilled = i < activeTicks;
        ticksHtml += `<span class="tick-segment ${isFilled ? 'is-filled' : ''}" style="--tick-idx: ${i}; background-color: ${isFilled ? fillColor : emptyColor};"></span>`;
      }
      ticksHtml += '</div>';
      return ticksHtml;
    }

    function renderWorkspace() {
      const container = document.getElementById('workspace-container');
      if (!container) return;

      if (appState.activeNav === 'projects') {
        container.innerHTML = appState.showSubjectOverview
          ? renderSubjectsOverview()
          : renderProjectsWorkspace();
      } else if (appState.activeNav === 'dashboard') {
        container.innerHTML = renderDashboardView();
      } else if (appState.activeNav === 'inbox') {
        container.innerHTML = renderInboxView();
      } else if (appState.activeNav === 'calendar') {
        container.innerHTML = renderCalendarView();
      } else if (appState.activeNav === 'reports') {
        container.innerHTML = renderReportsView();
      } else if (appState.activeNav === 'settings') {
        container.innerHTML = renderSettingsView();
      }
    }

    // =========================================================================
    // 3A. DASHBOARD VIEW (Cobalt Bento Design + Real Daily Curve + Live Quote)
    // =========================================================================

    let shouldAnimateDashboard = true;

    function switchChartRange(range) {
      appState.chartRange = range;
      appState.hoveredChartDay = null;
      shouldAnimateDashboard = false;
      savePersistedState();
      renderWorkspace();
    }

    function buildDashboardChartSvg() {
      const isLight = appState.appTheme === 'daylight';
      const gridColor = isLight ? '#E2E8F0' : '#202026';
      const axisTextColor = isLight ? '#64748B' : '#686873';
      const activeLabelColor = isLight ? '#2563EB' : '#93C5FD';
      const tooltipBg = isLight ? '#0F172A' : '#1E1E24';

      const rangeDays = appState.chartRange === '1T' ? 5 : appState.chartRange === '1M' ? 14 : 7;
      const todayKey = getTodayIsoKey();
      const seriesPoints = [];
      for (let i = rangeDays - 1; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const iso = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        const label = `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth() + 1).padStart(2, '0')}.`;
        const val = iso === todayKey
          ? Math.max(appState.dailyHistory[iso] || 0, appState.completedToday || 0)
          : (appState.dailyHistory[iso] || 0);
        seriesPoints.push({ iso, label, val, isToday: iso === todayKey });
      }

      const maxVal = Math.max(12, ...seriesPoints.map(p => p.val));
      const svgW = 540;
      const svgH = 175;
      const padL = 34;
      const padR = 44;
      const padT = 34;
      const padB = 26;
      const plotW = svgW - padL - padR;
      const plotH = svgH - padT - padB;

      const coords = seriesPoints.map((pt, idx) => {
        const x = padL + (seriesPoints.length > 1 ? (idx / (seriesPoints.length - 1)) * plotW : plotW / 2);
        const y = padT + plotH - (pt.val / maxVal) * plotH;
        return { ...pt, x, y, idx };
      });

      let linePath = '';
      if (coords.length > 0) {
        linePath = `M ${coords[0].x.toFixed(1)} ${coords[0].y.toFixed(1)}`;
        for (let i = 0; i < coords.length - 1; i++) {
          const p0 = coords[i];
          const p1 = coords[i + 1];
          const cpx = ((p0.x + p1.x) / 2).toFixed(1);
          linePath += ` C ${cpx} ${p0.y.toFixed(1)}, ${cpx} ${p1.y.toFixed(1)}, ${p1.x.toFixed(1)} ${p1.y.toFixed(1)}`;
        }
      }
      const areaPath = coords.length > 0
        ? `${linePath} L ${coords[coords.length - 1].x.toFixed(1)} ${(padT + plotH).toFixed(1)} L ${coords[0].x.toFixed(1)} ${(padT + plotH).toFixed(1)} Z`
        : '';

      const focusIdx = (appState.hoveredChartDay !== null && coords[appState.hoveredChartDay])
        ? appState.hoveredChartDay
        : Math.max(0, coords.length - 1);
      const focusPt = coords[focusIdx] || { x: padL, y: padT + plotH, val: 0, label: '' };
      const pillW = 68;
      const pillX = Math.min(svgW - pillW - 4, Math.max(4, focusPt.x - pillW / 2));
      const pillY = Math.max(4, focusPt.y - 31);

      return `
        <svg viewBox="0 0 ${svgW} ${svgH}" class="w-full h-[185px] overflow-visible">
          <defs>
            <linearGradient id="cobaltAreaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.34" />
              <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.0" />
            </linearGradient>
          </defs>

          ${[0, 0.25, 0.5, 0.75, 1].map(frac => {
            const yPos = padT + plotH - frac * plotH;
            const labelVal = Math.round(frac * maxVal);
            return `
              <line x1="${padL}" y1="${yPos.toFixed(1)}" x2="${svgW - padR}" y2="${yPos.toFixed(1)}" stroke="${gridColor}" stroke-width="1" />
              <text x="${padL - 8}" y="${(yPos + 3.5).toFixed(1)}" text-anchor="end" fill="${axisTextColor}" font-size="9.5" font-family="Inter, sans-serif">${labelVal}</text>
            `;
          }).join('')}

          <path d="${areaPath}" fill="url(#cobaltAreaGrad)" />
          <path d="${linePath}" fill="none" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round" />

          <line x1="${focusPt.x.toFixed(1)}" y1="${focusPt.y.toFixed(1)}" x2="${focusPt.x.toFixed(1)}" y2="${(padT + plotH).toFixed(1)}"
                stroke="#3B82F6" stroke-opacity="0.45" stroke-width="1.2" stroke-dasharray="3 3" />

          ${coords.filter((_, i) => coords.length <= 7 || i % 2 === 0 || i === coords.length - 1).map(pt => `
            <text x="${pt.x.toFixed(1)}" y="${svgH - 4}" text-anchor="middle" fill="${pt.idx === focusIdx ? activeLabelColor : axisTextColor}" font-size="9.5" font-weight="${pt.idx === focusIdx ? '600' : '400'}" font-family="Inter, sans-serif">${pt.label}</text>
          `).join('')}

          ${coords.map(pt => `
            <g class="cursor-pointer" onmouseenter="setHoveredChartDay(${pt.idx})" onclick="setHoveredChartDay(${pt.idx})">
              <rect x="${(pt.x - 18).toFixed(1)}" y="${padT - 10}" width="36" height="${plotH + 24}" fill="transparent" />
              <circle cx="${pt.x.toFixed(1)}" cy="${pt.y.toFixed(1)}" r="2.8" fill="${pt.idx === focusIdx ? '#3B82F6' : '#60A5FA'}" fill-opacity="${pt.idx === focusIdx ? '1' : '0.55'}" />
            </g>
          `).join('')}

          <circle cx="${focusPt.x.toFixed(1)}" cy="${focusPt.y.toFixed(1)}" r="8" fill="#3B82F6" fill-opacity="0.28">
            <animate attributeName="r" values="6;12;6" dur="2.2s" repeatCount="indefinite" />
            <animate attributeName="fill-opacity" values="0.38;0.08;0.38" dur="2.2s" repeatCount="indefinite" />
          </circle>
          <circle cx="${focusPt.x.toFixed(1)}" cy="${focusPt.y.toFixed(1)}" r="4.2" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2" />

          <g>
            <rect x="${pillX.toFixed(1)}" y="${pillY.toFixed(1)}" width="${pillW}" height="20" rx="10" fill="${tooltipBg}" stroke="#3B82F6" stroke-opacity="0.65" />
            <polygon points="${(focusPt.x - 4).toFixed(1)},${(pillY + 20).toFixed(1)} ${(focusPt.x + 4).toFixed(1)},${(pillY + 20).toFixed(1)} ${focusPt.x.toFixed(1)},${(pillY + 24).toFixed(1)}" fill="${tooltipBg}" />
            <text x="${(pillX + pillW / 2).toFixed(1)}" y="${(pillY + 13.5).toFixed(1)}" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="600" font-family="Inter, sans-serif">${focusPt.val} Lekt.</text>
          </g>
        </svg>
      `;
    }

    function setHoveredChartDay(idx) {
      if (appState.hoveredChartDay === idx) return;
      appState.hoveredChartDay = idx;
      const chartBox = document.getElementById('dash-chart-container');
      if (chartBox) {
        chartBox.innerHTML = buildDashboardChartSvg();
      }
    }

    function renderDashboardView() {
      const animClass = shouldAnimateDashboard ? 'dash-card-animate' : '';
      const headerAnimClass = shouldAnimateDashboard ? 'dash-header-enter' : '';
      shouldAnimateDashboard = false;

      const totalDone = COURSES.reduce((sum, c) => sum + c.cards.reduce((s, m) => s + m.completedSteps, 0), 0);
      const totalAll = COURSES.reduce((sum, c) => sum + c.cards.reduce((s, m) => s + m.totalSteps, 0), 0);
      const overallPct = totalAll > 0 ? Math.round((totalDone / totalAll) * 100) : 0;
      const dailyPct = appState.dailyGoal > 0 ? Math.min(100, Math.round((appState.completedToday / appState.dailyGoal) * 100)) : 0;

      const sortedExams = [...appState.exams].sort((a, b) => a.date.localeCompare(b.date));
      const nextExam = sortedExams[0] || null;
      const upcomingExams = sortedExams.slice(0, 3);
      const masteredFlashcards = appState.flashcards.filter(f => f.mastered).length;

      const getDaysCountdown = (isoDate) => {
        if (!isoDate) return '';
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const target = new Date(isoDate + 'T00:00:00');
        const diffDays = Math.round((target - today) / (1000 * 60 * 60 * 24));
        if (diffDays < 0) return 'Vorbei';
        if (diffDays === 0) return 'Heute';
        if (diffDays === 1) return 'Morgen';
        return `${diffDays}d`;
      };

      const totalItemsAll = totalAll + Math.max(1, appState.flashcards.length);
      const totalItemsDone = totalDone + masteredFlashcards;
      const exactQuote = totalItemsAll > 0
        ? Math.min(100, ((totalItemsDone / totalItemsAll) * 100) + (totalItemsDone === 0 && appState.completedToday > 0 ? Math.min(15, appState.completedToday * 2.5) : 0))
        : 0;
      const formattedQuote = `${exactQuote.toFixed(2)}%`;

      const shortMap = {
        rechnungswesen: 'RW',
        gespraechsgestaltung: 'GG',
        sozialkunde: 'SK',
        englisch: 'EN',
        kundenbindung: 'KAB'
      };
      const comparisonBars = [
        ...COURSES.map(c => {
          const d = c.cards.reduce((s, m) => s + m.completedSteps, 0);
          const t = c.cards.reduce((s, m) => s + m.totalSteps, 0);
          const pct = t > 0 ? Math.round((d / t) * 100) : 0;
          return {
            key: c.id,
            label: shortMap[c.id] || c.title.slice(0, 3).toUpperCase(),
            pct,
            action: `openSubjectBoard('${c.id}')`
          };
        }),
        {
          key: 'karten',
          label: 'Karten',
          pct: appState.flashcards.length > 0 ? Math.round((masteredFlashcards / appState.flashcards.length) * 100) : 0,
          action: `navigateSection('inbox')`
        }
      ];

      let bestBarIdx = 0;
      comparisonBars.forEach((b, i) => {
        if (b.pct > comparisonBars[bestBarIdx].pct) {
          bestBarIdx = i;
        }
      });

      const isLight = appState.appTheme === 'daylight';

      return `
        <div class="flex-1 overflow-y-auto px-6 sm:px-9 py-7">
          <div class="max-w-[1160px]">

            <!-- Top Header Row -->
            <div class="${headerAnimClass} flex items-center justify-between flex-wrap gap-4 mb-6">
              <div>
                <h1 class="text-[24px] sm:text-[26px] font-bold text-[#F4F4F6] tracking-[-0.02em]">Dashboard Overview</h1>
                <p class="text-[12.5px] text-[#7E7E87] mt-0.5">StudyV • Lernfortschritt &amp; Prüfungsübersicht</p>
              </div>

              <div class="flex items-center gap-3 flex-wrap">
                <button onclick="openAddExamModal()"
                        class="dash-cta-pill inline-flex items-center gap-2 px-4 py-2 rounded-full bg-[#3B82F6] hover:bg-[#2563EB] text-white text-[12.5px] font-semibold shadow-lg shadow-[#3B82F6]/20 transition">
                  <span class="w-4 h-4 rounded-full bg-white/20 flex items-center justify-center text-[12px] font-bold text-white">+</span>
                  <span class="text-white">Klausur eintragen</span>
                </button>

                <button onclick="navigateSection('settings')"
                        class="flex items-center gap-2.5 bg-[#161619] hover:bg-[#1C1C20] border border-[#24242A] rounded-full pl-3.5 pr-1.5 py-1 transition">
                  <div class="text-right">
                    <div class="text-[12.5px] font-semibold text-[#F4F4F6] leading-tight">${escapeHtml(appState.userName)}</div>
                    <div class="text-[10px] uppercase tracking-wider text-[#60A5FA] font-semibold">Lernprofil</div>
                  </div>
                  <div class="w-8 h-8 rounded-full overflow-hidden border border-[#2E2E36]">
                    ${getUserAvatarMarkup()}
                  </div>
                </button>
              </div>
            </div>

            <!-- Row 1: 3 Cobalt Bento KPI Cards -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-5">
              
              <!-- KPI 1: Gesamte Lerneinheiten -->
              <div onmousemove="handleFolderCardMove(event, this)" onmouseleave="handleFolderCardLeave(this)"
                   class="dash-bento-card ${animClass} p-5 flex flex-col justify-between min-h-[126px]" style="--stagger: 0;">
                <div class="dash-edge-shimmer"></div>
                <div class="dash-spotlight absolute inset-0 pointer-events-none"></div>
                <div class="relative z-10 text-[12.5px] font-medium text-[#8E8E93]">Gesamte Lerneinheiten</div>
                <div class="relative z-10 flex items-baseline gap-2.5 mt-3">
                  <span class="text-[30px] font-bold text-[#F4F4F6] tracking-[-0.03em]">${totalDone} <span class="text-[16px] font-medium text-[#7E7E87]">/ ${totalAll}</span></span>
                  <span class="dash-badge-bob px-2.5 py-0.5 rounded-full bg-[#3B82F6]/15 border border-[#3B82F6]/30 text-[11.5px] font-semibold text-[#60A5FA]">
                    +${overallPct}%
                  </span>
                </div>
              </div>

              <!-- KPI 2: Tagesziel Fortschritt -->
              <div onmousemove="handleFolderCardMove(event, this)" onmouseleave="handleFolderCardLeave(this)"
                   class="dash-bento-card ${animClass} p-5 flex flex-col justify-between min-h-[126px]" style="--stagger: 1;">
                <div class="dash-edge-shimmer"></div>
                <div class="dash-spotlight absolute inset-0 pointer-events-none"></div>
                <div class="relative z-10 flex items-center justify-between">
                  <span class="text-[12.5px] font-medium text-[#8E8E93]">Tagesziel Fortschritt</span>
                  <div class="flex items-center gap-1 bg-[#101013] border border-[#24242A] rounded-[7px] p-0.5">
                    <button type="button" onclick="adjustTodayProgress(-1)" class="w-6 h-6 rounded hover:bg-[#222228] text-[#9A9AA0] hover:text-[#3B82F6] text-[13px] font-bold transition">−</button>
                    <button type="button" onclick="adjustTodayProgress(1)" class="w-6 h-6 rounded bg-[#3B82F6]/20 hover:bg-[#3B82F6]/35 text-[#3B82F6] text-[13px] font-bold transition">+</button>
                  </div>
                </div>
                <div class="relative z-10 mt-3">
                  <div class="flex items-baseline justify-between mb-2">
                    <span class="text-[26px] font-bold text-[#F4F4F6] tracking-[-0.025em]">${appState.completedToday} Einheiten</span>
                    <span class="text-[12px] text-[#7E7E87]">Ziel: ${appState.dailyGoal}</span>
                  </div>
                  <div class="w-full h-1.5 ${isLight ? 'bg-[#E2E8F0]' : 'bg-[#1F1F25]'} rounded-full overflow-hidden">
                    <div class="dash-progress-shimmer h-full bg-[#3B82F6] rounded-full transition-all duration-300" style="width: ${dailyPct}%;"></div>
                  </div>
                </div>
              </div>

              <!-- KPI 3: Nächste Klassenarbeit -->
              <div onclick="navigateSection('calendar')"
                   onmousemove="handleFolderCardMove(event, this)" onmouseleave="handleFolderCardLeave(this)"
                   class="dash-bento-card ${animClass} p-5 flex flex-col justify-between min-h-[126px] cursor-pointer" style="--stagger: 2;">
                <div class="dash-edge-shimmer"></div>
                <div class="dash-spotlight absolute inset-0 pointer-events-none"></div>
                <div class="relative z-10 text-[12.5px] font-medium text-[#8E8E93]">Nächste Klassenarbeit</div>
                <div class="relative z-10 flex items-center gap-3.5 mt-3">
                  <div class="dash-icon-tile w-11 h-11 rounded-[12px] bg-[#1D1D22] flex items-center justify-center shrink-0">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" class="dash-clock-svg text-[#60A5FA]">
                      <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2.5C6.75329 2.5 2.5 6.75329 2.5 12C2.5 17.2467 6.75329 21.5 12 21.5C17.2467 21.5 21.5 17.2467 21.5 12C21.5 6.75329 17.2467 2.5 12 2.5ZM12.9 7.25C12.9 6.75294 12.4971 6.35 12 6.35C11.5029 6.35 11.1 6.75294 11.1 7.25V12C11.1 12.26 11.21 12.51 11.41 12.68L14.51 15.38C14.88 15.7 15.45 15.66 15.78 15.29C16.1 14.92 16.06 14.35 15.69 14.02L12.9 11.59V7.25Z" />
                    </svg>
                  </div>
                  <div class="min-w-0">
                    <div class="text-[22px] font-bold text-[#F4F4F6] tracking-[-0.02em] leading-tight">
                      ${nextExam ? getDaysCountdown(nextExam.date) : 'Keine geplant'}
                    </div>
                    <div class="text-[12px] text-[#8E8E93] truncate mt-0.5">
                      ${nextExam ? `${escapeHtml(nextExam.subject)} • ${formatGermanDate(nextExam.date)}` : 'Klicke zum Eintragen'}
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- Row 2: Dein Lernverlauf + Lernquote Gesamt Spotlight Card -->
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 mb-6">

              <!-- Left 8 Cols: Real Daily Learning Curve -->
              <div onmousemove="handleFolderCardMove(event, this)" onmouseleave="handleFolderCardLeave(this)"
                   class="lg:col-span-8 dash-bento-card ${animClass} p-5 sm:p-6 flex flex-col justify-between" style="--stagger: 3;">
                <div class="dash-edge-shimmer"></div>
                <div class="dash-spotlight absolute inset-0 pointer-events-none"></div>

                <div class="relative z-10 flex items-center justify-between flex-wrap gap-3 mb-4">
                  <div class="flex items-center gap-3">
                    <div class="dash-icon-tile w-10 h-10 rounded-[11px] bg-[#1D1D22] flex items-center justify-center text-[#60A5FA]">
                      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path fill-rule="evenodd" clip-rule="evenodd" d="M5.5 3.5C4.39543 3.5 3.5 4.39543 3.5 5.5V18.5C3.5 19.6046 4.39543 20.5 5.5 20.5H18.5C19.6046 20.5 20.5 19.6046 20.5 18.5V5.5C20.5 4.39543 19.6046 3.5 18.5 3.5H5.5ZM8.5 11.5C7.94772 11.5 7.5 11.9477 7.5 12.5V16.5C7.5 17.0523 7.94772 17.5 8.5 17.5C9.05228 17.5 9.5 17.0523 9.5 16.5V12.5C9.5 11.9477 9.05228 11.5 8.5 11.5ZM12 7.5C11.4477 7.5 11 7.94772 11 8.5V16.5C11 17.0523 11.4477 17.5 12 17.5C12.5523 17.5 13 17.0523 13 16.5V8.5C13 7.94772 12.5523 7.5 12 7.5ZM15.5 10C14.9477 10 14.5 10.4477 14.5 11V16.5C14.5 17.0523 14.9477 17.5 15.5 17.5C16.0523 17.5 16.5 17.0523 16.5 16.5V11C16.5 10.4477 16.0523 10 15.5 10Z" />
                      </svg>
                    </div>
                    <div>
                      <div class="text-[12px] text-[#8E8E93]">Dein Lernverlauf</div>
                      <div class="text-[22px] font-bold text-[#F4F4F6] tracking-[-0.02em]">
                        ${appState.completedToday} Lektionen heute
                      </div>
                    </div>
                  </div>

                  <div class="flex items-center gap-1 bg-[#101013] border border-[#232329] rounded-full p-1">
                    ${['1T', '1W', '1M'].map(r => `
                      <button onclick="switchChartRange('${r}')"
                              class="px-3 py-1 rounded-full text-[11.5px] font-semibold transition ${appState.chartRange === r ? 'bg-[#3B82F6] text-white' : 'text-[#8E8E93] hover:text-[#3B82F6]'}">
                        ${r}
                      </button>
                    `).join('')}
                  </div>
                </div>

                <div id="dash-chart-container" class="relative z-10 w-full mt-1" onmouseleave="setHoveredChartDay(null)">
                  ${buildDashboardChartSvg()}
                </div>
              </div>

              <!-- Right 4 Cols: Lernquote Gesamt Spotlight Card -->
              <div onmousemove="handleFolderCardMove(event, this)" onmouseleave="handleFolderCardLeave(this)"
                   class="lg:col-span-4 dash-bento-card ${animClass} p-5 sm:p-6 flex flex-col justify-between" style="--stagger: 4;">
                <div class="dash-edge-shimmer"></div>
                <div class="dash-spotlight absolute inset-0 pointer-events-none"></div>

                <div class="cobalt-spotlight-beam absolute -top-12 -right-10 w-52 h-52 pointer-events-none"
                     style="background: radial-gradient(ellipse at top right, rgba(59, 130, 246, 0.34) 0%, rgba(96, 165, 250, 0.12) 45%, transparent 72%);"></div>

                <div class="relative z-10 flex items-center gap-3">
                  <div class="w-11 h-11 rounded-full overflow-hidden border border-[#2E2E36] shrink-0">
                    ${getUserAvatarMarkup()}
                  </div>
                  <div>
                    <div class="text-[15px] font-bold text-[#F4F4F6]">${escapeHtml(appState.userName)}</div>
                    <div class="text-[11.5px] text-[#9A9AA4]">${COURSES.length} aktive Lernfächer</div>
                  </div>
                </div>

                <div class="relative z-10 my-4">
                  <div class="text-[12px] text-[#9A9AA4]">Lernquote Gesamt</div>
                  <div class="text-[32px] font-bold text-[#F4F4F6] tracking-[-0.03em] leading-tight mt-0.5">
                    ${formattedQuote}
                  </div>
                </div>

                <div class="relative z-10 grid grid-cols-6 gap-1.5 items-end pt-2">
                  ${comparisonBars.map((bar, idx) => {
                    const isLeader = idx === bestBarIdx;
                    const barH = Math.max(26, Math.min(82, bar.pct || 26));
                    const idleBg = isLight
                      ? 'background: linear-gradient(180deg, #E2E8F0 0%, #F1F5F9 100%); border-color: #CBD5E1;'
                      : 'background: linear-gradient(180deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.02) 100%);';
                    return `
                      <div onclick="${bar.action}" style="--bar-idx: ${idx};" class="flex flex-col items-center gap-1 cursor-pointer group">
                        ${isLeader ? `<span class="dash-badge-bob px-1.5 py-0.5 rounded-full bg-[#3B82F6] text-white text-[9px] font-bold shadow-md shadow-[#3B82F6]/30 whitespace-nowrap">↑ ${bar.pct}%</span>` : ''}
                        <div class="w-full rounded-[8px] border ${isLeader ? 'dash-striped-bar border-[#60A5FA]/60' : 'border-white/[0.08]'} transition-transform duration-200 group-hover:scale-105"
                             style="height: ${barH}px; ${isLeader ? '' : idleBg}"></div>
                        <span class="text-[10px] font-medium ${isLeader ? 'text-[#3B82F6] font-semibold' : 'text-[#8E8E93]'} truncate max-w-full">${bar.label}</span>
                      </div>
                    `;
                  }).join('')}
                </div>
              </div>
            </div>

            <!-- Row 3: Aktive Lernfächer -->
            <div class="flex items-center justify-between mb-3.5">
              <h2 class="text-[15.5px] font-semibold text-[#F4F4F6]">Aktive Lernfächer</h2>
              <button onclick="navigateSection('projects')" class="text-[12.5px] text-[#8E8E93] hover:text-[#3B82F6] transition">
                Alle Ordner anzeigen ›
              </button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-6">
              ${COURSES.map((c, idx) => {
                const done = c.cards.reduce((s, m) => s + m.completedSteps, 0);
                const total = c.cards.reduce((s, m) => s + m.totalSteps, 0);
                const pct = total > 0 ? Math.round((done / total) * 100) : 0;
                const openModules = c.cards.filter(m => m.column !== 'completed').length;

                return `
                  <div onclick="openSubjectBoard('${c.id}')"
                       onmousemove="handleFolderCardMove(event, this)" onmouseleave="handleFolderCardLeave(this)"
                       class="dash-bento-card ${animClass} p-5 cursor-pointer group" style="--stagger: ${idx + 5};">
                    <div class="dash-edge-shimmer"></div>
                    <div class="dash-spotlight absolute inset-0 pointer-events-none"></div>

                    <div class="relative z-10 flex items-center justify-between gap-2 mb-3">
                      <h3 class="text-[17px] font-bold text-[#F4F4F6] tracking-[-0.015em] truncate">${escapeHtml(c.title)}</h3>
                      <span class="px-2.5 py-0.5 rounded-full bg-[#3B82F6]/15 border border-[#3B82F6]/30 text-[11px] font-semibold text-[#60A5FA] shrink-0">
                        Aktiv
                      </span>
                    </div>

                    <div class="relative z-10 grid grid-cols-3 gap-2 text-[12px] my-3.5">
                      <div>
                        <div class="text-[#7E7E87]">Fortschritt</div>
                        <div class="font-semibold text-[#60A5FA] mt-0.5">${done} / ${total}</div>
                      </div>
                      <div>
                        <div class="text-[#7E7E87]">Module</div>
                        <div class="font-semibold text-[#F4F4F6] mt-0.5">${c.cards.length} Themen</div>
                      </div>
                      <div>
                        <div class="text-[#7E7E87]">Offen</div>
                        <div class="font-semibold text-[#F4F4F6] mt-0.5">${openModules}</div>
                      </div>
                    </div>

                    <div class="relative z-10 pt-3 border-t border-[#24242A]">
                      <div class="flex items-center justify-between text-[11.5px] mb-2">
                        <span class="text-[#7E7E87]">Lernziel-Fortschritt</span>
                        <span class="font-semibold text-[#E4E4E7]">${pct}%</span>
                      </div>
                      ${renderSegmentedTicks(done, total, '#3B82F6', 24)}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>

            ${upcomingExams.length > 0 ? `
              <div class="dash-bento-card ${animClass} p-5">
                <div class="flex items-center justify-between mb-3">
                  <h3 class="text-[14.5px] font-semibold text-[#F4F4F6]">Anstehende Klassenarbeiten &amp; Tests</h3>
                  <button onclick="navigateSection('calendar')" class="text-[12px] text-[#60A5FA] hover:underline">Kalender öffnen →</button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                  ${upcomingExams.map(ex => `
                    <div onclick="openExamDetailModal('${ex.id}')" class="bg-[#111114] hover:bg-[#19191E] border border-[#24242B] rounded-[12px] p-3.5 cursor-pointer transition">
                      <div class="flex items-center justify-between text-[11.5px] mb-1">
                        <span class="font-semibold text-[#60A5FA]">${escapeHtml(ex.subject)}</span>
                        <span class="text-[#FBBF24] font-semibold">${formatGermanDate(ex.date)}</span>
                      </div>
                      <div class="text-[13.5px] font-semibold text-[#F4F4F6] truncate">${escapeHtml(ex.title)}</div>
                      <p class="text-[11.5px] text-[#8E8E93] line-clamp-1 mt-1">${escapeHtml(ex.topics)}</p>
                    </div>
                  `).join('')}
                </div>
              </div>
            ` : ''}

          </div>
        </div>
      `;
    }

    // =========================================================================
    // 3B. SUBJECTS OVERVIEW (5 Fächer inkl. Englisch Rot & Kundenbindung Grün)
    // =========================================================================

    function renderSubjectsOverview() {
      const folderThemes = {
        rechnungswesen: {
          accentColor: '#5294FF',
          accentRgb: '82, 148, 255',
          glowGradient: 'radial-gradient(88% 82% at 92% 6%, rgba(59, 130, 246, 0.48) 0%, rgba(37, 99, 235, 0.17) 44%, rgba(20, 20, 22, 0) 78%)',

          `

          borderGlow: 'rgba(251, 146, 60, 0.24)',
          iconSvg: `

            </svg>
          `
        },
        sozialkunde: {
          accentColor: '#9D75FA',
          accentRgb: '157, 117, 250',

          iconSvg: `
            <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" class="text-[#9D75FA]">
              <path d="M12 2.5L2.5 7.5V9.5H21.5V7.5L12 2.5ZM5 11V18H8V11H5ZM10.5 11V18H13.5V11H10.5ZM16 11V18H19V11H16ZM2.5 19.5V21.5H21.5V19.5H2.5Z" />
            </svg>
          `
        },
        englisch: {
          accentColor: '#F87171',
          accentRgb: '248, 113, 113',
          glowGradient: 'radial-gradient(88% 82% at 92% 6%, rgba(239, 68, 68, 0.48) 0%, rgba(185, 28, 28, 0.18) 44%, rgba(20, 20, 22, 0) 78%)',
          borderGlow: 'rgba(248, 113, 113, 0.26)',
          iconSvg: `
            <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" class="text-[#F87171]">
              <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2.5C6.75 2.5 2.5 6.75 2.5 12C2.5 17.25 6.75 21.5 12 21.5C17.25 21.5 21.5 17.25 21.5 12C21.5 6.75 17.25 2.5 12 2.5ZM7.2 8.2C7.2 7.54 7.74 7 8.4 7H15.6C16.26 7 16.8 7.54 16.8 8.2C16.8 8.86 16.26 9.4 15.6 9.4H8.4C7.74 9.4 7.2 8.86 7.2 8.2ZM7.2 12C7.2 11.34 7.74 10.8 8.4 10.8H13.6C14.26 10.8 14.8 11.34 14.8 12C14.8 12.66 14.26 13.2 13.6 13.2H8.4C7.74 13.2 7.2 12.66 7.2 12Z" />
            </svg>
          `
        },
        kundenbindung: {
          accentColor: '#34D399',
          accentRgb: '52, 211, 153',
          glowGradient: 'radial-gradient(88% 82% at 92% 6%, rgba(16, 185, 129, 0.48) 0%, rgba(5, 150, 105, 0.18) 44%, rgba(20, 20, 22, 0) 78%)',
          borderGlow: 'rgba(52, 211, 153, 0.26)',
          iconSvg: `
            <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" class="text-[#34D399]">
              <path d="M12 21.2C11.55 21.2 11.12 21.03 10.78 20.73C5.8 16.25 2.75 13.45 2.75 9.65C2.75 6.55 5.15 4.2 8.2 4.2C9.95 4.2 11.6 5.02 12 6.25C12.4 5.02 14.05 4.2 15.8 4.2C18.85 4.2 21.25 6.55 21.25 9.65C21.25 13.45 18.2 16.25 13.22 20.73C12.88 21.03 12.45 21.2 12 21.2Z" />
            </svg>
          `
        }
      };

      const sparklesOverlaySvg = `
        <svg width="136" height="106" viewBox="0 0 136 106" fill="none" class="absolute top-0 right-0 pointer-events-none select-none">
          <path class="sparkle-star-lg" d="M111 49C111.7 55.6 113.4 57.3 120 58C113.4 58.7 111.7 60.4 111 67C110.3 60.4 108.6 58.7 102 58C108.6 57.3 110.3 55.6 111 49Z" fill="white" fill-opacity="0.52" />
          <path class="sparkle-star-md" d="M77 23C77.4 26.8 78.4 27.8 82.2 28.2C78.4 28.6 77.4 29.6 77 33.4C76.6 29.6 75.6 28.6 71.8 28.2C75.6 27.8 76.6 26.8 77 23Z" fill="white" fill-opacity="0.38" />
          <path class="sparkle-star-sm" d="M104 14C104.25 16.3 104.9 16.95 107.2 17.2C104.9 17.45 104.25 18.1 104 20.4C103.75 18.1 103.1 17.45 100.8 17.2C103.1 16.95 103.75 16.3 104 14Z" fill="white" fill-opacity="0.32" />
          <circle class="sparkle-glint-dot" cx="52" cy="18" r="1.15" fill="white" fill-opacity="0.36" />
          <circle class="sparkle-glint-dot" cx="94" cy="39" r="1.05" fill="white" fill-opacity="0.28" />
        </svg>
      `;

      return `
        <div class="flex-1 overflow-y-auto px-6 sm:px-9 py-8">
          <div class="max-w-[1060px]">
            <div class="mb-7">
              <p class="text-[13px] text-[#7E7E87] mb-1.5">Wähle einen übergeordneten Lernordner aus</p>
              <h1 class="text-[26px] font-bold text-[#F4F4F6] tracking-[-0.02em]">Project</h1>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
              ${COURSES.map((c, idx) => {
                const theme = folderThemes[c.id] || folderThemes.rechnungswesen;
                const doneSteps = c.cards.reduce((sum, item) => sum + item.completedSteps, 0);
                const allSteps = c.cards.reduce((sum, item) => sum + item.totalSteps, 0);
                const pct = allSteps > 0 ? Math.round((doneSteps / allSteps) * 100) : 0;

                return `
                  <div class="folder-card-slot" style="--stagger: ${idx};">
                    <div onclick="openSubjectBoard('${c.id}')"
                         onmousemove="handleFolderCardMove(event, this)"
                         onmouseleave="handleFolderCardLeave(this)"
                         class="folder-glow-card group cursor-pointer p-6 min-h-[214px] flex flex-col justify-between"
                         style="border-color: ${theme.borderGlow}; --accent-rgb: ${theme.accentRgb};">
                      
                      <div class="folder-edge-shimmer pointer-events-none"></div>
                      <div class="folder-glow-orb absolute inset-0 pointer-events-none" style="background: ${theme.glowGradient};"></div>
                      <div class="folder-cursor-spotlight absolute inset-0 pointer-events-none"></div>
                      ${sparklesOverlaySvg}

                      <div class="folder-icon-wrap relative z-10 w-10 h-10 flex items-center justify-start">
                        ${theme.iconSvg}
                      </div>

                      <div class="relative z-10 mt-6">
                        <h2 class="text-[17.5px] font-semibold text-[#F4F4F6] tracking-[-0.015em] mb-2 group-hover:text-white transition">
                          ${escapeHtml(c.title)}
                        </h2>
                        <p class="text-[13px] text-[#7E7E87] leading-[1.5] line-clamp-2 group-hover:text-[#9898A2] transition-colors">
                          ${escapeHtml(c.description)}
                        </p>

                        <div class="mt-4 pt-3 border-t border-white/[0.06]">
                          <div class="w-full h-1 bg-white/[0.06] rounded-full overflow-hidden mb-2.5">
                            <div class="h-full rounded-full transition-all duration-500" style="width: ${pct}%; background-color: ${theme.accentColor};"></div>
                          </div>
                          <div class="flex items-center justify-between text-[11.5px] text-[#7E7E87]">
                            <span>${c.cards.length} Lernmodule • ${pct}%</span>
                            <span class="font-medium inline-flex items-center gap-1 transition-transform duration-200 group-hover:translate-x-1" style="color: ${theme.accentColor};">
                              Öffnen <span>→</span>
                            </span>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 3E. REPORTS VIEW (Telemetry Gauges, 5-Axis Radar Web & Equalizer Matrix)
    // =========================================================================

    let shouldAnimateReports = true;

    function toggleReportSubjectExpand(courseId) {
      const scroller = document.getElementById('reports-scroll-container');
      const savedScrollTop = scroller ? scroller.scrollTop : 0;
      shouldAnimateReports = false;
      appState.expandedReportSubjectId = appState.expandedReportSubjectId === courseId ? null : courseId;
      renderWorkspace();
      const restoredScroller = document.getElementById('reports-scroll-container');
      if (restoredScroller) {
        restoredScroller.scrollTop = savedScrollTop;
      }
    }

    function renderReportsView() {
      const animateReports = shouldAnimateReports;
      const repAnim = animateReports ? 'rep-anim' : '';
      shouldAnimateReports = false;

      const totalCards = COURSES.reduce((s, c) => s + c.cards.length, 0);
      const doneCards = COURSES.reduce((s, c) => s + c.cards.filter(m => m.column === 'completed').length, 0);
      const totalQuestionsDone = COURSES.reduce((s, c) => s + c.cards.reduce((a, m) => a + m.completedSteps, 0), 0);
      const totalQuestionsAll = COURSES.reduce((s, c) => s + c.cards.reduce((a, m) => a + m.totalSteps, 0), 0);
      const questionsPct = totalQuestionsAll > 0 ? Math.round((totalQuestionsDone / totalQuestionsAll) * 100) : 0;
      const modulesPct = totalCards > 0 ? Math.round((doneCards / totalCards) * 100) : 0;

      const masteredCards = appState.flashcards.filter(f => f.mastered).length;
      const totalFlashcards = appState.flashcards.length;
      const flashcardsPct = totalFlashcards > 0 ? Math.round((masteredCards / totalFlashcards) * 100) : 0;

      const dailyPct = appState.dailyGoal > 0 ? Math.min(100, Math.round((appState.completedToday / appState.dailyGoal) * 100)) : 0;

      const subjectThemes = {
        rechnungswesen: { hex: '#60A5FA', rgb: '59, 130, 246', short: 'RW' },
        gespraechsgestaltung: { hex: '#FB923C', rgb: '249, 115, 22', short: 'GG' },
        sozialkunde: { hex: '#C084FC', rgb: '168, 85, 247', short: 'SK' },
        englisch: { hex: '#F87171', rgb: '239, 68, 68', short: 'EN' },
        kundenbindung: { hex: '#34D399', rgb: '16, 185, 129', short: 'KAB' }
      };

      // Subject stats for Radar Chart & Equalizer Spectrum
      const subjectMetrics = COURSES.map(c => {
        const done = c.cards.reduce((s, m) => s + m.completedSteps, 0);
        const total = c.cards.reduce((s, m) => s + m.totalSteps, 0);
        const pct = total > 0 ? Math.round((done / total) * 100) : 0;
        const completedMods = c.cards.filter(m => m.column === 'completed').length;
        const theme = subjectThemes[c.id] || subjectThemes.rechnungswesen;
        return {
          id: c.id,
          title: c.title,
          short: theme.short,
          hex: theme.hex,
          rgb: theme.rgb,
          done,
          total,
          pct,
          completedMods,
          totalMods: c.cards.length,
          cards: c.cards
        };
      });

      // Find weakest incomplete module for smart "Schwachstellen-Fokus" recommendation
      const allModules = COURSES.flatMap(c =>
        c.cards.map(m => ({ ...m, courseTitle: c.title, courseId: c.id }))
      );
      const unfinishedModules = allModules.filter(m => m.completedSteps < m.totalSteps);
      unfinishedModules.sort((a, b) => a.completedSteps - b.completedSteps);
      const focusModule = unfinishedModules[0] || allModules[0] || null;

      // 5-Axis Radar Geometry (Center 150, 150, Max Radius 96)
      const cx = 150;
      const cy = 150;
      const maxR = 94;
      const axisCount = subjectMetrics.length;
      const radarVertices = subjectMetrics.map((sm, idx) => {
        const angle = (-Math.PI / 2) + (idx * 2 * Math.PI) / axisCount;
        // Minimum visual radius of 14% so polygon shape is always visible even at 0%
        const effectiveRatio = Math.max(0.14, sm.pct / 100);
        const vx = cx + Math.cos(angle) * (maxR * effectiveRatio);
        const vy = cy + Math.sin(angle) * (maxR * effectiveRatio);
        const lx = cx + Math.cos(angle) * (maxR + 24);
        const ly = cy + Math.sin(angle) * (maxR + 24);
        const ox = cx + Math.cos(angle) * maxR;
        const oy = cy + Math.sin(angle) * maxR;
        return { ...sm, angle, vx, vy, lx, ly, ox, oy };
      });

      const polygonPoints = radarVertices.map(v => `${v.vx.toFixed(1)},${v.vy.toFixed(1)}`).join(' ');

      const ringConfigs = [
        { label: 'Fragen-Beherrschung', value: `${totalQuestionsDone}/${totalQuestionsAll}`, pct: questionsPct, color: '#3B82F6', sub: 'Richtig beantwortet' },
        { label: 'Module Done', value: `${doneCards}/${totalCards}`, pct: modulesPct, color: '#10B981', sub: '30/30 erreicht' },
        { label: 'Karten-Retention', value: `${masteredCards}/${totalFlashcards}`, pct: flashcardsPct, color: '#A855F7', sub: 'Als gewusst markiert' },
        { label: 'Tagesziel Heute', value: `${appState.completedToday}/${appState.dailyGoal}`, pct: dailyPct, color: '#F59E0B', sub: 'Aktive Einheiten' }
      ];

      const isLight = appState.appTheme === 'daylight';
      const ringTrackColor = isLight ? '#E2E8F0' : '#22222B';
      const radarGridStroke = isLight ? '#CBD5E1' : '#282834';

      return `
        <div id="reports-scroll-container" class="flex-1 overflow-y-auto px-6 sm:px-9 py-7">
          <div class="max-w-[1140px]">

            <!-- Header -->
            <div class="flex items-center justify-between flex-wrap gap-4 mb-6">
              <div>
                <div class="inline-flex items-center gap-2 px-2.5 py-0.5 rounded-full bg-[#3B82F6]/12 border border-[#3B82F6]/25 text-[11px] font-semibold text-[#60A5FA] mb-1.5">
                  <span>● LIVE LERN-TELEMETRIE</span>
                </div>
                <h1 class="text-[26px] font-bold text-[#F4F4F6] tracking-[-0.02em]">Kompetenz-Observatorium &amp; Reports</h1>
                <p class="text-[13px] text-[#8E8E93] mt-0.5">Fortschrittsanalyse über alle ${COURSES.length} Fächer, 20 Lernmodule und dein Karteikarten-Deck</p>
              </div>

              ${focusModule ? `
                <button onclick="openQuizPopup('${focusModule.id}')"
                        class="dash-cta-pill inline-flex items-center gap-2.5 px-4 py-2.5 rounded-full bg-[#3B82F6] hover:bg-[#2563EB] text-white text-[12.5px] font-semibold shadow-lg shadow-[#3B82F6]/25 transition">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" class="shrink-0">
                    <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2.5C6.75329 2.5 2.5 6.75329 2.5 12C2.5 17.2467 6.75329 21.5 12 21.5C17.2467 21.5 21.5 17.2467 21.5 12C21.5 6.75329 17.2467 2.5 12 2.5ZM6.2 12C6.2 8.79675 8.79675 6.2 12 6.2C15.2033 6.2 17.8 8.79675 17.8 12C17.8 15.2033 15.2033 17.8 12 17.8C8.79675 17.8 6.2 15.2033 6.2 12ZM12 8.8C10.2327 8.8 8.8 10.2327 8.8 12C8.8 13.7673 10.2327 15.2 12 15.2C13.7673 15.2 15.2 13.7673 15.2 12C15.2 10.2327 13.7673 8.8 12 8.8Z" />
                  </svg>
                  <span>Schwachstelle trainieren: ${escapeHtml(focusModule.title)}</span>
                  <span>→</span>
                </button>
              ` : ''}
            </div>

            <!-- Row 1: 4 Radial SVG Ring Gauges -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
              ${ringConfigs.map((rc, idx) => {
                const r = 24;
                const circ = 2 * Math.PI * r;
                const offset = circ - (rc.pct / 100) * circ;
                return `
                  <div style="--stagger: ${idx};" class="report-telemetry-card ${repAnim} p-4 flex items-center gap-4">
                    <div class="relative w-16 h-16 shrink-0 flex items-center justify-center">
                      <svg class="w-full h-full -rotate-90" viewBox="0 0 60 60">
                        <circle cx="30" cy="30" r="${r}" fill="none" stroke="${ringTrackColor}" stroke-width="5" />
                        <circle cx="30" cy="30" r="${r}" fill="none" stroke="${rc.color}" stroke-width="5"
                                stroke-linecap="round"
                                stroke-dasharray="${circ.toFixed(1)}"
                                stroke-dashoffset="${offset.toFixed(1)}"
                                style="transition: stroke-dashoffset 0.8s cubic-bezier(0.16, 1, 0.3, 1);" />
                      </svg>
                      <span class="absolute text-[12.5px] font-bold text-[#F4F4F6]">${rc.pct}%</span>
                    </div>
                    <div class="min-w-0">
                      <div class="text-[11.5px] font-medium text-[#8E8E93] truncate">${rc.label}</div>
                      <div class="text-[20px] font-bold text-[#F4F4F6] tracking-[-0.02em] leading-tight mt-0.5">${rc.value}</div>
                      <div class="text-[11px] text-[#7E7E87] mt-0.5 truncate">${rc.sub}</div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>

            <!-- Row 2: 5-Axis Radar Chart (5 Cols) + Subject Equalizer Spectrum (7 Cols) -->
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">

              <!-- Left 5 Cols: Interactive 5-Axis Competency Radar -->
              <div style="--stagger: 4;" class="lg:col-span-5 report-telemetry-card ${repAnim} p-5 sm:p-6">
                <div class="flex items-center justify-between mb-2">
                  <div>
                    <h2 class="text-[15.5px] font-bold text-[#F4F4F6]">5-Fächer Kompetenz-Netz</h2>
                    <p class="text-[11.5px] text-[#8E8E93]">Klicke auf einen Achsenpunkt, um das Fach zu öffnen</p>
                  </div>
                  <span class="px-2.5 py-1 rounded-full bg-[#3B82F6]/15 text-[11px] font-semibold text-[#60A5FA]">
                    Radar
                  </span>
                </div>

                <div class="w-full flex items-center justify-center my-2">
                  <svg viewBox="0 0 300 300" class="w-full max-w-[300px] h-auto overflow-visible">
                    <defs>
                      <radialGradient id="radarPolyGrad" cx="50%" cy="50%" r="55%">
                        <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.45" />
                        <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.14" />
                      </radialGradient>
                      <linearGradient id="radarSweepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.22" />
                        <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
                      </linearGradient>
                    </defs>

                    <!-- Concentric Pentagon Grid Levels (25%, 50%, 75%, 100%) -->
                    ${[0.25, 0.5, 0.75, 1].map(scale => {
                      const pts = radarVertices.map(v => {
                        const gx = cx + Math.cos(v.angle) * (maxR * scale);
                        const gy = cy + Math.sin(v.angle) * (maxR * scale);
                        return `${gx.toFixed(1)},${gy.toFixed(1)}`;
                      }).join(' ');
                      return `<polygon points="${pts}" fill="none" stroke="${radarGridStroke}" stroke-width="1" stroke-dasharray="${scale < 1 ? '2 2' : '0'}" />`;
                    }).join('')}

                    <!-- Axis Spokes -->
                    ${radarVertices.map(v => `
                      <line x1="${cx}" y1="${cy}" x2="${v.ox.toFixed(1)}" y2="${v.oy.toFixed(1)}" stroke="${radarGridStroke}" stroke-width="1" />
                    `).join('')}

                    <!-- Rotating Radar Scanner Line -->
                    <g class="radar-sweep-cone">
                      <line x1="${cx}" y1="${cy}" x2="${cx}" y2="${cy - maxR}" stroke="#60A5FA" stroke-opacity="0.45" stroke-width="1.5" />
                    </g>

                    <!-- Animated Competency Polygon -->
                    <polygon points="${polygonPoints}"
                             fill="url(#radarPolyGrad)"
                             stroke="#60A5FA"
                             stroke-width="2.2"
                             stroke-linejoin="round"
                             style="${animateReports ? '' : 'animation: none; opacity: 1;'}"
                             class="radar-polygon-shape" />

                    <!-- Interactive Vertex Nodes & Labels -->
                    ${radarVertices.map(v => `
                      <g class="cursor-pointer group" onclick="openSubjectBoard('${v.id}')">
                        <circle cx="${v.vx.toFixed(1)}" cy="${v.vy.toFixed(1)}" r="8" fill="${v.hex}" fill-opacity="0.24" />
                        <circle cx="${v.vx.toFixed(1)}" cy="${v.vy.toFixed(1)}" r="4.5" fill="${v.hex}" stroke="#FFFFFF" stroke-width="1.5" />
                        <text x="${v.lx.toFixed(1)}" y="${(v.ly - 3).toFixed(1)}" text-anchor="middle" fill="${v.hex}" font-size="11" font-weight="700" font-family="Inter, sans-serif">${v.short}</text>
                        <text x="${v.lx.toFixed(1)}" y="${(v.ly + 10).toFixed(1)}" text-anchor="middle" fill="${isLight ? '#475569' : '#9A9AA4'}" font-size="9.5" font-weight="600" font-family="Inter, sans-serif">${v.pct}%</text>
                      </g>
                    `).join('')}
                  </svg>
                </div>

                <!-- Legend Footer -->
                <div class="pt-3 border-t border-[#24242C] flex flex-wrap gap-2 justify-center">
                  ${subjectMetrics.map(sm => `
                    <button onclick="openSubjectBoard('${sm.id}')"
                            class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-white/[0.04] hover:bg-white/[0.09] text-[11px] text-[#A1A1AA] transition">
                      <span class="w-2 h-2 rounded-full" style="background: ${sm.hex};"></span>
                      <span>${sm.short}: <strong class="text-[#F4F4F6]">${sm.pct}%</strong></span>
                    </button>
                  `).join('')}
                </div>
              </div>

              <!-- Right 7 Cols: Subject Equalizer Breakdown & Module Matrix -->
              <div class="lg:col-span-7 space-y-3.5">
                <div class="flex items-center justify-between">
                  <h2 class="text-[15.5px] font-bold text-[#F4F4F6]">Fächer-Spektrum &amp; Modul-Equalizer</h2>
                  <span class="text-[12px] text-[#8E8E93]">Klicke ein Fach für Modul-Details</span>
                </div>

                ${subjectMetrics.map((sm, sIdx) => {
                  const isExpanded = appState.expandedReportSubjectId === sm.id || sIdx === 0 && appState.expandedReportSubjectId === null;
                  return `
                    <div style="--stagger: ${sIdx + 5}; --subj-rgb: ${sm.rgb};" class="report-subject-accordion ${repAnim} p-4 sm:p-5">
                      <div onclick="toggleReportSubjectExpand('${sm.id}')" class="flex items-center justify-between gap-4 cursor-pointer">
                        <div class="flex items-center gap-3 min-w-0">
                          <span class="w-3 h-3 rounded-full shrink-0" style="background: ${sm.hex}; box-shadow: 0 0 12px ${sm.hex};"></span>
                          <div class="min-w-0">
                            <div class="text-[15px] font-bold text-[#F4F4F6] truncate">${escapeHtml(sm.title)}</div>
                            <div class="text-[11.5px] text-[#8E8E93]">${sm.completedMods} von ${sm.totalMods} Modulen Done • ${sm.done}/${sm.total} Fragen</div>
                          </div>
                        </div>

                        <div class="flex items-center gap-3 shrink-0">
                          <!-- Mini 4-Bar Equalizer Preview -->
                          <div class="hidden sm:flex items-end gap-1 h-6 px-2 py-1 rounded-lg bg-white/[0.03]">
                            ${sm.cards.map((m, mIdx) => {
                              const mPct = m.totalSteps > 0 ? Math.max(18, Math.round((m.completedSteps / m.totalSteps) * 100)) : 18;
                              return `<span style="--eq-idx: ${mIdx}; height: ${mPct}%; background: ${m.completedSteps > 0 ? sm.hex : '#32323C'}; ${animateReports ? '' : 'animation: none; opacity: 1;'}" class="eq-bar-fill w-1.5 rounded-t-sm"></span>`;
                            }).join('')}
                          </div>
                          <span class="text-[14px] font-bold" style="color: ${sm.hex};">${sm.pct}%</span>
                          <span class="text-[12px] text-[#8E8E93] transition-transform duration-200 ${isExpanded ? 'rotate-180' : ''}">▼</span>
                        </div>
                      </div>

                      <!-- Overall Subject Progress Bar -->
                      <div class="w-full h-1.5 bg-[#111114] rounded-full overflow-hidden mt-3">
                        <div class="h-full rounded-full transition-all duration-500" style="width: ${sm.pct}%; background: ${sm.hex};"></div>
                      </div>

                      <!-- Expandable Individual Module Breakdown -->
                      ${isExpanded ? `
                        <div class="mt-4 pt-3.5 border-t border-[#24242C] grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                          ${sm.cards.map(mod => {
                            const modPct = mod.totalSteps > 0 ? Math.round((mod.completedSteps / mod.totalSteps) * 100) : 0;
                            const isModDone = mod.completedSteps >= mod.totalSteps;
                            return `
                              <div onclick="openQuizPopup('${mod.id}')"
                                   class="report-sub-panel bg-[#111114] hover:bg-[#191920] border border-[#24242D] rounded-[11px] p-3 cursor-pointer transition flex flex-col justify-between gap-2">
                                <div class="flex items-start justify-between gap-2">
                                  <span class="text-[12.5px] font-semibold text-[#F4F4F6] leading-snug">${escapeHtml(mod.title)}</span>
                                  <span class="text-[11px] font-bold shrink-0 ${isModDone ? 'text-[#34D399]' : 'text-[#8E8E93]'}">
                                    ${mod.completedSteps}/${mod.totalSteps}
                                  </span>
                                </div>
                                <div class="flex items-center justify-between gap-2">
                                  <div class="flex-1 h-1.5 bg-[#1E1E26] rounded-full overflow-hidden">
                                    <div class="h-full rounded-full" style="width: ${modPct}%; background: ${isModDone ? '#10B981' : sm.hex};"></div>
                                  </div>
                                  <span class="text-[10.5px] font-semibold" style="color: ${sm.hex};">Üben →</span>
                                </div>
                              </div>
                            `;
                          }).join('')}
                        </div>
                      ` : ''}
                    </div>
                  `;
                }).join('')}
              </div>

            </div>
          </div>
        </div>
      `;
    }

    function syncGoalSlider(val) {
      const parsed = Math.max(1, Math.min(30, parseInt(val || '6', 10)));
      const slider = document.getElementById('daily-goal-slider');
      const numInput = document.getElementById('daily-goal-input');
      const badge = document.getElementById('daily-goal-live-badge');
      if (slider) slider.value = parsed;
      if (numInput) numInput.value = parsed;
      if (badge) badge.textContent = `${parsed} Einheiten / Tag`;
    }
